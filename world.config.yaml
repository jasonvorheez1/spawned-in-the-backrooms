# name: the game's name: fill it once you know what this is. description: one line for the box art.
name: "The Backrooms: Level 0"
description: "Noclip into the yellow maze. Survive the smilers, find the exit, level up with whoever you meet."
camera: templates/camera.js#camera
lighting: scripts/lighting.js
defaultPlace: main
engine:
  behaviors:
    - scripts/arrival.js
  networking:
    mode: multiplayer
  ui:
    theme:
      font: Geist Pixel Square
inputs:
  actions:
    journal:
      keys:
        - p
      touch:
        button: false
    qtrack: {}
    quickUse: {}
    quick0:
      keys: ["0"]
      touch: { button: false }
    quick1:
      keys: ["1"]
      touch: { button: false }
    quick2:
      keys: ["2"]
      touch: { button: false }
    quick3:
      keys: ["3"]
      touch: { button: false }
    quick4:
      keys: ["4"]
      touch: { button: false }
    quick5:
      keys: ["5"]
      touch: { button: false }
    quick6:
      keys: ["6"]
      touch: { button: false }
    quick7:
      keys: ["7"]
      touch: { button: false }
    quick8:
      keys: ["8"]
      touch: { button: false }
    quick9:
      keys: ["9"]
      touch: { button: false }

    jump:
      keys:
        - space
    sprint:
      keys:
        - shift
    walk:
      keys:
        - capslock
      touch:
        button: false
    crouch:
      keys:
        - c
      touch:
        label: Crouch
    attack:
      mouse: left
    aim:
      mouse: right
      touch:
        button: false
    thirdPerson:
      mouse: middle
      touch:
        button: false
    reload:
      keys:
        - r
      touch:
        button: false
    drink:
      keys:
        - j
    compass: {}
    throw:
      keys:
        - g
    flashlight:
      keys:
        - f
      touch:
        button: false
    cycleWeapon:
      keys:
        - x
      mouse: wheelDown
      touch:
        button: false
    kick:
      keys:
        - h
        - l
      touch:
        button: false
    holster:
      keys: []
      touch:
        button: false
    interact:
      keys:
        - e
    loot: {}
    spam: {}
    grab:
      keys:
        - z
    wait:
      keys:
        - t
      touch:
        button: false
    waitdo: {}
    elevdo: {}
    mj: {}
    inventory:
      keys:
        - i
    inv: {}
    sheet:
      keys:
        - k
    stat: {}
    craft:
      keys:
        - y
    make: {}
    os: {}
    wardrobe:
      keys:
        - o
      touch:
        button: false
    emote:
      keys:
        - n
      touch:
        button: false
    dress: {}
    mmenu: {}
    mainmenu:
      keys:
        - backspace
      touch:
        button: false
    talk: {}
    hub: {}
    talkdo: {}
    shop: {}
    build:
      keys:
        - b
    bc1:
      keys:
        - "1"
      touch:
        button: false
    bc2:
      keys:
        - "2"
      touch:
        button: false
    bc3:
      keys:
        - "3"
      touch:
        button: false
    bc4:
      keys:
        - "4"
      touch:
        button: false
    bc5:
      keys:
        - "5"
      touch:
        button: false
    bc6:
      keys:
        - "6"
      touch:
        button: false
    bc7:
      keys:
        - "7"
      touch:
        button: false
    bc8:
      keys:
        - "8"
      touch:
        button: false
    buildPrev:
      mouse: wheelUp
      touch:
        button: false
  axes:
    moveX:
      keys: a/d
    moveZ:
      keys: s/w
  touch:
    style: "[data-part=\"button\"]{background:oklch(0.86 0.09 92 / .82);border:2px solid oklch(0.32 0.05 75);color:oklch(0.22 0.04 70);font-weight:800;letter-spacing:.04em;box-shadow:3px 3px 0 oklch(0.2 0.03 70 / .7)}\n[data-part=\"button\"][data-size=\"primary\"]{background:oklch(0.72 0.14 40 / .88);color:oklch(0.97 0.02 90)}\n[data-part=\"button\"][data-pressed]{transform:translate(2px,2px);box-shadow:1px 1px 0 oklch(0.2 0.03 70 / .7);filter:brightness(1.12)}\n[data-part=\"stick\"]{background:oklch(0.86 0.09 92 / .3);border:2px solid oklch(0.32 0.05 75 / .8)}\n[data-part=\"thumb\"]{background:oklch(0.32 0.05 75);border:none}"
    surfaces: {default: {buttons: [{action: attack, label: ATTACK, size: primary, slot: 1}, {action: aim, label: AIM, slot: 2}, {action: interact, label: USE, slot: 3}, {action: jump, label: JUMP, slot: 4}, {action: reload, label: RELOAD, size: secondary, slot: 5}, {action: cycleWeapon, label: SWAP, size: secondary, slot: 6}, {action: flashlight, label: LIGHT, size: secondary, slot: 7}, {action: drink, label: AID, size: secondary, slot: 8}, {action: holster, label: HOLSTER, size: secondary, slot: 9}, {action: inventory, label: BAG, size: secondary, slot: 10}, {action: sheet, label: STATS, size: secondary, slot: 11}, {action: build, label: BUILD, size: secondary, slot: 12}, {action: sprint, label: RUN, size: secondary, slot: 13}, {action: grab, label: GRAB, size: secondary, slot: 14}], look: true, orientation: any, pinch: true, sticks: [{x: moveX, y: moveZ}]}}
player: templates/player.js#player
ui:
  render: scripts/ui.js
# nametag: the tag over other players' heads: this file, yours to edit: export default function (ctx, tag) { return html }, the shape ui.js has.
nametag: ui/nametag.js
authoring:
  starter:
    id: 3d
routing:
  script: scripts/routing.js
  maxPlayers: 24   # the Bonus Room is shared (johnadams2); solo rooms still hold only you and invited friends
audio:
  gains: { Footsteps: 0.6 }   # Nov 8: Shelly, "make footsteps quiet"
godMode:
  behavior: []
