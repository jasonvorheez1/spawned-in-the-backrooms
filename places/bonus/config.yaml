# The Bonus Room: the shared vaporwave mall hub (johnadams2, Nov 8). Layout: scripts/lib/data/bonus.yml
mode: 3d
terrain:
  kind: "off"
gravity: { x: 0, y: -24, z: 0 }
defaultSpawnPoint: { x: 0, y: 0.1, z: 27 }
defaultSpawnRotation: { yaw: 0 }
worldBounds: { bottom: -20 }
atmosphere:
  look:
    script: scripts/look-bonus.js
    toneMapping: agx
    params:
      bloomStrength: 0.34
      bloomRadius: 0.72
      bloomThreshold: 0.88
  clouds: { enabled: false }
  fog: { kind: linear, near: 40, far: 120, color: oklch(0.78 0.06 330) }
  moon: { enabled: false, intensity: 0 }
  sky: { kind: color, color: oklch(0.82 0.07 230) }
  stars: { enabled: false }
  sun:
    rotation: { pitch: -62, yaw: 28 }
    light: { color: oklch(0.98 0.04 55), intensity: 1.35, shadow: { enabled: true, softness: 0.75 } }
  timeOfDay: 17
  wind: { direction: 0, speed: 0 }
  environmentIntensity: 1.18
  ambient: { light: { color: oklch(0.92 0.05 320), intensity: 0.44 } }
  hemisphere: { skyColor: oklch(0.86 0.07 230), groundColor: oklch(0.56 0.09 330), intensity: 0.62 }
acoustics: { reverb: 0.45 }
