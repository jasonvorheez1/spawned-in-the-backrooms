# The Bonus Room: the shared vaporwave mall hub (johnadams2, Nov 8). Layout: scripts/lib/data/bonus.yml
mode: 3d
terrain:
  kind: "off"
gravity: { x: 0, y: -24, z: 0 }
defaultSpawnPoint: { x: 0, y: 0.1, z: 27 }
defaultSpawnRotation: { yaw: 0 }
worldBounds: { bottom: -20 }
atmosphere:
  look:
    script: scripts/look-bonus.js
    toneMapping: agx
    params:
      bloomStrength: 0.22
      bloomRadius: 0.6
      bloomThreshold: 0.96
  clouds: { enabled: false }
  fog: { kind: linear, near: 50, far: 140, color: oklch(0.86 0.015 80) }
  moon: { enabled: false, intensity: 0 }
  sky: { kind: color, color: oklch(0.86 0.03 225) }
  stars: { enabled: false }
  sun:
    rotation: { pitch: -62, yaw: 28 }
    light: { color: oklch(0.98 0.03 75), intensity: 1.5, shadow: { enabled: true, softness: 0.8 } }
  timeOfDay: 17
  wind: { direction: 0, speed: 0 }
  environmentIntensity: 0.45
  ambient: { light: { color: oklch(0.95 0.012 75), intensity: 0.48 } }
  hemisphere: { skyColor: oklch(0.94 0.015 220), groundColor: oklch(0.66 0.025 55), intensity: 0.46 }
acoustics: { reverb: 0.45 }
