atmosphere:
  clouds:
    altitude: 600
    density: 0.2
    enabled: true
    opacity: 0.7
    thickness: 900
  fog:
    far: 900
    kind: linear
    near: 350
  look:
    script: scripts/look-default.js
  moon:
    intensity: 3
  sky:
    kind: realistic
    model: hosek
  stars:
    density: 0.6
    enabled: true
    milkyWay: 0.6
  timeOfDay: 17.2
  wind:
    direction: 230
    speed: 2
defaultSpawnPoint:
  x: 0
  y:
    terrain: 0
  z: 0
gravity:
  x: 0
  y: -24
  z: 0
# 3d: the engine draws this place, so it needs 3D graphics to open. A game that is only its HTML screen is mode ui.
mode: 3d
terrain:
  decorations:
    bindings:
      grass:
        - flower
        - grass
        - reed
    layers:
      flower:
        density: 0.5
        items:
          - colorJitter:
              hue: 8
              value: 0.1
            kind: scripted
            params:
              heart: "#a8642a"
              petal: "#f7d98b"
            randomRotation: true
            scale:
              - 0.8
              - 1.3
            script: scripts/flower.js
            seed: 1
            wind:
              force: 0.04
      grass:
        density: 44
        items:
          - kind: scripted
            randomRotation: true
            scale:
              - 1
              - 1.6
            script: scripts/grass.js
            seed: 1
            wind:
              force: 0.06
        material:
          kind: scripted
          script: scripts/grass-look.js
      reed:
        density: 1
        items:
          - colorJitter:
              hue: 4
              value: 0.08
            kind: scripted
            params:
              head: "#a8642a"
              stem: "#e9a24a"
            randomRotation: true
            scale:
              - 0.8
              - 1.2
            script: scripts/reed.js
            seed: 1
            wind:
              force: 0.08
  generator: scripts/flat-starter-terrain.js
  kind: heightmap
  materials:
    - albedo: cdn/texture-terrain-grass-realistic-albedo-summer-exploration.png
      id: grass
      pbr: true
      tint: oklch(0.68 0.10 95)
    - albedo: cdn/texture-terrain-gravel-realistic-albedo.png
      id: gravel
      pbr: true
      tint: oklch(0.70 0.02 80)
    - albedo: cdn/texture-terrain-rock-realistic-albedo.png
      id: rock
      pbr: true
      tint: oklch(0.58 0.02 260)
  seed: 1
