mode: 3d
terrain:
  kind: "off"
gravity: { x: 0, y: -24, z: 0 }
defaultSpawnPoint: { x: -55.6, y: 0.1, z: 2.0 }
defaultSpawnRotation: { yaw: -90 }
worldBounds: { bottom: -20 }
atmosphere:
  clouds: { enabled: false }
  fog: { kind: linear, near: 10, far: 80, color: oklch(0.36 0.018 95) }
  look: { script: scripts/look-utility.js, params: { bloomThreshold: 0.65, bloomStrength: 0.7 } }
  moon: { enabled: false, intensity: 0 }
  sky: { kind: color, color: oklch(0.05 0.004 95) }
  stars: { enabled: false }
  timeOfDay: 0
  wind: { direction: 0, speed: 0 }
  ambient: { light: { color: oklch(0.92 0.025 95), intensity: 0.95 } }
  hemisphere: { skyColor: oklch(0.85 0.03 95), groundColor: oklch(0.42 0.02 80), intensity: 0.75 }
acoustics: { reverb: 0.5 }
