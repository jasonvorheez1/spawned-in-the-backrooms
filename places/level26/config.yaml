# Level 26 "The SS Fun =)" (Shelly, Nov 8, from the wikidot page): the cruise liner Adventure, renamed by the Partygoers,
# no-clipping through the Backrooms in a green fog. Trashed party decks over a grey-green sea; Phoebe is first seen here.
mode: 3d
terrain:
  kind: "off"
gravity: { x: 0, y: -24, z: 0 }
defaultSpawnPoint: { x: 0, y: 0.2, z: 30 }
defaultSpawnRotation: { yaw: 0 }
worldBounds: { bottom: -30 }
atmosphere:
  look: { script: scripts/look-photo.js }
  clouds: { enabled: false }
  fog: { kind: linear, near: 4, far: 62, color: oklch(0.52 0.07 150) }
  sky: { kind: color, color: oklch(0.5 0.06 150) }
  moon: { enabled: false, intensity: 0 }
  stars: { enabled: false }
  timeOfDay: 16
  sun: { intensity: 0.35, color: oklch(0.85 0.06 140) }
  ambient: { light: { color: oklch(0.8 0.06 145), intensity: 0.5 } }
  hemisphere: { skyColor: oklch(0.7 0.08 150), groundColor: oklch(0.25 0.03 160), intensity: 0.5 }
  wind: { direction: 90, speed: 4 }
