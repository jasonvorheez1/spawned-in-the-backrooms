mode: 3d
terrain:
  kind: "off"
gravity: { x: 0, y: -24, z: 0 }
defaultSpawnPoint: { x: 2.5, y: 0.1, z: 4 }
defaultSpawnRotation: { yaw: 180 }
worldBounds: { bottom: -30 }
atmosphere:
  clouds: { enabled: false }
  fog: { kind: linear, near: 10, far: 85, color: oklch(0.2 0.02 150) }
  moon: { enabled: false, intensity: 0 }
  sky: { kind: color, color: oklch(0.02 0 0) }
  stars: { enabled: false }
  timeOfDay: 0
  wind: { direction: 0, speed: 0 }
  ambient: { light: { color: oklch(0.9 0.03 110), intensity: 0.22 } }
  hemisphere: { skyColor: oklch(0.9 0.03 110), groundColor: oklch(0.45 0.04 150), intensity: 0.18 }
