mode: 3d
terrain:
  kind: "off"
gravity: { x: 0, y: -24, z: 0 }
defaultSpawnPoint: { x: 0, y: 0.1, z: 5.5 }
defaultSpawnRotation: { yaw: 0 }
worldBounds: { bottom: -20 }
atmosphere:
  look: { script: scripts/look-photo.js }
  clouds: { enabled: false }
  fog: { kind: linear, near: 30, far: 90, color: oklch(0.18 0.02 60) }
  moon: { enabled: false, intensity: 0 }
  sky: { kind: color, color: oklch(0.2 0.02 60) }
  stars: { enabled: false }
  timeOfDay: 0
  wind: { direction: 0, speed: 0 }
  ambient: { light: { color: oklch(0.85 0.06 65), intensity: 0.32 } }
  hemisphere: { skyColor: oklch(0.85 0.05 70), groundColor: oklch(0.35 0.05 45), intensity: 0.3 }
acoustics: { reverb: 0.08 }
