mode: 3d
terrain:
  kind: "off"
gravity: { x: 0, y: -24, z: 0 }
defaultSpawnPoint: { x: -40, y: 0.1, z: 0 }
defaultSpawnRotation: { yaw: -90 }
worldBounds: { bottom: -20 }
atmosphere:
  clouds: { enabled: false }
  fog: { kind: linear, near: 6, far: 46, color: oklch(0.22 0.03 55) }
  look: { script: scripts/look-level5.js, params: { vignette: 0.45 } }
  moon: { enabled: false, intensity: 0 }
  sky: { kind: color, color: oklch(0.06 0.01 50) }
  stars: { enabled: false }
  timeOfDay: 0
  wind: { direction: 0, speed: 0 }
  ambient: { light: { color: oklch(0.8 0.06 70), intensity: 0.32 } }
  hemisphere: { skyColor: oklch(0.85 0.06 75), groundColor: oklch(0.3 0.05 30), intensity: 0.26 }
