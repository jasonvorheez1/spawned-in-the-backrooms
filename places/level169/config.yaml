# Level 169 "Welcome to the Desert" (archived Wikidot version, Shelly's brief Nov 14): a finite desert with a 48-hour day,
# deadly sun, water that turns to sand, Ferry the refrigerator and Ferry's Friends. Built by places/level169/sim.js.
mode: 3d
terrain:
  kind: heightmap
  seed: 169
  generator: scripts/terrain169.js
  materials:
    - { id: sand, albedo: cdn/texture-terrain-wind-rippled-pale-desert-sand.png, tint: "oklch(0.78 0.06 70)", textureScale: 3, antiTiling: stochastic, macro: { scale: 60, hue: 0.03, value: 0.12 } }
    - { id: hardpan, albedo: cdn/texture-terrain-cracked-dry-desert-hardpan-clay.png, tint: "oklch(0.7 0.05 60)", textureScale: 3, antiTiling: stochastic, macro: { scale: 60, hue: 0.03, value: 0.12 } }
    - { id: gravel, albedo: cdn/texture-terrain-desert-pavement-small-pebbles-gravel.png, tint: "oklch(0.62 0.04 55)", textureScale: 2.5, antiTiling: stochastic, macro: { scale: 60, hue: 0.03, value: 0.12 } }
    - { id: redrock, albedo: cdn/texture-terrain-layered-red-sandstone-cliff-strata.png, tint: "oklch(0.55 0.1 40)", textureScale: 9, antiTiling: stochastic, macro: { scale: 60, hue: 0.03, value: 0.12 } }
    - { id: rubble, albedo: cdn/texture-terrain-broken-red-sandstone-scree-rubble.png, tint: "oklch(0.58 0.08 45)", textureScale: 3, antiTiling: stochastic, macro: { scale: 60, hue: 0.03, value: 0.12 } }
    - { id: wash, albedo: cdn/texture-terrain-dry-riverbed-cobbles-and-silt.png, tint: "oklch(0.66 0.04 70)", textureScale: 2.5, antiTiling: stochastic, macro: { scale: 60, hue: 0.03, value: 0.12 } }
  marks:
    track-north: { kind: path, points: [[0, -14], [6, -120], [-10, -260], [14, -400], [18, -488]], width: 2.6, material: hardpan, edgeMaterial: gravel, noise: 0.35, grade: true }
    house-basement: { kind: hole, points: [ [ 18.15, -499.9 ], [ 24.3, -499.9 ], [ 24.3, -501.4 ], [ 27.9, -501.4 ], [ 27.9, -493.15 ], [ 18.15, -493.15 ] ] }
  decorations:
    layers:
      scrub:
        items:
          - { kind: scripted, script: scripts/grass.js, scale: [0.3, 0.6], randomRotation: true, useTerrainColor: true, wind: { force: 0.04, scale: 5, speed: 1.4 } }
        density: 0.8
        noise: { scale: 18, threshold: 0.35, seed: 3 }
      brush:
        items:
          - { kind: scripted, script: scripts/desert-flora.js, params: { kind: sage }, weight: 5, scale: [0.7, 1.4], randomRotation: true, wind: { force: 0.015, scale: 4, speed: 1 }, maxDistance: 140 }
          - { kind: scripted, script: scripts/desert-flora.js, params: { kind: yucca }, weight: 2, scale: [0.7, 1.3], randomRotation: true, wind: { force: 0.02, scale: 4, speed: 1.2 }, maxDistance: 140 }
          - { kind: scripted, script: scripts/desert-flora.js, params: { kind: dead }, weight: 2, scale: [0.8, 1.5], randomRotation: true, maxDistance: 120 }
        density: 0.05
        cluster: { clusters: 40, radius: 14, seed: 9, falloff: 0.6 }
      stones:
        items:
          - { kind: scripted, script: scripts/desert-flora.js, params: { kind: pebbles }, weight: 4, scale: [0.8, 1.4], randomRotation: true, maxDistance: 60 }
          - { kind: scripted, script: scripts/desert-flora.js, params: { kind: boulder }, weight: 1, scale: [0.6, 2.2], randomRotation: true, sink: 0.15, maxDistance: 260 }
        density: 0.04
      talus:
        items:
          - { kind: scripted, script: scripts/desert-flora.js, params: { kind: boulder }, weight: 3, scale: [0.8, 3.2], randomRotation: true, sink: 0.25, up: local, maxDistance: 320 }
          - { kind: scripted, script: scripts/desert-flora.js, params: { kind: pebbles }, weight: 2, scale: [1, 1.8], randomRotation: true, maxDistance: 60 }
        density: 0.09
    bindings: { scrub: [sand, hardpan], brush: [sand, hardpan, gravel], stones: [gravel, hardpan, wash], talus: [rubble] }
    settings: { maxDistance: 320, fadeDistance: 40 }
gravity: { x: 0, y: -24, z: 0 }
defaultSpawnPoint: { x: 2.5, z: 3, y: { terrain: 0 } }
defaultSpawnRotation: { yaw: 0 }
worldBounds: { bottom: -300 }
atmosphere:
  look: { script: mods/awakening/look.js, params: { mistBase: 1.2, mistDensity: 0.006, mistReach: 260, mistLight: 0.7, cloudCover: 0.22, sharpen: 0.3, vignette: 0.18, grain: 0.018 } }
  timeOfDay: 10.5
  cycle: { periodMs: 5760000, epoch: 0 } # Savi's pick: one 48-hour desert day lasts 96 real minutes (twice any other level's)
  clouds: { enabled: false, density: 0.08, speed: 0.4 }
  fog: { kind: linear, near: 180, far: 1400, color: oklch(0.86 0.04 75) }
  sun: { light: { intensity: 2.3, color: oklch(0.97 0.05 85), shadow: { enabled: true } } }
  moon: { enabled: true }
  stars: { enabled: true }
  ambient: { light: { color: oklch(0.85 0.03 70), intensity: 0.55 } }
  hemisphere: { skyColor: oklch(0.8 0.08 235), groundColor: oklch(0.6 0.07 55), intensity: 0.75 }
  wind: { direction: 250, speed: 3.5 }
acoustics: { reverb: 0.05 }
