mode: 3d
terrain:
  kind: "off"
gravity: { x: 0, y: -24, z: 0 }
defaultSpawnPoint: { x: 0, y: 0.25, z: 12 }
defaultSpawnRotation: { yaw: 0 }
worldBounds: { bottom: -30 }
atmosphere:
  look: { script: scripts/look-photo.js }
  clouds: { enabled: true, density: 0.35, speed: 0.7 }
  fog: { kind: linear, near: 55, far: 320, color: oklch(0.74 0.05 70) }
  timeOfDay: 17.3
  cycle: { frozen: 17.3 }
  sky: { kind: color, color: oklch(0.68 0.06 65) }
  sun: { light: { intensity: 1.85, color: oklch(0.95 0.12 75), shadow: { enabled: true, bias: 0.001 } } }
  moon: { enabled: false }
  stars: { enabled: false }
  ambient: { light: { color: oklch(0.76 0.04 80), intensity: 0.85 } }
  hemisphere: { skyColor: oklch(0.85 0.08 75), groundColor: oklch(0.35 0.03 80), intensity: 0.75 }
  wind: { direction: 120, speed: 2.2 }
acoustics: { reverb: 0.28 }
