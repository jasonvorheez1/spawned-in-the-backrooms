# Spamton's arena (Shelly 11-08): the worldspace he drags you into from the Level 11 dumpster. A real-time money fight.
mode: 3d
terrain:
  kind: "off"
gravity: { x: 0, y: -24, z: 0 }
defaultSpawnPoint: { x: 0, y: 0.1, z: 15 }
defaultSpawnRotation: { yaw: 0 }
worldBounds: { bottom: -30 }
acoustics: { reverb: 0.45 }
atmosphere:
  look: { script: scripts/look-photo.js }
  sky: { kind: color, color: oklch(0.04 0.005 90) }
  fog: { kind: linear, near: 10, far: 45, color: oklch(0.08 0.01 95) }
  clouds: { enabled: false }
  stars: { enabled: false }
  moon: { enabled: false }
  timeOfDay: 0
  cycle: { frozen: 0 }
  ambient: { light: { color: oklch(0.7 0.02 90), intensity: 0.18 } }
  hemisphere: { skyColor: oklch(0.5 0.02 220), groundColor: oklch(0.2 0.02 80), intensity: 0.25 }
  wind: { direction: 0, speed: 0 }
