mode: 3d
terrain:
  kind: "off"
gravity: { x: 0, y: -24, z: 0 }
defaultSpawnPoint: { x: 4, y: 0.1, z: 4 }
defaultSpawnRotation: { yaw: 90 }
atmosphere:
  clouds: { enabled: false }
  fog: { kind: linear, near: 10, far: 58, color: oklch(0.2 0.012 250) }
  look: { script: scripts/look-garage.js, params: { bloomThreshold: 0.7, bloomStrength: 0.6 } }
  moon: { enabled: false, intensity: 0 }
  sky: { kind: color, color: oklch(0.06 0.005 250) }
  stars: { enabled: false }
  timeOfDay: 0
  wind: { direction: 0, speed: 0 }
  ambient: { light: { color: oklch(0.86 0.02 240), intensity: 0.6 } }
  hemisphere: { skyColor: oklch(0.85 0.02 230), groundColor: oklch(0.34 0.01 250), intensity: 0.42 }
