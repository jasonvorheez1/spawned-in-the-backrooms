mode: 3d
terrain:
  kind: "off"
gravity: { x: 0, y: -24, z: 0 }
defaultSpawnPoint: { x: 28, y: 0.1, z: -27 }
defaultSpawnRotation: { yaw: 180 }
worldBounds: { bottom: -20 }
atmosphere:
  clouds: { enabled: false }
  fog: { kind: linear, near: 8, far: 50, color: oklch(0.6 0.02 105) }
  look: { script: scripts/look-level4.js, params: { vignette: 0.38 } }
  moon: { enabled: false, intensity: 0 }
  sky: { kind: color, color: oklch(0.1 0.004 90) }
  stars: { enabled: false }
  timeOfDay: 0
  wind: { direction: 0, speed: 0 }
  ambient: { light: { color: oklch(0.92 0.025 110), intensity: 0.42 } }
  hemisphere: { skyColor: oklch(0.93 0.025 105), groundColor: oklch(0.4 0.02 240), intensity: 0.32 }
