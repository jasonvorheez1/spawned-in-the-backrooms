mode: 3d
terrain:
  kind: "off"
gravity: { x: 0, y: -24, z: 0 }
defaultSpawnPoint: { x: -55, y: 0.1, z: 2.5 }
defaultSpawnRotation: { yaw: -90 }
worldBounds: { bottom: -20 }
atmosphere:
  clouds: { enabled: false }
  fog: { kind: linear, near: 5, far: 40, color: oklch(0.2 0.03 55) } # warm steam haze, was oklch(0.14 0.012 60)
  look: { script: scripts/look-utility.js, params: { bloomThreshold: 0.6, bloomStrength: 0.8 } }
  moon: { enabled: false, intensity: 0 }
  sky: { kind: color, color: oklch(0.04 0.004 60) }
  stars: { enabled: false }
  timeOfDay: 0
  wind: { direction: 0, speed: 0 }
  ambient: { light: { color: oklch(0.8 0.04 65), intensity: 0.5 } } # Nov 16 graphics pass: was 0.35, the floor read pitch black
  hemisphere: { skyColor: oklch(0.72 0.05 60), groundColor: oklch(0.3 0.02 50), intensity: 0.4 } # was 0.28
