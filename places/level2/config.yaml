mode: 3d
terrain:
  kind: "off"
gravity: { x: 0, y: -24, z: 0 }
defaultSpawnPoint: { x: -55, y: 0.1, z: 2.5 }
defaultSpawnRotation: { yaw: -90 }
worldBounds: { bottom: -20 }
atmosphere:
  clouds: { enabled: false }
  fog: { kind: linear, near: 6, far: 40, color: oklch(0.14 0.012 60) }
  look: { script: scripts/look-garage.js, params: { bloomThreshold: 0.65, bloomStrength: 0.7 } }
  moon: { enabled: false, intensity: 0 }
  sky: { kind: color, color: oklch(0.04 0.004 60) }
  stars: { enabled: false }
  timeOfDay: 0
  wind: { direction: 0, speed: 0 }
  ambient: { light: { color: oklch(0.8 0.03 70), intensity: 0.35 } }
  hemisphere: { skyColor: oklch(0.7 0.03 70), groundColor: oklch(0.25 0.01 60), intensity: 0.28 }
