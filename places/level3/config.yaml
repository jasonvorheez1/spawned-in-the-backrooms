mode: 3d
terrain:
  kind: "off"
gravity: { x: 0, y: -24, z: 0 }
defaultSpawnPoint: { x: -47.5, y: 0.1, z: -2 }
defaultSpawnRotation: { yaw: -90 }
worldBounds: { bottom: -20 }
atmosphere:
  clouds: { enabled: false }
  fog: { kind: linear, near: 5, far: 34, color: oklch(0.12 0.015 50) }
  look: { script: scripts/look-utility.js, params: { bloomThreshold: 1, bloomStrength: 0.45 } }
  moon: { enabled: false, intensity: 0 }
  sky: { kind: color, color: oklch(0.03 0.004 50) }
  stars: { enabled: false }
  timeOfDay: 0
  wind: { direction: 0, speed: 0 }
  ambient: { light: { color: oklch(0.8 0.04 60), intensity: 0.3 } }
  hemisphere: { skyColor: oklch(0.7 0.04 60), groundColor: oklch(0.22 0.02 40), intensity: 0.25 }
