# Level 69 "The Road Trip of Affliction" (Wikidot): an endless highway between tall concrete walls, dark and fogged in.
# Shelly Nov 17: "add level 69. another solo adventure with an intro cutscene." Solo, a fresh run each visit.
mode: 3d
instance: solo
persistence: ephemeral
terrain:
  kind: "off"
gravity: { x: 0, y: -24, z: 0 }
defaultSpawnPoint: { x: -3.5, y: 0.3, z: -6 }
defaultSpawnRotation: { yaw: 0 }
worldBounds: { bottom: -30 }
atmosphere:
  look: { script: scripts/look-photo.js }
  clouds: { enabled: false }
  fog: { kind: linear, near: 3, far: 34, color: "#0b0c0e" }
  moon: { enabled: false, intensity: 0 }
  sky: { kind: color, color: "#040405" }
  stars: { enabled: false }
  timeOfDay: 0
  wind: { direction: 0, speed: 2 }
  ambient: { light: { color: "#1c2028", intensity: 0.35 } }
  hemisphere: { skyColor: "#141820", groundColor: "#060607", intensity: 0.22 }
acoustics: { reverb: 0.25 }
