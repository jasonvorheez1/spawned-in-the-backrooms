# data clips for the scripted creatures (degrees about each bone's local axes)
smilerIdle:
  duration: 4.2
  tracks:
    head: { yaw: [0, 6, -4, 0], roll: [0, -5, 4, 0], y: [0, 0.02, -0.01, 0] }
    eyeL: { scale: [1, 1, 1, 0.15, 1, 1, 1, 1, 1, 1] }
    eyeR: { scale: [1, 1, 1, 0.15, 1, 1, 1, 1, 1, 1] }
smilerHunt:
  duration: 0.9
  tracks:
    head: { roll: [-8, 8, -8], pitch: [-6, 2, -6] }
    jaw: { pitch: [0, -16, 0] }
smilerBite:
  duration: 0.35
  tracks:
    head: { pitch: [0, -14, 0] }
    jaw: { pitch: [0, -38, 0] }
lurkerIdle:
  duration: 5
  tracks:
    head: { roll: [0, 14, 14, -6, 0], yaw: [0, 10, -12, 0, 0] }
    spine: { pitch: [0, -3, 0] }
    armL: { pitch: [0, 4, 0], roll: [0, -3, 0] }
    armR: { pitch: [0, -3, 0], roll: [0, 3, 0] }
lurkerWalk:
  duration: 1.3
  tracks:
    thighL: { pitch: [24, -20, 24] }
    shinL: { pitch: [-8, -45, -8] }
    thighR: { pitch: [-20, 24, -20] }
    shinR: { pitch: [-45, -8, -45] }
    armL: { pitch: [-18, 18, -18] }
    foreL: { pitch: [10, 22, 10] }
    armR: { pitch: [18, -18, 18] }
    foreR: { pitch: [22, 10, 22] }
    spine: { yaw: [-6, 6, -6], pitch: [-6, -10, -6] }
    head: { roll: [10, -10, 10] }
    hips: { y: [0, 0.025, 0, 0.025, 0] }
lurkerFrozen:
  duration: 2
  tracks:
    head: { roll: [22, 26, 22], pitch: [6, 8, 6] }
