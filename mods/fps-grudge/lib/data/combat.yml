# bullets fly: muzzle speed m/s per class, a straight march under gravity (no drag), solved on the shooter's machine (scripts/lib/ballistics.js)
ballistics: { speed: { pistol: 360, smg: 400, shotgun: 380, rifle: 880, lmg: 850, sniper: 950 }, gravity: 9.81, drag: 0, step: 0.05, stepFar: 0.12, maxT: 1.2, maxDist: 400, instant: 0.03, bucket: 0.04, tracerEvery: 3, tracerGapMs: 350, tracerRadius: 150, smoke: [rifle, sniper], whizRadius: 3, nearMiss: 1.5, crackSpeed: 700 }
# healing syringe (H): one per life, buy up to max; 2.2 s on the needle, the heal pours in over the last 0.4 s; a hit over `interrupt` or a weapon switch cancels
syringe: { price: 200, max: 2, perLife: 1, time: 2.2, ramp: 0.4, heal: 50, interrupt: 25, speedMul: 0.6 }
# molotov (T): thrown on the frag's arc, shatters on the first ground or wall it meets; a fire patch radius m for burn s, dmg every tick s (thrower takes half, no friendly fire)
molotov: { price: 400, max: 1, speed: 15, lift: 3, ahead: 0.6, radius: 3, burn: 7, dmg: 8, tick: 0.5, height: 2 }

# who may shoot whom (mods/fps-grudge/player.js pvpOn): place.state.pvp wins when a game writes it; else a mode listed here is player-vs-player
pvpModes: [pvp, duel, duo, squad]
pvpDefault: false   # no mode on the place: players never hurt players (set true for a free-for-all)
