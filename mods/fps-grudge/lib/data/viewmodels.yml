# ROW SCHEMA (enari:): one row = one first-person model; a new gun is one row, nothing else.
#   <key>: { type: rifle|smg|pistol|lmg|shotgun|sniper|knife|syringe|throwable, also: [classes it fills in for],
#            name, weapons: [weapons.yml ids it serves: an id match wins over type, type over also],
#            model: /cdn/…glb (eye at origin, looking -Z, +Y up, metres, floor pin y=-100; art/fpsimport/wrapall.py),
#            muzzle: [x,y,z] eye-frame tip, sight: [x,y] eye-frame sight line (ADS slides the model by -sight*adsT), adsDepth,
#            idleSpeed, clips: { draw holster idle walk run fire fire_ads reload_tactical reload_empty inspect melee use throw },
#            lens: { clip: seconds } }
#   a clip value is a clip name inside that model's own file (vm_<action>, cut by wrapall.py from the best animlib.yml entry
#   of the same rig) or `synth`: camera.js makes it procedurally (bob/sway walk, lowered run, dip draw/holster, roll-dip reload,
#   kick fire, bash melee). Reload: ammo left > 0 plays reload_tactical, else reload_empty. inspect: the I key (or 8 s still).
# Every first-person arms+gun model, baked to ONE standard in Blender-side source (art/vmstd/build.py, art/vmstd/STANDARD.md):
# metres, real size, barrel -Z, origin = the camera eye, hip pose baked in, pistol43 (scrap-9) the reference. camera.js places every row
# the same way: at the camera, identity, scale 1. sight/muzzle/grip are the file's own sockets (eye frame, m); ADS moves the model by -sight.
# clips: the standard names baked into each file (idle = the static rest pose the old rows froze on).
standard: { floor: -100, depth: 0 }   # build.py's PIN_Y: every file's bounds floor, so the engine's feet rule shifts all of them alike
