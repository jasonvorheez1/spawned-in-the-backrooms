# Main quest "The Front Door", part one (johnadams2 2026-11-08: slow burn, Levels 1-5 only, no more for now).
# Written, not wired yet. Reveals are held back: nobody says "exit" outright until a later part.
key: mainQ
name: The Front Door
chapters:
  - id: alpha
    name: Static
    level: level1
    steps:
      - "Your HALOGEN keeps flickering. Ask at the M.E.G. camp about it"
      - "Let the M.E.G. technician look at your HALOGEN"
      - "Its memory is locked and dead. Find a Robotics power cell"
    beat: "The technician goes quiet at the serial number and says only that it belonged to someone called Dana, and that you should keep it charged."
  - id: pipes
    name: Steam
    level: level2
    steps:
      - "Find the Robotics maintenance locker in the pipe halls"
      - "Pick its lock or find the key on a dead technician"
      - "Take the power cell and get out of the heat"
    beat: "Someone is watching from a catwalk. When you look up, nobody is there."
  - id: station
    name: Charge
    level: level3
    steps:
      - "Find a working charging bay in the Electrical Station"
      - "Hold out through the blackout while it charges"
      - "Listen to the recording that plays"
    beat: "A woman's voice, Dana, half static: 'if you're hearing this, it still works. don't let them take it back.' Then it cuts. Robotics drones begin to show up where you go."
  - id: office
    name: Them
    level: level4
    steps:
      - "Find the Backrooms Robotics office in the Abandoned Office"
      - "Get past the security doors"
      - "Copy whatever the server keeps under Dana's name"
    beat: "One file, unreadable, named FRONT DOOR. A memo says a copy went to the Terror Hotel."
  - id: hotel
    name: Check-In
    level: level5
    steps:
      - "Ask at the Terror Hotel front desk about the copy"
      - "Go down to the Boiler Room"
      - "Someone is waiting by the furnace"
    beat: "Phoebe, face hidden, smiling. She holds up the copy, says 'not yet,' and is gone. End of part one."
