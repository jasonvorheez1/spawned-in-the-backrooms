# Level 69 people, written by hand. Quest lines live in scripts/lib/level69-quest.js (l69Choices).
# Wren Adeyemi: M.E.G. field surveyor camped beside the Level 69 sedan in Boom Town, tired, dry, precise. Doesn't oversell the dark.
l69-npc-wren:
  hi: ["Oh. Someone who isn't running from a tower. Hi. Can you drive?"]
  back: ["You came back up. People don't, usually. They just keep driving."]
  warm: ["There's my driver. Engine still sound?"]
  cold: ["Keep your distance, please. I've had a long few days."]
  bye: ["Keep the doors shut.", "Drive in the middle lane. The edges whisper."]
  ask:
    - q: "Where is this?"
      a: ["Boom Town, up here. Down there, through that sedan, is Level 69 on our charts. A highway. Four lanes, two walls, no exits we've ever mapped, and fog that won't come near a running car."]
      then:
        - q: "Why won't the fog come near cars?"
          a: ["Nobody knows. I've got a thermometer on the dash and a theory I'm not proud of. The car is the only thing here that belongs to us. Maybe the fog knows that."]
    - q: "What's out there?"
      a: ["Above, mostly. Legs. Long ones, jointed like a crab's, coming down out of the black when somebody stands on the road too long. I've never seen the rest of it. I don't want to."]
    - q: "How do I get out?"
      sk: survival 20
      a: ["There's a tunnel. Cuts off the road at a right angle, lit like a parking garage. M.E.G. logs say it runs seventeen hours and comes out in the city. Level 11. The cars never make it the whole way. You walk the end."]
      fail: ["Keep driving. That's all anyone ever says. I hate that it's true."]
    - q: "Do you need food or water?"
      a: ["I've got rations for a week and almond water for four days. If you find a stalled car, check the boot. People pack for road trips. They just don't finish them."]
    - q: "Who were you talking to before I pulled up?"
      a: ["Nobody. That's the problem. You'll hear it too, after a while. A voice that knows your name and gets everything else slightly wrong. Turn the radio up. It doesn't like competition."]
  barks:
    idle: ["Six hundred metres. Six-forty. Seven hundred.", "Come on, come on.", "Don't look up. Don't look up."]
    hi: ["Hi.", "Lights on, please."]
    drawn: ["Whoa. I'm a surveyor. I carry a tripod.", "Please don't."]
    hurt: ["You're bleeding. There's gauze in my pack."]
    close: ["Oh! You walk quiet."]
    spot: ["Something's above us. Get in the car."]
    hostile: ["I mapped worse than you!"]
    hit: ["Ow!", "That's my writing arm!"]
