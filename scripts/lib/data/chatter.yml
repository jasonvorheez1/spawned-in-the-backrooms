# Level 109, the Doctors' outpost (room ew0_13m). Picked by scripts/lib/l109-life.js from what has happened: _open while the west door
# ew0_6p stands open, _clear/_lure once Keep It Closed ended that way, _stable for a few minutes after the triage scene settles.
level109:
  - [[l109o-ew0_13m-petra, "did someone move the supplies from ward c?"], [l109o-ew0_13m-guard1, "m.e.g. took them this morning."], [l109o-ew0_13m-petra, "all of them?"], [l109o-ew0_13m-guard1, "all the gauze. it's signed for, before you ask."]]
  - [[l109o-ew0_13m-doc1, "bed two dropped again overnight."], [l109o-ew0_13m-doc2, "third time this week."], [l109o-ew0_13m-doc1, "i'm not writing 'third time' on a chart."], [l109o-ew0_13m-doc2, "write it anyway."]]
  - [[l109o-ew0_13m-guard0, "you hear that? west end."], [l109o-ew0_13m-guard2, "the knocking?"], [l109o-ew0_13m-guard0, "it stopped."], [l109o-ew0_13m-guard2, "that's worse."]]
  - [[l109o-ew0_13m-halloran, "who's on the kettle?"], [l109o-ew0_13m-petra, "you are. you always are."]]
  - [[l109o-ew0_13m-doc2, "we're down to four kits in the cage."], [l109o-ew0_13m-halloran, "then nobody gets a kit for a splinter."]]
  - [[l109o-ew0_13m-guard1, "corporal. the stairwell door by arrival."], [l109o-ew0_13m-guard0, "still welded?"], [l109o-ew0_13m-guard1, "still welded."], [l109o-ew0_13m-guard0, "then it's still not our problem."]]
  - [[l109o-ew0_13m-doc1, "the ward across the hall had its lights go again."], [l109o-ew0_13m-guard2, "we're not walking over there in the dark."], [l109o-ew0_13m-doc1, "i wasn't asking you to."], [l109o-ew0_13m-guard2, "you were about to."]]
  - [[l109o-ew0_13m-petra, "somebody drank the almond water out of the cooler."], [l109o-ew0_13m-guard0, "it's a cooler. that's what it's for."], [l109o-ew0_13m-petra, "that was the patients' cooler."]]
level109_open:
  - [[l109o-ew0_13m-guard1, "door count?"], [l109o-ew0_13m-guard0, "same as yesterday. all shut but one."], [l109o-ew0_13m-guard1, "the west one's still open?"], [l109o-ew0_13m-guard0, "nobody's volunteered."]]
  - [[l109o-ew0_13m-doc2, "are we sending anyone west?"], [l109o-ew0_13m-halloran, "with what? two privates and a corporal?"], [l109o-ew0_13m-doc2, "so we wait."], [l109o-ew0_13m-halloran, "we wait and we keep ours shut."]]
level109_clear:
  - [[l109o-ew0_13m-guard2, "no knocking from the west door."], [l109o-ew0_13m-guard0, "the stranger cleared it out."], [l109o-ew0_13m-guard2, "all of it?"], [l109o-ew0_13m-guard0, "i went and looked. all of it."]]
  - [[l109o-ew0_13m-halloran, "ruiz. the west room."], [l109o-ew0_13m-guard0, "shut. empty."], [l109o-ew0_13m-halloran, "good. take the red off the board."]]
level109_lure:
  - [[l109o-ew0_13m-guard2, "west door's knocking again."], [l109o-ew0_13m-guard0, "means they're still in there."], [l109o-ew0_13m-guard2, "the stranger walked them home."], [l109o-ew0_13m-guard0, "brave or stupid."], [l109o-ew0_13m-guard2, "both, probably."]]
  - [[l109o-ew0_13m-petra, "is the west room empty now?"], [l109o-ew0_13m-guard1, "no. just shut."], [l109o-ew0_13m-petra, "i'd rather empty."], [l109o-ew0_13m-guard1, "so would i."]]
level109_stable:
  - [[l109o-ew0_13m-doc1, "bed two's holding."], [l109o-ew0_13m-petra, "for now."], [l109o-ew0_13m-doc1, "for now is what we do here."]]
  - [[l109o-ew0_13m-halloran, "what was it, bed two?"], [l109o-ew0_13m-doc1, "pressure. same as before."], [l109o-ew0_13m-halloran, "write it down. all of it."]]
# Level 132, Lumiria: the stallkeepers across the square, gossiping over what they collect (scripts/lib/l132-people.js)
level132:
  - [[l132-teodora, "Anouk. Anouk! Have you got any saffron left?"], [l132-anouk, "For you? For one of those blue urns, maybe."], [l132-teodora, "Never. The blue ones stay."]]
  - [[l132-benny, "Dex, the new cartridge. The gold one. Is it real?"], [l132-dex, "It's r-real. It's not for trade."], [l132-benny, "Everything's for trade, buddy."]]
  - [[l132-gus, "Somebody brought me a record today. Didn't know what to do with it."], [l132-silas, "Bring it here, Gus. Bring it right here."]]
  - [[l132-rosalind, "Margo, darling, your scarf. Is that new?"], [l132-margo, "Older than you. Keep your hands off it."], [l132-rosalind, "Ha! Worth a try."]]
  - [[l132-anouk, "Did you hear? The Duke's festival is coming round again."], [l132-gus, "Already? Who's he calling this year?"], [l132-anouk, "Five lucky ones. Five big collections. Same as always."]]
  - [[l132-silas, "Haven't seen old Pell since the last festival."], [l132-margo, "Well. He went up to the palace, didn't he."], [l132-silas, "Yeah. Lucky guy."]]
  - [[l132-mateo, "The Wi-Fi's down again."], [l132-wendell, "I can, um, I can sell you a router. Trade you. Trade you a router."], [l132-mateo, "You traded me three already, Wendell."]]
  - [[l132-del, "Pie's out! Who wants pie?"], [l132-gus, "Me! I'll bring you a peach for it."], [l132-del, "Two peaches, hon. It's cherry."]]
  - [[l132-odalys, "Is the Wi-Fi always like this here?"], [l132-mateo, "Only on days that end in Y."], [l132-odalys, "Great. Just great."]]
  - [[l132-benny, "New phone came in this morning. Sealed in the box!"], [l132-teodora, "And next to it, a Greek amphora. Your stall makes no sense."], [l132-benny, "It makes perfect sense. It's Lumiria."]]
  - [[l132-dex, "Rosalind, d-do you have any hats with, um, propellers?"], [l132-rosalind, "I have one. It is not for you, sweetheart."]]
  - [[l132-margo, "My knees say rain."], [l132-anouk, "It never rains here, Margo."], [l132-margo, "My knees don't know that."]]
  - [[l132-wendell, "Del, the TV in the diner's working again?"], [l132-del, "Works if you hit it. So I hit it."]]
  - [[l132-gus, "Lovely day."], [l132-silas, "Every day's a lovely day."], [l132-gus, "That's what I like about it."]]
