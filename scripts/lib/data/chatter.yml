# Camp chatter: short exchanges two or three NPCs have with each other while a player is near.
# Each exchange is a list of [speaker id, line]. Lines are plain talk: tired people with jobs, not a tutorial.
# her picks: hear range 20 m, a gap of 25-50 s between exchanges
hear: 20
gapMin: 25
gapMax: 50
level1:
  - [[meg-callum, "who took the last can of peaches."], [meg-ale, "define took."], [meg-callum, "ale."], [meg-ale, "it was expiring. i did us a favor."]]
  - [[meg-ortiz, "hold still, your hand's bleeding again."], [meg-ale, "it's fine, it's a scratch."], [meg-ortiz, "it's a bite. there's a difference."], [meg-ale, "...okay yeah, that's a bite."]]
  - [[meg-ale, "lights went out in the east block again."], [meg-callum, "how long?"], [meg-ale, "long enough that i stopped counting."], [meg-callum, "great. so no one's walking that way tonight."]]
  - [[meg-callum, "you ever think about what's up there? level zero?"], [meg-ortiz, "try not to."], [meg-callum, "i miss the carpet. isn't that stupid."], [meg-ortiz, "a little. i get it though."]]
  - [[meg-ortiz, "did you sleep at all?"], [meg-callum, "couple hours."], [meg-ortiz, "you said that yesterday."], [meg-callum, "and it was true yesterday too."]]
  - [[meg-ale, "heard someone yelling hello down the pipes earlier."], [meg-ortiz, "did you answer?"], [meg-ale, "no. i'm not new."], [meg-ortiz, "good."]]
  - [[meg-callum, "count's off. we're short two almond waters."], [meg-ale, "don't look at me."], [meg-callum, "i'm looking at the crate. the crate's looking at you."]]
  - [[meg-ortiz, "base wants a report by the next blackout."], [meg-ale, "tell them nothing's changed."], [meg-ortiz, "that's what i told them last time."], [meg-ale, "so it's still true."]]
  - [[meg-ale, "callum. your snoring has a rhythm now."], [meg-callum, "i don't snore."], [meg-ortiz, "you snore in four four time."], [meg-callum, "...at least it's on beat."]]
  - [[meg-ortiz, "someone left the almond water in the sun lamp again."], [meg-ale, "warm almond water is a crime."], [meg-ortiz, "then stop committing it."]]
  - [[meg-callum, "new wanderer came through yesterday. kept asking where the exit was."], [meg-ale, "what'd you tell them?"], [meg-callum, "the truth. that we're all still looking."], [meg-ale, "harsh."], [meg-callum, "honest."]]
  - [[meg-ale, "if the lights flicker twice, what do we do?"], [meg-ortiz, "we stop talking."], [meg-ale, "and three times?"], [meg-ortiz, "we stop breathing."]]
  - [[meg-ortiz, "your boots are falling apart."], [meg-callum, "they're broken in."], [meg-ortiz, "they're broken, period."]]
  - [[meg-callum, "i traded a guy two batteries for a deck of cards."], [meg-ale, "full deck?"], [meg-callum, "forty nine."], [meg-ale, "so not a deck."], [meg-callum, "it's a deck in spirit."]]
level2:
  - [[surv-mags, "found a toolbox in the north rooms. half of it's rust."], [surv-hollis, "and the other half?"], [surv-mags, "also rust, but useful rust."]]
  - [[surv-wren, "pipes are knocking again."], [surv-hollis, "it's just pressure."], [surv-wren, "you say that every time."], [surv-hollis, "and every time i'm right. mostly."]]
  - [[surv-hollis, "you're limping."], [surv-wren, "no i'm not."], [surv-hollis, "sit down."], [surv-wren, "...fine. two minutes."]]
  - [[surv-mags, "if anyone comes asking, shells are four waters each."], [surv-wren, "that's robbery."], [surv-mags, "that's business, honey."]]
  - [[surv-wren, "you remember what the sky looked like?"], [surv-mags, "blue, mostly."], [surv-wren, "i keep forgetting if clouds were white or grey."], [surv-mags, "both. depended on the day."]]
  - [[surv-hollis, "that barred door with the three on it."], [surv-mags, "don't."], [surv-hollis, "i'm just saying something's breathing back there."], [surv-mags, "and i'm just saying don't."]]
  - [[surv-mags, "hollis, you still got that radio working?"], [surv-hollis, "it hisses. sometimes the hiss has words in it."], [surv-mags, "what words?"], [surv-hollis, "never the ones you want."]]
  - [[surv-wren, "hounds were close last night."], [surv-mags, "how close?"], [surv-wren, "close enough i could smell 'em."], [surv-hollis, "then we double up on watch."]]
  - [[surv-hollis, "steam vent on the west run blew out again."], [surv-wren, "anyone hurt?"], [surv-hollis, "just my pride. and my eyebrows."]]
  - [[surv-mags, "wren, quit tapping the pipe."], [surv-wren, "i'm checking if it's hollow."], [surv-mags, "they're all hollow. they're pipes."], [surv-wren, "this one's more hollow."]]
  - [[surv-wren, "do you think the people upstairs miss us?"], [surv-hollis, "which upstairs?"], [surv-wren, "any of them."], [surv-hollis, "i think they don't know we're gone."]]
  - [[surv-hollis, "price on rounds just went up."], [surv-mags, "says who?"], [surv-hollis, "says the guy selling them."], [surv-mags, "that guy is me."], [surv-hollis, "and you're a thief."]]
  - [[surv-mags, "something left footprints in the grease by the boiler."], [surv-wren, "ours?"], [surv-mags, "nobody here has that many toes."]]
level3:
  - [[gamma-reyes, "generator four is coughing again."], [gamma-pell, "it's been coughing for a month."], [gamma-reyes, "it's coughing louder."], [gamma-pell, "then walk faster past it."]]
  - [[gamma-ito, "reyes. sleeve. now."], [gamma-reyes, "it's a burn, doc. the wiring bit me."], [gamma-ito, "the wiring bites everyone. hold still."]]
  - [[gamma-pell, "two crates of wire came in, one crate went out. explain that."], [gamma-reyes, "moths?"], [gamma-pell, "moths don't sign the ledger, reyes."]]
  - [[gamma-reyes, "heard the hounds down by the lines."], [gamma-ito, "how many?"], [gamma-reyes, "enough that i came back."], [gamma-ito, "good call."]]
  - [[gamma-ito, "you ever sleep through the hum?"], [gamma-pell, "first week, no. now i can't sleep without it."], [gamma-ito, "that's the part that worries me."]]
  - [[gamma-pell, "base wants a tally by shift change."], [gamma-reyes, "tell them the halls moved again."], [gamma-pell, "they'll want it in writing."], [gamma-reyes, "write 'the halls moved again.'"]]
  - [[gamma-reyes, "somebody chalked an arrow by the crawl tube."], [gamma-ito, "pointing in or out?"], [gamma-reyes, "in."], [gamma-ito, "then nobody follows it."]]
  - [[gamma-ito, "stove's low. who's on fuel?"], [gamma-pell, "the ledger says reyes."], [gamma-reyes, "the ledger lies."], [gamma-pell, "the ledger is never wrong."]]
  - [[gamma-reyes, "doc, you got anything for a headache?"], [gamma-ito, "quiet."], [gamma-reyes, "that's not medicine."], [gamma-ito, "here it is."]]
  - [[gamma-pell, "the lift made a sound today."], [gamma-reyes, "what kind of sound?"], [gamma-pell, "the kind lifts aren't supposed to make."]]
  - [[gamma-ito, "you're humming along with the hum again, reyes."], [gamma-reyes, "am not."], [gamma-ito, "a perfect b flat."], [gamma-reyes, "...it's catchy."]]
  - [[gamma-pell, "inventory says we have nine flashlights."], [gamma-reyes, "i count four."], [gamma-pell, "then five are somewhere dark."], [gamma-ito, "fitting."]]
level7:
  # Fort Surrender: Jude preaches, Mara keeps the lights on
  - [[l7-jude, "the water was restless last night, sister."], [l7-mara, "the water's always restless, jude. it's water."], [l7-jude, "it was restless with purpose."], [l7-mara, "then its purpose can wait till i fix the roof."]]
  - [[l7-mara, "tar's running low. the north wall won't hold another storm."], [l7-jude, "then we offer it what we cannot keep."], [l7-mara, "we are not feeding the wall to the sea."], [l7-jude, "...a plank, then. just one."]]
  - [[l7-jude, "do you ever hear it, beneath the waves?"], [l7-mara, "i hear the waves."], [l7-jude, "beneath them."], [l7-mara, "i make a point of not listening down there."]]
  - [[l7-mara, "a dory came in with half a crate of almond water."], [l7-jude, "and the rest?"], [l7-mara, "the rest is somewhere in the twilight zone."], [l7-jude, "then it is with him now."], [l7-mara, "him can buy his own."]]
  - [[l7-jude, "the seawatch people still won't come ashore."], [l7-mara, "they trade at the rocks. it's enough."], [l7-jude, "they fear us."], [l7-mara, "jude, you scare me, and i live here."]]
  - [[l7-mara, "if a stranger asks, we're a fishing camp."], [l7-jude, "we have never caught a fish."], [l7-mara, "nobody has. that's not the point."]]
  - [[l7-jude, "tiny sang last night, out by the pipes."], [l7-mara, "that wasn't singing."], [l7-jude, "everything is singing, if you surrender to it."], [l7-mara, "you need more sleep."]]
  - [[l7-mara, "the lantern oil smells like the deep."], [l7-jude, "good."], [l7-mara, "not good. it's starting to smell like everything."]]
  - [[l7-ezra, "the watch saw a dory by the rocks. two people, one oar."], [l7-tobit, "they row like they are sorry."], [l7-ezra, "everyone here rows like that."]]
  - [[l7-ines, "the pit ran hot again. i skimmed it twice."], [l7-ezra, "does it want more?"], [l7-ines, "it always wants more. i give it the rope."]]
  - [[l7-tobit, "who built the first wardrobe wall?"], [l7-ezra, "the first ones. the ones before the tar."], [l7-tobit, "and who found the tar?"], [l7-ezra, "it found us."]]
  - [[l7-ines, "the strangers on the pier don't look up."], [l7-tobit, "they are looking for the door under the water."], [l7-ines, "let them. it is not ours to open."]]
  # Outpost Seawatch: Vance on the radio to a base nobody else hears
  - [[l7-vance, "seawatch to gamma. seawatch to gamma. nothing on the surface, again. over."]]
  - [[l7-vance, "visibility forty meters. ceiling still there. sea still there. me still here."]]
  - [[l7-vance, "logged another pipe formation west of the door. not diving it. nobody pay me enough."]]
  - [[l7-vance, "the fort lit three lanterns tonight. that's one more than last week. noting it."]]
  - [[l7-vance, "dive tank's holding. rope's holding. nerves are... adequate."]]
  - [[l7-vance, "something big moved under the dory line. didn't surface. good. stay down there."]]
level10:
  # Outpost Bountiful: Cooper runs it, Maeve studies it, Hale counts it, Wren works it, Sully talks to nobody on the radio
  - [[l10-meg-cooper, "loaves are up. who's on the caravan tally?"], [l10-meg-hale, "me. forty-one loaves, nine sacks."], [l10-meg-cooper, "i baked forty-two."], [l10-meg-hale, "then somebody ate one."], [l10-meg-wren, "...it was warm."]]
  - [[l10-meg-wren, "dug a post hole by the east fence. deeper than i meant."], [l10-meg-maeve, "how deep?"], [l10-meg-wren, "deep enough it started moving."], [l10-meg-maeve, "fill it. now. and bring me a sample next time."]]
  - [[l10-meg-maeve, "the eastern scarecrow is facing the house again."], [l10-meg-cooper, "it faced the road yesterday."], [l10-meg-maeve, "nobody turned it."], [l10-meg-cooper, "then nobody tell wren."], [l10-meg-wren, "i'm standing right here."]]
  - [[l10-meg-sully, "bountiful to alpha. clear skies, ripe wheat, nothing on the horizon. over."], [l10-meg-sully, "...alpha? anybody?"], [l10-meg-sully, "fine. i'll log it myself."]]
  - [[l10-meg-hale, "barn roof leaks on the north bay."], [l10-meg-cooper, "put a bucket under it."], [l10-meg-hale, "i put six. it's a lot of roof."]]
  - [[l10-meg-wren, "you ever wonder who planted all this?"], [l10-meg-cooper, "every day."], [l10-meg-wren, "and?"], [l10-meg-cooper, "and then i harvest it anyway."]]
  - [[l10-meg-maeve, "soil reads normal. moisture normal. ph normal."], [l10-meg-hale, "so it's fine."], [l10-meg-maeve, "nothing is that normal, hale."]]
  - [[l10-meg-sully, "picked up music on the shortwave last night."], [l10-meg-wren, "what kind?"], [l10-meg-sully, "a fiddle. real slow."], [l10-meg-wren, "from where?"], [l10-meg-sully, "the antenna was pointed at the ground."]]
  - [[l10-meg-cooper, "wren, the well rope's fraying."], [l10-meg-wren, "i'll splice it after the barley."], [l10-meg-cooper, "the well's more important than barley."], [l10-meg-wren, "tell that to the barley."]]
  - [[l10-meg-hale, "a wanderer paid in backbucks again."], [l10-meg-cooper, "money's money."], [l10-meg-hale, "money's paper. bread is bread. i know which one i'd eat."]]
  - [[l10-meg-maeve, "the worms surfaced near the lake at dawn."], [l10-meg-sully, "how many?"], [l10-meg-maeve, "i stopped counting at a few hundred."], [l10-meg-sully, "logging it as 'a few hundred.'"]]
  - [[l10-meg-wren, "the fire's nice tonight."], [l10-meg-cooper, "every night's nice out here. that's the trick of it."], [l10-meg-wren, "what trick?"], [l10-meg-cooper, "you stop looking for the catch."]]
level8:
  # the 9th Road camp: Hobb keeps the fire, Wen trades, Ivo surveys, Marit stitches, Carla cooks
  - [[l8-hobb, "torch count."], [l8-wen, "eleven."], [l8-hobb, "it was twelve this morning."], [l8-wen, "it was twelve until someone went for a walk."], [l8-ivo, "...i brought it back."]]
  - [[l8-ivo, "the asphalt's warm again. past the camp."], [l8-marit, "roads don't get warm, ivo."], [l8-ivo, "this one does. like something drove it."], [l8-marit, "nobody's driven anything down here."], [l8-ivo, "then who laid it?"]]
  - [[l8-carla-kid, "soup's three bucks."], [l8-hobb, "you charged me four."], [l8-carla-kid, "you said it was bad."], [l8-hobb, "...fair."]]
  - [[l8-marit, "the choir was singing again last night."], [l8-wen, "i heard."], [l8-marit, "lull used to sing on shift. same song."], [l8-wen, "don't go back there, marit."], [l8-marit, "i'm not going. i'm just saying it's the same song."]]
  - [[l8-wen, "broodmother's bigger."], [l8-hobb, "you say that every week."], [l8-wen, "and every week i'm right."]]
  - [[l8-ivo, "dell's map ends at the tar."], [l8-marit, "because dell ended at the flood."], [l8-ivo, "i know. i'm finishing it for her."], [l8-marit, "finish it from here. with a light on."]]
  - [[l8-hobb, "anyone new comes in, tell 'em. light off past the hall."], [l8-carla-kid, "why off?"], [l8-hobb, "the lightless hate it."], [l8-carla-kid, "then why do we keep ours on?"], [l8-hobb, "'cause we're not them."]]
  - [[l8-wen, "dredge brought up another hand."], [l8-ivo, "attached to anything?"], [l8-wen, "a ring."], [l8-ivo, "keep it?"], [l8-wen, "sold it. it was warm."]]
  - [[l8-carla-kid, "can spiders swim?"], [l8-marit, "no."], [l8-carla-kid, "good. i'm gonna live in the lake."], [l8-marit, "the lake's freezing, carla."], [l8-carla-kid, "spiders are worse."]]
  - [[l8-ivo, "the lane hummed a whole chord today."], [l8-wen, "my lights tune it."], [l8-ivo, "your lights are mushrooms, wen."], [l8-wen, "tuned mushrooms."]]
  - [[l8-hobb, "blackjaw was at the tar again."], [l8-marit, "drinking it?"], [l8-hobb, "drinking it."], [l8-marit, "...then he won't need us much longer."]]
  - [[l8-marit, "spider bite count this week: four."], [l8-hobb, "who?"], [l8-marit, "ivo, ivo, ivo and a stranger."], [l8-ivo, "they like me."]]
level21:
  # Refrigerator Paradise: Ned manages the quartermaster supplies, Goknar keeps watch
  - - ["l21-ned", "How many cartons of Saltines we got left, Goknar?"]
    - ["l21-goknar", "Roughly four thousand sleeves. Enough to outlive our grandchildren."]
    - ["l21-ned", "Good. Because I'm never eating another can of cold beans."]
  - - ["l21-goknar", "Hear that scratching behind the east wall?"]
    - ["l21-ned", "Just the Smilers down in The Edges. Keep the lights on and they stay back."]
    - ["l21-goknar", "I checked the breakers this morning. Voltage is holding."]
  - - ["l21-ned", "Copper coil on the condenser is dripping clean water again."]
    - ["l21-goknar", "Coldest water in the Backrooms. Makes this place feel almost civilized."]
  - - ["l21-goknar", "Nobody go near that specimen jar in Exploration."]
    - ["l21-ned", "Admin Memo #13. Don't worry, nobody's stupid enough to eat glowing purple berries."]
    - ["l21-goknar", "You'd be surprised what people eat when the hunger sets in."]
level11:
  - - ["l11-walker-1", "Hey Kael. Got any fresh apples in that crate, or did the southern refinery noclip more cabbages?"]
    - ["l11-trader-kael", "Fresh apples, right off the noclip stack ten minutes ago. Help yourself, it's free citizen ration."]
    - ["l11-walker-1", "Bless the Capital Council. If I had to eat another tin of boiled beans on 14th Avenue I'd cry."]
  - - ["l11-walker-2", "Excuse me... do you know if the commercial elevator to Floor 14 is running today?"]
    - ["l11-commuter-faceling", "Good afternoon! Yes, the brass lift is nominal. The view over the canal promenade from the skydeck is quite lovely."]
    - ["l11-walker-2", "Thanks. Three weeks in this city and I still get dizzy looking up at the Pegasus sign."]
    - ["l11-commuter-faceling", "Take it slow, dear. The concrete never moves, even if the cars do."]
  - - ["l11-walker-3", "Specialist Vance. Steam line pressure on 11th Avenue checked out. Manholes are venting clean Almond Water vapor."]
    - ["l11-meg-agent-vance", "Appreciate the check, Janitor. Base Beta logged no entity hostility around the perimeter today either."]
    - ["l11-walker-3", "The Level 11 Effect holds up, then. Even the hound by the lamppost was snoring like a domestic mutt."]
    - ["l11-meg-agent-vance", "Just don't kick his bowl. Docile doesn't mean brain-dead."]
  - - ["l11-walker-1", "Hey pop, what's with the orange barricades and the pneumatic drill on the west lane?"]
    - ["l11-walker-3", "Simulated roadworks. Level popped 'em up overnight."]
    - ["l11-walker-1", "Are they actually digging up pipes or what?"]
    - ["l11-walker-3", "Course not, you idiot. The street just likes having roadworks. Walk around it."]
  - - ["l11-walker-2", "Trader Kael! Any word on when the next B.N.T.G. coffee shipment arrives?"]
    - ["l11-trader-kael", "Trader caravan from Level 6.1 is crossing the canal locks this afternoon. Real roasted beans, no chicory."]
    - ["l11-walker-2", "Put me down for two bags. My office manager runs on caffeine and anxiety."]
    - ["l11-trader-kael", "The Guild delivers, friend. Capital credits or scrap tokens, we take both."]
  - - ["l11-commuter-faceling", "Mind your speed on the sidewalk, young man! You nearly clipped the newspaper stand."]
    - ["l11-walker-1", "Sorry ma'am! Priority dispatch for the Sedco building. Management gets testy if their CCTV logs are five minutes late."]
    - ["l11-commuter-faceling", "Haste makes waste, especially when a street might noclip an exit right under your toes."]
    - ["l11-walker-1", "Point taken. Watching my step."]
  - - ["l11-meg-agent-vance", "Kael. The barricade on 32nd Street holding? We logged three new one-way rifts past the pallets."]
    - ["l11-trader-kael", "Holding tight, Vance. Guild spray-painted fresh warnings on the corrugated sheets. Nobody's crossing over."]
    - ["l11-meg-agent-vance", "Good. We lost enough wanderers to unknown levels this month. Keep your eyes sharp."]
  - - ["l11-meg-agent-vance", "Base Beta patrol log. Boulevard perimeter secure. Docile entities remain calm."]
  - - ["l11-trader-kael", "Fresh loaves and crisp apples straight from the pantry rifts! Citizen rations, compliments of the B.N.T.G.!"]
  - - ["l11-commuter-faceling", "Such calm air along the canal promenade today. Almost makes one forget about the ceiling far above."]
  - - ["l11-walker-1", "Package manifest stamped for Sedco. If the commercial lift gets stuck again, I'm taking the fire escape."]
  - - ["l11-walker-2", "Three weeks here and I'm still counting window panes. Beautiful city, though."]
  - - ["l11-walker-3", "Almond Water steam pressure on 11th is holding nominal. Clean heat for the apartment stoops."]
  # Nov 8, Shelly: "add more dialogue and conversations for level 11". Small talk, how people actually talk.
  - - ["l11-walker-2", "Dee! Is the bag mask back in stock? The one with the scribbly smile?"]
    - ["l11-tm-clerk", "Came in yesterday. Somebody traded it for a sandwich, honestly."]
    - ["l11-walker-2", "A whole sandwich?"]
    - ["l11-tm-clerk", "Half. They looked hungry. Don't tell my manager."]
  - - ["l11-tm-clerk", "Vance, you ever gonna buy something or just stand by my window?"]
    - ["l11-meg-agent-vance", "I'm watching the street. Your window happens to be on it."]
    - ["l11-tm-clerk", "There's a hoodie in there with your name on it."]
    - ["l11-meg-agent-vance", "There's a hoodie in there that says Game Master. That's not my name."]
  - - ["l11-walker-1", "You ever notice nobody drives those cars? They just sit there."]
    - ["l11-walker-3", "Somebody drives 'em. Taxi moved two spots last week."]
    - ["l11-walker-1", "Did you see who?"]
    - ["l11-walker-3", "No. And I didn't ask."]
  - - ["l11-commuter-faceling", "Have you tried the payphone on the corner? It rings at night."]
    - ["l11-walker-2", "Who's calling?"]
    - ["l11-commuter-faceling", "I picked it up once. Somebody was breathing. Then they said my name."]
    - ["l11-walker-2", "...I'm gonna use the other corner."]
  - - ["l11-trader-kael", "Courier, you still owe me for last week's batteries."]
    - ["l11-walker-1", "I paid you! I put the money in the crate!"]
    - ["l11-trader-kael", "The crate that refills itself? Kid, that crate eats money."]
    - ["l11-walker-1", "Oh. Oh no."]
  - - ["l11-walker-3", "Sedco's got their lights on again. Whole floor, all night."]
    - ["l11-meg-agent-vance", "Nobody badges in or out. We checked."]
    - ["l11-walker-3", "Then who's paying the power bill?"]
    - ["l11-meg-agent-vance", "Nobody pays power bills here, old man."]
    - ["l11-walker-3", "Still. Feels rude."]
  - - ["l11-walker-2", "I found an apartment! Third floor, faces the street."]
    - ["l11-commuter-faceling", "Wonderful. Does the radio work?"]
    - ["l11-walker-2", "How did you know there's a radio?"]
    - ["l11-commuter-faceling", "There's always a radio, dear."]
  - - ["l11-walker-1", "Tried the subway gate again. Still locked."]
    - ["l11-walker-3", "Good. You don't want what's down there."]
    - ["l11-walker-1", "What's down there?"]
    - ["l11-walker-3", "A train that hasn't moved since before I got here. Leave it be."]
  - - ["l11-tm-clerk", "Kael, you want the coat with the red smile or not? I'm closing the hold."]
    - ["l11-trader-kael", "Can I trade you three loaves for it?"]
    - ["l11-tm-clerk", "Bread for a coat. Sure. Why not. Everything's bread here."]
  - - ["l11-commuter-faceling", "Lovely weather."]
    - ["l11-walker-3", "It's always this weather."]
    - ["l11-commuter-faceling", "And it's always lovely."]
  - - ["l11-meg-agent-vance", "Courier. Slow down near the kiosk, somebody's been messing with that terminal."]
    - ["l11-walker-1", "Wasn't me!"]
    - ["l11-meg-agent-vance", "Didn't say it was. Said slow down."]
  - - ["l11-walker-2", "Do you ever miss home?"]
    - ["l11-walker-3", "Every day. Then I remember my landlord."]
    - ["l11-walker-2", "Ha. Yeah. This one doesn't charge rent."]
    - ["l11-walker-3", "This one doesn't have a landlord. That's worse, somehow."]
