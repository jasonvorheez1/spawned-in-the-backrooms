# Clothing as loot and armor (Shelly #10224: "every critter should start out with just regular clothes and they should get
# the other types of clothes as random loot ... used as armor"; "strip them naked and wear their clothes like in fallout").
# A garment is an item token "cloth:<slot>:<kind>:<hex>" (scripts/lib/items.js). slot = the critter look key
# (topw, botw, shoes, hat, eyew, neck), kind = a garment scripts/critter2-geo.js draws, hex = its colour without '#'.
# dr = damage resistance points, subtracted from every hit (Fallout NV DT: a hit never drops below `floor` of itself).
# Every number below is Savi's pick. regular: true = the plain set every new critter starts in.
# A row with `strict: true` only matches its own colours (the M.E.G. jacket is a jacket in agency lime).
colourKey: { topw: top, botw: bottom, shoes: shoec, hat: hatc, neck: neckc }   # eyewear has no colour
# Fabric patterns (Shelly, Nov 7: "add textures to most of the clothes and new variants ... that only changes their texture").
# A row's pats: the patterns it comes in, the first its usual one. The pattern rides the look (patKey) and the token's 5th part
# ("cloth:topw:longsleeve:3d5a98:plaid"); same DR and weight, a different cloth. Drawn by scripts/mat-cloth.js.
patKey: { topw: topp, botw: botp, shoes: shoep, hat: hatp, neck: neckp }
patterns: { weave: "", denim: Denim, plaid: Plaid, tartan: Tartan, gingham: Gingham, stripes: Striped, pinstripe: Pinstripe, breton: Breton, camo: Camo, knit: Knit, cable: Cable-knit, argyle: Argyle, polka: Polka-dot, floral: Floral, leather: Leather, canvas: Canvas, hivis: Reflective, scales: Scaled, velvet: Velvet, oilskin: Waxed }
floor: 0.2          # Savi's pick: a hit keeps at least 20% of itself, however armored
findBase: 0.05      # Savi's pick: chance a remains body holds a garment at Observation 5, Luck 5
crateWeight: 6      # Savi's pick: weight of "cloth" among Level 0 crate rolls (almond is 40)
rarity:
  common:   { label: Common,   color: "#d8c9a0", weight: 10 }
  uncommon: { label: Uncommon, color: "#8fd07a", weight: 4 }
  rare:     { label: Rare,     color: "#6fb4ff", weight: 1.5 }
  agency:   { label: M.E.G.,   color: "#b6e04a", weight: 0.6 }
regularColours: ["e85d75", "ff9f43", "ffd93d", "6bcb77", "4d96ff", "3d5a98", "9b5de5", "f4f1ea", "2b2b33", "8b5a3c"]
# Leveled lists (Fallout/Skyrim style). A row's `level` is the lowest level it can turn up at (missing = 1).
# Loot reads the finder's level (or the place's tier for a drop with no finder); NPCs read their own level.
leveled:
  placeTier: { main: 1, level1: 4, level2: 8, level3: 12, level4: 10, gamma: 12, level5: 14, level6: 15, level7: 16, level8: 17, debug: 20 }   # Savi's picks
  rarityAt: { common: 1, uncommon: 4, rare: 10, agency: 14 }   # a rarity never rolls below this level
  lift: 0.04          # per level past a row's own: rarer rows get this much heavier (a level 20 finder sees more rare cloth)
  # NPC wardrobes by faction: the rows a faction dresses from (ids below), and how often each optional slot is filled
  factions:
    meg:      { rows: [megjacket, longsleeve, cargo, pants, boots, steeltoe, cap, beanie, padbeanie, shades, scarf, padjacket], extra: { hat: 0.45, eyew: 0.3, neck: 0.25 } }
    survivor: { rows: [hoodie, sweater, jacket, padjacket, wirehood, pants, cargo, overalls, canvasskirt, boots, sneakers, beanie, padbeanie, cap, scarf, carpetponcho, glasses], extra: { hat: 0.4, eyew: 0.2, neck: 0.35 } }
    wanderer: { rows: [tee, hoodie, sweater, officeshirt, pajamas, pants, shorts, skirt, slacks, sneakers, slippers, beanie, bow, headphones, glasses, scarf, carpetponcho], extra: { hat: 0.35, eyew: 0.25, neck: 0.25 } }
    office:   { rows: [officeshirt, longsleeve, dress, slacks, longskirt, sneakers, boots, glasses, bowtie], extra: { hat: 0.05, eyew: 0.5, neck: 0.4 } }
    tbd:      { rows: [hoodie, wirehood, jacket, cargo, pants, boots, headphones, tophat, crown, partyhat, shades, bell, cape], extra: { hat: 0.7, eyew: 0.4, neck: 0.4 } }
    l5:       { rows: [] }   # Level 5's hand-cast residents keep their own clothes (scripts/lib/l5-people.js)
    l7:       { rows: [] }   # Level 7's Seawatch & Fort Surrender residents keep their bespoke maritime/abyssal armor
    homely:   { rows: [] }   # Homely Hotel staff keep their bespoke uniforms
    orig:     { rows: [] }   # The Originals keep their vintage period clothing
    amor:     { rows: [dress, sweater, apron, longskirt, pants, boots, flower, cape, scarf], extra: { hat: 0.3, eyew: 0.05, neck: 0.6 } }
  # what a job wears (Shelly, Nov 7: "disperse clothes/armors to existing npcs and make sure they make sense"): a role's rows replace its
  # faction's for the slots they cover; pats: fabrics it leans to (60%). Savi's picks.
  roles:
    scout:     { rows: [jacket, padjacket, cargo, pants, boots, steeltoe, beanie, padbeanie, cap, shades, scarf], pats: [camo, canvas], extra: { hat: 0.65, eyew: 0.35, neck: 0.3 } }
    guard:     { rows: [megjacket, padjacket, wirehood, cargo, steeltoe, boots, cap, padbeanie, shades], pats: [camo, canvas, leather], extra: { hat: 0.85, eyew: 0.5, neck: 0.05 } }
    agent:     { rows: [megjacket, padjacket, cargo, pants, boots, steeltoe, cap, shades, scarf], pats: [camo, canvas], extra: { hat: 0.6, eyew: 0.45, neck: 0.15 } }
    captain:   { rows: [padjacket, jacket, cargo, slacks, steeltoe, boots, cap, shades, scarf], pats: [leather, canvas], extra: { hat: 0.9, eyew: 0.3, neck: 0.4 } }
    medic:     { rows: [longsleeve, apron, slacks, pants, sneakers, boots, glasses, cap], pats: [weave, canvas], extra: { hat: 0.15, eyew: 0.6, neck: 0.05 } }
    trader:    { rows: [apron, sweater, jacket, overalls, pants, cargo, boots, sneakers, beanie, cap, scarf, glasses], pats: [plaid, denim, knit, canvas], extra: { hat: 0.5, eyew: 0.3, neck: 0.4 } }
    quarter:   { rows: [apron, padjacket, jacket, cargo, overalls, steeltoe, boots, cap, glasses], pats: [canvas, denim, leather], extra: { hat: 0.5, eyew: 0.4, neck: 0.1 } }
    keeper:    { rows: [sweater, apron, longskirt, pants, slippers, boots, scarf, glasses], pats: [knit, cable, floral], extra: { hat: 0.1, eyew: 0.5, neck: 0.5 } }
    clerk:     { rows: [officeshirt, longsleeve, slacks, longskirt, sneakers, glasses, bowtie], pats: [pinstripe, weave], extra: { hat: 0, eyew: 0.6, neck: 0.5 } }
    psychic:   { rows: [sweater, dress, longskirt, cape, scarf, slippers, flower, bow, glasses], pats: [velvet, floral, knit], extra: { hat: 0.5, eyew: 0.2, neck: 0.7 } }
    pilgrim:   { rows: [hoodie, pants, longskirt, boots, beanie, carpetponcho, cape, scarf], pats: [knit, canvas], extra: { hat: 0.5, eyew: 0, neck: 0.8 } }
    scavenger: { rows: [hoodie, wirehood, padjacket, cargo, overalls, boots, padbeanie, beanie, shades], pats: [camo, denim, canvas], extra: { hat: 0.6, eyew: 0.4, neck: 0.2 } }
