# Level 2 "Abandoned Utility Halls": every tuned number. All Savi's picks, tune freely.
cells: 24            # 24 x 24 cells
cellSize: 5          # metres per cell (lore: hall lengths come in multiples of 5)
height: 3.0          # floor to ceiling: tight
seed: 2202
arrive: [1, 12]      # the Survivors' camp, by the door back to Level 1
rooms: 9             # warehouse rooms behind the tunnels
loops: 0.14          # share of extra openings so it's not a pure tree
darkShare: 0.3       # share of 4x4 sectors whose circuit is dead (violet emergency light only)
sanityDrain: { tunnel: 0.1, room: 0.07, dark: 0.22, camp: -1.2 }
sanityDrain: { tunnel: 0.1, room: 0.07, dark: 0.22, camp: -1.2, side: 0.04, hall: 0.14, pipes: 0.18 }
hounds: 3
crates: 28
crates: 22
almonds: 18
floorWeapons: 8
entityRespawn: 75
xpArrive: 90
# the boiler hall: a 4x4 block of cells, open inside, an 8 m ceiling, a catwalk ring at 3.6 m
hall: { x0: 10, z0: 9, w: 4, d: 4, height: 8, catwalk: 3.6 }
# the pipe maze: a block where the walls are banks of pipe, steam in the air, lamps that won't stay on
pipes: { x0: 16, z0: 15, w: 5, d: 5 }
flickerShare: 0.22   # share of 4x4 sectors whose tubes flicker
steamVents: 18
# side rooms: dead-end cells closed off by a real door. One of each type, then again, in this order.
sideRooms: 14
sideOrder: [boiler, locker, electrical, office, cage, break, pump, office, locker, electrical, cage, break, boiler, pump]
skillLockShare: 0.3  # an ordinary room door is picked shut this often (Lockpick 25 or 50)
types:
  boiler:     { label: "BOILER ROOM",  light: "oklch(0.78 0.14 55)", containers: [toolbox, locker] }
  locker:     { label: "MAINTENANCE",  light: "oklch(0.92 0.03 200)", containers: [locker, locker, locker] }
  pump:       { label: "PUMP ROOM",    light: "oklch(0.85 0.06 200)", lock: valve, containers: [cabinet, toolbox, locker] }
  office:     { label: "OFFICE",       light: "oklch(0.9 0.06 90)",  containers: [filing, filing, desk] }
  cage:       { label: "STORAGE",      light: "oklch(0.88 0.04 230)", lock: keycard, containers: [cagecrate, cagecrate, toolbox], bonus: 2 }
  break:      { label: "BREAK ROOM",   light: "oklch(0.9 0.08 80)",  containers: [vending, fridge] }
  electrical: { label: "ELECTRICAL",   light: "oklch(0.8 0.1 240)",  lock: fuse, containers: [cabinet, toolbox], bonus: 1 }
# what each container is: its name, size (w h d), how many rolls, its loot table
containers:
  toolbox:   { name: "Toolbox",          size: [0.62, 0.32, 0.3],  n: [1, 3], table: tools }
  locker:    { name: "Maintenance locker", size: [0.5, 1.9, 0.5], n: [1, 3], table: locker }
  cabinet:   { name: "Supply cabinet",   size: [0.9, 1.1, 0.42],   n: [2, 3], table: tools }
  filing:    { name: "Filing cabinet",   size: [0.48, 1.32, 0.62], n: [1, 2], table: office }
  desk:      { name: "Desk drawers",     size: [1.4, 0.76, 0.7],   n: [1, 2], table: office }
  vending:   { name: "Vending machine",  size: [1.0, 1.9, 0.8],    n: [3, 5], table: food }
  fridge:    { name: "Break-room fridge", size: [0.7, 1.7, 0.7],   n: [2, 3], table: food }
  cagecrate: { name: "Caged supply crate", size: [0.9, 0.7, 0.7],  n: [2, 4], table: cage }
  lockbox:   { name: "Foreman's lockbox", size: [0.7, 0.45, 0.45], n: [3, 4], table: cage }
# loot tables: token weights. "weapon" rolls a Level 2 weapon, "book" a skill book
tables:
  tools:  { tape: 8, fuse: 5, valve: 3, battery: 8, kit: 4, ammo: 4, shells: 2, weapon: 4, almond: 2 }
  locker: { bar: 5, almond: 4, firstaid: 3, tape: 4, battery: 4, keycard: 2, ammo: 4, shells: 2, weapon: 4, book: 1 }
  office: { keycard: 5, battery: 4, bar: 3, book: 4, almond: 3, ammo: 2, fuse: 2, beans: 2 }
  food:   { beans: 8, bar: 9, almond: 7, ration: 2, keycard: 1 }
  cage:   { firstaid: 5, ammo: 6, shells: 4, weapon: 7, kit: 4, book: 3, battery: 3, almond: 2 }
# what the new items do
use: { beansHp: 30, beansSanity: 6, barHp: 12, barStamina: 40, firstaidHp: 70, tapeRepair: 18 }
