# Level 22 "Ruins Left Behind": every paper a player can read in Emstable. One row = one record object for the dress lane:
# spawn the prop with tags ["usable"], behavior "scripts/l22-record.js", state { name, verb, page, rec: <id> }.
# page -> scripts/lib/data/pages.yml. quest: which quest counts it (scripts/lib/level22-quest.js); null = flavour only.
# Canon placement: the census was "found on the top floor"; Jacobs Opal's family lived on 21. Every other floor/where is game-original.
sound: cdn/sfx-paper-page-turn-soft.mp3
records:
  - { id: l22-rec-hilda-1, floor: 21, page: 2201, name: "Transcript sheet, 02/08/14", verb: Read, where: "in a clear plastic sleeve weighted with a lump of cut concrete, at the lip of a mine pit", quest: hilda }
  - { id: l22-rec-hilda-2, floor: 20, page: 2202, name: "Transcript sheet, 06/08/14", verb: Read, where: "in a plastic sleeve taped to a stripped column beside the ramp up to Floor 19", quest: hilda }
