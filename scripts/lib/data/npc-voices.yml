# Every person's voice (Nov 11). The game reads this file (scripts/lib/voices.js), and so should any agent writing a line
# for someone: the voice is the person. Key = the npc's id (the last part of its object id). Value = the voice type, in the
# words the voice maker reads: sex, age, timbre, accent, manner. A clip is /cdn/voice-<voice>-saying-<line>.mp3, so changing
# a voice here re-voices every line that person says. Keep each one distinct; two people should never share a voice.
# The archetypes at the bottom (faction:role) are for people with no id of their own: each unnamed person still gets a
# voice from the pool in voices.js, picked by their id and sex.

