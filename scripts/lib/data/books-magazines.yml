    rarity: rare
  energy:
    title: Cell & Arc Systems Primer
    desc: "Technical monograph on high-draw capacitors, overcharged batteries, and thermal insulation sleeves. Permanently increases Energy Weapons by +3."
    value: 155
    kg: 0.3
