    desc: "Marksman fundamentals handbook covering sight alignment, recoil management, and malfunction drills. Permanently increases Guns by +3."
    value: 150
    kg: 0.3
    rarity: rare
  science:
    title: Introduction to Electronics
    desc: "Lab primer on relay logic, ballast transformers, Back OS terminal shells, and battery diagnostics. Permanently increases Science by +3."
    value: 150
    kg: 0.3
    rarity: rare
  sneak:
    title: Silent Movement Techniques
    desc: "Scout pamphlet detailing weight transfer on damp carpet, acoustic shadows, and breaking sightlines. Permanently increases Sneak by +3."
    value: 140
    kg: 0.3
    rarity: rare
  melee:
    title: Close Combat Training
    desc: "Heavy-grip guard stances and reach timing for crowbars, pipe wrenches, and corridor corners. Permanently increases Melee Weapons by +3."
    value: 140
    kg: 0.3
    rarity: rare
  unarmed:
    title: Boxing & Clinch Manual
    desc: "Worn gym notebook on footwork, knuckle alignment, and breaking an entity lunge at arm's length. Permanently increases Unarmed by +3."
