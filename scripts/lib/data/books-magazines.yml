# Fallout: New Vegas-style Skill Books (permanent +3, one-time per unique placed edition, capped at SKILL_MAX)
# and Skill Magazines (temporary +10 for 120 in-game minutes via clock.js gameNow, non-stacking per skill).
# Strictly mapped to the 13 real skills in scripts/lib/stats.js SKILLS.

bookBonusDefault: 3
bookCapPerGeneric: 2        # legacy generic book:<skill> cannot be read more than twice per skill
magazineBonusDefault: 10
magazineDurationGameMin: 120

books:
  medicine:
    title: First Aid Fundamentals
    desc: "Illustrated M.E.G. trauma field primer covering splinting, tourniquets, and dosage limits. Permanently increases Medicine by +3."
    value: 140
    kg: 0.3
    rarity: rare
  lockpick:
    title: Practical Lock Mechanisms
    desc: "Battered locksmith workbook with cutaway pin-tumbler diagrams and tension wrench notes. Permanently increases Lockpicking by +3."
    value: 140
    kg: 0.3
    rarity: rare
  repair:
    title: Field Repair Handbook
    desc: "Dog-eared technician binder for patching pipework, receivers, and worn harnesses with scrap. Permanently increases Repair by +3."
    value: 140
    kg: 0.3
    rarity: rare
  survival:
    title: Improvised Survival Guide
    desc: "Field notes on boiling suspect water, layering damp wool, and rationing under flicker-light fatigue. Permanently increases Survival by +3."
