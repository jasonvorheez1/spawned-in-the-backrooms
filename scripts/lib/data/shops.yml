# Traders' shops (scripts/lib/npc-talk.js). Backdollars are the money (Shelly's ruling, #33323 / #44597): traders buy and sell in $ only.
# stock: [token, count, base price in Backdollars]. A grey almond water sells for cash like any other good. All numbers Savi's picks; tune freely.
restock: 600        # seconds until a trader's shelf fills back up (Savi's pick)
buyMul: 1.45        # price = base * (buyMul - barter/barterDiv) * (1 - discount) (Savi's pick)
barterDiv: 200      # barter 100 takes 0.5 off the multiplier (Savi's pick)
sellShare: 0.32      # selling pays base * sellShare * (0.75 + barter/barterDiv) (Savi's pick)
roles: [quarter, trader, smith]   # smith: the dedicated repair NPC (a trader that also mends weapons and armor; nobody else repairs)
