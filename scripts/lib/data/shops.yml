# Traders' shops (scripts/lib/shop.js). Almond water is the money: there is no other currency in the game.
# stock: [token, count, base price in almond waters]. All numbers Savi's picks; tune freely.
restock: 600        # seconds until a trader's shelf fills back up (Savi's pick)
buyMul: 1.25        # price = base * (buyMul - barter/barterDiv) * (1 - discount) (Savi's pick)
barterDiv: 200      # barter 100 takes 0.5 off the multiplier (Savi's pick)
sellShare: 0.4      # selling pays base * sellShare * (0.75 + barter/barterDiv) (Savi's pick)
roles: [quarter, trader]
