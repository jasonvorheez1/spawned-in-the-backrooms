# Lumiria's barter table (Shelly, Nov 15: "make bartering actually a barter thing"). Goods for goods, no coin. Every number is Savi's pick.
# value: what one piece is worth on the table. A keeper takes a deal when your side is worth at least theirs × ask.
value: { pottery: 8, phones: 14, remedies: 6, records: 7, spices: 5, computers: 12, hats: 6, fruit: 3 }
other: { snack: 3, meat: 4, almond: 4 }   # your road goods: any snack or drink, any cut of meat, a grey almond water
ask: 1.3             # a keeper's markup before skill; Barter skill takes 0.006 per point off, never below 1.0
loves: 1.25          # the one kind their shelf lacks is worth this much more to them
haggle: { dc: 45, win: 0.15, lose: 0.12 }   # one try a visit: Barter + Charisma roll; a win drops the ask, a loss raises it
stock: { own: 3, extra: 1 }   # a keeper's table: pieces of their own kind, plus one of a neighbour's
restockMin: 2        # real minutes before an emptied table fills again
