# Level 0 "The Threshold": every tuned number. (picks are Savi's, tune freely)
cells: 56          # maze is cells x cells (224 m across; was 36, widened for Shelly 2026-11-07)
cellSize: 4        # metres per cell
wallHeight: 3      # floor to ceiling
hub: [26, 29]      # the safe room spans these cells on both axes (16 m square, centred on 0,0)
wallChance: { halls: 0.26, arches: 0.4, red: 0.34, dark: 0.3, holes: 0.12, pillars: 0.0, expanse: 0.02, offices: 0.55 }
zoneBlock: 8       # cells per zone square (her pick)
pitDepth: 1.4
# the wanderer
hp: 100
sanity: 100
stamina: 100
walkSpeed: 4.6    # her pick (was 6): walking no longer outruns anything
sprintSpeed: 7.4  # her pick (was 8): beats a chase only while AP lasts
staminaDrain: 25   # per second sprinting: a full bar is ~4.8 s of sprint
staminaRegen: 8.5   # per second resting
windedAt: 30       # her pick: run AP to 0 and you can't sprint again until it's back to this
windedRegen: 0.6   # regen multiplier while winded
sanityDrain: { expanse: 0.18, offices: 0.1, halls: 0.12, arches: 0.06, pillars: 0.12, holes: 0.15, red: 0.9, dark: 0.6, hub: -4 }
insanityHurt: 4    # hp per second at 0 sanity
almondHp: 24
almondSanity: 30
almondRefill: 5   # the debug heal pad tops you up to this. No carry limit on any item (Shelly, 2026-11-07)
battery: 100
batteryDrain: 1.2  # per second while the flashlight is on
xpPerCell: 3        # paid once per xpCellsPer new squares explored (Shelly: xp came too easy, 2026-11-07)
xpCellsPer: 10
xpAlmond: 5
xpKill: 36
xpExit: 150
xpBase: 72         # xp to next level = xpBase * level
perLevel: { hp: 10, sanity: 6, damage: 1.6 }   # Nov 8 hard: damage was 3 a level; levels made you a god
damage: 14
swingCooldown: 0.55
reach: 2.8
# the smilers
smilers: 6  # was 11; shelly: enemies spawn too much
smilerHp: 60
stalkSpeed: 3.2
chargeSpeed: 6.6   # her pick (was 4.6): faster than your walk, slower than your sprint
smilerSight: 25
smilerSightLit: 1.8      # her pick: a lit flashlight is seen this many times farther
smilerSightDark: 0.5     # her pick: light off, they only notice you this close
stareCone: 18            # her pick: degrees off your aim that still counts as eye contact
stareSpeed: 0.35         # her pick: a stared-down smiler creeps at this many m/s
biteDamage: 12
biteSanity: 10
biteCooldown: 1.2
smilerRespawn: 120
almonds: 65
almondRespawn: 110
# the lurkers: pale things that freeze while watched and rush when you look away
lurkers: 3  # was 6
lurkerHp: 35
lurkerSpeed: 6.6   # lurch speed; with the stop-motion hold it averages ~6.2 m/s
hearSprint: 16     # her pick: m a sprinting wanderer is heard through walls
hearFight: 14      # her pick: m a swing or a smash carries
hearGun: 34        # her pick: m a gunshot carries
callRange: 24      # her pick: m a hunter that spots you calls the others within this
smilerGlimpse: 6   # her pick: m a moving wanderer is noticed even in the dark
hearWalk: 6        # m a walking one is heard (crouching is silent)
chaseMemory: 16    # s a hunter keeps after losing sight, heading where you were going
leadSeconds: 1.6   # how far ahead along your path it guesses
lurkerSight: 28
lurkerWatchCos: 0.5  # how squarely you must face one to hold it still
lurkerGaze: 1.5      # sanity lost per second while watching one
lurkerBite: 12
lurkerSanity: 8
lurkerBiteCooldown: 1.4
lurkerRespawn: 180
xpLurker: 80

# noises (wiki: hum spikes, whispers, scratching behind walls). all her picks
humSpikeEvery: [70, 140]   # seconds between spikes
humSpikeLength: 6          # seconds a spike lasts
humSpikeSanity: 2.5        # sanity per second lost standing still in a spike (moving takes a fifth)
wallNoiseEvery: [25, 55]   # seconds between whispers / scratching
figureEvery: [40, 90]      # seconds between dark-figure sightings (her pick)
figureSeen: 1.4            # seconds one stands before it is gone
# arch rooms (wiki: deep wet carpet, archways wide enough to rest on). her picks
wetCarpetSpeed: 0.65       # walking speed multiplier on the soaked arch-room floor
ledgeRest: { stamina: 3, sanity: 1.2 }   # on an arch sill: stamina regen x3, sanity back per second
stairsCount: 18            # stairs that go nowhere, seeded through the halls (her pick)
shiftEvery: 25             # seconds between wall shifts behind each wanderer (her pick)
shiftLife: 90              # seconds a shifted wall stands before it moves on
