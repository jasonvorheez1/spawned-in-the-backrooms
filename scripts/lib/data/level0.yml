# Level 0 "The Threshold": every tuned number. (picks are Savi's, tune freely)
cells: 36          # maze is cells x cells
cellSize: 4        # metres per cell
wallHeight: 3      # floor to ceiling
hub: [16, 19]      # the safe room spans these cells on both axes (16 m square, centred on 0,0)
wallChance: { halls: 0.38, arches: 0.42, red: 0.38, dark: 0.36, holes: 0.12, pillars: 0.0 }
pitDepth: 1.4
# the wanderer
hp: 100
sanity: 100
stamina: 100
walkSpeed: 6
sprintSpeed: 8
staminaDrain: 28   # per second sprinting
staminaRegen: 16
sanityDrain: { halls: 0.12, arches: 0.06, pillars: 0.12, holes: 0.15, red: 0.9, dark: 0.6, hub: -4 }
insanityHurt: 3    # hp per second at 0 sanity
almondHp: 35
almondSanity: 30
almondMax: 5
battery: 100
batteryDrain: 1.2  # per second while the flashlight is on
xpPerCell: 2
xpAlmond: 5
xpKill: 45
xpExit: 150
xpBase: 60         # xp to next level = xpBase * level
perLevel: { hp: 10, sanity: 6, damage: 3 }
damage: 14
swingCooldown: 0.55
reach: 2.8
# the smilers
smilers: 7
smilerHp: 60
stalkSpeed: 2.2
chargeSpeed: 4.6
smilerSight: 22
smilerSightLit: 1.8      # her pick: a lit flashlight is seen this many times farther
smilerSightDark: 0.5     # her pick: light off, they only notice you this close
stareCone: 18            # her pick: degrees off your aim that still counts as eye contact
stareSpeed: 0.35         # her pick: a stared-down smiler creeps at this many m/s
biteDamage: 12
biteSanity: 10
biteCooldown: 1.2
smilerRespawn: 45
almonds: 40
almondRespawn: 60
# the lurkers: pale things that freeze while watched and rush when you look away
lurkers: 4
lurkerHp: 35
lurkerSpeed: 5.4
lurkerSight: 28
lurkerWatchCos: 0.5  # how squarely you must face one to hold it still
lurkerGaze: 1.5      # sanity lost per second while watching one
lurkerBite: 12
lurkerSanity: 8
lurkerBiteCooldown: 1.4
lurkerRespawn: 60
xpLurker: 80

# noises (wiki: hum spikes, whispers, scratching behind walls). all her picks
humSpikeEvery: [70, 140]   # seconds between spikes
humSpikeLength: 6          # seconds a spike lasts
humSpikeSanity: 2.5        # sanity per second lost standing still in a spike (moving takes a fifth)
wallNoiseEvery: [25, 55]   # seconds between whispers / scratching
figureEvery: [40, 90]      # seconds between dark-figure sightings (her pick)
figureSeen: 1.4            # seconds one stands before it is gone
# arch rooms (wiki: deep wet carpet, archways wide enough to rest on). her picks
wetCarpetSpeed: 0.65       # walking speed multiplier on the soaked arch-room floor
ledgeRest: { stamina: 3, sanity: 1.2 }   # on an arch sill: stamina regen x3, sanity back per second
