# Zenith Station's security drones (Shelly, Nov 9: "different types that have ranged weapons and have combat dialogue"). Every number is Savi's pick.
# hp, sight (m), keep (the range it holds), speed (m/s), hover (m off the floor), dmg per bolt, burst (bolts a volley), gap (s between bolts),
# cool (s between volleys), aim (hit chance at rest, 0..1), charge (s of warning glow before it fires), size (body width m), beam colour, drops [token, chance]
