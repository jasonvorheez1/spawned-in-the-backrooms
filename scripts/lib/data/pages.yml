  I keep thinking of you back in the yellow rooms, counting lights, so listen: if you ever find a door that smells of cedar, don't think, just
1783: |
  SECTOR ROTA · this week
  Irawan — rice on before sunrise. tea for whoever wakes.
  Cooks — miso, fish, pickles. wash up. (somebody finish the scallions)
  Runner — check the Hub door at dawn and dusk. bring in anyone sleeping there.
  Host — air the futons, change the towels, sign them in.
  Order — fresh rice and sake at the shrine. sweep the court.
  The cat — feed it if it ever comes back.
1784: |
  woke up here. slept 14 hours. first time since the yellow rooms.
1321: |
  LUMIRIA · TOWN NOTICES

  THE CROSS-VILLAGE FESTIVAL
  Pollisville, Luscio and Fosran walk in on the next full lantern-night. Stalls stay open till the bunting comes down. Bring what you'd trade and what you'd only show.

  THE DUKE CHOOSES FIVE
  As every festival, His Grace will pick five collectors to bring their collections through the keep gate. Nobody knows what he looks for. Last time it was a girl with forty-one left-hand gloves and a man with one very good spoon.
  Lay your collection out where he strolls. He will look. He always looks.

  ALSO
  · Wi-Fi is down again by the fountain. Stand nearer the phone box. Yes, the old one.
  · Found: one VR headset, in the planter by the east road. Ask at the RadioShed.
  · Wanted: an apple. Any apple. Will part with a ring for it. Marguerite, fruit stall.
  · Leaving town? The hollow in the old oak still lets out on the wheat road. Mind the step.
1322: |
  M.E.G. DATABASE · public mirror · connection: patchy
  Recent wanderer reports, Morigont region

  > "Came through the hollow tree at dusk. A town. Lights on, music somewhere. A woman traded me a radio for a button off my coat because her button jar lacked a green one. I do not understand the economy and I love it."

  > "The shops are copies. I found the hardware store from my street, down to the bell on the door. Next morning it was a pottery stall from some century I can't place. Same shelf height."

  > "Met the Duke. Very tall, gold mask, no feet to speak of. He went through my pack like a customs man, laughed at my can opener and offered a crown-shaped biscuit tin for it. Asked him the way out and he simply pointed. Class 0. Would visit again."

  > "Wi-Fi drops whenever the router in the electronics shop sulks. Locals say somebody should look at it."

  [ end of cached page ]
3251: |
  Mara,

  I left the lamp on the lot where we came in. If you get separated, look for the one with the bag beside it. The towers have all moved on, so don't use them to find your way back.

  West, across the streets, I found an empty lot with a crate. I'll leave a note there too. Please don't climb anything to look for me.

  — Eli
3252: |
  Eli,

  I found your crate. There were two bottles. I've taken them with me.

  The shaking starts before the blue light. When the light comes, get away from the side the tower is falling toward. The bamboo and concrete don't stay put afterward; the whole pile sinks.

  I saw blue glass near where the top came down. You were right about Vance wanting that. I'm going farther west, toward the next clear lot.

  — Mara
3253: |
  Mara's bag is here. Her shoes are beside it; she must have changed into the dry pair.

  She took the blue glass. On the back of my map she wrote: "The stairs in the basement kept going. Air smelled like pipes. I didn't wait."

  I hope I find her at the other end.

  — Eli
