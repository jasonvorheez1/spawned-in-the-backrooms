# Torn notebook pages found in Level 3 crates (token page:<n>). Written by whatever lives behind the bars.
# ~~word~~ is a scratched-out word. Savi's pick of words.
1: |
  they keep coming through the west door. ten this week maybe more i stopped counting at the ~~fourth~~ sixth because counting makes it real. they bring flashlights. they bring LIGHT in here like it belongs to them. one of them sat by my bars and ate a ration and talked to me like i was a dog. i am not a dog. i MADE the dogs
2: |
  the hounds were good once. i want that written somewhere. i built the first one out of a ~~man~~ coat and a fuse box and it sat when i said sit. it put its head on my knee. now they run in packs and they don't know my name and they bite the new people and the new people bite back and i hear it all night through the floor
3: |
  Generator 4 is humming wrong again. not wrong. it's humming my name. no it isn't. i turned it off twice and it came back on by itself and the lights in the hall went purple for a second. i wrote the date on the wall so i would know. the date is gone now. someone painted over it or it painted over itself
4: |
  The purple ones are in the walls. i hear them behind the conduit, little feet, clicking like relays. they don't come out when the humans are near. they wait. i think they are waiting for ME to go out. i haven't gone out since ~~the~~ ~~last~~ i don't remember. there is a lot i don't remember and it all used to be in this notebook
5: |
  a girl asked me through the bars if i was okay. nobody asks that. i told her to go back to gamma and stay on the painted floor and she laughed and went the wrong way down the line. i heard the hounds about twenty minutes later. i didn't make those ones. i want that written too. i didn't make those ones
6: |
  I keep tearing pages out and throwing them through the bars so somebody reads them. is that stupid. probably. if you're reading this you're one of them, one of the ones who keeps coming. please stop coming. please also don't stop, it's so quiet when you stop. i don't know which i mean. ~~both~~
7: |
  rules for staying alive in the station (i used to know these by heart):
  stay off the sludge, it pulls.
  the sparks mean the cable is live, not decorative.
  if the lights go purple don't look at the walls.
  if a hound sits when you tell it to, it's one of mine. pat it. tell it i'm sorry
8: |
  the bars aren't to keep you out. i put them up myself. they're for me. i get bad when the generators get loud, i get ~~hungry~~ i get loud too. if the door is ever open DO NOT come in to check on me. i mean it. leave a ration on the floor and walk away. that's all i want. that and for it to be quiet one more time
# Level 2.1, Base Alef: the Lockout (11 Jul 2020). Written by the people who were locked in.
11: |
  ZOOM0366: earlier today Wilson couldn't get back through to Level 2 because of a big metal wall. he said it appeared out of nowhere. the administrators are scared. we're locked out of the rest of the world until they get it fixed. praying they get it fixed soon.
12: |
  Exploration Wing sign-out, last page. 11 JUL: team A back at 0412, Gray and one other not. lights went on the east side. rations halved at noon. the IT guy says "temporary connection loss". there is no food on this level. there is no water on this level. nobody wrote that on the form because nobody thought we would need it.
13: |
  To: all Alef staff. From: Administration. Effective immediately the berries are NOT to be taken from the exploration room. Ten of us are already gone, and the berries with us. This memo will be ignored. I am leaving it anyway so someone knows we knew.
14: |
  Locker 14: if you are reading this I got out. If you are reading this and the locker is empty I took everything and I am sorry. The grey ones have padlocks. The brown ones do not close. Do not go east past the white rooms. The Edges are not on the map for a reason.
15: |
  connor says there's a place with fridges. "Refrigerator Paradise". he wouldn't say more. everyone thinks he's gone nuts. i'm going anyway. better to die together than alone. if you find this: it's north, past the double doors with the orange paint, and it is real. i can't believe it's real.
16: |
  five weeks. the ground is getting soft. the walls smell like fish. i dreamt i fell through the floor and landed at home. it's actually not too far off. probably. maybe. i keep a dictionary: Hope (n.) to cherish a desire with anticipation. there's no one to read it to.
17: |
  Alef layout, east edge. The white rooms stop. The rock starts. The lane runs a long way and the lights go out one by one behind you. The cave at the end breathes, cold. I think it goes down. I think it goes somewhere that is not here. Rope's tied. Going.
# Level 0 Field Documents: M.E.G. Survey Reports & Survivor Logs
21: |
  M.E.G. SURVEY LOG · SECTOR 0-MANILA
  Location: Isolated 3x3 chamber. All four walls lined with uncreased manila cardstock folder material instead of standard mono-yellow wallpaper.
  Observations:
  1. The acoustic hum of the fluorescent fixtures drops by approximately 80% within this perimeter.
  2. A solitary wooden desk, swivel chair, functional incandescent lamp, and cassette deck remain intact.
  3. Spatial anomalies here appear dampened. Wanderers report a rapid reduction in psychological dread and stabilization of baseline sanity.
  Conclusion: Designate as temporary sanctuary waypoint. Do not attempt to strip cardstock from the drywall.
22: |
  M.E.G. FIELD DIRECTIVE #0-01 · LEVEL 0 SURVIVAL ESSENTIALS
  Classification: Survival Difficulty Class 0 (Safe / Unsecure / Devoid of Entities)
  1. DO NOT DRINK CARPET MOISTURE. The fluid is chemically contaminated and biologically hazardous. Siphon only clean condensates or locate sealed Almond Water caches.
  2. AUDITORY ISOLATION: The ambient fluorescent hum operates at a steady ~80 decibels. Prolonged exposure causes auditory hallucination and visual pareidolia. Maintain focus on tactile anchors.
  3. EXIT VECTORS: Wandering far enough from your entry point often leads back to yourself. To leave, locate wallpaper seams exhibiting visual distortion or static grain. Noclipping through anomalous boundaries is the documented exit to Level 1.
23: |
  Wanderer's Journal · Day 43 (?)
  The hum never stops. It's inside my teeth.
  I found another room that looks exactly like the room I left six hours ago, except someone drew an arrow on the wallpaper pointing west. I don't know if I drew it yesterday or if someone else drew it ten years ago.
  I drank the last drops of almond water. Down the far corridor, near the outer perimeter, the wall looks like television static if you squint. When you touch the plaster it feels like cold oil. That has to be the seam. If this is where I fall through, I hope whatever is underneath has real skies.
24: |
  M.E.G. AGRONOMY LOG · THE WATCHERS OF LEVEL 10 (ENTITY 17)
  Subject: Anomalous Scarecrows in Plot E-4.
  Observations:
  1. The scarecrows appear constructed from rustic burlap, rough pine posts, and straw. No internal skeleton or musculature has been detected by tactile inspection.
  2. In defiance of wind vectors, the scarecrow's head occasionally turns 10 to 20 degrees when wanderers look away.
  3. Survivors have reported hearing faint dry whispers resembling the rustling of dried husks when standing within five meters.
  4. Despite their eerie presence, they have never initiated physical hostility. They serve as reliable navigational landmarks across the endless wheat fields.
  Conclusion: Documented as passive territorial anomalies. Do not destroy them; wanderers rely on their silhouettes to find the way back to the road.
# Level 109 The Neon Hospital: intake notes, chart clippings, and outpost warnings.
101: |
  THE DOCTORS · INTAKE ORIENTATION (LEVEL 109)
  Corridors average nearly three miles before a turn. No builder left a blueprint.
  1. Supply storerooms hold stock behind chain-link cages; check the receiving desk manifest before burning bobby pins.
  2. Never answer knocks coming from behind a closed ward door. Real patients are already in our beds.
  3. Outpost East lies 424 m down the first cross corridor (ew0_13m). Marked EXIT sits 1.3 km west of the crossing.
102: |
  M.E.G. DETACHMENT 109 · SUB-LEVEL B3 LOG
  Stairwell west wall near arrival leads three flights under the carpet into poured concrete.
  The fluorescent hum stops at the landing. That should have worried us sooner.
  Hounds came out of the middle morgue drawers at 0210. Locked the slab door, left the cage hot with one M72 and rocketry crates. Nobody goes back down without backup.
103: |
  ICU NURSING SHIFT CHART · BED 4
  03:15 - Heart monitor on Bay 2 began cycling after patient discharged six days prior. Silenced alarm to stop drawing wanderers from east hall.
  03:40 - Wall intercom paged Dr. Vance to Theatre 4. Dr. Vance checked the door; theatre was empty except for fresh scalpel marks ~~on the ceiling~~ on the tiles.
  Note to relief nurse: pull curtains to check for stashed tape/almond. Do NOT open the biohazard curtain without purging negative pressure first.
104: |
  PHARMACY & DECON MAINTENANCE MEMO
  Negative-pressure contamination suites can be scrubbed safely using the green Decon Purge Switch mounted outside the yellow line.
  Pneumatic dispatch tubes connect dispensary counters directly to upper wings — jammed capsules still arrive on the hour when powered.
  Power breakers along corridors isolate neon ballast banks; killing the lights buys quiet if frenzied wanderers are prowling ahead.
# Level 109 · Entity 19 "The Disease": the Doctors' recovered records, printed from hospital terminals (Shelly Nov 14). Pages 110-116.
110: |
  FROM: Fisher.Mason@level109.br · TO: Sutton.Dennis@level109.br
  SUBJECT: Thursday patient
  Hi Dennis,
  You should receive a patient (Carl Johnson) within the hour for a blood test. Context of his visit attached. He's allocated room 245, so send him there with his attendant (Brian Torr) afterwards.
  Have a good day,
  Mason Fisher
111: |
  FROM: Sutton.Dennis@level109.br · TO: Fisher.Mason@level109.br
  SUBJECT: Re: Thursday patient
  Hi Mason,
  So far nothing special. Looks like a classic Staphylococcus aureus infection. Agar plates inoculated, first results tomorrow.
  The nurses say he's getting worse though. His complexion has gone red. I'd keep an eye on him, his symptoms don't match the diagnosis. Your call.
  Dennis Sutton
112: |
  INCIDENT REPORT · HOSPITAL DIMENSION · ROOM 245
  This morning patient Carl Johnson began convulsing in pain. Two nurses found him burning with fever, his skin flushed a deep angry red across the arms, abdomen and right thigh. He tried to stand and collapsed.
  The nurses, helped by the patient's friend, held him until he lost consciousness.
  AFTERMATH: Area quarantined. All three decontaminated and released. Mr. Johnson declared comatose a few hours later. In-depth study of the pathogen has begun.
113: |
  FROM: Fisher.Mason@level109.br · TO: Sutton.Dennis@level109.br
  SUBJECT: Unknown disease?
  Hi Dennis,
  Sorry, I only saw your emails after the incident. This is a very big problem. We can't regulate travellers coming through from the Pipe Dimension. If a new patient appears this will spread very quickly and the hospital could be doomed. Most of the staff are on the blood samples now.
  Mason Fisher
114: |
  EVACUATION ALERT · RECORDING
  This is a level 5 contamination alert. This is not a drill.
  Leave your rooms or stations and proceed immediately to the nearest no-clip area with your supervisor or team leader.
  If you are contaminated, remain where you are and wait for qualified personnel. You will be placed in isolation.
  I repeat: this is not a drill.
115: |
  PERSONAL JOURNAL · D. SUTTON (found on a sleeping bag)
  I don't really know where to start. Level five means massive, out-of-control contamination of the entire dimension. People were running everywhere. We heard the screams of staff who'd caught it.
  We sealed the no-clip behind us, as procedure says. The Flooded Cave camp took us in, but they're afraid of us.
  The Hospital Dimension can't be abandoned. Travellers need us. Our lack of knowledge will be our greatest enemy.
  It's late. I'm so hot. I'm so red. My limbs hurt.
116: |
  [BACKDOOR] ARCHIVED CHAT · 2013-03-18
  someoneintheroom: Remember that disease thing? Level 109's an abandoned hospital. A group calling themselves "The Doctors" found rooms that are highly infected.
  katyaaaaaaaaa576: Have they studied it?
  someoneintheroom: They found records of a group that lived there a hundred years before the M.E.G. Data's mostly corrupted. They sent us everything.
  katyaaaaaaaaa576: You're telling me it started there?
  someoneintheroom: Not sure. Sharing the file now. Cafeteria tonight?
