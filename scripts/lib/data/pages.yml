# Torn notebook pages found in Level 3 crates (token page:<n>). Written by whatever lives behind the bars.
# ~~word~~ is a scratched-out word. Savi's pick of words.
1: |
  they keep coming through the west door. ten this week maybe more i stopped counting at the ~~fourth~~ sixth because counting makes it real. they bring flashlights. they bring LIGHT in here like it belongs to them. one of them sat by my bars and ate a ration and talked to me like i was a dog. i am not a dog. i MADE the dogs
2: |
  the hounds were good once. i want that written somewhere. i built the first one out of a ~~man~~ coat and a fuse box and it sat when i said sit. it put its head on my knee. now they run in packs and they don't know my name and they bite the new people and the new people bite back and i hear it all night through the floor
3: |
  Generator 4 is humming wrong again. not wrong. it's humming my name. no it isn't. i turned it off twice and it came back on by itself and the lights in the hall went purple for a second. i wrote the date on the wall so i would know. the date is gone now. someone painted over it or it painted over itself
4: |
  The purple ones are in the walls. i hear them behind the conduit, little feet, clicking like relays. they don't come out when the humans are near. they wait. i think they are waiting for ME to go out. i haven't gone out since ~~the~~ ~~last~~ i don't remember. there is a lot i don't remember and it all used to be in this notebook
5: |
  a girl asked me through the bars if i was okay. nobody asks that. i told her to go back to gamma and stay on the painted floor and she laughed and went the wrong way down the line. i heard the hounds about twenty minutes later. i didn't make those ones. i want that written too. i didn't make those ones
6: |
  I keep tearing pages out and throwing them through the bars so somebody reads them. is that stupid. probably. if you're reading this you're one of them, one of the ones who keeps coming. please stop coming. please also don't stop, it's so quiet when you stop. i don't know which i mean. ~~both~~
7: |
  rules for staying alive in the station (i used to know these by heart):
  stay off the sludge, it pulls.
  the sparks mean the cable is live, not decorative.
  if the lights go purple don't look at the walls.
  if a hound sits when you tell it to, it's one of mine. pat it. tell it i'm sorry
8: |
  the bars aren't to keep you out. i put them up myself. they're for me. i get bad when the generators get loud, i get ~~hungry~~ i get loud too. if the door is ever open DO NOT come in to check on me. i mean it. leave a ration on the floor and walk away. that's all i want. that and for it to be quiet one more time
