# What each npc knows of where they stand (Wikidot Backrooms, with the game's own liberties). Savi's writing.
levels:
  main: "Level 0, the Lobby. Endless yellow rooms, damp carpet, the hum that never stops. Smilers in the dark parts, things that walk behind walls. People noclip in here from the real world and most never leave it. The way down to Level 1 is somewhere past the red zones."
  level1: "Level 1, the Habitable Zone. Concrete car-park halls, fog, crates of supplies that appear from nowhere, lights that go out. M.E.G. keeps a camp here. Hounds hunt in packs and skin-stealers wear faces. Almond water is the currency of trust."
  level2: "Level 2, Pipe Dreams. Hot, cramped utility halls full of pipes, steam and oil. The Survivor camp holds a few rooms. Doors open on odd rooms nobody built. The way to Level 3 is through the hot end."
  level3: "Level 3, the Electrical Station. Brick halls and crawlways, humming machines, sparks, dead ends. Hostile and fast. M.E.G. Base Gamma is reachable from here. Lifts go up to Levels 4 and 5 if you know which."
  gamma: "M.E.G. Base Gamma. The biggest safe settlement anyone knows: a security hall, a mall, a fake little town. Order, rations, guards, rules. The Database terminal is locked to agents."
  level4: "Level 4, the Abandoned Office. Empty cubicles, water fountains that run with almond water, phones that ring for no one. Quiet and mostly safe. Base Omega sits here. The stairs go down to the hotel."
  level5: "Level 5, the Terror Hotel. A 1930s grand hotel that never ends: the Main Hall, the Beverly Room ballroom where the polonaise always plays, the Boiler Room's heat. Housekeeping, the Homely Hotel staff and The Originals run it. Some staff are facelings wearing a smile. Samantha the cat wants good meat. Never stay in the Boiler Room alone."
  level6: "Level 6, Lights Out. Pitch-black concrete labyrinth where flashlights die and only night-vision goggles work. Whispers mimic voices in the dark, walls shift when unwatched, and the concrete stairs descend to the flooded room of Level 7."
  level7: "Level 7, Thalassophobia. A vast freezing ocean under an endless concrete ceiling. Wanderers arrive through the flooded Entrance Room (the Floating House) atop a basalt rock, with a wooden pier and rowboats leading out to M.E.G. Outpost Seawatch on the near island and Fort Surrender on the far island. Beneath the Daylight, Twilight and Midnight zones prowl two gargantuan leviathans: Entity 20 ('The Thing on Level 7') and 'Tiny'. The abyssal seafloor is carpeted in tar and bones, where underwater tar caves lead down to Level 8."
  level8: "Level 8, the Cave Systems: the first level wholly enclosed, cold wet karst caves, stalactites, tunnels branching every way. Most come in wading out of the entrance lake from Level 7's diving bell. The 9th Road is the one marked way through: M.E.G. paint, B.N.T.G. light guides, a Harmouth Speleological Society survey nobody finished. Along it: a flooding cavern where a caver in an orange suit drowned, Hyperspace Lane where the fungus glows and the walls resonate, a nest of man-sized spiders and their broodmother, a boiling tar pit with a B.N.T.G. dredge winch and hands that reach out of it, the 9th Road camp round its fire, and the old asphalt road that runs on toward Level 9. The Lightless haunt two dens off the road: wanderers who lost their lights, stopped wanting them, and now kill anyone who carries one. Nobody knows who laid the asphalt."
  level10: "Level 10, the Bountiful Harvest. Endless golden wheat fields, gentle hills, a real breeze, and no ceiling anywhere. M.E.G. Outpost Bountiful grows grain, bakes sourdough loaves in a stone hearth oven, and keeps the Backrooms fed. Windmills, wooden silos, an ancient stone well that runs deep, and scarecrows that face toward the farmhouse whenever no one looks. Anomalous worms burrow near the lake, and the roads lead to Level 11."
  level11: "Level 11, the Infinite City. A sprawling metropolis of modern concrete skyscrapers, paved avenues, crosswalks, and glass storefronts under a cycling day and night sky. The Level 11 Effect renders entities docile, so Hounds sleep by lampposts and Facelings commute like office workers. M.E.G. Base Beta maintains order, while B.N.T.G. operates produce stalls, transit locks, and realty offices. Sedco Tower hums with power, and elevators connect to deep levels."
  level21: "Level 21, Numbered Doors and Refrigerator Paradise. An endless labyrinth of walk-in coolers, industrial compressors, and cold storage lockers. Freezing temperatures and frosty breath. The Base Alef survivors stay in Refrigerator Paradise living on four thousand cartons of Saltines and copper coil water, while Smilers and Hounds prowl the dark unpowered Edges."
  level61: "Level 61, The Snackrooms. A retro 1980s train station food court with endless clean counters, jukeboxes, warm booths, and free fresh snacks. Faceling servers wipe counters and flip burgers in peace. A rare sanctuary where violence is prohibited."
  level184: "Level 184, The Autumn Hills. Rolling golden-red meadows, apple orchards, manicured hedges, and tranquil sunlight. A peaceful pastoral expanse that feels like a quiet dream."
factions:
  hotel: "Homely Hotel staff: polite to a fault, loyal to the hotel more than to guests."
  hk: "M.E.G. Outpost Housekeeping: agents posing as cleaners, watching the hotel."
  orig: "The Originals: the oldest residents, who claim they checked in before the Backrooms swallowed the hotel."
  meg: "M.E.G., the Major Explorer Group: the closest thing to a government down here."
  survivor: "Survivors: loners and small crews who trust nobody official."
  surrender: "Fort Surrender: a haphazard shelter of broken furniture held together with tar on the nearest island to Level 7's entrance. A handful of survivors, four to nine, who worship The Thing on Level 7 and are rumoured to be hostile to outsiders."
  lightless: "The Lightless: wanderers the cave dark got into. They smash every flashlight they find, sing to the walls, and kill anyone carrying light. Nobody comes back from talking to them."
  camp: "The 9th Road camp: a fire in the cave kept by M.E.G. operatives, B.N.T.G. traders and a Harmouth caver, the only safe ground between the tar and Level 9."
  bntg: "B.N.T.G., the Backrooms Nonaligned Trade Group: merchants, traders, artisans and logisticians who supply the major hubs, hold trading posts, run caravans through canal locks, and don't care about politics as long as debts are paid."
  alef: "Base Alef survivors: the locked-out crew in Refrigerator Paradise on Level 2.1 surviving on Saltines and freezer condensation since July 2020."
# a backstory for anyone without one written, rolled stable from their id
origins: ["a night janitor who walked through a wall on shift", "a teenager who fell asleep in a mall", "a nurse who took the wrong stairwell", "a trucker who stopped for gas and never left the station", "a grad student who found a door that shouldn't open", "a soldier from an expedition nobody remembers sending", "someone who woke up here and remembers nothing before", "a contractor who clipped through a half-built office", "a hotel guest from long before the war", "a kid who grew up down here and never saw the sky"]
years: ["three weeks", "four months", "almost a year", "two years", "five years, maybe more", "so long they stopped counting"]
wants: ["a way back up", "enough almond water to stop worrying", "to find someone they lost on Level 2", "to be left alone", "to map one level properly", "a real bed and one quiet night", "to get into Base Gamma", "revenge on whatever took their crew"]
fears: ["hounds", "the dark when the lights die", "facelings", "being forgotten", "the Boiler Room", "smilers", "the sound behind the walls", "running out of water"]
quirks: ["counts things under their breath", "hums the polonaise without meaning to", "never sits with their back to a door", "keeps a notebook of every face they meet", "laughs at bad moments", "talks to the lights", "always offers food first", "asks everyone where they came in"]
