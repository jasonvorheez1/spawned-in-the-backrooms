# Errands: small jobs people hand out when you talk to them (scripts/lib/errands.js runs them).
# Written to design/story-spine.md: a job never names a place, a level or a person the player has not been told about.
# stage kinds: fetch (hold <count> of item <target>), carry (talk to NPC <target> holding <count> of <item>; handed over),
#   talk (talk to NPC <target>), clear (<count> kills from the moment the stage starts), find (walk up to object <target>),
#   repair (stand at object <target> holding <item>; one used per fix, <count> fixes).
# alt: a second way through, tried each time you talk to the giver mid-job:
#   speech (your Speech skill at <sk> or more talks them out of the rest, pay * <pay>), item (hand over <count> of <item> instead).
# reward: cents (100 = 1 Backdollar), xp, item (tokens), rep { group, d }, trail (a hint toward that trail key, never the key;
#   only given while the key is still unknown; hintNeeds: name keeps a hint quiet until the player has heard the name).

- id: ale-water
  giver: meg-ale
  place: level1
  title: "Water for the Fire"
  stages:
    - { text: "Find still water", kind: fetch, target: stillwater, count: 3 }
    - { text: "Bring the water back to Ale", kind: carry, target: meg-ale, item: stillwater, count: 3 }
  alt: { kind: item, item: mineralwater, count: 2, text: "Ale takes the fancy water instead. Says it tastes like a hotel." }
  reward: { cents: 1500, xp: 60, rep: { group: meg, d: 2 }, trail: word }
  hint: "Ale says the people around the fire have a name for all of this. Ask them where you are."

