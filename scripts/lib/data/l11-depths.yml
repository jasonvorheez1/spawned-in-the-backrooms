floor: -3.6
sight: 20        # sees you this far with a clear line, inside its view cone (sneaking and crouching shrink it)
fov: 150         # the view cone in degrees; once it is hunting or searching it watches all round
hear: 7          # hears you walking this close (through rock, 60% of it); crouched steps make no sound
hearSprint: 15   # hears you running this close
hearFight: 14    # a swing, a smash or a kick
hearGun: 32      # a gunshot
loseSec: 5       # hunts this long after it last saw or heard you, then searches where you were heading
searchSec: 10    # searches round there this long, then walks home
callRange: 14    # a foe that spots you rouses the idle ones this close
leash: 45        # never chases farther than this from its post
roster: 2       # bump to replace the crew in rooms already open
respawnMin: 60   # the dead come back after an hour (Shelly's rule)
