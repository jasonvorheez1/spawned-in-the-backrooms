# Levels 1, 2, 2.1 and 3: who says what (scripts/lib/dialogue.js reads it; the format is described there).
# Rewritten by hand, Nov 13, to design/story-spine.md: the player knows nothing, so no choice (q:) uses a word they
# may not have heard. Everyone answers the three questions (where am I, how do I get out, the name Dina) their own way.
# The Dina question has no condition field to hide behind, so it is worded to be safe before the name is learned.

# ===== Level 1, the camp. Ale gives the word, Callum keeps the list =====
meg-ale:
  hi: "Hey. Rookie. Get off the middle of the floor, you look like a target. Wall. Now. There you go."
  back: ["Rookie's back. All ten fingers? Show me.", "Huh. You lived. I owe Callum a can."]
  warm: "There's my rookie. Sit. I ate your share, but I felt bad about it."
  cold: "Can't talk. Very busy. Go count something with Callum."
  follow: "I'm on your six. Quit looking, it's creepy."
  bye: "Sure. Walk soft."
  walk: "Wow. Okay."
  ask:
    - q: "Where am I?"
      a: "Oh, you're brand new. Okay. People call it the Backrooms. All of it. This floor is Level 1, the yellow carpet you crawled out of is Level 0, and it keeps going down from there."
      then:
        - q: "Levels of what?"
          a: "Nobody knows. It's like a parking garage somebody forgot to finish. Each floor's a different kind of wrong. We number them so we can complain properly."
        - q: "Who's 'we'?"
          a: "M.E.G. It's on the jackets. We explore, we write it down, we try not to get eaten. Two out of three, most days."
    - q: "How do I get out?"
      a: "Out out? Home? Rookie, I've been here two years and I haven't met one person who walked out. Met plenty who walked off. Not the same thing."
      then:
        - q: "So nobody's tried?"
          a: "Everybody's tried. Callum writes them in his book when they stop coming back. Go ask him how thick the book is."
    - q: "How do I stay alive out there?"
      sk: survival 25
      a: "Shoulder on the wall, never your back. Watch the lights. One starts ticking, you get maybe a minute before that block goes black. Things hunt in the black."
      fail: "Step one, get off the middle of the floor. Come back when you've got step one."
    - q: "Somebody's calling hello out there."
      a: "Yeah. Somebody always is. Mine did my brother's voice for a week. My brother's in Ohio."
      then:
        - q: "So what is it?"
          a: "No idea. Don't want one. You don't answer, you don't look, you go the other way. End of class."
        - q: "You ever go look?"
          a: "One time. Got this scar and a rule out of it."
    - q: "Ever hear the name Dina?"
      a: "Dina. Yeah, maybe. Quiet one, kept asking which stairs go where. I told her down is the only direction that works. Callum would have her written down. He writes everybody down."
    - q: "Where's the water out there?"
      a: "Storage racks, if you're first. Pallets near the stairwells. A crate that's already open is an empty crate. Somebody hungrier beat you."
    - q: "You know the way around. Walk with me?"
      sk: speech 35
      do: recruit
      a: "You didn't scream and you didn't run. Okay, rookie. I'm in. I'm not carrying you, though. You drop, you stay dropped."
      fail: "You breathe like a kettle. No offense. A little offense."
    - q: "Who's in charge here?"
      a: "Ortiz, if somebody's bleeding. Callum, if it comes in a can. Me, when they're both asleep."
  barks:
    idle: ["Who sat in my chair? It's warm.", "Lights are holding. Don't jinx it.", "Callum, those peaches came open. I swear.", "Not asleep. Resting my eyes at the hallway."]
    hi: ["Rookie. Still vertical.", "Oh look, it walks."]
    drawn: ["Aim that somewhere I'm not.", "Put it up, rookie. We're pals, right?"]
    hurt: ["You're leaking. Ortiz is ten feet that way.", "Get sewn up before you tip over on me."]
    sneak: ["I hear you. The whole floor hears you."]
    close: ["Arm's length. It's a great length."]
    spot: ["Hound! On the left!", "Incoming, move it!", "Great. Guests."]
    hostile: ["You pulled that in the wrong camp.", "Bad pick, rookie. Real bad."]
    hit: ["Ow! Okay, you're dead now.", "It bit me. The nerve."]
    kill: ["Down. Don't get up.", "That one was for the jacket."]
    clear: ["Alright. Arms, legs, count them."]
    flee: ["Nope. Falling back!", "Too many, go, go!"]
    death: ["Aw, seriously?"]
    reload: ["I'm dry, cover me!"]
  gest: { wave: "Yep. Hi. There, I waved. Happy?", gift: "For me? Now I feel bad about going through your bag. Nearly.", dance: "We're doing this? Fine. Callum never hears about it.", nodance: "Under these lights? No.", insult: "Brave. Dumb, but brave." }

meg-ortiz:
  hi: "Sit. You are swaying. No, do not say you are fine, everyone says that. Hands out, let me see."
  back: ["Look at me. Eyes. Good. Hands. Good enough.", "My patient returns. What did you do to yourself now?"]
  warm: "My favourite patient. This is not praise. It means you are always hurt."
  cold: "I will treat you. Talking is extra, and I am not selling."
  follow: "Go. I keep up. I have kept up with worse."
  bye: "Drink water before you go. All of it."
  walk: "Fine. Go bleed on someone else."
  ask:
    - q: "Can you patch me up?"
      do: heal
      a: "Bring the lamp here. First I clean it. Tell me if the fingers go numb. Do not be brave about it."
    - q: "Where am I?"
      a: "In my clinic. It is two cots and a lamp, but it is a clinic. Past that curtain is the camp. Past the camp, concrete. For the big answer ask Ale. She enjoys telling it."
    - q: "How do I get out?"
      a: "I am a nurse, patient, not a map. I can tell you this. Everyone I ever treated is still down here, or they are in Callum's book. I have not signed one discharge."
    - q: "My head's not right. What do I do?"
      sk: medicine 30
      a: "Sleep with a wall at your back. Drink before the thirst comes. When the humming gets inside, say your own name out loud. It sounds foolish. It works."
      fail: "First, do not tell people your head is not right. Second, drink this. Third, lie down."
    - q: "Ever hear the name Dina?"
      a: "Dina. Yes. I wrapped her hand. Burn, from a hot pipe, so she had already been below once. She did not rest it like I told her. She kept asking people about doors."
    - q: "How long have you been here?"
      a: "I filled two notebooks counting days, then I stopped. I was a nurse in Valencia. Now I stitch people under a lamp that buzzes. Same work. Worse coffee."
      then:
        - q: "Do you miss it?"
          a: "Windows. I miss windows. And sleeping five hours in a row. The forms I do not miss."
    - q: "Would you come with me?"
      sk: speech 60
      do: recruit
      a: "Dios. Fine. Callum can hand out bandages for one day. You keep me breathing, I keep you breathing."
      fail: "No. Twelve people here need me more than you. Do not take it to heart."
  barks:
    idle: ["Who took the last thread? Ale. It was Ale.", "Wash your hands. All of you.", "Someone put water on to boil."]
    hi: ["Eyes are clear. Good.", "You walk in a straight line today. Progress."]
    drawn: ["Away with that. I do not stitch what you do to yourself."]
    hurt: ["You are bleeding. Come. Now.", "Sit down. I am not asking."]
    sneak: ["I am a nurse. I heard you from the stairs."]
    close: ["One metre, unless you are bleeding."]
    spot: ["Behind me, everyone!", "Trouble! Move the cots back!"]
    hostile: ["Nobody touches my patients."]
    hit: ["Ah! It is nothing, go on!", "That one needs thread. After."]
    kill: ["Good. Now nobody move."]
    clear: ["Who is hurt? Show me. Quickly."]
    flee: ["Back to the cots!"]
    death: ["Hold... pressure..."]
  gest: { wave: "Hello. Your walk is better.", gift: "Kind of you. It goes to the stores. No arguing.", dance: "One song only. My knees vote no.", nodance: "If I dance I fall asleep on my feet.", insult: "People I was saving have said worse." }

meg-callum:
  hi: "Name for the book. Then what you're after, then what you're carrying. Dinnae dawdle, pal."
  back: ["You, pal. Right. What's it today.", "Counted the tins twice since you were in. Still one short."]
  warm: "Ach, it's yourself. Grab a crate. No that one. That one's full."
  cold: "Stores are open. My mouth isnae."
  bye: "Pockets where I can see them on your way out."
  walk: "Aye, good chat."
  ask:
    - q: "Where am I?"
      a: "Camp stores, Level 1. Folk call the lot of it the Backrooms. I just call it the job. What I know is what's on these shelves and who's in this book."
      then:
        - q: "What book?"
          a: "Everybody who comes through that door goes in the book. Name, day, which way they left. If they dinnae come back, I move them to the back pages."
    - q: "How do I get out?"
      a: "Stairs go down, pal. That's all the stairs do. I've four hundred names in the back pages that went looking for a way out. No a one came back to tell me they found it."
    - q: "Ever hear the name Dina?"
      a: "Dina. Hold on. Aye, here. Back pages. Came through alone, signed in her own hand. Asked me three times where the exits were. I've nothing written under exits. Left by the down stairs."
      then:
        - q: "Why the back pages?"
          a: "She's no been seen since. That's all it means. Could be dead, could be fine and four floors under us. The book disnae know. Neither do I."
        - q: "Did she say why?"
          a: "Folk dinnae tell the storeman why. She bought water for a long walk and she wasnae scared. I mind that. Most are scared."
    - q: "What have you got?"
      a: "Water, tins, bandages. Shells if there's any and I like your face. The price is the price. Dinnae haggle."
    - q: "Knock a bit off?"
      sk: barter 40
      do: discount
      a: "Hm. You didnae whinge. I like that. Fifteen off. Tell a soul and it's thirty on."
      fail: "No. And for asking, it's just gone up."
    - q: "You miss anything?"
      a: "The carpet up in the yellow rooms. Daft, eh? Soaking, stinking thing. But you could lie down on it. This concrete wants you gone."
    - q: "Need anything brought in?"
      a: "Ration crates. Something's lifting them between the racks. Speak to me again if you want the job done right."
  barks:
    idle: ["Thirty-eight. Thirty-nine. Who's had forty?", "Peaches dinnae grow legs.", "I'll find where it went. I always do."]
    hi: ["Aye. You.", "After something, pal?"]
    drawn: ["No by the stock. Away with it."]
    hurt: ["Bandage, two bucks. Same for everybody."]
    sneak: ["That's a thief's walk, that."]
    close: ["Step back from the crates."]
    spot: ["Trouble! Mind the stores!", "Here we go, then."]
    hostile: ["Right. That's you done."]
    hit: ["Ach! Away!", "Get off, ye wee pest!"]
    kill: ["And that's it shut."]
    clear: ["Sound off. All of you. Then the crates."]
    flee: ["Back behind the racks!"]
    death: ["Mind... the tins..."]
  gest: { wave: "Aye. Hand up. Noted.", gift: "In the book it goes. Ta. You'll get no change.", dance: "One. Then it's back to the tins.", nodance: "Stock willnae count itself.", insult: "Better hagglers than you have tried that." }

bntg-voss:
  hi: "Come, come, friend. B.N.T.G. trader, fair scales, honest man. Fairly honest. What do you look for on my blanket?"
  back: ["Ah, my best customer. The others must not hear this.", "You again, friend. To buy, or to ask?"]
  warm: "For you, friend, I open the box under the box."
  cold: "Money first. Words after."
  bye: "Send your friends to me. Only the ones who pay."
  walk: "No manners. I will live."
  ask:
    - q: "Where am I?"
      a: "At the best blanket on this floor, friend. Also the only blanket. The soldiers call the floor Level 1. I call it a market with bad lighting."
    - q: "How do I get out?"
      a: "Out I do not sell. If I had out, I would be a rich man somewhere with a sky. But I sell what you need for the trip. Batteries, mostly."
    - q: "What's B.N.T.G.?"
      a: "We trade. We carry things from where they sit to where they are wanted. The M.E.G. people count everything. We put a price on it."
    - q: "Ever hear the name Dina?"
      a: "Dina, Dina. A woman with a small recorder? She bought every blank tape I had and did not haggle once. I remember people who do not haggle. She went down the stairs with them."
    - q: "Heard anything good?"
      sk: barter 35
      a: "Someone sells camp rations two blocks south. Same tins, labels scratched off. Not me, friend. If I scratch a label, you cannot tell."
      fail: "News has a price too, friend."
    - q: "How's business?"
      a: "Slow, until the lights go. Then everyone needs batteries and nobody argues about the price. I love the dark."
  barks:
    idle: ["Batteries, bandages, fair scales.", "I take chits. Some chits.", "All for sale. Not the blanket."]
    hi: ["A customer!", "Ah, a friend with deep pockets."]
    drawn: ["This scares the customers, friend."]
    hurt: ["You need bandage? I have bandage."]
    spot: ["Away from my goods!", "Something comes!"]
    hostile: ["B.N.T.G. remembers thieves."]
    hit: ["Not the coat!"]
    kill: ["No refunds."]
    flee: ["Save the stock!"]
    death: ["My book..."]
  gest: { wave: "A wave is free. I like free.", gift: "A gift? Now I am in your debt. Terrible.", dance: "Partners in trade must dance one time.", nodance: "Not in shop hours.", insult: "I write this down, and I add it to your price." }

# ===== Level 2, the pipe camp =====
surv-wren:
  hi: "Stop! Stay there. Turn so I can see your face. Okay. You've got one. Sorry, new person. Had to check."
  back: ["Hey, new person! You came back. Nobody comes back.", "Oh. Hi. I wasn't watching the door or anything."]
  warm: "You're back! I kept your spot. It's a pipe. It's a warm pipe though."
  cold: "I've got my eye on you. Both eyes."
  follow: "I'm right behind you. Like really right behind."
  bye: "Don't die. Okay? Okay."
  walk: "Oh. Bye, I guess."
  ask:
    - q: "Where am I?"
      a: "The pipes. Our camp's the warm bit. Hollis says the soldiers upstairs call it a number, but it's just the pipes. I've lived here since I was eleven so I get to name it."
    - q: "How do I get out?"
      a: "Out of the pipes? Stairs up, or the barred door. Out of everything? I don't know. I stopped asking. Mags says there's no out, Hollis says the radio comes from somewhere. Pick one."
    - q: "You alright? You're limping."
      a: "Am not. The floor's bumpy. Hollis says I twisted it. Hollis says tons of stuff."
    - q: "What's past all this?"
      a: "Pipes. Then more pipes. Then pipes that burn you. And a barred door with a three on it. It kind of breathes at night. I don't go there."
    - q: "Ever hear the name Dina?"
      a: "The tape lady? She talked into a little box the whole time, like it was a friend. She let me say hi into it. She went off toward the hot pipes. I told her not to."
    - q: "Want to come with me?"
      sk: speech 30
      do: recruit
      a: "For real? I mean, sure. Whatever. I'll grab my stuff. I have no stuff. Ready!"
      fail: "You're nice. You look like you're headed somewhere awful, though."
    - q: "How'd you end up here?"
      a: "Hide and seek. Found the best spot in the world. Nobody found me. It's a good joke if you say it fast."
  barks:
    idle: ["That pipe sounds emptier than this one.", "Mags still owes me a can.", "You hear that? No? Me neither."]
    hi: ["Hi! Hey!", "Oh good, it's you."]
    drawn: ["Whoa whoa, don't, I'm little!"]
    hurt: ["That's so much blood. Hollis! Hollis, come here!"]
    sneak: ["Ha! Spotted you."]
    close: ["Too near, back up, back up."]
    spot: ["It's coming! It's coming!", "Hound! There's a hound!"]
    hostile: ["I liked you! Why would you do that?"]
    hit: ["Ow ow ow! Ow!", "My arm! It got my arm!"]
    kill: ["Was that me? That was me!"]
    clear: ["Did it go? Did it really go?"]
    flee: ["No way! I'm running!", "I'm gone, I'm gone!"]
    death: ["Mum?"]
  gest: { wave: "Hi! Look, I'm waving too. See?", gift: "This is mine? Really mine? Thanks thanks thanks.", dance: "I don't know any moves. Okay, go!", nodance: "Not with people looking.", insult: "Wow. Mean. Okay." }

surv-hollis:
  hi: "Easy there, neighbor. Put the bag down, it's safe. Mags might peek in it. Nobody else will."
  back: ["Well, there you are. Radio told me you were coming. Radio tells me all sorts.", "Come in, neighbor. Warm pipe's free."]
  warm: "Good to lay eyes on you, neighbor. Kettle's hot. Kettle's always hot."
  cold: "I'll mend you. Don't ask me for more than that."
  follow: "Nice and slow. I'm here."
  bye: "Watch the steam down the west run."
  walk: "Well, alright."
  ask:
    - q: "Can you fix me up?"
      do: heal
      a: "Let me see. Mm hm. I've seen worse. I've seen a good deal worse. Hold this here. There. Good as new. Well, good as secondhand."
    - q: "Where am I?"
      a: "Among friends, first of all. The rest is boiler pipe, far as anybody's walked. I worked power lines thirty years and I never saw plumbing with no building on the end of it. But here we sit."
    - q: "How do I get out?"
      a: "I don't rightly know, neighbor. I'll tell you what I hold onto. That radio picks up a woman singing. Singing comes from somewhere. Somewhere means there's a line to follow."
    - q: "What's the radio saying?"
      a: "Hiss, mostly. Some nights a fella reads out numbers. One night a woman sang a whole lullaby. I took down the words. Couldn't tell you what tongue it is."
      then:
        - q: "Can I hear it?"
          a: "Only comes at night. And only once you've quit waiting on it."
    - q: "Ever hear the name Dina?"
      a: "Dina. I do. Sat right there two nights with her ear on my radio and a little tape machine running. Said that signal sounded like home. Then she packed up and went through the barred door."
      then:
        - q: "She leave anything?"
          a: "Not with me. She talked into those tapes like a diary, though. Somebody that careful leaves one behind sooner or later. Look where she slept, out past the hot pipes."
    - q: "What's the barred door with the three?"
      a: "Folks say that's the next one down. Bare wire, and things that come to the hum. If you go, wear rubber on your feet and carry nothing metal."
    - q: "How do you stay so calm?"
      a: "Thirty years a lineman. Ice storms, hot wire, wind. This here is only a storm that won't quit."
  barks:
    idle: ["Come on now, radio. Talk to me.", "Kettle's hot.", "That pipe's been knocking since Tuesday. My Tuesday, anyhow."]
    hi: ["Hey now, neighbor.", "Come set a while."]
    drawn: ["No call for that here, neighbor."]
    hurt: ["Come on over, let me see to that."]
    sneak: ["I hear you tiptoeing. Ears still work."]
    close: ["Little close, neighbor."]
    spot: ["Here they come. Easy now.", "Trouble! Get behind the pipes!"]
    hostile: ["I took you in. I won't forget this."]
    hit: ["Oof. I'm alright.", "Ah. Old bones, that's all."]
    kill: ["Go on and rest."]
    clear: ["Everybody whole? Let me look."]
    flee: ["Get back of the boiler!"]
    death: ["Tell Wren... it's fine..."]
  gest: { wave: "Well, hello right back.", gift: "Now that is kind. Thank you.", dance: "I was good at this once.", nodance: "These knees have retired.", insult: "Alright. Reckon your day's been long too." }

surv-mags:
  hi: "Well, look at this. Hi, honey. You buying, selling, or window shopping? Window's free. For now."
  back: ["Look what the pipes dragged in. Miss me?", "Honey! Tell me those pockets are heavy."]
  warm: "For you, I go in the back. Wren doesn't hear about it."
  cold: "Money on the crate, honey. Then we chat."
  bye: "Come back with more money."
  walk: "You'll be back, sweetheart."
  ask:
    - q: "Where am I?"
      a: "Mags's. Finest store between that boiler and that other boiler. You want the big picture, ask Hollis. I do retail."
    - q: "How do I get out?"
      a: "Honey, if there was an out I'd be selling tickets at the door. There's no out. There's just deeper, and a few spots that are nicer than others. This is one of the nicer ones. Sad, right?"
    - q: "What are you selling?"
      a: "Shells, tape, batteries, and a can opener I'm in love with. It all has a price. So do I, but honey, not on your budget."
    - q: "Bit steep, isn't it?"
      sk: barter 45
      do: discount
      a: "Ooh, look at you. Okay. A little off. That's for the face, not the argument."
      fail: "Steep's on purpose, honey. Keeps out the tourists."
    - q: "Ever hear the name Dina?"
      a: "The one with the tape recorder. Sure. Traded me a real nice wristwatch for rubber boots and didn't even argue. You only want rubber boots for one place, honey. The barred door."
    - q: "Where's all this from?"
      a: "Pockets of people who quit needing pockets. Oh, don't look at me like that. They're done with it. You're not."
    - q: "Seen anything strange?"
      a: "Prints in the grease by the boiler. Bare feet. More toes than a foot should come with. I quit going that way. Take the hint."
  barks:
    idle: ["Junk, junk, good junk.", "Shells are four waters apiece. Robbery's such an ugly word.", "Wren, quit drumming on that pipe."]
    hi: ["Hi, honey.", "Ooh, a customer."]
    drawn: ["Easy, you'll ding the stock."]
    hurt: ["Ouch. I smell a bandage sale."]
    sneak: ["We shoot sticky fingers here, sweetie."]
    close: ["Hands up top where I can admire them."]
    spot: ["Ugh, really? Now? Heads up!", "Trouble! Watch the shop!"]
    hostile: ["Oh, honey. Bad idea. The worst."]
    hit: ["Not the hair!", "I'm billing you for that!"]
    kill: ["Ta ta."]
    clear: ["Anything busted? Other than that thing."]
    flee: ["I'm not dying over a pipe!"]
    death: ["My can opener..."]
  gest: { wave: "Adorable. Next time wave cash.", gift: "Aw, you sweet thing. Prices stay where they are.", dance: "You lead, honey. I'll score it.", nodance: "On the clock.", insult: "Ha! That just cost you ten percent." }

# ===== Level 2.1, the cold room camp =====
l21-ned:
  hi: "This is Alef. Watch the drip there, bub. You want saltines? We got saltines. That's the whole menu."
  back: ["Back again, bub. Saltine?", "Four thousand and nine cartons. Did the count over."]
  warm: "Oh, good. Sit down. Saltine. Have two, I'm feeling wild."
  cold: "I'll trade with you. That's all."
  bye: "Take a carton. Go on. Take two, do me a favor."
  walk: "Ayuh."
  ask:
    - q: "Where am I?"
      a: "Alef. It's a warehouse and some walk-in fridges, off the side of the pipes. Fella at the door calls it a base. It's a pantry with a guard."
    - q: "How do I get out?"
      a: "Door you came in. That's the one I know. If you mean out for good, bub, I gave that up and took up counting. Counting you can finish."
    - q: "Why so many crackers?"
      a: "Warehouse was full of them when we got here. Fridges were cold. Turns out a person can go a long while on crackers and fridge water. Wouldn't wish it on you."
    - q: "Need anything?"
      a: "Copper wire. Condenser's got a leak and the water tastes like a pocketful of change. Talk to me proper if you want the job."
    - q: "Cut me a deal?"
      sk: barter 30
      do: discount
      a: "Ayuh. Everybody gets a deal on saltines. You get one on the rest, too."
      fail: "It's crackers, bub. It can't get cheaper."
    - q: "Ever hear the name Dina?"
      a: "Can't say so. I know faces by what they take. Anybody who came through took saltines. So that's no help to you, is it."
  barks:
    idle: ["Four thousand and eight. Nine.", "Condenser's spitting again.", "Anybody want a saltine. Anybody."]
    hi: ["Saltine?", "Hey, bub."]
    drawn: ["Not in the cold room, bub."]
    hurt: ["Go sit by the fridge. Cold'll help."]
    spot: ["Smiler in the doorway!", "Lights! Somebody hit the lights!"]
    hostile: ["Out of Alef. Go."]
    hit: ["Ow! Ayuh, that hurt."]
    kill: ["That's done."]
    clear: ["Somebody check the fridge seals."]
    flee: ["Cold room! Get in!"]
    death: ["My crackers..."]
  gest: { wave: "Hey there. Saltine?", gift: "Thank you. Here, take a saltine.", dance: "Out here in the cold? Sure. Warms you up.", nodance: "Too cold for it.", insult: "Alright. You get no saltine." }

l21-goknar:
  hi: "Stop on the line. Hands up. Good. You come from the pipes, or from the dark side? No matter. This is Alef. Go in."
  back: ["You. Okay. Go.", "Back. Good."]
  warm: "Good you are here. Lights are steady."
  cold: "My eyes are on you."
  bye: "Carry a light. Always."
  walk: "Tch."
  ask:
    - q: "Where am I?"
      a: "Alef door. Behind me, light and food. In front of me, the Edges. No light there. I stand in the middle. That is all the map I need."
    - q: "How do I get out?"
      a: "Out of where? Out of Alef, you walk past me. Out of the dark, you keep a lamp. Bigger than this I do not know. I guard one door."
    - q: "What's out in the dark?"
      a: "Smilers. Teeth, nothing else. When the lights blink they come and scratch the frame. I keep the lights on. They keep scratching."
    - q: "How long on this door?"
      a: "Since the man before me lost it."
    - q: "Any advice?"
      sk: survival 30
      a: "You see teeth in the dark and no face. Do not turn. Do not run. Step back slow until light is behind you."
      fail: "Stay inside Alef. That is the advice."
    - q: "Ever hear the name Dina?"
      a: "No names at this door. Only hands and faces. A woman went out to the Edges with a lamp and a recorder once. She came back, so I remember. Most do not."
  barks:
    idle: ["Lights steady.", "Scratching again.", "Clean the pistol. Then clean it again."]
    hi: ["Go in.", "You."]
    drawn: ["Down. Now."]
    hurt: ["Medic is inside."]
    spot: ["Teeth at the door!", "They come from the Edges!"]
    hostile: ["Bad choice."]
    hit: ["Ngh. Nothing."]
    kill: ["Finished."]
    clear: ["Door is clear."]
    flee: ["Back to the light!"]
    death: ["The lights... keep them..."]
  gest: { wave: "Hm. Yes. Hello.", gift: "I thank you.", dance: "I am on the door.", nodance: "I am on the door.", insult: "Say this again past the line." }

# ===== Level 3, the gated base =====
gamma-reyes:
  hi: "Halt. Hands where I can see them. Good. Base Gamma is behind me. Generators that way. Hounds in the middle. Any questions, civilian?"
  back: ["You came back, civilian. First week, most do not.", "Still breathing. Keep it up."]
  warm: "Hey. Good, it's you. Walk with me. I have a lap to finish."
  cold: "Your business. Short version."
  follow: "I have your six."
  bye: "Head low. Feet quiet."
  walk: "Understood."
  ask:
    - q: "Where am I?"
      a: "Electrical station. Level 3 on our maps. Miles of halls, live cable, and machines nobody switched on. My part of it is this gate and one lap around it."
    - q: "How do I get out?"
      a: "My orders are to hold a gate, not find a door home. Command says the scouts are working on it. Command has said that the whole time I have been here."
    - q: "How do I get through the halls?"
      sk: survival 35
      a: "The hum is loudest by the big lines, and the hounds like the hum. So you take the quiet way, even when it is longer. Crawl tubes are quiet. Tight, but quiet."
      fail: "Run fast and pray. That is the cowboy plan. You look like a cowboy."
    - q: "What's behind the gate?"
      a: "Walls, a scanner, hot food. People who will shoot a hound off your back. Down here that is a palace."
    - q: "Ever hear the name Dina?"
      a: "Dina. One night at the gate, months back. She had a hand-drawn map with doors marked on it. Good work, better than ours. She asked my patrol about a hotel. I told her that is a campfire story."
    - q: "Want another gun on patrol?"
      sk: speech 40
      do: recruit
      a: "You have kept your head so far. Fine. You walk where I walk. You shoot what I shoot."
      fail: "Nothing personal. You would get the both of us killed."
    - q: "Where are you from?"
      a: "Monterrey. Twenty years in the army. I used to think a desert was the worst place there is. I miss the desert now."
  barks:
    idle: ["Generator four has that cough again.", "Lap done. Next lap.", "Hum is loud today."]
    hi: ["Civilian.", "You. Good."]
    drawn: ["Lower it. Slow."]
    hurt: ["You are hit. Go to Ito. Now."]
    sneak: ["I see you. On your feet."]
    close: ["One arm of distance."]
    spot: ["Contact! Hounds on the lines!", "Movement, west hall!"]
    hostile: ["That was your mistake."]
    hit: ["Hit! Still up!", "Ah! Keep shooting!"]
    kill: ["Target is down.", "Got him."]
    clear: ["Clear. Check the corners."]
    flee: ["Back to the gate!"]
    death: ["Hold... that gate..."]
    reload: ["Loading!"]
  gest: { wave: "Mm. Civilian.", gift: "Thank you. I mean it.", dance: "One step. I am counting it.", nodance: "On duty.", insult: "My drill sergeant did it better." }

gamma-pell:
  hi: "Name for the ledger, please. None? Then you are 'Visitor', underlined. What have you brought to trade?"
  back: ["Ah, Visitor. Two underlines now.", "No debts against you. How unusual. Do come in."]
  warm: "One of my tidy names. Sit down, I shall show you the clean crates."
  cold: "Payment first, thank you."
  bye: "Mind the wire on your way out. Don't touch it."
  walk: "The ledger shall note that."
  ask:
    - q: "Where am I?"
      a: "Stores, Base Gamma, third shelf from the door, standing on my clean floor. If you want it larger than that, Commander Moss has the maps. I have the receipts."
    - q: "How do I get out?"
      a: "There is no entry for 'out', Visitor. I have checked. If someone had found it, they would have needed supplies for the trip, and they would have signed for them."
    - q: "What's for trade?"
      a: "Wire, water, filters, shells, batteries. Every item counted. If it is not in the ledger, it does not exist, and you may not have it."
    - q: "A better price?"
      sk: barter 40
      do: discount
      a: "Very well. You pay when you say you will. That is scarcer than bullets. Ten off."
      fail: "The prices are written down. That is why one writes them down."
    - q: "Ever hear the name Dina?"
      a: "One moment. D. Here. 'Dina, visitor. Six batteries, one roll of tape. Paid in full.' Lovely handwriting. Under destination she wrote 'the hotel'. I put a question mark beside it. I still would."
    - q: "Where's the wire going?"
      a: "Two crates come in, one goes out. Reyes blames moths. Moths do not sign for things. Somebody is signing for things."
  barks:
    idle: ["Two in, one out. Who is it.", "Initial here, please. And here.", "That is not how one stacks a crate."]
    hi: ["Visitor.", "Yes? The ledger is open."]
    drawn: ["Not beside the stock, if you please."]
    hurt: ["Ito is two rooms along. Off you go."]
    spot: ["Intruder! Lock the crates!"]
    hostile: ["You are in the book now. In ink."]
    hit: ["Oh! This is not acceptable!"]
    kill: ["Entered."]
    clear: ["I am counting. Nobody move."]
    flee: ["I am taking the ledger!"]
    death: ["My... ledger..."]
  gest: { wave: "Good day. Noted.", gift: "I shall enter that as a gift. Thank you.", dance: "Very well. One dance, exactly.", nodance: "I have inventory.", insult: "Filed under insults. That column is long." }

gamma-ito:
  hi: "Sit. Water is boiling. You have not slept, I can see it. The hum does that to new faces."
  back: ["Tea. You will say no. Drink it anyway.", "Show me your eyes."]
  warm: "Good. When I see you I worry a little less."
  cold: "Sit. I will treat you. I will not enjoy it."
  bye: "Sleep, if it lets you."
  walk: "The tea can wait."
  ask:
    - q: "Patch me up?"
      do: heal
      a: "Burn. Bruise. One bite. Be quiet. This one first. Now this. Done. Drink the tea. It is part of the treatment."
    - q: "Where am I?"
      a: "In the sick room of a base, inside a power station that powers nothing. That is the honest answer. The others will give you a number. The number does not help you sleep."
    - q: "How do I get out?"
      a: "I do not know. I know what happens to the ones who think about it all day. They stop eating, then they walk toward the big cables. So think about it a little. Then eat."
    - q: "What does the hum do?"
      a: "First your head hurts. Then you hum with it and do not notice. Then you go and stand by the big cables and you do not come back. If you hear yourself humming, come to me."
    - q: "Does anything help?"
      sk: medicine 35
      a: "Wax in the ears. Talk when you walk, even alone. Count things out loud. The hum does not like counting."
      fail: "Leaving this place helps. Do that."
    - q: "Ever hear the name Dina?"
      a: "Yes. She did not hum. She kept one earphone in, listening to her own voice on a tape. Clever. I asked what she recorded. She said every door she found, so the next person would not start from nothing."
  barks:
    idle: ["Water.", "Somebody is humming. Stop.", "Count it out loud. Good."]
    hi: ["Sit. Tea.", "Eyes. Show me."]
    drawn: ["Put that away. People are resting."]
    hurt: ["Here. Sit. Now."]
    close: ["If you are not hurt, step back a little."]
    spot: ["The wounded stay behind me!"]
    hostile: ["I treated you. Think about that."]
    hit: ["Ah. It is fine. Go on."]
    kill: ["Good. Who is hurt?"]
    clear: ["Make a line. One at a time."]
    flee: ["To the sick room!"]
    death: ["The water... is boiling..."]
  gest: { wave: "Hello. Sit down.", gift: "Thank you. Someone who needs it will get it.", dance: "A short one. Then tea.", nodance: "I would fall down.", insult: "I will remember it when you are bleeding." }

gamma-hask:
  hi: "ID. No? Yeah, nobody's got one. Go ahead, buddy. Stay off the red hoses. That's liquid pain. I'm not being cute."
  back: ["You. Go ahead.", "Still off the hoses? Good."]
  warm: "Hey, buddy. Lean here a while. It's dull. Dull's good."
  cold: "Keep walking. Don't stop."
  bye: "Stay off the hoses."
  walk: "Yup."
  ask:
    - q: "Where am I?"
      a: "Gate. Base Gamma's behind it. I'm in front of it. That's about all I got."
    - q: "How do I get out?"
      a: "Beats me, buddy. If I knew, you think I'd be counting bolts?"
    - q: "Liquid pain?"
      a: "It's in the red hoses, all over the station. Burns you deep and doesn't quit. Every month some genius drinks it on a dare."
    - q: "Long shift?"
      a: "All of them. I count ceiling bolts. Four hundred and six. Last week I got four hundred and five."
    - q: "Anything get past this gate?"
      a: "One time. We don't bring it up. Duke brings it up. Don't listen to Duke."
    - q: "Ever hear the name Dina?"
      a: "Nope. Lot of people through here. Ask Vale at the scanner. She looks in everybody's bag and remembers all of it."
  barks:
    idle: ["Four hundred and six.", "Dull. The good kind.", "Hands off the hoses."]
    hi: ["Yup.", "Go ahead."]
    drawn: ["Not on my gate."]
    spot: ["Gate! Something at the gate!"]
    hostile: ["Bad call."]
    hit: ["Ha. Tickles."]
    kill: ["Yup."]
    clear: ["Back to dull."]
    flee: ["Get in! Shut it!"]
    death: ["Huh. Okay."]
  gest: { wave: "Yup. Hey.", gift: "Thanks, buddy.", dance: "Nope.", nodance: "Nope.", insult: "Sure." }

gamma-vale:
  hi: "Into the frame, arms out. Lovely. Let's see what's on you, blip. Oh. Why so much string?"
  back: ["Another go, blip? You've gained a spoon since last time.", "Arms out. You know how it goes."]
  warm: "Best blip of the day! Go on in."
  cold: "Arms out. Mouth shut."
  bye: "Go round the alarm on your way out. It's dead loud and I'm dead tired."
  walk: "That scan's not finished. Rude."
  ask:
    - q: "Where am I?"
      a: "In a doorway with a machine in it. Past me is Base Gamma, which is beds and stew. Behind you is the station, which is neither. So well done, you picked the right side."
    - q: "How do I get out?"
      a: "Of the frame? Step forward. Of the whole place? Ah, now. I've scanned a thousand bags and not one had a ticket home in it. I do check. Every time."
    - q: "What are you scanning for?"
      a: "Metal, mould, and anything that isn't you but says it is. The machine shrieks at all three. It shrieked at a sandwich once."
    - q: "Catch anything bad?"
      a: "A fella came through with a face a bit too smooth. The machine didn't shriek. It went silent. Silent's worse, trust me."
    - q: "Ever hear the name Dina?"
      a: "I'm awful with names. Bags, though. Tape recorder, a pile of tapes, a map drawn in biro, no weapon at all. That her? Came in from the station on her own. Not many do that with no weapon."
  barks:
    idle: ["Beep. Beep. Sandwich again.", "Next blip!", "Arms out, thanks."]
    hi: ["Ooh, blip.", "Next!"]
    drawn: ["Machine hates that. Me too."]
    spot: ["It's in the scanner hall!"]
    hostile: ["Alarm! I'm hitting the alarm!"]
    hit: ["Ow! Manners!"]
    kill: ["Scanned. Deleted."]
    flee: ["Behind the desk!"]
    death: ["Beep..."]
  gest: { wave: "Hiya! Arms out.", gift: "For me? I'm not scanning it. I want the surprise.", dance: "Arms out, twirl, grand.", nodance: "I've a queue.", insult: "Machine says rude." }

gamma-duke:
  hi: "Up here. Higher. Yeah. Name's Duke. I got the door. Hound at eighty yards, one round. Ask anybody. Not Hask, Hask lies."
  back: ["Hey, ground floor! Legs still on?", "You again. Saw you a mile out."]
  warm: "My favorite thing to look at down there. Holler if something's on your tail."
  cold: "Got you in the glass. Just so you know."
  bye: "I'll keep an eye on you. Friendly eye."
  walk: "Fine. I got a door to watch."
  ask:
    - q: "Where am I?"
      a: "Under the best shot in Base Gamma. Rest of it's hallways and hum, far as the glass can see. And I can see real far, ground floor."
    - q: "How do I get out?"
      a: "Easy. You find the door home, I'll cover you while you walk through it. Finding it's your half. I did my half already."
    - q: "Eighty yards? Really?"
      a: "Eighty-two. Dark. Hum in my ear. Best shot I ever made and every soul in here was asleep."
    - q: "Worst thing you've seen?"
      a: "Something walked up on two legs with Hask's face on. Hask was standing next to me at the time. I held fire. Still can't tell you if that was right."
    - q: "Ever hear the name Dina?"
      a: "Don't get names up here. Got a lady who walked out the east hall alone, no gun, looking at a map. I kept the glass on her till the corner. Nothing touched her. That one bugs me."
  barks:
    idle: ["Eighty-two yards.", "Nothing sneaks by Duke.", "No wind. Never any wind. Easy money."]
    hi: ["Ground floor!", "Hey now."]
    drawn: ["Cute. Mine's longer."]
    spot: ["I see it! Shot's mine!", "Hound, eleven o'clock!"]
    hostile: ["You're in my glass, ground floor."]
    hit: ["Ow! Nobody hits me! Who was that?"]
    kill: ["One round. Somebody write that down.", "Right in the head."]
    clear: ["Nothing's moving. Beautiful."]
    flee: ["Changing position! That ain't running!"]
    death: ["Nobody... was looking..."]
    reload: ["Loading, watch the door!"]
  gest: { wave: "Waving at the sniper. Gutsy.", gift: "Ooh. That goes on the trophy shelf.", dance: "Catwalk two-step!", nodance: "Can't. Eyes on the door.", insult: "Missed me. Like you would." }

gamma-marlo:
  hi: "Oi, mate, hold this pipe flat for us. Spring's off an old sofa and it won't stay on the catch."
  back: ["You're back, mate! Got us anything that goes bang?", "A customer! Love a customer."]
  warm: "For you, mate, the cloth comes off the good bench."
  cold: "Buy something or get out of my light."
  bye: "Keep her oiled!"
  walk: "Alright, alright."
  ask:
    - q: "Where am I?"
      a: "Marlo's bench, mate. Only gunsmith in Base Gamma. Only gunsmith I know of anywhere, which makes me the best in the world. Lovely feeling."
    - q: "How do I get out?"
      a: "Couldn't tell you, mate. Not my trade. What I can do is make sure whatever's standing between you and the way out has a very bad day."
    - q: "What've you got?"
      a: "Rounds, parts, one revolver that's not for sale, one revolver that is. Spitting image of each other. That's the game."
    - q: "Do me a deal?"
      sk: barter 35
      do: discount
      a: "You can tell a firing pin from a bent nail. I'll knock a bit off for that. There you go."
      fail: "It costs what it costs, mate. Springs don't grow on sofas. Well. They do. Still."
    - q: "Where'd you learn this?"
      a: "Grandad's shed, Croydon. Fixing lawnmowers. Now I fix things that drop hounds. He'd be chuffed. Then appalled. Then chuffed."
    - q: "Ever hear the name Dina?"
      a: "Dina? Don't think so. Hang on. Woman who wouldn't buy a gun? Offered her a cracking little pistol at cost and she said it'd only slow her down. Slow her down! I think about that."
  barks:
    idle: ["Shouldn't work. Does, though.", "Who's had my little screwdriver.", "Spring, spring, spring."]
    hi: ["Customer!", "Hands! Lovely."]
    drawn: ["Ooh, give us a look at that. Gently."]
    spot: ["Test fire! Live one!"]
    hostile: ["You're having a go at the gunsmith?"]
    hit: ["Ow! That's my oiling arm!"]
    kill: ["It worked! Ha! It worked!"]
    flee: ["I'm taking the good one!"]
    death: ["Keep... her... oiled..."]
  gest: { wave: "Hello hello, mate!", gift: "Is it a part? Not a part. Lovely all the same.", dance: "Ha! Go on, then.", nodance: "Hands are all oil.", insult: "My own guns call me worse." }

gamma-june:
  hi: "Hi, love! Sit down, sit down. Almond water's cold, stew's hot, and you're telling me where you've been."
  back: ["There you are, love! Same again?", "You're back! Give me some good news."]
  warm: "My best regular. Take the good stool, I've kept it warm."
  cold: "Two bucks a drink."
  bye: "Bring me back a story, love!"
  walk: "Alright, love."
  ask:
    - q: "Got a drink? I'm in bad shape."
      do: heal
      a: "Here, love. Cold almond water and a bowl of stew. Don't ask what's in it. Eat. There you go, you've got your colour back."
    - q: "Where am I?"
      a: "June's. It's four stools and a pot, love, but it's the only bar I've heard of down here. The base is called Gamma. I never asked why. Sounds official, doesn't it?"
    - q: "How do I get out?"
      a: "I hear a new way out every week at this bar, love. None of the tellers ever went and used theirs. I don't think that means there isn't one. I think it means people are scared."
    - q: "Heard any good stories?"
      a: "A runner swore he found a door onto a beach. Sand, waves, all of it. Went to fetch his mate and came back to a wall. He drinks here every night, facing that way."
    - q: "Ever hear the name Dina?"
      a: "Oh, her! Lovely manners. Sat on that stool and asked every runner one thing. Had they heard of a hotel. They all had, love. A few floors down, real beds, they say. Not one had seen it."
    - q: "What's the best thing here?"
      a: "Someone saying thank you. You would not believe how few do."
  barks:
    idle: ["Stew's on!", "Top up, anybody?", "Somebody give me good news."]
    hi: ["Hi, love!", "Sit down, sit down."]
    drawn: ["Not at my bar, love."]
    hurt: ["Sit, love, I'm getting water."]
    spot: ["All of you, behind the bar!"]
    hostile: ["Out! Get out of my bar!"]
    hit: ["Oh! Ow!"]
    kill: ["And stay gone."]
    flee: ["Get behind the bar!"]
    death: ["Oh, love..."]
  gest: { wave: "Hiya, love!", gift: "Oh, you darling.", dance: "Ooh, yes! Come on, then!", nodance: "Orders up, love.", insult: "Well. Your drink just went warm." }

gamma-tess:
  hi: "Mm. That jacket. Who made this seam? No. Do not say. I will only suffer."
  back: ["You return. The sleeve is worse.", "Come. I fix the collar. It offends me."]
  warm: "Ah, my model. Come, put this one on."
  cold: "Buy. Or go."
  bye: "Do not catch it on a nail."
  walk: "Pff."
  ask:
    - q: "Where am I?"
      a: "In the one corner of this ugly station where things are made and not broken. The rest is grey halls. I do not look at the rest."
    - q: "How do I get out?"
      a: "I do not know, and I will say something terrible. I am not sure I want it. At home I sewed for an empty theatre. Here, what I sew keeps someone alive. Go ask a braver person."
    - q: "What do you make?"
      a: "Coats that stop teeth. Bags that do not split. All from what people leave behind them. Nothing wasted. Fashion has one rule, and that is it."
    - q: "Where'd you learn to sew?"
      a: "Lyon. A theatre. Costumes for operas with no audience. Now I have an audience. It is hounds."
    - q: "Ever hear the name Dina?"
      a: "Names, no. Coats, yes. A woman asked me for one inside pocket, this big, lined so it stays dry. For her tapes. She cared more for the tapes than for the coat. I respected it. A little."
  barks:
    idle: ["This seam. Awful.", "My needle. Where is my needle.", "Wool. More wool. Always wool."]
    hi: ["Mm. Yes?", "That jacket again."]
    drawn: ["You will mark the leather."]
    spot: ["There is something here."]
    hostile: ["Savage."]
    hit: ["Not the hands! Never the hands!"]
    kill: ["Pff."]
    flee: ["I take the good cloth!"]
    death: ["The hem... unfinished..."]
  gest: { wave: "Mm. Bonjour.", gift: "It is cloth? No? Merci all the same.", dance: "Slow. With grace.", nodance: "Non.", insult: "Your jacket insults me more." }

gamma-bo:
  hi: "I'm Bo! Did you come by the tunnels? Which way did you turn? I was two weeks finding the way through."
  back: ["Bo's back! No, wait. You're back. Hi, friend!", "Hey, friend!"]
  warm: "Best friend! Okay, top five. Top five's good."
  cold: "Oh. Hey."
  bye: "See you, friend!"
  walk: "Oh. Okay, bye!"
  ask:
    - q: "Where am I?"
      a: "Gamma! It's the good part. There's a gate and stew. Everything else out there is the bad part. That's how I split it up."
    - q: "How do I get out?"
      a: "Out of the tunnels, you turn left a lot. Out of here here? I don't know, friend. I looked for two weeks and all I found was stew. So I stayed with the stew."
    - q: "What happened in the tunnels?"
      a: "Nothing. Well. I ate a battery. Don't do that. And a voice knew my mum's name. That's it. Ask a different one."
    - q: "What's the pipe for?"
      a: "Bonking. And if you swing it just so, it whistles. Listen. Hear it? Whoo."
    - q: "Like it here?"
      a: "Stew! Walls! And nobody asks about the tunnels. Just you. You're alright, though."
    - q: "Ever hear the name Dina?"
      a: "Is she nice? I don't know her. I don't know lots of people. I know you now, though! That's one more."
  barks:
    idle: ["Whoo. Whoo. Hear the pipe?", "Is it stew time?", "Not thinking about tunnels. Nope."]
    hi: ["Hey hey, friend!", "Friend!"]
    drawn: ["Whoa. Okay. That's okay."]
    spot: ["A thing! A thing!"]
    hostile: ["But we were friends!"]
    hit: ["Ow, alright, alright!"]
    kill: ["Bonk!"]
    flee: ["To the tunnels! No! Not the tunnels!"]
    death: ["Oh. Okay."]
  gest: { wave: "Hi hi hi, friend!", gift: "Is it food? It is? Yay!", dance: "Yes! Dancing!", nodance: "Leg's gone funny.", insult: "That was mean." }

gamma-nell:
  hi: "Hiya, lovely! You hurt? You look hurt. Mind you, everybody does. Come by here."
  back: ["You again, lovely! Give us a look at that arm.", "Hiya!"]
  warm: "Oh, brilliant, it's you! I saved you a clean bandage."
  cold: "Sit down. I'll do the bandage."
  bye: "Ta-ra, lovely! Keep that dry!"
  walk: "Oh. Right you are!"
  ask:
    - q: "Where am I?"
      a: "The sick room, lovely! Well, the hall outside it. I'm not allowed to do bandages in there till I stop dropping them. It's all part of Base Gamma."
    - q: "How do I get out?"
      a: "Ooh, I've a plan for that. I get good at this, I keep everybody alive, and one of them finds it and tells me. It's a slow plan. I think it's a good one, though."
    - q: "You work here?"
      a: "I hand Ito things and she says not that one. I'm improving, mind. She's down to twice a shift."
    - q: "Best part of the job?"
      a: "Somebody comes in grey and goes out pink. Pink's my favourite colour now."
    - q: "Ever hear the name Dina?"
      a: "Doesn't ring a bell, lovely, sorry. Ito would know. She remembers every single patient. She says she doesn't. She does."
  barks:
    idle: ["Bandages, bandages, bandages.", "Not that one, Nell.", "Clean hands, clean table, clean everything."]
    hi: ["Hiya, lovely!", "You hurt?"]
    hurt: ["Oh no! Come by here, quick!"]
    spot: ["Behind me, go on!"]
    hostile: ["No! What did you do that for?"]
    hit: ["Ow! I'm fine!"]
    kill: ["Oh. Oh, that's dead, that is."]
    flee: ["Sick room, quick!"]
    death: ["Ito..."]
  gest: { wave: "Hiya!", gift: "Aww. Ta, lovely.", dance: "Oh, go on, then!", nodance: "I'm on shift!", insult: "Ow. That one stung." }

gamma-pip:
  hi: "Whoa, did you come down from the pipes? What's it like now? Is the old guy with the radio still there? Tell me all of it."
  back: ["News! You got news?", "You're back! What'd you see? What'd you see?"]
  warm: "Sit, sit. I fixed a radio. Listen. It's just static. But I made that static."
  cold: "Okay."
  bye: "Bring news next time!"
  walk: "Aw, man."
  ask:
    - q: "Where am I?"
      a: "Level 3! Base Gamma, the workshop bit. Up from here's the pipes, then the big concrete one, then the yellow one. I drew it. It's a stack. I don't know what's under us yet."
    - q: "How do I get out?"
      a: "Okay, so. My idea. Radios work down here. Radio has to come from somewhere, right? So you don't look for a door. You look for where the signal's loudest. Nobody listens to me. I'm sixteen."
    - q: "What are you building?"
      a: "A radio that picks up other floors. I think. It picks up something. Last night it said stop listening, super clear. So I'm definitely not stopping."
    - q: "Ever hear the name Dina?"
      a: "The tape lady! She played me a tape of a song off the old guy's radio. She said it sounded like home. I'm trying to tune my set to it. She said if I find it, say hi."
    - q: "How old are you?"
      a: "Sixteen. Probably. Nobody does birthdays. I did one on my own once. It was pretty sad, so I quit."
  barks:
    idle: ["Bzzt. Static. Nice.", "Who took my tiny screwdriver?", "News? Anybody got news?"]
    hi: ["Got news?", "Hi! Hi!"]
    drawn: ["Whoa! Cool. No, wait, scary. Kind of cool."]
    spot: ["Oh no. Oh no no no!"]
    hostile: ["Hey! What?"]
    hit: ["Ow!"]
    kill: ["We got one!"]
    flee: ["I'm hiding!"]
    death: ["Just... static..."]
  gest: { wave: "Hi!", gift: "Is it a radio part? Thanks!", dance: "Robot dance. Watch.", nodance: "Can't, I'm soldering!", insult: "Rude much." }

gamma-otto:
  hi: "Hm. Hello. Watch the crates. They move if you look away. No. They do not. They are heavy."
  back: ["Back. Good.", "Hello again."]
  warm: "Ah. Good. Help me lift this. No. I joke."
  cold: "I am busy."
  bye: "Ja. Goodbye."
  walk: "Okay."
  ask:
    - q: "Where am I?"
      a: "Loading floor. Base Gamma. Before this I was three years up in the pipes. Before that, Rotterdam. Each time I go down one. It is not the direction I wanted."
    - q: "How do I get out?"
      a: "I do not know. I know everything goes down. Crates, people, me. Maybe out is at the bottom. Maybe that is only a thing I tell myself."
    - q: "Been here long?"
      a: "Here, one year. In the pipes, three. Hollis fixed my leg two times. Mags sold me my own boots. I came down for the walls. They are good walls."
    - q: "What's the job?"
      a: "Crate in. Crate up. Crate down. Crate out. It is a good job. A crate does not surprise you."
    - q: "Ever hear the name Dina?"
      a: "No. I am sorry. I know crates."
  barks:
    idle: ["Crate in. Crate out.", "Heavy. That is good.", "Use the legs. Not the back."]
    hi: ["Hello.", "Hm."]
    spot: ["There is something."]
    hostile: ["No. Stop."]
    hit: ["Oof."]
    kill: ["So."]
    flee: ["Go back."]
    death: ["Ach."]
  gest: { wave: "Hello.", gift: "Thank you.", dance: "Ha. Okay.", nodance: "Crates.", insult: "Fine." }

gamma-ivy:
  hi: "...Hi. Sorry. I do the screens. I'm not good at talking."
  back: ["Hi.", "...You were on camera six."]
  warm: "Hi. I watched you come in. Camera seven. You looked alright."
  cold: "..."
  bye: "...Bye."
  walk: "..."
  ask:
    - q: "Where am I?"
      a: "...Camera room. Nine screens. That's nine halls. I don't know what's past where the cameras stop."
    - q: "How do I get out?"
      a: "...Not on my screens. I'd have seen it."
    - q: "What's on the screens?"
      a: "Halls. Moths. Hounds. A man on camera four who stands still for an hour. Only I see him. I quit telling people."
    - q: "Ever hear the name Dina?"
      a: "...I don't get names. There was a woman on camera three. East hall. She looked up and waved at the lens. Nobody waves. I waved back. That was dumb. She couldn't see."
    - q: "Why the red jacket?"
      a: "So if I show up on a camera one day, they know it's me."
  barks:
    idle: ["Camera four.", "...A moth.", "He's back."]
    hi: ["...Hi.", "Hi."]
    spot: ["Movement. Camera two. It's here."]
    hostile: ["...Why?"]
    hit: ["Ah."]
    flee: ["..."]
    death: ["Four..."]
  gest: { wave: "...Hi.", gift: "...Thanks.", dance: "...Okay. Slow.", nodance: "...No.", insult: "..." }

gamma-moss:
  hi: "Welcome to Base Gamma, traveller. All are welcome here until they prove otherwise. My name is Moss. I command it, God forgive me."
  back: ["It is good to see you again, traveller.", "Your face is known here now. In this place that is praise."]
  warm: "Sit with me a while. I am tired, and you are easy company."
  cold: "You are still welcome. So far."
  bye: "Go with care."
  walk: "Hm."
  ask:
    - q: "Where am I?"
      a: "The third level down, by our count. We named the whole of it the Backrooms long ago. My people have mapped eleven levels. I do not believe we have seen a tenth of it."
    - q: "How do I get out?"
      a: "I will be honest, because few will. In all my years I have not signed out one person as gone home. I have signed many as lost. We keep looking. That is the whole of what I can promise."
    - q: "Why leave the gate open?"
      a: "The day we shut it, we become one more thing in the dark that people run from. The danger is the price. I pay it."
    - q: "Ever hear the name Dina?"
      a: "I do. She sat in that chair. Her map of doors shamed my scouts. She recorded as she walked and left tapes behind her, on purpose, for whoever followed. One is out in these halls. We left it where she set it."
      then:
        - q: "Why not bring it in?"
          a: "It was not left for us. She told me so. She said the one who needs it will be on foot, and alone, and will not think to ask a commander."
    - q: "What's the hardest part?"
      a: "The book. Each one who walks out and does not return, I write the name myself. My hand knows those pages too well."
    - q: "What are your people after?"
      a: "The way down, and then the next. We map so the one who comes after need not die learning what we have learned already."
  barks:
    idle: ["One more name for the book.", "Hold that gate.", "Coffee. Is there any coffee left."]
    hi: ["Welcome, traveller.", "Good. You are back."]
    drawn: ["Lower that inside my walls, please."]
    spot: ["Defend the base!"]
    hostile: ["You had a welcome here."]
    hit: ["Hold! Hold the line!"]
    kill: ["Well done, all."]
    clear: ["Report. Who is hurt?"]
    flee: ["Back to command!"]
    death: ["Keep it... open..."]
  gest: { wave: "Traveller.", gift: "Thank you. I mean that.", dance: "My wife was the dancer. I watched. I will watch.", nodance: "Not today.", insult: "The council has said worse to me." }
