# Crafting and survival: every tuned number. (7 Days to Die: scrap into tools, a workbench, hunger and thirst. Fallout: skills gate recipes.)
# needs: hunger and thirst run 0..100. Both fall with time (faster sprinting); at 0 you waste away (never to death: hp stops at 1).
needs:
  thirstPerSec: 0.058      # about 37 minutes from full to empty
  hungerPerSec: 0.037      # about 60 minutes
  sprintMul: 1.7
  low: 25                  # under this you are weak: sanity drains faster
  lowSanity: 0.08          # extra sanity per second while a need is low
  starveHp: 1.2            # hp per second at 0 (stops at 1)
  almondThirst: 40         # one almond water drunk
# food: what each eaten token gives back to hunger (it is eaten where you pick it up)
food:
  ration: 30
  royal_ration: 60
  beans: 25
  bar: 12
  lobby_wafer: 18
# cat: the menu tab it sits under (weapons, ammo, aid, tools, armor).
# recipes. in: scrap tokens (scripts/lib/data/breakables.yml scrap) and counts. out: item tokens, each one a takeToken().
# skill: [name, level] you must have; each skill point above it adds 1% to a chance of one extra output (Fallout style).
# bench: needs a workbench (B builds one) within reach.
recipes:
  kit:        { cat: aid, name: Weapon repair kit, in: { scrap_metal: 2, bolts: 2, nails: 1 },       out: [kit],              skill: [repair, 15],   desc: "Mends a weapon +30%, more with Repair skill (I menu)" }
  akit:       { cat: aid, name: Armor repair kit, in: { drywall: 2, wire: 2, nails: 1 },              out: [akit],             skill: [repair, 20],   desc: "Mends every piece you wear +24% (I menu)" }
  tape:       { cat: aid, name: Duct tape,       in: { wire: 1, drywall: 1 },                         out: [tape],             skill: [repair, 5],    desc: "A quick patch +15%, never past 45%" }
  bobbypin:   { cat: tools, name: Bobby pins,      in: { wire: 1, nails: 1 },                            out: [bobbypin, bobbypin, bobbypin], skill: [repair, 10],   desc: "3 bobby pins for picking locks" }
  ammo:       { cat: ammo, name: Pistol rounds,   in: { scrap_metal: 2, springs: 1 },                  out: [ammo, ammo],       skill: [guns, 20],     bench: true, desc: "Two boxes of rounds" }
  shells:     { cat: ammo, name: Shotgun shells,  in: { scrap_metal: 2, wire: 1, nails: 1 },           out: [shells],           skill: [guns, 30],     bench: true, desc: "One box of shells" }
