landings:
  landing-soft:   body-landing-thump-feet-on-thick-carpet-after-jump
  landing-hard:   body-landing-feet-slap-on-concrete-after-jump-with-shoe-scuff
  landing-gravel: body-landing-feet-crunch-into-loose-gravel-after-jump
  landing-wood:   body-landing-feet-thud-on-hollow-wooden-floorboards-after-jump
  landing-metal:  body-landing-boots-clang-on-steel-plate-floor-after-jump
