# Footsteps (Nov 8, Shelly: "improve footstep technology + make it more dynamic"). Every number is Savi's pick.
# The floor is read under your feet (a short ray down): the object's state.floor, else its texture's words, else the level's default.
# Nov 8: Shelly, "level 6.1 footsteps are horrendously loud": hard mall floors (terrazzo, tile, linoleum) cut to under half.
# Nov 8: Shelly, "level 10's footsteps are horrid": Level 10 reads its terrain (wheat, barley, stubble → field; dirt → soil), quieter takes.
# Order matters: the first word that matches wins.
match:
  - [metal, "steel|metal|diamond|grate|iron|aluminum"]
  - [wood, "wood|plank|hardwood|floorboard|deck|parquet"]
  - [terrazzo, "terrazzo"]
  - [checker, "checker|linoleum"]
  - [tile, "tile|vinyl|ceramic|porcelain|marble"]
  - [snow, "snow|ice"]
  - [hotel, "plush|hotel"]
  - [office, "office-carpet|carpet-tile|low-pile"]
  - [carpet, "carpet|rug|canvas|fabric|velvet"]
  - [field, "wheat|barley|stubble|straw|canola|crop"]
  - [soil, "dirt|soil|mud|farm-track|ruts"]
  - [rock, "rock|basalt|cliff|boulder"]
  - [gravel, "gravel|sand|rubble"]
  - [grass, "grass|lawn|moss|turf"]
  - [asphalt, "asphalt|road|street|tarmac"]
  - [concrete, "concrete|sidewalk|stone|brick|plaster|cement|pavement|curb"]
# stride in metres: a step lands every stride walked, so a faster walk steps faster on its own
stride: { crouch: 0.55, walk: 0.78, run: 1.25 }
runSpeed: 4.2        # m/s past which the run take plays
loud: { crouch: 0.18, walkMin: 0.45, runMax: 0.8, heavyMax: 0.35 }   # Nov 8: Shelly, "make footsteps quiet": everything about 40% down   # heavyMax: extra loudness at full burden
pitch: { jitter: 0.05, foot: 0.025, heavy: -0.08 }
side: 0.13           # each foot sounds this far left or right of centre
scuffAfter: 0.25     # a stop after this much walking ends on a scuff
land: { min: 3.2, hard: 8 }   # fall speed (m/s) for a landing sound, and for the loudest one
hearRange: 18        # other players hear your steps this far, walls muffle them
