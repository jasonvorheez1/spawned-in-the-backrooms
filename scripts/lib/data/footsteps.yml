# Footsteps (Nov 8, Shelly: "improve footstep technology + make it more dynamic"). Every number is Savi's pick.
# The floor is read under your feet (a short ray down): the object's state.floor, else its texture's words, else the level's default.
# Order matters: the first word that matches wins.
match:
  - [metal, "steel|metal|diamond|grate|iron|aluminum"]
  - [wood, "wood|plank|hardwood|floorboard|deck|parquet"]
  - [terrazzo, "terrazzo"]
  - [checker, "checker|linoleum"]
  - [tile, "tile|vinyl|ceramic|porcelain|marble"]
  - [hotel, "plush|hotel"]
  - [office, "office-carpet|carpet-tile|low-pile"]
  - [carpet, "carpet|rug|canvas|fabric|velvet"]
  - [gravel, "gravel|dirt|soil|sand|rubble|mud"]
  - [grass, "grass|lawn|moss|turf"]
  - [asphalt, "asphalt|road|street|tarmac"]
  - [concrete, "concrete|sidewalk|stone|brick|plaster|cement|pavement|curb"]
# stride in metres: a step lands every stride walked, so a faster walk steps faster on its own
stride: { crouch: 0.55, walk: 0.78, run: 1.25 }
runSpeed: 4.2        # m/s past which the run take plays
loud: { crouch: 0.3, walkMin: 0.75, runMax: 1.5, heavyMax: 0.45 }   # heavyMax: extra loudness at full burden
pitch: { jitter: 0.05, foot: 0.025, heavy: -0.08 }
side: 0.13           # each foot sounds this far left or right of centre
scuffAfter: 0.25     # a stop after this much walking ends on a scuff
land: { min: 3.2, hard: 8 }   # fall speed (m/s) for a landing sound, and for the loudest one
hearRange: 26        # other players hear your steps this far, walls muffle them
surfaces:
  carpet:   { walk: footstep-damp-carpet-squelch-soft, run: footstep-damp-carpet-run, v: 0.2, land: landing-soft }
  hotel:    { walk: footstep-shoe-on-thick-plush-hotel-hallway-carpet-single-step, run: footstep-shoe-running-on-thick-hotel-carpet-single-step, v: 0.2, land: landing-soft }
  office:   { walk: footstep-shoe-on-low-pile-office-carpet-tile-single-step, run: footstep-shoe-running-on-low-pile-office-carpet-single-step, v: 0.2, land: landing-soft }
  concrete: { walk: footstep-boot-heel-on-bare-concrete-floor-single-step, run: footstep-boot-running-on-bare-concrete-floor-single-step, v: 0.22, land: landing-hard }
  asphalt:  { walk: footstep-sneaker-on-gritty-city-asphalt-sidewalk-single-step, run: footstep-sneaker-running-on-gritty-city-asphalt-single-step, v: 0.22, land: landing-hard }
  tile:     { walk: footstep-sneaker-on-vinyl-school-floor-tile-single-step, run: footstep-sneaker-running-on-vinyl-floor-tile-single-step, v: 0.22, land: landing-hard }
  terrazzo: { walk: footstep-sneaker-on-polished-mall-terrazzo-floor-squeak-single-step, run: footstep-sneaker-running-on-polished-mall-floor-single-step, v: 0.24, land: landing-hard }
  checker:  { walk: footstep-boot-on-worn-checkered-linoleum-locker-room-single-step, run: footstep-boot-running-on-worn-linoleum-tile-single-step, v: 0.23, land: landing-hard }
  gravel:   { walk: footstep-boot-crunch-on-loose-cave-gravel-single-step, run: footstep-boot-running-on-loose-cave-gravel-single-step, v: 0.26, land: landing-gravel }
  grass:    { walk: footstep-boot-on-short-damp-lawn-grass-single-step, run: footstep-boot-running-on-damp-lawn-grass-single-step, v: 0.2, land: landing-soft }
  wood:     { walk: footstep-boot-on-wet-wooden-floorboards-creak-single-step, run: footstep-boot-running-on-wet-wooden-floorboards-single-step, v: 0.24, land: landing-wood }
  metal:    { walk: footstep-boot-on-steel-diamond-plate-floor-clank-single-step, run: footstep-boot-running-on-steel-diamond-plate-floor-single-step, v: 0.24, land: landing-metal }
  wet:      { walk: footstep-soaked-carpet-deep-squelch, run: footstep-soaked-carpet-deep-squelch, v: 0.4, land: landing-water }
  water:    { walk: footstep-boot-splash-in-shallow-ankle-deep-puddle-single-step, run: footstep-boot-running-splash-through-shallow-puddle-single-step, v: 0.3, land: landing-water }
landings:
  landing-soft:   body-landing-thump-feet-on-thick-carpet-after-jump
  landing-hard:   body-landing-feet-slap-on-concrete-after-jump-with-shoe-scuff
  landing-gravel: body-landing-feet-crunch-into-loose-gravel-after-jump
  landing-wood:   body-landing-feet-thud-on-hollow-wooden-floorboards-after-jump
  landing-metal:  body-landing-boots-clang-on-steel-plate-floor-after-jump
  landing-water:  body-landing-feet-splash-into-shallow-water-after-jump
scuff: shoe-sole-short-scuff-stop-on-floor
