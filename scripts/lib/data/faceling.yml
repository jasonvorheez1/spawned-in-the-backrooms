# Level 6.1 Facelings (Entity 9, "The 11 Effect"): friendly staff who mimic, wave, learn your name, and close ranks when one is hurt.
# scripts/l61-staff.js reads every number here.
hp: 60
every: { social: 0.4, wave: 45, mimic: 7 }   # seconds
reach: { notice: 12, wave: 6, mimic: 4 }   # metres
mimicChance: 0.55        # per thing the player does within reach
crouchHold: 6            # seconds a faceling stays crouched copying you
nickAfter: 3             # visits before it greets you by a name it picked
temper:
  run: 3.4
  reach: 1.4
  hit: 6
  swing: 1.3
hostile: ["NOW YOU'VE DONE IT.", "OUT.", "YOU DON'T TOUCH US."]
defend: ["LEAVE THEM ALONE.", "NOT IN OUR KITCHEN."]
greetNick: ["Hey, {n}!", "{n}! The usual?", "Look who's back. {n}.", "Hi {n}. Hot ones just out."]
nicks:
  cat: ["Whiskers", "Kitty", "Mittens"]
  fox: ["Foxy", "Red", "Sly"]
  wolf: ["Howler", "Pup", "Big Wolf"]
  bear: ["Teddy", "Big Bear", "Honey"]
  bunny: ["Hops", "Bun", "Carrot"]
  dog: ["Buddy", "Pup", "Sport"]
  deer: ["Fawn", "Bambi", "Antlers"]
  sheep: ["Woolly", "Lamb", "Fluff"]
  any: ["Regular", "Sweetie", "Champ", "Sunshine", "Hon"]
