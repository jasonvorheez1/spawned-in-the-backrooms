greet:
  omega: ["base omega. keep your weapon down and you're welcome.", "water's free at the fountains. don't hog it.", "you look like you walked up from three. sit a minute."]
  wanderer: ["oh, hey. you new on four?", "hi. don't go near the window rooms.", "you heard the phones yet? don't answer the break room one.", "nice to see a face that isn't mine."]
  tbd: ["you got anything weird? like, really weird?", "we don't trade for useful. useful is boring.", "keep walking unless you're selling."]
  amor: ["the mold provides.", "walk softly. things are growing.", "you carry something holy? no? then walk on."]
night: ["lights-out hours. i'm going to lie down.", "that's me done. wake me if the lift dings.", "night, everyone. sort of."]
morning: ["morning. if it's morning.", "okay. up. water first.", "slept. kind of."]
phone: ["hello? ...no. wrong office.", "four-oh-nine? no, this is... they hung up.", "hello? hello. ...it's breathing again.", "omega desk. who is this? ...right."]
amorWarn: ["this is a growing room. out.", "the spores don't like your boots. leave.", "step back. you're on the bed."]
amorShove: ["i said out!", "you trample, you pay.", "the mold remembers your face."]
meet:
  - [[A, "you still drinking from the east fountain?"], [B, "it tastes like pennies."], [A, "they all taste like pennies."], [B, "the east one tastes like more pennies."]]
  - [[A, "phone rang in my office last night."], [B, "you answer?"], [A, "it knew my name."], [B, "then don't sleep in there tonight."]]
  - [[A, "quill offered me a doorknob for two bottles."], [B, "a doorknob."], [A, "said it was from level six."], [B, "...did you buy it?"], [A, "i bought it."]]
  - [[A, "how long you been on four?"], [B, "i stopped counting at the vending restock."], [A, "how many restocks?"], [B, "i stopped counting."]]
  - [[A, "somebody took the tape off a window in the west rooms."], [B, "who'd do that."], [A, "nobody i still see around."]]
  - [[A, "the cooler in my office fills itself overnight."], [B, "mine too."], [A, "you ever see who fills it?"], [B, "i don't want to."]]
  - [[A, "omega's hiring runners for five and six."], [B, "you going?"], [A, "with these shoes?"], [B, "fair."]]
  - [[A, "the cult brought me a plate of mold."], [B, "as a gift?"], [A, "as dinner."], [B, "...and?"], [A, "it was okay. don't tell them."]]
