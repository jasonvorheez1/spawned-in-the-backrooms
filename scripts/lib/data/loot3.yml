# Level 3 is the Backrooms' richest level: tables roll more items than anywhere else.
tables:
  crate: { bobbypin: 4, almond: 7, warm_tea: 2, ammo: 6, shells: 3, battery: 6, firstaid: 3, painkillers: 2, splint: 1, bar: 4, beans: 3, tape: 4, kit: 3, weapon: 4, mag: 1.5, cloth: 2, fuse: 2, page: 3, "meat:spam": 2, "meat:rat": 1 }  # page: Savi's pick
