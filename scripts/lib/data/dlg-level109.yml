# Level 109, The Doctors' outpost. Short, human. Nobody knows your name.
l109-halloran:
  hi: "Another walk-in. Sit if you're bleeding, stand if you're not."
  back: ["You again. Still in one piece, good.", "Back. Wipe your feet."]
  warm: "Our favourite stranger. Don't let it go to your head."
  cold: "Clinic's open. That's about all the warmth I have."
  bye: "Keep the doors shut behind you."
  walk: "I'll be here. I'm always here."
  ask:
    - q: "What is this place?"
      a: "A hospital nobody built. Clean halls, unmarked doors, and something behind half of them. We patch people up and keep the lids on."
    - q: "What's behind the stairwell door back toward arrival?"
      a: "Sub-level B3. Old M.E.G. cache they walled off when things started climbing out of the morgue drawers. If you go down there, watch the metal door on your right."
    - q: "Why do I hear knocking on shut doors?"
      a: "Because whatever's inside learned what a patient sounds like. Never open a door that knocks. Everything alive on this floor is already in our wards."
l109-petra:
  hi: "Triage. Where does it hurt and can you pay."
  back: ["Back for more stitches?", "Sit. Arm out."]
  warm: "You. Fine. You get the good tape."
  cold: "Cash first, sympathy never."
  bye: "Don't pick at it."
  walk: "Next."
  ask:
    - q: "Patch me up. (15 backdollars)"
      a: "Hold still. There. Breathe slower, you're scaring the beds."
      fail: "Fifteen. Come back with fifteen."
      do: l109heal
    - q: "Buy a first aid kit. (20 backdollars)"
      a: "One kit. Don't waste it on splinters."
      fail: "You're short. Cage stays locked."
      do: l109buy:firstaid
    - q: "Buy a bandage. (6 backdollars)"
      a: "Bandage. Wrap it tight, not pretty."
      fail: "Six. Not five. Six."
      do: l109buy:bandage
    - q: "Who are you people?"
      a: "The Doctors. Medical group. We stayed when everyone else walked."
l109-doctor:
  hi: "Mind the bed rails, they bite."
  back: ["Rounds. Always rounds.", "You look better than bed three."]
  bye: "Wash your hands."
  walk: "Don't block the aisle."
  ask:
    - q: "How are the patients?"
      a: "Stable. Boring. Boring is my favourite word."
    - q: "What's behind the other doors?"
      a: "Check the whiteboard. If it says do not open, I mean it in capital letters."
    - q: "Any tips for surviving the deep wings?"
      a: "Biohazard suites have green decon purge switches outside the yellow tape; hit them before going deep. Pharmacies still run live pneumatic tubes behind the shutters, too."
l109-guard:
  hi: "M.E.G. Keep moving, keep it calm."
  back: ["Still walking around? Bold.", "Hey. You good?"]
  bye: "Stay out of the red rooms."
  walk: "Move along."
  ask:
    - q: "Why is M.E.G. here?"
      a: "Doctors heal, we watch the doors. Fair trade."
    - q: "Seen anything loose?"
      a: "Down the hall west, a couple hundred metres. Somebody got curious. We heard it from here."
    - q: "How do I deal with wanderers locked inside the wards?"
      a: "If a door's lockpicked open, they come out swinging. Trip a red corridor alarm or throw a wing breaker first if you need them looking the other way."
l109-patient:
  hi: "Mm. Is it morning?"
  bye: "Sleep sounds good."
  ask:
    - q: "How are you feeling?"
      a: "Like a tray table. They said I'll walk tomorrow."
