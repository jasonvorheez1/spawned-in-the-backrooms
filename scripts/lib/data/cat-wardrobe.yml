# Clothes for the NEW Tripo cat bodies only (art/critter-cute/tripo_rig.py). Shelly #211xxx Nov 11: "bring back the clothing but in our agreed way:
# theyre painted in and anything that warrants a new model does get a new model via tripo. Make sure they actually fit" + "dont do the clothing on the
# model currently in right now just the model the wisp is doing". The old critter body and clothes.js CLOTHES_OFF are untouched.
# PAINT: scripts/mat-catskin.js draws a garment into the skin itself from the body's bind-pose position (metres, y up, front +z), so it can never clip.
# MODEL: a Tripo garment skinned to the same rig rides as a child; the skin under it is painted its colour (`under`), so nothing furry pokes through.
# body: measurements of each rest body, mesh metres. top/bot: [low hem, high line]; arm: [shoulder x, elbow x, wrist x]; leg: [crotch y, knee y, ankle y];
# neck: [half width, front depth, back depth] of the collar scoop under `top[1]`; front: the z that splits front from back; tail: a 4-point line + radius fitted (max-distance) to the verts the Tail bones own, from the rigged glb
body:
  f: { top: [0.425, 0.626], arm: [0.095, 0.245, 0.36], leg: [0.36, 0.19, 0.065], waist: 0.435, neck: [0.066, 0.056, 0.034], front: 0.045,
       tail: [[0.014, 0.412, -0.018], [0.053, 0.302, -0.179], [0.169, 0.359, -0.147], [0.385, 0.576, -0.111]], tailR: 0.068 }
  m: { top: [0.435, 0.705], arm: [0.11, 0.27, 0.405], leg: [0.40, 0.21, 0.075], waist: 0.47, neck: [0.074, 0.036, 0.018], front: 0.082,
       tail: [[0.025, 0.433, -0.067], [0.096, 0.379, -0.166], [0.217, 0.434, -0.237], [0.274, 0.555, -0.313]], tailR: 0.048 }
# a painted top: hem 0..1 (0 = the body's low hem, 1 = the collar line), sleeve 0..2 (0 shoulder, 1 elbow, 2 wrist), scoop = collar depth scale, pat = fabric
# a painted bottom: leg 0..2 (0 crotch, 1 knee, 2 ankle), rise = waistband above the body's waist line (m)
tops:
  tee:        { hem: 0.0,  sleeve: 0.42, scoop: 1.0, pat: weave }
  crop:       { hem: 0.27, sleeve: 0.42, scoop: 1.15, pat: stripes, band: true }   # hem 0.27: under the bust, not across it (Shelly #221537). stripes per Shelly's crop ref (#219730): it read washed out as plain cream
  tank:       { hem: 0.0,  sleeve: 0.0,  scoop: 1.35, pat: rib }
  longsleeve: { hem: 0.0,  sleeve: 1.95, scoop: 0.8, pat: weave }
  pajamas:    { hem: 0.0,  sleeve: 1.95, scoop: 0.9, pat: gingham }
  breton:     { hem: 0.0,  sleeve: 1.4,  scoop: 0.7, pat: stripes }
bottoms:
  shorts:  { leg: 0.68, rise: 0.0,  pat: denim }
  briefs:  { leg: 0.12, rise: -0.02, pat: weave }
  pants:   { leg: 1.92, rise: 0.0,  pat: denim }
  pjpants: { leg: 1.92, rise: 0.0,  pat: gingham }
  leggings: { leg: 1.92, rise: 0.01, pat: rib }
feet:
  socks: { top: 0.55 }      # share of the shin, ankle up
# Tripo garments: glb per body (f/m), under = the painted layer hidden beneath it
models:
  hoodie: { under: longsleeve, pat: weave, f: /cdn/value.5b6eb19ef5d7bf62e5dd56c192ff3190df615a5e944168a078b3baafc048a3aa.glb, m: /cdn/value.4df45d98acbabac5094b7c6e13b0875a985d2d0ae7fade74a202d50248a0f85d.glb }
  jacket: { under: longsleeve, pat: weave, f: /cdn/value.8350c434bfd017ef3d8568a07e785da67ca80a4aa772f058591930e9b10df655.glb, m: /cdn/value.8c7576e191ed79ae090fdeb59a22827b62a9ec1ea95a40b12ecc46f6f645640a.glb }   # Nov 11 Taubin-smoothed: the Tripo crumple ironed out, 4 mm off the body; skin and Chest key kept
  skirt:  { under: briefs, pat: weave, f: /cdn/value.b282d6badcb027f5466097b768c9df6bbc0dbd64b8d9e4b13d1be674c5c42a3c.glb, m: /cdn/value.8da93a9c31f245cf12374f56094596155615cf358394c0cda2ac6538b59c8535.glb }
  boots:  { under: socks, pat: weave, f: /cdn/value.3f9b0636806b0ebabcd12d5037ca8aecf54984a63ea3e5b5c979c1f61c9c9983.glb, m: /cdn/value.dcfebd4370d0c0aa932157cae6acd02db2afb18e59cc83e6ef34261ed69176f2.glb }
defaults:
  f: { topw: crop, top: "#e0775a", botw: shorts, bottom: "#4f78ad" }
  m: { topw: tee, top: "#9b9da1", botw: shorts, bottom: "#2f3d5c" }
