  slim: { top: [0.525, 0.705], arm: [0.074, 0.186, 0.29], leg: [0.40, 0.25, 0.062], waist: 0.53, neck: [0.04, 0.02, 0.024], front: 0.0, tail: [[0.0, 0.459, -0.07], [0.01, 0.497, -0.101], [0.042, 0.495, -0.158], [0.178, 0.379, -0.318]], tailR: 0.028, shIn: 0.042, shOut: 0.31 }
