# Level 13 "The Boiling Frogs", Floor 283 (scripts/lib/level13-people.js). Written lines only, per skills/npc-dialogue.md.
# Written to design/story-spine.md: no pre-knowledge assumed; Oona handles orientation & exits at reception, while residents speak from their own lives.
l13p-oona:
  hi: "Welcome to Floor 283! Oona Pell, Free Home Project. You've got the look of an applicant. Everybody who comes up to this desk does."
  back: ["Applicant! Still upright. Lovely.", "Back at the desk. Is it a flat today, or snacks?"]
  warm: "My best applicant. If we had a flat with a window, it'd be yours."
  cold: "The desk is open. Just not for you."
  bye: "Mind the mat. It says welcome and I had it checked."
  walk: "I don't leave the desk. The desk is the whole job."
  ask:
    - q: "Where am I?"
      a: "Floor 283! Flats down both halls, reception right here, me behind it. Past the stairs I couldn't tell you. My map stops at the mat."
      then:
        - q: "And outside the building?"
          a: "I've not seen an outside. I've seen a stairwell. I took a job on this side of it and I've been very happy."
    - q: "How do I get out?"
      a: "Why would you want to? End of the second hall, plain yellowish door, no number. Goes somewhere damp. Nobody I've housed has ever asked for it twice."
    - q: "What's the Free Home Project?"
      a: "A flat. Yours. Free. The fridge fills itself, the TV works, the door locks. My company does one kind thing a year and you're standing in it."
      then:
        - q: "What's the catch?"
          a: "No catch! One form. Short form. People love it here. They love it so much you hardly see them again."
    - q: "Lots of crossed out names on that board."
      a: "That's a filing matter. Can I get you an Almond Water? It's cold. Well. It was."
      then:
        - q: "Where did they go?"
          a: "Home. Doors shut, televisions on. That's what home looks like, applicant. Next question, and I'd like it to be about snacks."
    - q: "Who lives on the first hall?"
      a: "Not ours. They were here before the Project and they won't sign a form out of spite. Two of them have had one chess game going since I got this desk."
    - q: "Any discount for a future resident?"
      sk: barter 35
      do: discount
      a: "Oh, you're good at this. Fine. Applicant rate. Not a word to the first hall."
      fail: "Future residents pay full price. That's how I tell they mean it."
  barks:
    idle: ["Flats going. Flats always going.", "Key for 14. Where did I put 14.", "Free means free, folks."]
    hi: ["Applicant!", "Welcome home. Pending paperwork."]
    drawn: ["Not at reception, thank you."]
    hurt: ["That comes off your deposit!"]
    spot: ["Not in my hall, you don't!"]
    hostile: ["Application denied!"]
    hit: ["Denied!"]
    kill: ["That's a vacancy."]
    flee: ["Desk is closed!"]
    death: ["Somebody take... the keys..."]
  gest: { wave: "Hello, hello!", gift: "For the desk? I'll write it down as a donation.", dance: "On the mat, please. Not past the mat.", nodance: "My shift ends never.", insult: "I've heard worse from people I gave a free flat." }

l13p-gus:
  hi: "Oh. Neighbour. Hi. Have a seat if you... no. Hang on. Somebody said to tell people don't. I forget who."
  back: ["You again. Or it's the first time. Hi.", "Neighbour. Is it still today?"]
  warm: "You keep dropping in. That's nice. Nobody drops in."
  cold: "I'm in the middle of a show."
  bye: "Okay. Get the door on your... leave it. It's fine."
  walk: "Out there? Maybe when this one's over."
  ask:
    - q: "How long have you lived here?"
      a: "Three weeks. Maybe eight. I moved in on a Tuesday. There's been a lot of Tuesdays since."
      then:
        - q: "When were you last in the hall?"
          a: "The hall. Sure. I was out there getting my key off the desk lady. That was on the way in, though. Huh."
    - q: "What are you watching?"
      a: "The one with the family. They've got a dog now. They didn't have a dog. Or it's another family."
    - q: "You feeling alright?"
      a: "I feel great. Heavy. Great and heavy. Like I just had a big lunch, all day. The fridge makes a good lunch."
    - q: "Get up. Take a walk."
      sk: speech 40
      a: "A walk. Yeah. You know, my legs remember walks. Give me a minute. I'll get up at the next ad. Thanks, neighbour. I mean it."
      fail: "I will. After this one. It's nearly done. It's been nearly done for a while."
  barks:
    idle: ["Mm.", "Didn't I see this one.", "Fridge is humming again.", "I ought to get up."]
    hi: ["Oh. Hi.", "Hey, neighbour."]
    drawn: ["That's... could you... okay."]
    hurt: ["Ow. Huh."]
    spot: ["There's something in my flat."]
    hostile: ["Don't make me stand up."]
    hit: ["Sorry about that."]
    kill: ["Oh. Oh no."]
    flee: ["It's too far. It's all too far."]
    death: ["Leave the TV on..."]
  gest: { wave: "Hey.", gift: "For me? Put it over by the... wherever.", dance: "Look at you go.", nodance: "Next ad break.", insult: "Yeah, probably." }

l13p-noor:
  hi: "Don't sit. I mean it, walker. Not the sofa, not the bed, not the edge of the tub. I'm gone from here tonight."
  back: ["Still on your feet? Good. Keep it up.", "Walker. Tell me you haven't taken a key."]
  warm: "You're the only one on this floor who walks like there's somewhere to get to."
  cold: "I'm packing. Go stand somewhere else."
  bye: "Stay on your feet."
  walk: "I'm leaving tonight. One person moves faster than two."
  ask:
    - q: "Why can't I sit down?"
      a: "Because it's comfortable. Stay in one flat and you slow down. Then you stop going out. Then your door's shut and your TV's on and that's all anyone knows about you."
      then:
        - q: "How do I shake it off?"
          a: "Walk out the door. That's all. The hall clears your head in a minute. The hard part is wanting to, and the flat is very good at that."
    - q: "The fridges really refill?"
      a: "Every time you step out and come back. Take the food, I would. Eat it standing up, somewhere that isn't here."
    - q: "What's the banging in the flats?"
      a: "Tenants. People who stayed too long. They throw things. Plates, lamps, a toaster once. Only from inside their own rooms, though. Don't hang around in their doorways."
    - q: "And the dark flat?"
      a: "First hall, lights off, door open. Something stands in there. Look at it when you go by. Walk past with your head turned and you'll hear it step out after you."
    - q: "Where will you go?"
      a: "Through the plain door at the end of the second hall. Damp carpet, yellow walls, nothing to sit on. Never thought I'd miss a place like that."
  barks:
    idle: ["Socks. Where are my socks.", "Not sitting. Not sitting.", "One bag in, one bag out."]
    hi: ["Standing. Good.", "Walker."]
    drawn: ["Save that for the Tenants."]
    hurt: ["Not tonight, no!"]
    spot: ["It's left its room!"]
    hostile: ["I'm leaving. You don't get a say."]
    hit: ["Out of my way!"]
    kill: ["Should've stayed inside."]
    flee: ["The hall! Get in the hall!"]
    death: ["I was so close..."]
  gest: { wave: "Yeah. Hi.", gift: "I'm trying to carry less. Thanks, though.", dance: "Fine. Dancing isn't sitting.", nodance: "I've got a bag to pack.", insult: "Say it on your feet, at least." }

l13p-hale:
  hi: "Shh. I'm thinking. Been thinking since spring, kid, and she's breathed on me the whole time."
  back: ["Kid. Still my move.", "You're back. So's the headache."]
  warm: "Find a wall and watch, kid. A wall. Not a chair."
  cold: "You're standing in my light."
  bye: "Hands off the board on your way out."
  walk: "And leave her alone with it? She cheats."
  ask:
    - q: "How long's this game been going?"
      a: "A year. About. I'm winning."
      then:
        - q: "Who's really winning?"
          a: "I'm a knight up. She says the knight hit the floor in June so it's off. It's not off."
    - q: "You're not with the desk?"
      a: "We were here before the desk, the mat and the smile. Nobody handed us a flat. We just never signed. A man thinks clearer when he doesn't owe."
    - q: "Why haven't you gone slow?"
      a: "Because once an hour she says something so dumb I have to get up and walk the hall. Turns out you can't nod off angry."
    - q: "Ever tried leaving this floor?"
      a: "We walked down to that dull yellow door at the end of the hall once. Puts you right back in wet rooms. We came back. The chess is here."
  barks:
    idle: ["Hmm.", "Bishop. No.", "Don't rush me.", "It's not off."]
    hi: ["Shh.", "Kid."]
    drawn: ["Not by the board."]
    hurt: ["I nearly had the move!"]
    spot: ["Dot. The door."]
    hostile: ["You tipped a pawn. That does it."]
    hit: ["Check."]
    kill: ["Mate."]
    flee: ["Get the board!"]
    death: ["It's still... my move..."]
  gest: { wave: "Mm.", gift: "If that's a chess clock, she'll break it.", dance: "You're shaking the table.", nodance: "Thinking.", insult: "Dot does better before breakfast." }

l13p-dot:
  hi: "Oh, thank heavens, sunshine, a witness. Tell him it's been his move nine days."
  back: ["Sunshine! He still hasn't gone.", "You're back. So is his dithering."]
  warm: "You I like. You get his chair the day he gives up."
  cold: "Shoo. I'm busy waiting."
  bye: "Off you go. I'll be here. He'll be thinking."
  walk: "The minute I'm gone he nudges a rook. No."
  ask:
    - q: "Nine days for one move?"
      a: "His record's twenty. I knitted a scarf. This is the scarf."
      then:
        - q: "Why not start a new game?"
          a: "Because I'm winning this one. A new one, who can say. I'm old, I'm not reckless."
    - q: "He says he's a knight up."
      a: "That knight went under the fridge in June. The fridge puts back everything in this flat but his knight. I call that a ruling."
    - q: "Is it true about people who stay in?"
      a: "True as carpet. We had a neighbour, Bea, lovely girl. Stopped coming for tea. Now there's banging in her flat and I don't knock. Keep moving, sunshine. Pick a fight with someone. It helps."
    - q: "Do you miss home?"
      a: "I miss a real street and a bakery down the corner. Out here, at least someone lets me play black without tipping the table."
  barks:
    idle: ["Any day now.", "Your move, Hale.", "Tick tock.", "Under the fridge, it went."]
    hi: ["Sunshine!", "A witness!"]
    drawn: ["Point it at him. He might move."]
    hurt: ["Mind my scarf!"]
    spot: ["Hale! The door!"]
    hostile: ["Nine days I've waited to hit something."]
    hit: ["Your move!"]
    kill: ["I'll take that one."]
    flee: ["The board first, then us!"]
    death: ["Don't let him... touch my queen..."]
  gest: { wave: "Hello, sunshine.", gift: "Is it a knight? He's short one.", dance: "At last, something in here moves.", nodance: "I'm in a game, dear.", insult: "That's nothing. Try a year across from him." }
