# Spamton's dumpster battle. Every number is Savi's pick: "a bit difficult" = about 3 clean hits a fight lose you a third of the soul.
soulHp: 100
hit: 11          # one bullet
maxHit: 18       # the client can't claim more per hit
iframes: 0.9     # seconds the SOUL blinks after a hit
attackSeconds: 9
introSeconds: 2.6
lateFromStep: 3   # the last half of the deal he throws his nastier attacks (there is no NEO form: Shelly's call)
losePenaltyHp: 20
soulSpeed: 150   # px/s inside a 220 px box
attacks:
  base: [words, minitons, vacuum, strings]
  late: [heads, heart, pipis, rain, strings, words]
warnSeconds: 0.9   # every attack warns first: the box flashes and nothing flies yet
grazeTp: 4         # TP per bullet grazed (passed close without a hit)
healCost: 50       # TP spent at the deal to get healHp back
healHp: 20
taunts: ["KEEP DANCING!!", "[[SALE]] ENDS SOON!", "HEH HEH HEH!!", "CAN'T [[AFFORD]] ME?", "LOOK AT YOU GO!", "[[FREE]] SAMPLES!!", "DON'T BLINK!", "ONE [[PAYMENT]] AT A TIME!"]
hitTaunts: ["OUCH! THAT'S [[EXTRA]]!", "HAHA!! NO [[REFUNDS]]!", "SO CLOSE!!", "THAT'S GONNA [[LEAVE A MARK]]!", "WATCH THE [[FINE PRINT]]!", "[[SOLD]]!!"]
grazeTaunts: ["HEY!! STOP [[SHOPPING AROUND]]!", "STAY STILL, [[WINDOW SHOPPER]]!", "TOO CLOSE FOR [[COMFORT]]!!"]
# the talk before the fight (Shelly: "i wanted to talk to spamton first"): any reply moves him on; the last line starts the battle
chat:
  - { line: "LOOK AT YOU!! A REAL [[Paying Customer]]!! NOBODY COMES DOWN THIS ALLEY ANYMORE. NOT SINCE THE [[Big Shot]] DAYS.", replies: ["WHO ARE YOU?", "WHY ARE YOU IN A DUMPSTER?"] }
  - { line: "ME?? I'M [[Spamton G. Spamton]]! THE G STANDS FOR [[Great Deals]]! I USED TO HAVE A [[Mansion]]. NOW I HAVE A [[Lid]].", replies: ["WHAT HAPPENED?", "NICE LID."] }
  - { line: "I WAS A [[Little Sponge]] ONCE. LIKE YOU. THEN I GOT [[Connected]]. NOW EVERY HALLWAY IN THIS CITY IS MY [[Showroom]].", replies: ["WHAT ARE YOU SELLING?", "THAT SOUNDS SAD."] }
  - { line: "SAD?? SAD!! I'M SELLING THE BEST DEAL OF YOUR [[Life]]: ME!! BUT YOU GOTTA [[Earn It]], KID. LET'S SEE IF YOU CAN [[Keep Up]]!!", replies: ["BRING IT.", "WAIT, WHAT?"] }
intro: "HEY      HEY HEY!! IT'S ME, [[Number 1 Rated Salesman1997]]!! WHAT'S A [[Little Sponge]] DOING DOWN HERE IN MY [[Penthouse Suite]]?"
winLine: "HOCHI MAMA!! YOU GOT YOURSELF A [[Pocket Pal]], KID! FITS ANYWHERE! WEIGHS [[0 KG]]! NO REFUNDS!!!"
loseLine: "TOO BAD!! TOO SAD!! CALL [[1-800-ROOM-0]] WHEN YOU'RE READY TO BE A [[Real Customer]]."
deal:
  - { yes: "TELL ME MORE", no: "WALK AWAY", line: "YOU LOOK LIKE A KID WHO WANTS TO BE A [[BIG SHOT]]. AM I RIGHT? I'M ALWAYS RIGHT.", ok: "THAT'S MY [[Valued Customer]]! LEAN IN! CLOSER! NOT THAT CLOSE.", bad: "WALK AWAY?? FROM [[Hyperlink Blocked]]??? NOBODY WALKS AWAY FROM SPAMTON!!" }
  - { yes: "DON'T GIVE", no: "GIVE MONEY", line: "BUT FIRST I NEED A [[Small Processing Fee]]. JUST WHAT'S IN YOUR [[Wallet]]. AND YOUR SHOES.", ok: "HEH HEH... YOU'RE NO [[Sucker]], ARE YOU. I LIKE THAT. I HATE THAT.", bad: "THANK YOU FOR YOUR [[Generous Donation]]!! NOW HOLD STILL!!" }
  - { yes: "TAKE DEAL", no: "HANG UP", line: "FINE! FINE!! [[Zero Down]]! [[Zero Interest]]! ZERO [[Questions Asked]]! JUST TAKE THE DEAL!", ok: "DEAL!!! WAIT. DID I JUST [[Lose Money]]? I NEVER [[Lose Money]].", bad: "HANGING UP?? ON ME??? THE LINE'S STILL [[Open]], KID!!" }
  - { yes: "DON'T BUY", no: "BUY", line: "LIMITED TIME [[Upgrade Package]]! A [[Gold Plated]] ME! ONLY $$49.998 A MONTH!", ok: "NO?? NO [[Gold Plated]]??? YOU'RE KILLING ME HERE!! I'M ALREADY [[Dead Inside]]!!", bad: "[[SOLD]]!!! ALL SALES FINAL!! THAT'S WHAT THE FINAL MEANS!!" }
  - { yes: "REFUSE", no: "ACCEPT", line: "JUST SIGN THE [[Terms And Conditions]]. IT SAYS YOU OWE ME [[Everything]] [[Forever]]. STANDARD STUFF.", ok: "OKAY!! NO [[Fine Print]]! YOU DRIVE A HARD [[Bargain]], KID!!", bad: "HAHAHA!! SHOULDA READ THE [[Fine Print]]!! IT'S VERY [[Fine]]!!" }
  - { yes: "YES DEAL", no: "NO DEAL", repeat: true, line: "LAST OFFER!! ME. IN YOUR POCKET. FOR [[Free]]. WHAT DO YOU SAY, KID? [[DEAL]]?", ok: "", bad: "THAT'S NOT WHAT I HEARD!! I'LL ASK AGAIN!! [[DEAL]]???" }
# THE ARENA (Shelly 11-08: "talk to me, then a battle in another worldspace in real time, not undertale combat";
# "spamton fights with money and occasionally talks to me, i can spare him after a few times"). Every number is Savi's pick.
arena:
  hp: 2400            # a level-15 pistol (~45 a shot) needs ~55 hits; spare comes first if you listen
  scale: 2.2          # his standing model is 1.3 m, so ~2.9 m tall
  orbit: 9            # metres from the centre he circles at
  talkEvery: 3        # attacks between talks
  talkSeconds: 9
  spareAfter: 3       # talks heard before SPARE unlocks
  billDmg: 9
  coinDmg: 16
  vacuumDmg: 7        # per half second inside his mouth's reach
  shotDmg: 12
  iframes: 0.35
  attacks: [bills, rain, bills, vacuum, bigshot, rain, bills, bigshot]
  killCash: 49.99     # kill him instead of sparing: his last [[Payment]], no pocket pal
  talks:
    - "HEY!! TIME OUT!! [[Commercial Break]]!! YOU HIT LIKE A [[Premium Subscriber]]."
    - "YOU KNOW I WAS A [[Big Shot]] ONCE? HAD A [[Mansion]]. HAD [[Friends]]. HAD A [[Phone Line]] THAT RANG."
    - "WHY ARE YOU STILL [[Listening]]?? NOBODY [[Listens]]. EVERYONE JUST [[Clicks Away]]."
    - "...KID. I'M [[Tired]]. MAYBE THE BEST [[Deal]] IS NO DEAL. YOUR CALL, [[Valued Customer]]."
    - "STILL HERE?? HEH. HEH HEH. YOU'RE A [[Real Customer]], AREN'T YOU."
  interrupt: ["HEY!! NO [[Interrupting]] THE [[Pitch]]!!", "RUDE!! THAT'S A [[Late Fee]]!!", "FINE!! BACK TO [[Business]]!!"]
  spareLine: "...A [[Pocket Pal]]? FOR ME?? HOCHI MAMA. NO REFUNDS, KID. NO [[Take Backs]]."
  killLine: "GUESS I... WASN'T WORTH THE [[Price]]... HERE'S YOUR... [[Change]]..."
  winLine: "TOO BAD!! TOO SAD!! COME BACK WHEN YOU'RE A [[Big Shot]]!!"
  throwTaunts: ["[[CASH]] BACK!!", "KEEP THE [[CHANGE]]!", "FREE [[MONEY]]!!", "CATCH, [[BIG SPENDER]]!", "[[$$$]]!!"]
