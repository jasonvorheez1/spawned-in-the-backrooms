# Level 13 "The Boiling Frogs": every tuned number of its creatures (scripts/l13-foes.js, scripts/lib/level13-foes.js).
foes:
  v: 1                  # Savi's pick: bump to re-lay every l13e- object
  respawnMs: 300000     # Savi's pick: 5 minutes after death
  respawnClear: 20      # Savi's pick: no player within this many metres
  corpseMinMs: 60000    # Savi's pick: an emptied body stays at least this long
  tenant:
    flats: [a3, a8]     # Savi's pick
    hp: 40              # Savi's pick
    height: 1.72        # Savi's pick
    kitchenDx: 2.6      # Savi's pick: where it stands, metres from the room's middle along the hall
    hallRange: 9        # Savi's pick: hall sight through its doorway
    windMs: 700         # Savi's pick: arm back before the throw
    everyMs: 2200       # Savi's pick: one throw per
    speed: 14           # Savi's pick: m/s off the hand
    gravity: 9.8        # Savi's pick
    dmg: 8              # Savi's pick
    throws: 6           # Savi's pick: then it restocks
    restockMs: 4000     # Savi's pick: the opening
    walk: 0.9           # Savi's pick: shuffle m/s
    doorIn: 1.0         # Savi's pick: how far inside its doorway it stops
    forgetMs: 7000      # Savi's pick: waits at the doorway this long, then back to the TV
    shoveRange: 1.5     # Savi's pick
    shoveDmg: 4         # Savi's pick
    shoveMs: 1500       # Savi's pick
    shoveKnock: 520     # Savi's pick: impulse
    stunMs: 300         # Savi's pick
  lurker:
    flat: a5            # Savi's pick
    hp: 60              # Savi's pick
    height: 2.05        # Savi's pick: standing; it moves crouched
    trigger: 2.5        # Savi's pick: metres from the doorway
    lookDeg: 35         # Savi's pick: looking further off than this = not watching (70 counted a side glance as watching)
    tellMs: 500         # Savi's pick
    lungeMs: 300        # Savi's pick: out to the victim
    dragMs: 1600        # Savi's pick: the whole grab, lunge included
    lockMaxMs: 1800     # Savi's pick: the victim's lock expires on its own by then (hard cap 3000)
    grabDmg: 6          # Savi's pick
    grabSanity: 8       # Savi's pick
    bathMs: 8000        # Savi's pick: hides in the bathroom after a drag
    coolMs: 4000        # Savi's pick: after a hiss or a cancelled grab
    speed: 2.3          # Savi's pick: m/s in the flat
    swipeRange: 1.7     # Savi's pick
    swipeDmg: 10        # Savi's pick
    swipeMs: 1500       # Savi's pick
    swipeWindMs: 450    # Savi's pick
    lampOn: 0.35        # Savi's pick: a5's lamp as the shell lays it
# ---- furnishing
fridgeRestockS: 120        # a fridge emptied by hand is full again this many seconds later (Savi's pick)
fridgeItems: [2, 4]        # how many things a stocked fridge holds
# item tokens (scripts/lib/items.js, snacks.yml) and their weights
fridgeLoot: { almond: 30, stillwater: 8, coke: 6, pepsi: 5, sprite: 4, drpepper: 4, snapple: 4, cherrycoke: 3, millerlite: 4, budweiser: 3, beans: 8, bread: 5, pizza: 5, lobby_wafer: 5, "meat:chicken": 4, "meat:spam": 5, "meat:sardines": 4 }
tv: { light: 0.7, lightDistance: 4, gain: 0.12, maxDistance: 6, screen: [0.36, 0.28], screenAt: [0.04, 0.6, -0.325] }  # screenAt: x right of centre, y up, z out of the front
tvLines:
  empty: "Nobody lives here. The set is warm anyway, and the fridge is full."
  tenant: "A game show with no contestants. Somebody left this on for company."
  lurk: "Only snow. Something behind you is breathing in time with the hiss."
  resident: "An old sitcom, the laugh track a little too slow. It would be easy to sit down."
  chess: "A weather report for a town that is not on any map. Clear skies, forever."
  bntg: "A B.N.T.G. notice card: free homes, hot water, friendly neighbours. Stay as long as you like."
