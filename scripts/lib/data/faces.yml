# FACE TYPE is the shape of the head itself: the heads carry structure keys (art/critter-cute/build.py FT_*: Round Long Broad Narrow Heart Square Snub Snout Chubby), and a type is a blend of
# them, so a round face, a long face and a heart face are different heads, whatever they are feeling. A TRAIT (below) is only a resting mood.
# Face variety: a trait is a resting face on top of any expression (shape-key weights added to the head's Blink Happy Sad Angry Wide Half Smile Open Frown O Blep Blush), so
# two critters of one species no longer read alike. NPCs roll a trait, eye colour, cheek colour and nose from their own id (scripts/lib/clothes.js npcLook);
# the critter creator's face tab offers the same lists (critter.yml: trait, eye, blush, nose).
traits:
  placid:   { w: 2.5, Smile: 0.15 }
  warm:     { w: 3, Happy: 0.22, Smile: 0.28 }
  gentle:   { w: 2.5, Smile: 0.22, Happy: 0.14 }
  bubbly:   { w: 2.5, Smile: 0.32, Wide: 0.15 }
  curious:  { w: 2, Wide: 0.22, Smile: 0.2 }
  cheerful: { w: 2.5, Happy: 0.26, Smile: 0.3 }
  perky:    { w: 2, Wide: 0.18, Smile: 0.24, Happy: 0.12 }
  wideeyed: { w: 2, Wide: 0.25, Smile: 0.14 }
  dreamy:   { w: 2, Happy: 0.18, Half: 0.14 }
  cheeky:   { w: 2, Smile: 0.28, Blep: 0.12 }
  soft:     { w: 2.5, Smile: 0.22, Happy: 0.14 }
  shy:      { w: 1.5, Half: 0.12, Smile: 0.18 }
  sly:      { w: 1, Half: 0.2, Smile: 0.22 }
  smug:     { w: 1, Half: 0.25, Smile: 0.25 }
  pouty:    { w: 0.8, Frown: 0.15, O: 0.1 }
  sleepy:   { w: 0.8, Half: 0.25, Smile: 0.1 }
  goofy:    { w: 1, Blep: 0.28, Wide: 0.12, Smile: 0.14 }
  wry:      { w: 0.8, Smile: 0.16, Half: 0.15 }
  focused:  { w: 0.8, Wide: 0.12, Smile: 0.08 }
  stern:    { w: 0.6, Angry: 0.12, Half: 0.08 }
  anxious:  { w: 0.6, Sad: 0.12, Wide: 0.1 }
  grumpy:   { w: 0.5, Frown: 0.18, Half: 0.1 }
  tired:    { w: 0.5, Half: 0.22 }
  weary:    { w: 0.5, Half: 0.18, Sad: 0.1 }
  haughty:  { w: 0.5, Half: 0.2, Frown: 0.1 }
  wary:     { w: 0.5, Half: 0.15, Wide: 0.05 }
  startled: { w: 0.5, Wide: 0.25, O: 0.12 }
