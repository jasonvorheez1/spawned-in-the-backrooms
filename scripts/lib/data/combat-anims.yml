    up: { clip: cdn/clip-pistol-w1-stand-aim-point-u90-4a1608e0-loop.glb, mask: upper, loop: true }
    down: { clip: cdn/clip-pistol-w1-stand-aim-point-d90-b10ae0fd-loop.glb, mask: upper, loop: true }
    upCrouch: { clip: cdn/clip-pistol-w1-crouch-aim-point-u90-1e5b624c-loop.glb, mask: upper, loop: true }
    downCrouch: { clip: cdn/clip-pistol-w1-crouch-aim-point-d90-dedccff2-loop.glb, mask: upper, loop: true }
    fire: { clip: cdn/clip-pistol-w1-stand-fire-single-40b6bdfc-loop.glb, weight: 6, mask: upper, blendIn: 0.03, blendOut: 0.2, speed: 1.6, cut: 0.45, recoil: 6 }
