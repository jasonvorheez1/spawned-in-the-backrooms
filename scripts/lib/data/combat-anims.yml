  long: # no rifle takes in the packs: the pistol stance squares the torso, IK puts the stock at the shoulder and the left hand on the foregrip
    ready: { clip: cdn/clip-pistol-w1-stand-relaxed-idle-ipc-5cbecb9f.glb, weight: 2, mask: upper, blendIn: 0.25, blendOut: 0.3, loop: true, grip: true }
