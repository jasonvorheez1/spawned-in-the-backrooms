    flourish: { clip: cdn/clip-gunplay-584dc731.glb, weight: 5, mask: upper, blendIn: 0.15, blendOut: 0.35 }
  long: # Shelly's Commando KF rifle pack (art/rifle-clips/retarget3.py): ready is the low carry, aim the iron-sight hold, up/down blend the look pitch; the legs keep the gait under the upper mask
    readyPitch: 0 # Nov 15 revamp: the ready is its own carry take now (ash rifle idle: stock in, muzzle low across the body), no dipped aim
    ready: { clip: cdn/clip-ash-rifle-idle-17015494-loop.glb, weight: 4, mask: upper, blendIn: 0.25, blendOut: 0.3, loop: true }
    # Nov 15: the ash aim-idle take held the rifle muzzle-up beside the head on our rigs, so the iron-sight take stays; body3 holds the head level over it so a snout clears the stock
    aim: { clip: /cdn/clip-rifle-2hraimis-c6be86ad.glb, weight: 4, mask: upper, blendIn: 0.15, blendOut: 0.3, loop: true }
