    upCrouch: { clip: cdn/clip-pistol-w1-crouch-aim-point-u90-1e5b624c-loop.glb, mask: upper, loop: true }
    downCrouch: { clip: cdn/clip-pistol-w1-crouch-aim-point-d90-dedccff2-loop.glb, mask: upper, loop: true }
    fire: { clip: cdn/clip-pistol-w1-stand-fire-single-40b6bdfc-loop.glb, weight: 6, mask: upper, blendIn: 0.03, blendOut: 0.25, speed: 1.2, cut: 0.6, recoil: 11 }
    fireCrouch: { clip: cdn/clip-pistol-w1-crouch-fire-single-f21022b9-loop.glb, weight: 6, mask: upper, blendIn: 0.03, blendOut: 0.25, speed: 1.2, cut: 0.6, recoil: 11 }
