# Third-person combat clips for every human (and furry) body: players seen from outside and NPCs (scripts/lib/body3.js reads this).
# Sources are Shelly's packs: pistol-w1 (aim/fire), UAL2 (sword combos, hook, block, knockback, throw), Gunplay (handling/reload).
# Row keys: clip, weight (beats the gait's 1 per bone), mask (upper = from Spine, legs keep the gait; full = whole body),
#   blendIn/blendOut (s), speed, hit (clip seconds where the blow lands), lead (s from the click to the blow), cut (s: channel released early).
lead: 0.12
families:
  pistol: [pistol, revolver, magnum, flare_gun, laser_pistol]
  long: [shotgun, rifle, smg, hunting_rifle, carbine, sawed_off, lever_action, assault_rifle, laser_rifle]
  fists: [fists]
  club: [table_leg, pipe_scrap, crowbar, bat, rebar, wrench, stun_baton, golf_club, tire_iron, baton]
  slash: [lineman_machete, machete, katana, sword]
  stab: [knife, screwdriver, shiv, switchblade]
  chop: [hatchet, cleaver]
  heavy: [fire_axe, sledgehammer, pickaxe]
common:
  hit: { clip: cdn/clip-hit-react.glb, weight: 3, mask: upper, blendIn: 0.05, blendOut: 0.3, cut: 0.8 }
  knockdown: { clip: cdn/clip-ual-hit-knockback-a79b859a.glb, weight: 6, mask: full, blendIn: 0.05, blendOut: 0.2, clamp: true }
  getup: { clip: cdn/clip-ual-laytoidle-3a7ed6c0.glb, weight: 6, mask: full, blendIn: 0.15, blendOut: 0.35 }
  throw: { clip: cdn/clip-ual-overhandthrow-ada55cac.glb, weight: 5, mask: upper, blendIn: 0.08, blendOut: 0.3, hit: 0.55 }
  block: { clip: cdn/clip-ual-sword-block-f2918589-loop.glb, weight: 5, mask: upper, blendIn: 0.12, blendOut: 0.25, loop: true }
gun:
  pistol:
    readyPitch: -42 # low ready: the aim hold dipped 42 deg (Shelly Nov 9: third-person holds looked off); the old relaxed clip held it sideways at the belly
    ready: { clip: cdn/clip-pistol-w1-stand-aim-idle-ipc-1e51f0f0.glb, weight: 2.5, mask: upper, blendIn: 0.25, blendOut: 0.3, loop: true }
    aim: { clip: cdn/clip-pistol-w1-stand-aim-idle-ipc-1e51f0f0.glb, weight: 4, mask: upper, blendIn: 0.15, blendOut: 0.3, loop: true }
    aimWalk: { clip: cdn/clip-pistol-w1-walk-aim-f-loop-ipc-c02edbce-loop.glb, weight: 4, mask: upper, blendIn: 0.2, blendOut: 0.3, loop: true }
    aimJog: { clip: cdn/clip-pistol-w1-jog-aim-f-loop-ipc-66839d46-loop.glb, weight: 4, mask: upper, blendIn: 0.2, blendOut: 0.3, loop: true }
    aimCrouch: { clip: cdn/clip-pistol-w1-crouch-aim-idle-ipc-829f36eb.glb, weight: 4, mask: upper, blendIn: 0.2, blendOut: 0.3, loop: true }
    aimCrouchWalk: { clip: cdn/clip-pistol-w1-crouchwalk-aim-f-loop-ipc-5b4132eb-loop.glb, weight: 4, mask: upper, blendIn: 0.2, blendOut: 0.3, loop: true }
    up: { clip: cdn/clip-pistol-w1-stand-aim-point-u90-4a1608e0-loop.glb, mask: upper, loop: true }
    down: { clip: cdn/clip-pistol-w1-stand-aim-point-d90-b10ae0fd-loop.glb, mask: upper, loop: true }
    upCrouch: { clip: cdn/clip-pistol-w1-crouch-aim-point-u90-1e5b624c-loop.glb, mask: upper, loop: true }
    downCrouch: { clip: cdn/clip-pistol-w1-crouch-aim-point-d90-dedccff2-loop.glb, mask: upper, loop: true }
    fire: { clip: cdn/clip-pistol-w1-stand-fire-single-40b6bdfc-loop.glb, weight: 6, mask: upper, blendIn: 0.03, blendOut: 0.2, speed: 1.6, cut: 0.45, recoil: 6 }
    fireCrouch: { clip: cdn/clip-pistol-w1-crouch-fire-single-f21022b9-loop.glb, weight: 6, mask: upper, blendIn: 0.03, blendOut: 0.2, speed: 1.6, cut: 0.45, recoil: 6 }
    reload: { clip: cdn/clip-gunplay-584dc731.glb, weight: 5, mask: upper, blendIn: 0.15, blendOut: 0.3, time: 0.9, speed: 1.2, cut: 1.3 }
    flourish: { clip: cdn/clip-gunplay-584dc731.glb, weight: 5, mask: upper, blendIn: 0.15, blendOut: 0.35 }
  long: # Shelly's Commando KF rifle pack (art/rifle-clips/retarget3.py): ready is the low carry, aim the iron-sight hold, up/down blend the look pitch; the legs keep the gait under the upper mask
    readyPitch: -40 # low ready, shouldered and muzzle down; the old carry clip hung the gun vertical along the body
    ready: { clip: /cdn/clip-rifle-2hraimis-c6be86ad.glb, weight: 2, mask: upper, blendIn: 0.25, blendOut: 0.3, loop: true }
    aim: { clip: /cdn/clip-rifle-2hraimis-c6be86ad.glb, weight: 4, mask: upper, blendIn: 0.15, blendOut: 0.3, loop: true }
    aimWalk: { clip: /cdn/clip-rifle-2hraimis-c6be86ad.glb, weight: 4, mask: upper, blendIn: 0.2, blendOut: 0.3, loop: true }
    aimJog: { clip: /cdn/clip-rifle-2hraimis-c6be86ad.glb, weight: 4, mask: upper, blendIn: 0.2, blendOut: 0.3, loop: true }
    aimCrouch: { clip: /cdn/clip-rifle-2hraimis-c6be86ad.glb, weight: 4, mask: upper, blendIn: 0.2, blendOut: 0.3, loop: true }
    aimCrouchWalk: { clip: /cdn/clip-rifle-2hraimis-c6be86ad.glb, weight: 4, mask: upper, blendIn: 0.2, blendOut: 0.3, loop: true }
    up: { clip: /cdn/clip-rifle-2hraimisup-48ec984a.glb, mask: upper, loop: true }
    down: { clip: /cdn/clip-rifle-2hraimisdown-b98450f8.glb, mask: upper, loop: true }
    upCrouch: { clip: /cdn/clip-rifle-2hraimisup-48ec984a.glb, mask: upper, loop: true }
    downCrouch: { clip: /cdn/clip-rifle-2hraimisdown-b98450f8.glb, mask: upper, loop: true }
    fire: { clip: /cdn/clip-rifle-2hrattack3is-db1e228f.glb, weight: 6, mask: upper, blendIn: 0.03, blendOut: 0.2, speed: 1.0, cut: 0.6 }
    fireCrouch: { clip: /cdn/clip-rifle-2hrattack3is-db1e228f.glb, weight: 6, mask: upper, blendIn: 0.03, blendOut: 0.2, speed: 1.0, cut: 0.6 }
    reload: { clip: /cdn/clip-rifle-2hrreloadz-94bc26d5.glb, weight: 5, mask: upper, blendIn: 0.15, blendOut: 0.3, cut: 2.0 }
    flourish: { clip: /cdn/clip-gunplay-584dc731.glb, weight: 5, mask: upper, blendIn: 0.15, blendOut: 0.35 }
