  - { where: beta, name: "level11_protocol.txt", text: "M.E.G. FIELD DIRECTIVE 11-B\n1. Entities in Level 11 are docile under the Level 11 Effect. Do NOT engage unless provoked.\n2. Tap water in the Capital district is tested pure Almond Water.\n3. Barricaded alleys contain wild noclip rifts. Observe all spray-painted caution marks.\n4. Base Beta maintains open supply caches for all peaceful wanderers." }
  - { where: beta, name: "city_grid_map.txt", text: "LEVEL 11 SECTOR MAP\nNorth: Grand Canal promenade, stone balustrades, arched bridges.\nNortheast: M.E.G. Base Beta outpost.\nWest: Strip Mall (Marroka Pizzeria, Centro Dermatologico, ISLA Lab).\nEast: Sedco Spotlight commercial block, parking lot, transition zone.\nSoutheast: Grand Neoclassical Tower (Skydeck, Floor 14 observation elevator).\nCenter: 11th Avenue Central Boulevard, traffic signals, payphones, ATMs." }
  - { where: beta, name: "incident_11_607b.txt", text: "M.E.G. BASE BETA INCIDENT REPORT #11-607B\nSubject: Unregistered Skin-Stealer (known locally as 'Halliel')\nStatus: PRESUMED DEAD\nSummary: Subject lived peacefully near 14th Ave for several months under the Level 11 Effect. Pursued by Patrol 4 during a routine sweep. Heavy blood loss observed on scene; torn wool cap and coat sleeve logged into evidence. Body unrecovered due to nearby noclip shear. Case closed." }
