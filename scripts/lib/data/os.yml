  - { where: office, name: "phone_log.txt", text: "09:12  ring. answered. breathing.\n09:40  ring. answered. my own voice, saying 09:40.\n15:40  ring.\n15:40  ring.\n15:40  ring." }
  - { where: office, name: "quarterly_report_v9.doc", text: "Q3 SUMMARY\nRevenue: n/a\nHeadcount: decreasing\nOffice count: increasing\nRecommendation: do not count the offices" }
