  registered: "the field was filled in once. the ink is gone."
  cpu: "Pentium-class. A sticker on the case says DO NOT OPEN in four different handwritings."
  ram: "640 KB. It has always been enough. It has never been enough."
  disk: "BACKDRIVE (C:) · 2.1 GB · 0 bytes free · 0 bytes used"
  origin: "This copy of Back OS was not installed. It was here when the desk was."
  users: ["guest", "dana.acct", "marcus.h", "facilities", "temp04", "you"]
  notes:
    - "95.0  first boot. nobody remembers pressing the button."
    - "95.1  fixed: the clock no longer runs. nobody asked for this."
