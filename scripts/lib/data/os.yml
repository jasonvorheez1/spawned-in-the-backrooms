files:
  - { where: hosp, name: "incident_room245.txt", text: "INCIDENT REPORT · HOSPITAL DIMENSION · ROOM 245\n\nThis morning patient Carl Johnson began convulsing in pain. Two nurses found him burning with fever, skin flushed deep red across the arms, abdomen and right thigh. He tried to get up to no avail. The nurses, aided by the patient's friend, held him until he fainted.\n\nAFTERMATH: Area quarantined. All three decontaminated and allowed to leave. Mr. Johnson declared comatose a few hours later. In-depth study of the pathogen begun." }
  - { where: hosp, name: "culture_lab_notes.txt", text: "Light microscope x400 (gram stain): purple cocci in clusters.\nDay 1: reads as S. aureus.\nDay 2: resists every antibiogram on the bench.\nDay 3: identification impossible. This is not anything we know.\n\nCure on hand: none. Decon showers slow it. Purge the air first." }
  - { where: hosp, name: "sutton_journal.txt", text: "I don't really know where to start.\n\nLevel five means massive, out-of-control contamination of the entire dimension. People were running everywhere. We could hear staff who had caught it screaming. Even security ran.\n\nWe closed the no-clip behind us, as procedure required. The Flooded Cave camp picked us up. They're afraid of us.\n\nThe Hospital Dimension must not be deserted. Travelers need us. Our lack of knowledge will be our greatest enemy.\n\nIt's late. I'm so hot. I'm so red. My limbs hurt." }
  - { where: hosp, name: "backdoor_chat_2013-03-18.log", text: "[BACKDOOR] Backrooms' #1 Chat & Forum · archived 2013-03-18 09:18:43\n\nsomeoneintheroom: Hey, remember that bleeding disease thing?\nkatyaaaaaaaaa576: Don't remind me, I'm on the case and it's... complicated\nsomeoneintheroom: Level 109's an abandoned hospital. A group called The Doctors found it. Lots of rooms highly infected.\nsomeoneintheroom: They found records of a group that lived there a hundred years before the M.E.G.\nkatyaaaaaaaaa576: You're telling me the infection started there?\nsomeoneintheroom: Not sure, a lot of data was corrupted. Sending you the file.\n\n  someoneintheroom shared a file  [OPEN FILE (49kb)]\n\n[END OF ARCHIVED CHATLOG]" }
  - { where: any, name: "readme.txt", text: "Back OS(tm). BACKDRIVE. Files here belong to whoever sat here last. They have not come back to claim them." }
