# BackOS: the M.E.G.'s Backdoor client that every working computer in the Backrooms boots into. All text is ours (a game's version of the wiki).
# ADDING A MACHINE: give it a host whose name starts with a profile's `prefix` (profiles below), place it with scripts/lib/terminal.js (terminalSpec), and write its mail and files here with
# `where: <profile>`. A new place gets its own profile: owner, motd, level (what `level` prints), a password (passwords:) and its mail, files and database entries. Hosts with no prefix are offices.
# A computer's state: host, lock ('' | 'science:N' | 'pw:<word>'), profile (office | omega | gamma). Guests see public data; admin sees all.
version: "Back OS(tm) 95 (Backdoor client)"
boot:
  - "Back OS(tm) · Backdoor client"
  - "checking reality anchor ............ OK"
  - "mounting BACKDRIVE ................. OK"
  - "syncing the database ............... 1 of 3 servers reachable"
  - "you are now blinking manually"
  - "keyboard ......................... found (sticky)"
  - "last session ended: improperly"
  - "welcome back."
profiles:
  office:  { prefix: "", level: "a desk somewhere", owner: "Facilities", motd: "Quarterly review postponed indefinitely." }
  omega:   { prefix: "OMEGA", level: "Level 4 · Base Omega", owner: "Base Omega · Overseer desk", motd: "Authorised M.E.G. personnel. Everyone else: hi." }
  gamma:   { prefix: "GAMMA", level: "Level 3 · Base Gamma", owner: "Base Gamma · Administration", motd: "The Database. Handle with care." }
  alef:    { prefix: "ALEF", level: "Level 2.1 · Base Alef (sealed since 11 Jul 2020)", owner: "M.E.G. Base Alef · Comms desk", motd: "UPLINK DOWN since 11 JUL 2020. Cached mail only. Do not wait for a reply." }
  beta:    { prefix: "BETA", level: "Level 11 · Base Beta Outpost", owner: "M.E.G. Base Beta · Tactical Operations", motd: "Base Beta. The only outdoor M.E.G. base. Keep watch on the grid." }
  hosp:    { prefix: "HOSP", level: "Level 109 · The Hospital Dimension (evacuated · contamination level 5)", owner: "Hospital Dimension · Culture lab & wards", motd: "LEVEL 5 CONTAMINATION ALERT. THIS IS NOT A DRILL. If you are flushed red, stay where you are." }
  sedco:   { prefix: "SEDCO", level: "Level 11 · Sedco Spotlight Commercial", owner: "Sedco Security · Closed Circuit", motd: "Municipal security monitor. Feeds nominal. Do not tamper." }
passwords: { omega: "overseerb", gamma: "minerva2015", alef: "keisha", beta: "pegasus11", sedco: "spotlight" }
# the database. restricted entries and every "weak" line are admin only. studied: reading it sharpens you against that creature (+10% damage)
entries:
  - { id: l0, cat: Levels, title: "Level 0 · The Lobby", sc: "Class 2", text: "Endless yellow rooms, damp carpet, a hum that gets into your teeth. Smilers and lurkers wander the maze. The only way on is the flickering wall on the west edge. Sanity drains everywhere except the safe room.", weak: "Red rooms and dark rooms drain sanity several times faster. Walk, do not run, when the hum spikes. A lit flashlight is seen from forty metres; a dark one from eleven." }
  - { id: l1, cat: Levels, title: "Level 1 · The Habitable Zone", sc: "Class 3", text: "Concrete halls with banded pillars, storage racks and rooms behind push doors with green signs. Hounds hunt the halls and never enter the corridors. The lights fail in a Flickering every few minutes. The M.E.G. keeps a waypoint at the centre.", weak: "During a Flickering get into a corridor and keep your light off. New crates appear on the racks afterwards." }
  - { id: l2, cat: Levels, title: "Level 2 · Abandoned Utility Halls", sc: "Class 3", text: "Narrow maintenance tunnels with corners cut at forty-five degrees, wrapped pipes and dead circuits. Survivors keep a camp by the green door home. Many doors are locked; some hold toolboxes, lockers and parts.", weak: "Lights are wired in series: one dead tube darkens the block. Violet emergency light marks a dead circuit." }
  - { id: l3, cat: Levels, title: "Level 3 · Electrical Station", sc: "Class 4", text: "Brick halls with conduit on every wall, indestructible white bars that block most of the level, generators, assembly lines that never run out, and black sludge in the pipes. Its entities hunt in organised brigades. Base Gamma stands at the end.", weak: "The bars cannot be passed. Some have gates that can be picked. Sludge burns through boots. Generators overload on a cycle: do not stand beside one." }
  - { id: l4, cat: Levels, title: "Level 4 · Abandoned Office", sc: "Class 2", text: "A single office floor: perimeter offices, open plan in the middle, fountains with clean water. Any wanderer may claim an empty office as a home. Base Omega holds the north-west corner. Stairs down lead to Level 5; the lift goes back to Level 3.", weak: "Three offices still have bare windows. Do not stand near them. The desk phones ring for a reason." }
  - { id: smiler, cat: Entities, title: "Smiler", sc: "Class 3", studied: smiler, text: "A shape with a grin and nothing else, drawn to light. Looking straight at one slows it to a creep. It cannot be outrun in the open, so use walls and corners.", weak: "Weapons work; guns do little against the shade itself, so close with something heavy. They ignore the safe room." }
  - { id: lurker, cat: Entities, title: "Lurker", sc: "Class 3", studied: lurker, text: "Pale, hairless, too tall. It freezes while you watch it with a clear line of sight, and rushes the moment you look away. Watching it costs sanity; so does being grabbed.", weak: "Back up while keeping it in view. Break line of sight only when a door is between you." }
  - { id: hound, cat: Entities, title: "Hound", sc: "Class 3", studied: hound, text: "A black, long-legged hunter that howls once on sight, calling every hound within thirty metres. It pounces from a few metres and mauls. On Level 3 they work in brigades and lie in wait in dead ends.", weak: "They will not enter corridors on Level 1 or the camp on Level 2. Kill the spotter first and the pack loses its target." }
  - { id: stealer, cat: Entities, title: "Skin-Stealer", sc: "Class 4", studied: stealer, text: "Wears a wanderer's skin. It calls out hello from far away and walks slowly toward you; the skin slides off when it is close, then it lunges.", weak: "Real people travel in groups. A lone voice in the halls is not a person. Aim for the moment the skin comes off." }
  - { id: moth, cat: Entities, title: "Deathmoth", sc: "Class 3", studied: moth, text: "Swarms drawn to any light. They gnaw wiring and wanderers alike.", weak: "Flashlights draw them. Dark halls are safer than lit ones when a swarm is out." }
  - { id: obj94, cat: Objects, title: "Object-94 · Back OS(tm)", sc: "-", text: "An operating system found on flash drives (94-A) and hard drives (94-B) lying around the Backrooms. Its logo is the logo of a very old Frontrooms system with one colour left. Nobody knows who writes it, or whether it writes itself. It always boots.", weak: "Do not leave it running unattended. It has never been seen to shut down on its own." }
  - { id: almond, cat: Objects, title: "Almond Water", sc: "-", text: "Drinkable, restores health and sanity, and replaces food for many. It is the Backrooms' common currency. Eating or drinking nothing else for long enough will still hurt you.", weak: "A drink restores 40 thirst. Carry some; Level 3 assembly lines make more." }
  - { id: firesalt, cat: Objects, title: "Firesalt", sc: "-", text: "A hot orange crystal found in generator rooms. Valuable to traders.", weak: "" }
  - { id: pain, cat: Objects, title: "Liquid Pain", sc: "Restricted", restricted: true, text: "A fluid that hurts the way a burn hurts. Used heated in Base Gamma's defences against brigades.", weak: "The M.E.G. Human and Entity Rights Committee dislikes it. It works." }
  - { id: meg, cat: Groups, title: "The M.E.G. (Major Explorer Group)", sc: "-", text: "The largest group in the Backrooms. Runs bases on many levels (Omega on Level 4, Gamma on Level 3), maintains this database and pays wanderers for reports.", weak: "" }
  - { id: bntg, cat: Groups, title: "B.N.T.G.", sc: "-", text: "The Backrooms Nonaligned Trade Group. Runs warehouses and trade, neutral toward nearly everyone.", weak: "" }
  - { id: uec, cat: Groups, title: "U.E.C.", sc: "Hostile", restricted: true, text: "The Unbound Explorers Coalition. Hostile to entities and to visitors it does not know. Do not approach their colony.", weak: "" }
  - { id: l5, cat: Levels, title: "Level 5 · The Terror Hotel", sc: "Class 3", text: "A 1930s hotel floor that never ends: a grand lobby, guest rooms and suites, a library, a kitchen, the Beverly Room ballroom and a Boiler Room underneath. The radios all play the same polonaise. Reached by the brass lift from Level 3 or the stairs down from Level 4. Things in the drawers are real and worth searching.", weak: "The Boiler Room vents steam on a cycle: heat builds while you stand in it and burns once it peaks. Leave before the gauge fills. Guest-room doors close behind you; the Staff do not knock." }
  - { id: samantha, cat: Entities, title: "Entity 26 · Samantha", sc: "Friendly", text: "A very small black-and-white cat with green eyes and serrated teeth. Speaks eloquently. Keeps the Beverly Room on Level 5 and has been seen near the Level 3 lift. Offers psychic readings in exchange for meat. Her readings have so far been accurate.", weak: "Steak gets the best reading. Spam gets a polite one. Do not offer her rat. Do not touch her." }
  - { id: deathrat, cat: Entities, title: "Death Rat", sc: "Class 3", studied: l5rat, text: "Rats the size of a dog that pour out of walls and vents in the Terror Hotel and, lately, the Level 3 maze. They hunt in small packs and go for the legs. Their meat is edible if you are desperate.", weak: "They flinch from light and break off when the pack thins. Kill the first one; the rest hesitate." }
  - { id: staff, cat: Entities, title: "The Staff (Facelings)", sc: "Class 4", studied: l5staff, restricted: true, text: "Faceless figures in hotel livery who walk the corridors of Level 5 as if on shift. Usually indifferent. They do not like guests in rooms that are not theirs, and they do not like noise.", weak: "Holster your weapon and they lose interest once. Never block a doorway they are walking to." }
  - { id: tenant13, cat: Entities, title: "Tenant", sc: "Class 2", studied: tenant13, text: "What a resident of Level 13 becomes once the lethargy is done with them: a housecoat, slippers, a face with nothing left on it, skin the colour of the wallpaper. It watches its television until someone comes into view, then throws its crockery, hard and accurately.", weak: "It never crosses its own doorway. Break its line of sight, count six throws, and rush it while it restocks at the counter." }
  - { id: lurker13, cat: Entities, title: "Hall Lurker", sc: "Class 3", studied: lurker13, text: "Thin, charcoal, forearms too long for the rest of it. It lives in a stripped flat on Level 13 and takes people who walk past its open door without looking in. The lamp goes out first.", weak: "Look straight at its doorway as you pass and it stays where it is. Hit it the moment the lamp dies and it lets go of the idea." }
  - { id: l21, cat: Levels, title: "Level 2.1 · \"Locked\"", sc: "Class 3", text: "A sublevel above Level 2: hot, humid storage halls of lockers, janitorial gear and fluorescent light, and one stairwell in. About ten kilometres across. Hounds are the commonest thing in it. Base Alef lives here. In July 2020 a steel wall closed the stairwell and nobody has opened it from the Level 2 side since, until now.", weak: "No food and no water on the whole level. Take your own. Refrigerator Paradise, north of the checkered locker room, is the only food anywhere." }
  - { id: alef, cat: Groups, title: "M.E.G. Base Alef", sc: "-", text: "The first of the sublevel bases, founded in June 2020 with 53 staff as a storage and quarters outpost for Level 2. Locked out on 11 July 2020 by a steel wall across the only stairwell. Twelve people are known to have got out.", weak: "" }
  - { id: fridgep, cat: Levels, title: "Refrigerator Paradise (Level 2.1)", sc: "-", text: "A room of banks of refrigerators, freezers and cupboards north of the checkered locker room. Enough saltine crackers to last a lifetime, if the lifetime is short. A few survivors live there.", weak: "The water that drips off the freezer coils is clean. Hold a jug under it." }
  - { id: edges, cat: Levels, title: "The Edges (Level 2.1)", sc: "Class 4", restricted: true, text: "The east end of Level 2.1, where the white painted halls give way to rock-cut concrete caves under silver ducts. Smilers nest in the dark side tunnels. The lane runs to a cave mouth that survey teams call unsurveyed.", weak: "The cave mouth leads down to Level 8. Take rope, a flashlight, and spare batteries. The lane is lit only down its middle." }
  - { id: l8, cat: Levels, title: "Level 8 · Cave Systems", sc: "Class 3", text: "A sprawling system of karst caves, cold and dark, reached through a lake from Level 7's diving bell or the concrete caves at the far end of Level 2.1. Markers every fifty metres count down along the 9th Road. A camp near the end keeps a fire.", weak: "Flashlights give a twelfth of their light here and their batteries drain faster. Spiders cannot swim. Never enter caverns marked in red." }
  - { id: warpberry, cat: Objects, title: "Warpberries", sc: "Restricted", restricted: true, text: "A berry that tastes of copper and static. Eaten, it opens a door somewhere else for a moment: most of the administrators who left Base Alef on the first day did so on warpberries.", weak: "Not reliable. Not safe. Not for sharing." }
  - { id: l11, cat: Levels, title: "Level 11 · \"The Infinite City\"", sc: "Class 2", text: "An endless metropolis of Western architecture, roads in block formations, concrete monolith buildings, canals, and skydecks. Approximately 129,500 permanent residents. Self-sufficient: supplies and building materials noclip into shops and storerooms when unobserved. Exits to nearly every known level lurk in alleyways and side streets.", weak: "Roughly one-third of all buildings are indestructible and unenterable. Barricades of wooden pallets and spray-painted trails mark known safe streets away from wild noclip exit zones." }
  - { id: l11effect, cat: Phenomena, title: "The Level 11 Effect", sc: "Safe", text: "A documented pacifying phenomenon unique to Level 11. Hostile entities (including Hounds, Facelings, and Deathmoths) become remarkably docile upon entering the city. Facelings wear civilian business attire and commute; Hounds behave like domestic stray dogs and can be approached safely.", weak: "The effect is not foolproof. Deliberately attacking or provoking entities can cause their pacification to fail. Do not push your luck." }
  - { id: basebeta, cat: Groups, title: "M.E.G. Base Beta", sc: "-", text: "The primary M.E.G. stronghold in Level 11, and the only major M.E.G. facility situated entirely in an open-air exterior level. Founded by Overseer Justin to map exit clusters, organize supply convoys, and safeguard wanderers arriving from lower levels.", weak: "" }
  - { id: capital, cat: Groups, title: "The Capital (Level 11)", sc: "-", text: "The primary nonaligned metropolitan civilization of Level 11, housing over 45,000 residents across a 5.5-mile territory. Features a currency economy powered by First Capital municipal credits, automated services, and fully furnished enterable buildings restored in partnership with the B.R.C.", weak: "" }
  - { id: brc, cat: Groups, title: "B.R.C. (Backrooms Remodelling Co)", sc: "-", text: "An anomalous commercial group dedicated to retrofitting the stark, indestructible concrete hulls of Backrooms structures into furnished, habitable Frontrooms-style offices and commercial storefronts.", weak: "" }
# email. from, subj, body. tip: crate (a supply crate appears in a Level 4 office) | xp | key (a keycard, admin only) . where: office | omega | gamma | any
mails:
  - { where: office, from: "Facilities", subj: "Re: the windows", body: "We have blacked out every window on the floor. Three were missed. We know which three. Please do not go near them to check.", tip: "" }
  - { where: office, from: "Dana in Accounts", subj: "Lunch?", body: "Anyone want to split a jug from the cooler? The one in the middle is clean. The rest, I do not know. Also the phone in the break room rang twice again.", tip: "" }
  - { where: office, from: "IT Helpdesk", subj: "Your password", body: "As requested we have reset your password. It is the same as before. It was always the same as before. Admin boxes follow the pattern: the surname of whoever photographed Level 3 first.", tip: "" }
  - { where: office, from: "Marcus", subj: "supply box", body: "I hid a box in the corner office on the north wall before I left. Under the desk. If you read this, it is yours. Take it before the next shift does.", tip: "crate" }
  - { where: office, from: "Shift Board", subj: "Notice", body: "Tasks are posted on the board by the north desks. Complete them and the supply cupboard will pay. Nobody remembers who stocks the cupboard.", tip: "" }
  - { where: office, from: "HR", subj: "Mandatory fun", body: "Please clear your desk by the end of the day. The day has not ended. Please clear your desk.", tip: "" }
  - { where: office, from: "(no sender)", subj: "you", body: "You are reading this at a desk that is not yours. That is fine. Sit down. You are early.", tip: "xp" }
  - { where: omega, from: "Overseer B", subj: "Omega log", body: "Base Omega is holding. The lift to Level 3 works only from this side. The stairwell is chained: we do not unchain it for anyone who cannot tell us what is under it.", tip: "" }
  - { where: omega, from: "Quartermaster", subj: "stores", body: "Spare keycard is in the safe under the radio. Combination is on a sticky note on the monitor. Do not tell the new people.", tip: "key" }
  - { where: omega, from: "Overseer B", subj: "to whoever finds this", body: "If you have hacked this machine, you have the Science for it, and you should come to Base Gamma. They need people who can open things.", tip: "xp" }
  - { where: gamma, from: "Cmdr. Moss", subj: "Brigades", body: "Third brigade this week. The hoses held. Reminder: the Database servers stay on the top floor, never in the tunnels. Minerva has the only key, and her password is in my head.", tip: "" }
  - { where: gamma, from: "Archivist", subj: "new entries", body: "Added the stealer's habits and what the hounds do in dead ends. Restricted view shows the weak points. Please do not print those.", tip: "xp" }
  - { where: gamma, from: "Base Leader", subj: "Re: security", body: "Yes the Administration door is open during the day. No, I do not want it locked. People should be able to find us.", tip: "" }
  - { where: office, from: "Dana in Accounts", subj: "Re: Re: Lunch?", body: "Never mind. Marcus did not come back from the break room. The phone rang three times this time. I am taking my lunch at my desk from now on.", tip: "" }
  - { where: office, from: "Facilities", subj: "Ceiling tiles", body: "Some of you have reported ceiling tiles that are missing. Please do not look up into the gaps to check if anything is up there. Nothing is up there. Please do not check.", tip: "" }
  - { where: office, from: "temp04", subj: "is anyone reading these", body: "my badge says temp04. i do not remember signing anything. if you are reading this at OFC4 something, i sat here too. the chair remembers. reply if you can", tip: "" }
  - { where: office, from: "IT Helpdesk", subj: "Ticket #0000001 closed", body: "Issue: computer turns on by itself. Resolution: working as intended.", tip: "" }
  - { where: omega, from: "Sgt. Okafor", subj: "night watch", body: "Two more wanderers came up from the lift last night. One of them said hello from too far away. We did not let that one in. Good work, everyone.", tip: "" }
  - { where: hosp, from: "Fisher.Mason@level109.br", subj: "Thursday patient", body: "Hi Dennis,\n\nYou should receive a patient (Carl Johnson) within one hour for a blood test. Context of his visit attached. He's been allocated room 245, so send him there with his attendant (Brian Torr) afterwards.\n\nHave a good day,\nMason Fisher\n\nAttachment(s): 1", tip: "" }
  - { where: hosp, from: "Sutton.Dennis@level109.br", subj: "Re: Thursday patient", body: "Hi Mason,\n\nSo far nothing special. It just looks like a classic Staphylococcus aureus infection. I've inoculated the agar plates for the blood culture, first results tomorrow as usual.\n\nThe nurses report he's feeling really unwell. His condition has worsened and his complexion has become red. His symptoms are nothing like the diagnosis. Your call.\n\nHave a nice day,\nDennis Sutton", tip: "" }
  - { where: hosp, from: "Fisher.Mason@level109.br", subj: "Unknown disease?", body: "Hi Dennis,\n\nSorry, I've only just seen your emails after the incident. This is a very big problem. We can't regulate travelers coming from the Pipe Dimension. If a new patient appears the disease is likely to spread very quickly, and the hospital could be doomed. A large part of the staff is on the blood samples now.\n\nI remain available should any problems arise,\nMason Fisher", tip: "" }
  - { where: hosp, from: "Hospital PA (auto)", subj: "LEVEL 5 CONTAMINATION ALERT", body: "This is a level 5 contamination alert. This is not a drill.\n\nPlease leave your rooms or stations and proceed immediately to the nearest no-clip area with your supervisor or team leader. If you are contaminated, please remain where you are and wait for qualified personnel to arrive, whereupon you will be placed in isolation.\n\nI repeat: this is not a drill.", tip: "" }
  - { where: any, from: "Backmail", subj: "Welcome", body: "Your mailbox is empty except for this message. This message was empty too.", tip: "" }
  - { where: any, from: "Homely Hotel Management", subj: "RENTAL NOTICE: rooms available", body: "The Homely Hotel is pleased to announce vacancies on every floor. Rooms are let by the night, the week, or permanently. Meals are served in the kitchen at all hours. Guests are reminded that the thirteenth floor is closed for refurbishment. Please do not ask the Staff about it. Rent is collected.", tip: "" }
  - { where: gamma, from: "Archivist", subj: "Terror Hotel files", body: "New pages for Level 5: the hotel, Entity 26 (the cat, yes, the talking one), the Death Rats and the Staff. The Staff page is restricted. If you meet Samantha, bring meat and be polite.", tip: "xp" }
  - { where: alef, from: "Wilson (Comms)", subj: "READ THIS FIRST", body: "11 JUL 2020 03:18. A solid steel shutter has dropped across the Level 2 stairwell. Blowtorches barely scratch it. All 53 of us are sealed in. Comms are down. If you are reading this, the uplink is not coming back. Do not wait for it.", tip: "" }
  - { where: alef, from: "Base Leader", subj: "Memo #13: the berries", body: "Under NO circumstances are the specimen berries in the Exploration Wing to be taken or eaten. Ten of the administration have already left on them. We do not know where they went. If you are reading this because you are hungry: do not.", tip: "" }
  - { where: alef, from: "Pell (IT)", subj: "temporary connection loss", body: "Everyone keeps asking. It is a temporary connection loss between us and the rest of the Backrooms. It will be fixed quickly. It has been nine days. It will be fixed quickly.", tip: "" }
  - { where: alef, from: "Arellano (Quartermaster)", subj: "rationing", body: "Strict shares from tonight: quarter-rations, one jug a day. Anyone caught taking more is on their own. I am not in charge of what happens next, only of the count. The count is not good.", tip: "" }
  - { where: alef, from: "Connor Goknar", subj: "Refrigerator Paradise", body: "Found it. A room north of the checkered lockers, behind the double doors with the orange paint. Banks of humming refrigerators packed floor to ceiling with saltines. I am not making this up. Tell them to come. Tell them to bring jugs: the freezer coils drip clean water.", tip: "xp" }
  - { where: alef, from: "Banks, J.", subj: "the roof", body: "Six sticks of dynamite, the plunger box, and a roof I think is five metres of solid concrete. Detonation velocity 6.5k m/s. If I get three to five metres I reach the surface. Going east into The Edges in the morning. Now or never.", tip: "" }
  - { where: alef, from: "Survey Team A (Gray)", subj: "The Edges: turn back at the white rooms", body: "East of the white rooms the lights stop. The rock starts. Smilers nest in the side tunnels. The lane runs to a cold fissure that breathes. It goes down. I do not think it goes to anywhere we have a map for. The spare cage keycard is taped under the comms desk.", tip: "key" }
  - { where: alef, from: "(delivery system)", subj: "DELIVERY FAILED x 412", body: "Backmail could not reach meg-database. Backmail will keep trying. Backmail will keep trying. Backmail will keep trying.", tip: "" }
  - { where: beta, from: "Overseer Justin", subj: "Base Beta Directive", body: "Base Beta is the only outdoor stronghold we hold. The weather here is always mild, but do not let your guard down. Keep the perimeter sandbags manned. Track every exit cluster mapped along 11th Ave.", tip: "xp" }
  - { where: beta, from: "Specialist Vance", subj: "Entity Observation Log #88", body: "Confirmed: the hound by the south curb has been sleeping on the wool rug for three days. Took a strip of jerky from my hand. Level 11 Effect continues to hold. Still feels surreal after Level 1 and Level 3.", tip: "" }
  - { where: beta, from: "Quartermaster Reyes", subj: "Emergency Crate Manifest", body: "Ration crate by the dispatch table is stocked with canned Almond Water, med-packs, and fresh batteries. Unlocked for any wanderer heading toward the Capital.", tip: "crate" }
  - { where: beta, from: "Field Surveyor Lin", subj: "Unstable Alleyways Warning", body: "Alley east of the brick warehouse has high noclip shear. We threw three pallets and corrugated sheeting up to block the gap. Do not jump the barricade unless you want a one-way trip to Level 10 or the Metro.", tip: "" }
  - { where: beta, from: "Sgt. Mercer", subj: "Incident #11-607B: Halliel (Closed)", body: "Patrol 4 engaged an unregistered Skin-Stealer ('Halliel') off 14th Ave after civilian reports of unnatural movement under heavy outerwear. Suspect fled wounded into the east alley behind the brick warehouse. Heavy blood trail ended near a storm drain; no remains recovered. Suspect is presumed dead. Note: if a yellow-coated Mimic matching Entity 607 ('Phoebe') inquires at Base Beta, log the sighting.", tip: "" }
  - { where: beta, from: "Tech Morales (IS LAB)", subj: "IS LAB splitter relay fault", body: "Left the clinic-wall frequency trace hooked to our rear test rack before clocking out. Splitter module blew at 400 Hz trying to pin the bleeding threshold noise behind Centro Dermatologico. Storm-grade replacement relays sit down Level 34's East sewer if nobody here has a spare, or a good tech can bypass it at the bench.", tip: "" }
  - { where: sedco, from: "Municipal Security", subj: "CCTV Camera Status", body: "All 4 camera feeds active. Cam 01 (11th Ave) clear. Cam 02 (Grand Canal) clear. Cam 03 (Strip Mall) clear. Cam 04 (Grand Tower Skydeck) reporting clear skies. Spotlight sign transformer humming normally.", tip: "" }
  - { where: sedco, from: "Sedco Management", subj: "Keycard & Vault Access", body: "Security terminal locked for non-staff. Passcode is spotlight. Master keycard for the rear storage locker is logged in security log sedco_cctv_log.txt.", tip: "key" }
forum:
  - { title: "Anyone else hear the phone in 4-09?", by: "late_shift", replies: ["yes. do not answer it twice", "I answered it once. nothing happened. that is the worst part", "it knew my name"] }
  - { title: "Best way to carry almond water", by: "carry_weight_gang", replies: ["bag, obviously", "Hardiness 8 and no regrets", "I got the Hardiness. I regret it now, I never rest"] }
  - { title: "[Level 3] are the bars really impossible", by: "bolt_cutter_dave", replies: ["we tried acid", "we tried the lava squirt gun", "dave please", "dave stop"] }
  - { title: "Is it safe to claim an office?", by: "new_arrival", replies: ["yes, the cooler refills", "the cot is surprisingly OK", "the plate on the door does not lie about whose it is"] }
  - { title: "Hounds howl before they jump", by: "field_note", replies: ["pinned. standard advice, kill the one that howls first", "or walk away from the one that howls first. none of us did"] }
