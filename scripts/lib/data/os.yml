  - { where: gamma, name: "sunderland_intake.txt", text: "BASE GAMMA INTAKE LOG #219\nSubject: Mike Sunderland (Courier)\nEntry vector: Red steel hospital threshold, strip mall rear wall, Level 11.\nCarrier pattern: 400 Hz square drop, 134 BPM stride cadence on payphone harmonics.\nOutcome: Survived sprint, collapsed in exit alcove beside an unknown yellow-coated mimic ('Phoebe'). Later departed north toward Level 989." }
  - { where: any, name: "homely_hotel_notice.txt", text: "HOMELY HOTEL · RENTAL NOTICE\nVacancies: all floors.\nTerms: nightly / weekly / permanent.\nThe 13th floor is closed. It has always been closed.\nGuests must not prop doors open. Guests must not leave.\n- Management" }
  - { where: alef, name: "alef_layout.txt", text: "BASE ALEF (sublevel 2.1)\nWest wall: stairwell down to Level 2 (SHUTTER).\nAtrium: lockers, cots, this desk.  North door: administration.  East door: Exploration Wing.\nSouth: quarters (double bunks). Further east: the checkered locker room, restrooms, break room.\nNorth of the locker room, behind the orange double doors: Refrigerator Paradise.\nFar east: the white rooms, then The Edges. Do not go past the white rooms." }
  - { where: alef, name: "headcount.txt", text: "11 JUL 2020   53\n12 JUL         53 (ten administration unaccounted for)\n19 JUL         41\n02 AUG         27\n27 AUG         14\n04 APR 2022   1 (Arellano, out by warpberry)\n19 JUN 2025   1 (Banks, out through the roof)" }
  - { where: alef, name: "ration_log.txt", text: "DAY 1   full shares\nDAY 3   half\nDAY 7   quarter\nDAY 14  one jug, one cracker\nDAY 19  Refrigerator Paradise found. rations suspended.\nDAY 21  rations resumed. the crackers are not enough. the crackers are never enough." }
