# The S.S. Fun =) voyage: Level 26's ship no-clips between its own sea, Level 10 and Level 169, arriving and leaving in green fog.
# Every number here is Savi's pick unless marked otherwise.
seaMin: 2             # minutes at sea between calls (pick; Shelly Nov 14: 20 was too long a wait)
visitMin: 8           # minutes moored at a level (pick)
order: [level10, level169]   # visits alternate in this order, off ctx.now() (pick)
fogSec: 40            # green fog rolls in this long before the hull stands, and again before it leaves (brief)
fogLinger: 10         # the fog thins this many seconds after the hull appears or goes (pick)
debrisSec: 3600       # popped balloons and the party hat stay this long after it sails (brief)
witnessM: 800         # players within this of the site get the sighting line (brief)
witness: "Green fog on the horizon. Something very large is in it."
hull:
  length: 150
  beam: 18
  deck: 12            # main deck above the keel
  sink: 2.5           # keel sits this far under the lowest ground at mid-ship (grounded)
  listDeg: 4          # leans to starboard
  doorZ: 8            # port shell door (gangway), metres aft of mid-ship
  doorY: 5            # its sill above the keel
  run: 12             # gangway ramp horizontal length
  plat: 1.6           # gangway landing at the door
sites:                # where the hull grounds in each visited place (feet = mid-ship)
  level169: { x: -170, z: -300, yaw: 80 }   # L.ship spot; yaw 80 lies along the dry lakebed's long axis (yaw 20 drove both ends 44 m into the dunes)
  level10: { x: 200, z: -200, yaw: 90 }     # east of the lake, south of the east track, open field; nothing the sim lays stands within 100 m
sound:
  horn: /cdn/moodboard-realistic-gritty/sfx-distant-cruise-ship-horn-blast-in-fog.mp3
  party: /cdn/moodboard-realistic-gritty/music-muffled-party-music-through-steel-floor-distorted-bass-loop.mp3
deckGate:             # Level 26: the gangway gate on the main deck's port rail
  x: -9.4
  z: 18
  signZ: 15.6
