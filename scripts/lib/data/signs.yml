fonts:
  plank: "Rockwell, 'Courier New', serif"
  tin: "Impact, 'Arial Narrow', sans-serif"
  enamel: "Verdana, Tahoma, sans-serif"
  plywood: "'Courier New', monospace"
  cardboard: "'Comic Sans MS', 'Marker Felt', cursive"
  street: "'Arial Narrow', Helvetica, sans-serif"
  plaque: "Georgia, 'Times New Roman', serif"
textures:
