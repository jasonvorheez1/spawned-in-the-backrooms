# Sign styles (scripts/lib/sign-style.js, Shelly Nov 12: "look through evrey single sign and make them more unique").
# A sign is any box with a ui panel whose id or tags say sign; its place's style unless ids names one. Her picks throughout.
places: { main: tin, level01: enamel, level1: tin, level2: enamel, level21: plywood, level3: enamel, gamma: plywood, level4: enamel,
  level5: plaque, level6: plank, level61: cardboard, level7: plank, level8: plywood, level10: plank, level11: street, level12: tin,
  level184: tin, level26: enamel, level27: enamel, home11: plaque, testlab: enamel }
ids:
  l7-fort-sign: plank
  l7-seawatch-sign: plank
  l8-camp-sign: enamel
  l8-l21-sign: tin
  l8-end-sign: cardboard
  l21-down-sign: street
  l21-cave-sign: tin
  l21-sign-fridge: cardboard
  l21-sign-explo: enamel
  l10-outpost-sign: tin
  l11-sedco-sign: enamel
  l11-barricade-sign1: plywood
  l11-roadwork-sign: tin
  l11-market-sign: plank
  l11-spam-sign: cardboard
  l11-sub-sign: enamel
  l11-th-sign: plaque
  l61-meg-sign: enamel
  l61-l11-sign: tin
  l61-amber-sign: plank
