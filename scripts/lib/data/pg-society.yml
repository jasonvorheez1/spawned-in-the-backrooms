# Level 26 Partygoer society (Shelly's S.S. Fun brief, Nov 14). Roles are game roles, not a wiki caste.
# Each row: role, deck (up | low), a route of stops [x, z, yaw?, task] in place metres; y comes from the deck.
# tasks: guard (stand watch), decorate, trap (arms a bait gift), panel (works the lift), haul, party, brief (senior talks), prowl
decks: { up: 0, low: -80 }
tune: # Savi's picks
  sight: 14        # m, in the 120° cone ahead
  near: 4          # m, all around (they're nearsighted to the sides)
  crouchMul: 0.55  # a crouched player is seen at this fraction
  huntSight: 25
  relay: 22        # m: the telepathic call reaches a Partygoer it can SEE within this
  lostMs: 3000     # sight lost this long while alerted: searching
  searchMs: 30000
  recoverMs: 30000
  suspiciousMs: 20000
  lockdownAfter: 3 # alerts within 10 min
  lockdownMs: 180000
  rearmMs: 300000  # a disarmed bait gift is re-wrapped this long after, if its trapper lives
  stopMs: [4000, 9000]
roles:
  l26-pg-0:   { role: guard,      deck: up,  route: [[-2.2, 24.5, 180, guard], [2.2, 24.5, 180, guard]] }
  l26-pg-1:   { role: decorator,  deck: up,  route: [[8.4, 38, -90, decorate], [4.5, 42, 0, decorate], [-4.5, 42, 0, decorate], [-6.5, 38, 90, decorate]] }
  l26-pg-2:   { role: organizer,  deck: up,  route: [[-8.3, -4, 0, party], [-6, -1.5, 30, party]] }
  l26-pg-3:   { role: trapper,    deck: up,  route: [[-6.5, 8, 0, trap], [-6, -6, 0, prowl], [6.5, -20, 180, trap]] }
  l26-pg-4:   { role: scout,      deck: up,  route: [[8.5, -30, 0, prowl], [8, 0, 0, prowl], [8, 30, 0, prowl], [-8, 30, 180, prowl], [-8, 0, 180, prowl], [-8, -30, 180, prowl]] }
  l26d-pg-0:  { role: senior,     deck: low, route: [[300, -30, 0, brief], [300, -46, 180, brief]] }
  l26d-pg-1:  { role: technician, deck: low, route: [[300, 2.2, 0, panel], [300, -8, 180, prowl]] }
