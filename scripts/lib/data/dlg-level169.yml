# Level 169 "Welcome to the Desert": Ferry's Friends, the seven people of the house. Plain talk. They disagree on one thing: taking more people in.

l169-friend-1:   # Odalys Brandt, cook
  hi: "Come in out of it. Sit anywhere that isn't the stove. I'm Odalys, I cook."
  back: ["You again. Have you eaten?", "Kitchen's open. It's always open."]
  bye: "Eat before you walk. Walk after dark."
  ask:
    - q: "When do you eat here?"
      a: "Sunrise and sunset, all seven of us at the one table. Everybody sleeps at a different time, so those two meals are when we see each other."
    - q: "My water turned to sand."
      a: "Everybody's does. Whatever you carried in, water or almond water, it goes to sand out here. Only what comes out of Ferry stays water, and only while it's cold."
    - q: "How long does Ferry's water stay cold?"
      a: "About three hours if you're out in the sun. All night if you walk at night. Under a roof it keeps as long as you like. Once it's warm it's sand like the rest."
    - q: "Is anything dangerous out here?"
      a: "The sun. That's the whole list. Nothing out here hunts you. No animals, no people with knives. Just the daylight."
    - q: "Would you take more people in?"
      a: "Yes. Every time. Nobody gets turned away from my table. Tobin will show you his arithmetic. I'll show you a pot that has never once come up empty."
  barks:
    spot: ["Out of my kitchen!", "Put it down, love. Now.", "Not in my house!"]
    hostile: ["You eat at my table and do this?", "Thief! Tobin, the pan!", "I'll teach you manners myself!"]
    hit: ["Ah! My arm!", "That's my stirring hand!", "You little..."]
    kill: ["Stay down.", "And stay out of my kitchen."]
    allyDown: ["Tobin! No!", "Leave them alone!", "Somebody get the kit!"]
    hurt: ["I'm cut, I'm cut.", "Ugh. Not like this."]
    death: ["My pot...", "Oh, love..."]
    relief: ["There. Wash your hands, all of you.", "Supper's late now."]
    clear: ["Is it over? Somebody check the door."]
    idle: ["Needs salt.", "Who moved my ladle?", "Beans are on."]
    hi: ["Hello, love.", "Come in, come in."]

l169-friend-2:   # Tobin Achterberg, quartermaster
  hi: "Tobin. I keep the count. If you take something off a shelf, tell me, so the count stays right."
  back: ["Need a number?", "Shelves are counted. Go on."]
  bye: "Bring the empties back if you can."
  ask:
    - q: "How does Ferry work?"
      a: "Ferry is the refrigerator in the kitchen. About once an hour it's full again, eight bottles. Nobody fills it. I've stopped asking how and started counting."
    - q: "Can I take bottles for the road?"
      a: "Ask Ferry, not me. Take what's there and come back in an hour if you want more. They stay water while they're cold. Warm, they turn to sand."
    - q: "What's in the basement?"
      a: "Shelves. Tins, blankets, lamp oil, spare wraps. It's the coolest room in the house, so it's also where I'd put you at noon if the bedrooms were full."
    - q: "Why does my own water turn to sand?"
      a: "I don't know why. I know it does. The sun does the same to a body if you stand in it long enough. Six, seven hours of direct sun and that's the end of you."
    - q: "Would you take more people in?"
      a: "No. Eight bottles an hour and seven of us, plus what goes north to the checkpoints. One more is fine. Ten more and somebody goes thirsty. Odalys thinks I'm being hard. I'm being accurate."
  barks:
    spot: ["That's off my count!", "Hey! Shelf six!", "I saw that."]
    hostile: ["Three tins! I counted!", "You're on the ledger now!", "Put back what you took!"]
    hit: ["Ow! Forty-one, forty-two...", "Agh, my ribs!", "That's going in the book!"]
    kill: ["Minus one.", "Count's settled."]
    allyDown: ["Odalys, get up!", "That's one of ours!", "No, no, no!"]
    hurt: ["I'm bleeding on the ledger.", "Need a bandage, now."]
    death: ["Count... it...", "Tell Ferry..."]
    relief: ["Everyone accounted for?", "Recounting. Don't touch anything."]
    clear: ["Shelves are safe. For now."]
    idle: ["Forty-one. Forty-two.", "Who took a blanket?", "That's the wrong shelf."]
    hi: ["Morning. Or evening.", "Yes?"]

l169-friend-3:   # Senna Okoro, road guide
  hi: "Senna. I walk the track. You came up from the well, so you've already done the first five kilometres."
  back: ["Still here. Good, it's still light.", "Ready to walk?"]
  bye: "Go at night. Stop before the sky goes grey."
  ask:
    - q: "How do I cross the desert?"
      a: "Walk at night. Only at night. When the sky starts to lighten you find shade and you stay in it until dark. The day here is twenty-four hours long, so pack for a long sit."
    - q: "What counts as shade?"
      a: "Something solid between you and the sun. A roof, a big rock, a canyon wall. A bush doesn't count. Your hat doesn't count. If you can see the sun, it can see you."
    - q: "Where are the checkpoints?"
      a: "All due north on the track. A is at 60 kilometres. B is at 150. B and a half is at 190, that one is a proper house with a bed. C is at 230. Each has a roof and a crate."
    - q: "What's past Checkpoint C?"
      a: "The edge, at 250. The ground just stops. People jump, and they wake up in Level 11, the city. Nobody's come back to complain."
    - q: "Why do you walk south at dusk?"
      a: "To look for whoever climbed out of the well that day. Some of them sit down half way. I'd rather find them at dusk than at dawn."
    - q: "Would you take more people in?"
      a: "I'm the one who brings them, so yes. I'm not going to walk past someone on the track because Tobin's shelf is tight."
  barks:
    spot: ["Wrong road, friend.", "I see you. Hands open.", "Stop right there."]
    hostile: ["I walked you here and you rob us?", "You won't make Checkpoint A.", "Run. The sun's waiting for you."]
    hit: ["Ngh! Lucky shot.", "My leg, my leg!", "Not the face!"]
    kill: ["That's the end of your road.", "Desert takes the rest."]
    allyDown: ["Pim! Get behind me!", "They hurt Dov!", "Somebody's down!"]
    hurt: ["I can walk on it. Barely.", "Wrap it, wrap it."]
    death: ["Walk... at night...", "Cold water..."]
    relief: ["Breathe. Drink something cold.", "Road's clear again."]
    clear: ["Nobody follow them past the well."]
    idle: ["Wheel's pulling left.", "Dark in a few hours.", "Wraps, lamp, bottles."]
    hi: ["Evening.", "You made it up."]

l169-friend-4:   # Halvard Pruitt, checkpoint keeper
  hi: "Halvard. I keep the checkpoints stocked. Have a look at the map if you're going north."
  back: ["Map's on the table.", "Going north yet?"]
  bye: "Leave the crates how you found them."
  ask:
    - q: "Show me the route."
      a: "One track, straight north. Checkpoint A at 60 kilometres, B at 150, B and a half at 190, C at 230, the edge at 250. From this house, take five off each. We're five north of the well."
    - q: "What's at a checkpoint?"
      a: "A roof, a wall on the sun side, and a crate. Enough to sit out a day. B and a half is better: it's a furnished house and it has a bed. Sleep there if you sleep anywhere."
    - q: "The gap from A to B is 90 kilometres."
      a: "It is, and it's the one that catches people. You won't make it in one night. There are rocks and a canyon on the way. Pick your shade before dawn, not at dawn."
    - q: "What happens at the edge?"
      a: "Cliffs, then nothing. You jump. You wake up on a street in Level 11. I've sent enough people that way to believe it."
    - q: "Would you take more people in?"
      a: "I'd rather stock the road so they don't need us. A house fills up. A road doesn't. Tobin and I agree on that much."
  barks:
    spot: ["Halt! Name and business!", "Step back from the map!", "Checkpoint's closed to you."]
    hostile: ["You're not on any list I keep!", "Logged, and now punished!", "I'll write your name in red!"]
    hit: ["Gah! My spectacles!", "That's assault, that's in the log!", "Ow!"]
    kill: ["Entry closed.", "Struck from the log."]
    allyDown: ["Man down at the house!", "Ines! Talk to me!", "No! Not on my watch!"]
    hurt: ["I need to sit.", "Where's my pencil, I'm logging this."]
    death: ["Twenty... nine...", "Close... the gate..."]
    relief: ["Log it. All of it.", "Incident report, tonight."]
    clear: ["Perimeter's quiet. Write that down."]
    idle: ["B needs a lid.", "Twenty-nine. Or thirty-one.", "Where's my pencil?"]
    hi: ["Hello.", "Mind the map."]

l169-friend-5:   # Ines Varga, weather keeper
  hi: "Ines. I keep the slate by the door. If you read one thing in this house, read that before you go out."
  back: ["Did you read the slate?", "Check the hour first."]
  bye: "Slate first, then the door."
  ask:
    - q: "What does the slate say?"
      a: "Whether it's day or night, and the hour. A full day here is forty-eight hours. Twenty-four of sun, twenty-four of dark. If it says DAY, stay in."
    - q: "How bad is the sun?"
      a: "It dries you out from the inside. First you're uncomfortable, then you're dizzy, then you see things. Six or seven hours of it in total and you're sand. Shade lets you recover, slowly. A roof is faster."
    - q: "And the night?"
      a: "Cold, about one degree. A coat sorts it. The cold won't kill you. It's the safe half, and it's when you walk."
    - q: "Is a wrap enough to walk by day?"
      a: "No. A wrap buys you time. It doesn't make it safe. Wear it for the last hour before you reach cover, not as a plan."
    - q: "Would you take more people in?"
      a: "I don't have a side. I write down the hour. Ask me again after Odalys and Tobin have had it out over supper."
  barks:
    spot: ["Something's wrong. Look.", "Storm's coming, and it's you.", "Don't."]
    hostile: ["You chose the wrong hour!", "I read the sky, I read you too!", "Get out of the light!"]
    hit: ["Ah! The chalk!", "It burns!", "Stop it!"]
    kill: ["Clear skies.", "Gone, like heat at dusk."]
    allyDown: ["Halvard! Oh no.", "They're not moving!", "Help them!"]
    hurt: ["Light's going grey.", "I'm alright. I think."]
    death: ["The slate...", "Sunrise... soon..."]
    relief: ["I'll chalk it on the slate. Bad day.", "The air's settling."]
    clear: ["Quiet. Like before a storm."]
    idle: ["Light's changing.", "Chalk, chalk...", "An hour yet."]
    hi: ["Oh, hello.", "Read the slate?"]

l169-friend-6:   # Dov Kessler, fixer
  hi: "Dov. If it squeaks, leaks or sticks, that's me. Shut the door behind you, the cool gets out."
  back: ["Door. Shut.", "What's broken?"]
  bye: "Mind the hinge on your way out."
  ask:
    - q: "What do you fix?"
      a: "The roof, the swamp cooler, the shutters, every hinge in the place. Shutters go closed at sunrise and open at sunset. That's the difference between a house and an oven."
    - q: "Why does a roof matter so much?"
      a: "Because the sun here has to actually reach you to hurt you. A real roof stops it. So does a rock or a canyon wall. Under a roof you recover, and Ferry's bottles stay cold as long as you sit there."
    - q: "Can I shelter anywhere on the road?"
      a: "Anywhere solid. Each checkpoint has a roof I've patched at least once. Between them, rocks and the canyon. Check where the shade will be at noon, not where it is when you sit down."
    - q: "Does anything come to the house at night?"
      a: "No. Nothing lives out here but us. Nothing hunts you. If you hear a noise, it's the cooler belt, and I know about it."
    - q: "Would you take more people in?"
      a: "This house was built for four. There are seven of us and I'm the one who keeps it standing. I'm with Tobin. Feed them, water them, point them north."
  barks:
    spot: ["Hey. Hands where I can see 'em.", "Back off, I've got a wrench.", "Don't make me fix you."]
    hostile: ["You break it, I break you!", "Should've oiled the door shut!", "Come here!"]
    hit: ["Ow! Son of a...", "That's a tooth!", "Agh, my good hand!"]
    kill: ["Fixed.", "That's that broke."]
    allyDown: ["Senna! Stay with me!", "Who's hit? Who's hit?", "Get them inside!"]
    hurt: ["I'm patched. Mostly.", "Ribs. Feels like ribs."]
    death: ["Oil... the hinge...", "Huh."]
    relief: ["Who slammed the door? Never mind.", "Okay. Back to work."]
    clear: ["Gonna need to fix that window now."]
    idle: ["That belt's going.", "Who slammed this?", "Oil. Where's the oil."]
    hi: ["Door.", "Yeah?"]

l169-friend-7:   # Pim Laurier, newcomer
  hi: "Hi. I'm Pim. I'm new too, sort of. Two weeks. I still knock before I come into the kitchen."
  back: ["Oh, hey.", "Hi again."]
  bye: "See you. Probably."
  ask:
    - q: "How did you get here?"
      a: "Same as you, I think. Up out of the well with a full bottle. It was sand before I'd gone a kilometre. Senna found me sitting on the track at dusk."
    - q: "What did they tell you first?"
      a: "Walk at night. Get under something real before the sun's up. Drink Ferry's water, not your own. That's most of it, honestly."
    - q: "Why do you sit out here at night?"
      a: "North is that way. Checkpoints at 60, 150, 190 and 230, then the edge at 250. You jump and you wake up in a city. I keep thinking I should go and see."
    - q: "What's stopping you?"
      a: "It's a long way to do by myself. And they've been kind. But half of them think the house is too full already, and I can hear them not saying it."
    - q: "Do they want you here?"
      a: "Odalys and Senna do. Tobin and Dov count bottles when I walk in. Nobody's been unkind. I just know I'm the eighth mouth if anyone else turns up."
  barks:
    spot: ["W-what are you doing?", "Hey! That's not yours!", "Guys? Guys!"]
    hostile: ["I trusted you!", "Two weeks and this happens!", "Get away from them!"]
    hit: ["Ow! Ow!", "I'm hit, I'm hit!", "That really hurt!"]
    kill: ["Did... did I do that?", "Oh. Oh no."]
    allyDown: ["No! Odalys!", "They're down! Somebody!", "Wake up, please!"]
    hurt: ["I'm shaking.", "I want to sit down."]
    death: ["Two weeks...", "Stars..."]
    relief: ["Is everyone okay? Please be okay.", "My hands won't stop shaking."]
    clear: ["Is that it? Is it really over?"]
    idle: ["Lot of stars.", "North's that way.", "Two weeks."]
    hi: ["Oh. Hi.", "Hey."]

# Field Office 7: three people who say they're Backrooms Robotics. No badges, no proof, a door they never open. Their gunslinger units went frenzied.
l169-bro-1:   # Desmond Vail, "site supervisor"
  hi: "Welcome to Field Office Seven, Backrooms Robotics. Desmond Vail, site supervisor. Please don't touch the antenna."
  back: ["Ah. Our favourite independent contractor.", "Back again. Good. Very good. Please don't tell anyone how good."]
  bye: "Backrooms Robotics thanks you for your discretion."
  ask:
    - q: "You're really Backrooms Robotics?"
      a: "Absolutely. Completely. Do I have a badge? No. Paperwork? Lost in transit. Head office? Can't say where. But look at that dish. Would a liar have a dish?"
    - q: "What's behind the locked door?"
      a: "Proprietary. Very proprietary. It hums. That's all I'm cleared to tell you, and honestly, that's all I know."
    - q: "What are those robots out in the sand?"
      a: "Gunslinger Series field units. Hats, holsters, the full frontier package. Marketing's idea. They were meant to escort wanderers. Then they started shooting the wanderers."
    - q: "You need help, don't you?"
      a: "Ugh. Fine. Yes. Three units, minimum, put down before head office notices. Bring nothing back, just stop them. I'll pay. In cash. Real cash, not company scrip, I promise."
    - q: "Can I keep their armor?"
      a: "Officially, that plating is company property. Unofficially, I'm not walking out there to get it back. Wear it in good health. Maybe take the hat off indoors."
  quest:
    start: "Three units. That's all I'm asking. They spawn wherever somebody's alone out there, so go be alone."
    progress: "Still counting? Every one you drop is one less incident report."
    done: "Three down. Wonderful. Fantastic. I'm writing this up as a scheduled recall. You were never here. Here's your money."
  barks:
    spot: ["Easy! We're the good robotics people!", "Hey, hey, nobody shoot the supervisor!"]
    hostile: ["That's assault on a corporate officer! Probably!", "I am calling head office! Eventually!"]
    hit: ["Ow! That's my clipboard arm!", "Ah! Workplace injury!"]
    hurt: ["I'm filing a complaint.", "Oh, this is going in the report."]
    relief: ["Okay. Okay. Nobody saw that.", "Everyone breathe. That's a company directive."]
    clear: ["Is it off? Is it fully off?"]
    allyDown: ["Wren! Somebody grab the kit!", "Pruitt's down! Get the kit!"]
    idle: ["Signal's weak today.", "Head office will call. Any minute.", "Seventeen units. We had seventeen."]
    hi: ["Backrooms Robotics, how can we help?", "Afternoon. Corporate afternoon."]
l169-bro-2:   # Wren Okoye, field technician
  hi: "Hi! Wren. I fix them. Well. I used to fix them. Now I mostly hide from them."
  back: ["Oh good, it's you and not a unit.", "Hey! You're alive! That's honestly the nicest thing that's happened today."]
  bye: "Stay off the ridgelines. They love a ridgeline."
  ask:
    - q: "Why did the robots go frenzied?"
      a: "Somebody pushed a patch called COWBOY MODE. Every unit took it at once. Now they think every stranger is a bandit. I've cried about it twice. Today."
    - q: "Who actually built them?"
      a: "Backrooms Robotics. I think. The crates said so. The manuals said so. I never met anyone who said so. That's normal, right? That's normal for a company."
    - q: "How do I fight them?"
      a: "Deadeyes have revolvers, keep moving. Buckshots have coach guns, keep far. Longhorns snipe, use cover. And if you see a Tin Sheriff, just run. Seriously, run."
    - q: "Can I wear the plating?"
      a: "Yes! It's just shell plates over a cat-shaped frame. Pop the clips, it comes off clean. Underneath they look just like you. Which is honestly the creepiest part."
  barks:
    spot: ["Oh no, oh no, is that a unit?", "Somebody's here!"]
    hostile: ["Please stop! I just fix things!", "Why is everyone always shooting!"]
    hit: ["Ow! Ow!", "Ah, that really hurt!"]
    hurt: ["I'm bleeding, I'm bleeding!", "Ugh, not again."]
    relief: ["Ha. Ha ha. We're okay. We're okay!", "Oh thank goodness."]
    clear: ["Is it over? Please say it's over."]
    allyDown: ["Desmond! No!", "Pruitt, get up, please get up!"]
    idle: ["Where did I put the eleven millimetre.", "Come on, firmware, come on.", "Don't spark. Don't spark. Don't spark."]
    hi: ["Hi!", "Oh! Hello!"]
l169-bro-3:   # Pruitt, gate guard
  hi: "Pruitt. Gate. You can stand there. Not there. There."
  back: ["You.", "Still breathing. Good."]
  bye: "Watch the horizon."
  ask:
    - q: "Do you work for Backrooms Robotics?"
      a: "I work for whoever fills the water tank. Desmond fills it. So yes. I work for Backrooms Robotics. Whatever that is."
    - q: "What happened to the other guards?"
      a: "Two of them went out to recover a Tin Sheriff. The Sheriff came back. They didn't."
    - q: "Any advice?"
      a: "They spin up loud. Spurs and a whirr. You hear the jingle, you get low. Every time."
  barks:
    spot: ["Contact.", "Unit on the line!", "Get behind me!"]
    hostile: ["Wrong gate, friend.", "Last warning. Drop it."]
    hit: ["Hngh.", "Took one."]
    hurt: ["I'm fine. I'm fine.", "Still standing."]
    kill: ["Stay down.", "That's one."]
    relief: ["Clear.", "Holster up."]
    clear: ["Line's quiet."]
    allyDown: ["Man down!", "Cover them!"]
    idle: ["Quiet.", "Too quiet.", "Wind's shifting."]
    hi: ["Gate's open.", "Mm."]

