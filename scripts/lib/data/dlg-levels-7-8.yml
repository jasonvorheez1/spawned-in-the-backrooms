l8x-tar-1:
  hi: "Eyes. You still use eyes. Look at mine. Black. Don't need 'em. Drink from the pit and you won't either."
  bye: "Come back thirsty."
  ask: []
  barks:
    idle: ["Drink.", "Black teeth, clear mind.", "Hah."]
    hi: ["Eyes.", "Thirsty?"]
    spot: ["Fresh one!"]
    hostile: ["I'll drown you in it!"]
    hit: ["Ha! More!"]
    kill: ["In the pit."]
    flee: ["Into the tar!"]
    death: ["Black..."]
  gest: { wave: "Hah.", gift: "Pour it in the pit.", dance: "Hah. Swim.", nodance: "No.", insult: "Say it closer." }
l8x-tar-2:
  hi: "Shh! Don't step there! That's my sister! In the tar! You see her hand? You see it? Don't touch her!"
  bye: "Don't tell them I talked to you!"
  ask: []
  barks:
    idle: ["Sister? Sister?", "Hee hee hee.", "They're watching. They're always watching."]
    hi: ["Who's that? WHO'S THAT?", "Hee."]
    spot: ["Intruder! On the hands!"]
    hostile: ["Get off my family!"]
    hit: ["They'll get you for that!"]
    kill: ["Hee hee. Join them."]
    flee: ["The hands! The hands!"]
    death: ["Coming... sister..."]
  gest: { wave: "Don't wave! They see!", gift: "Is it for my sister?", dance: "Hee hee!", nodance: "No!", insult: "Hee. They heard." }
l8x-tar-3:
  hi: "Ha! Look at it. Look at its little light. Blackjaw, look. Can I? Can I?"
  bye: "Run along."
  ask: []
  barks:
    idle: ["Can I? Can I?", "Ha.", "Blackjaw says."]
    hi: ["Ha! Look!", "Little light."]
    spot: ["Ooh! Mine!"]
    hostile: ["Gonna get you!"]
    hit: ["Ow! Blackjaw!"]
    kill: ["Ha! Mine!"]
    flee: ["Blackjaw!"]
