    spot: ["Light! There is a light!", "Sing it out!"]
    hostile: ["Put it OUT!"]
    hit: ["The light burns!"]
    kill: ["Dark again. Dark."]
    flee: ["Into the deep dark!"]
    death: ["Finally... dark..."]
  gest: { wave: "Wave in the dark, and nobody sees.", gift: "Is it a light? Break it.", dance: "Dance blind!", nodance: "No.", insult: "Sing louder." }
