# Level 7 (Outpost Seawatch, Fort Surrender) and Level 8 (the 9th Road camp, the Lightless). Written by hand.
# Camp guides answer orientation/exit; cultists, watchmen and specialists ask and answer from their own lives.

l7-vance:
  hi: "Mind the wet boards, landsman. Name's Vance. I keep this hut and that screen. See the big smudge on it? That's why nobody swims."
  back: ["Still dry, landsman? Good.", "Back on the rock. Kettle's just gone on."]
  warm: "There you are. Pull up the crate. Watch the screen with me a while."
  cold: "Hands off the screen."
  bye: "Stay out of the water."
  walk: "Aye. Off you go."
  ask:
    - q: "Where am I?"
      a: "On a rock in a sea with no shore. I've had the sonar running four years and never found one. My lot call it Seven. The sea doesn't call it anything."
      then:
        - q: "Your lot?"
          a: "M.E.G. Folk who got lost same as you and decided to write it all down. We put huts on places like this and watch. I got the wet one."
    - q: "How do I get out?"
      a: "Off this rock? Same door that put you here, if it's still where you left it. Out altogether? I log everyone who lands. Never logged one who went home."
    - q: "What's the big smudge?"
      a: "We just call it the Thing. It turns under the island every few hours. The little smudge next to it is Tiny. Tiny's about the size of a bus."
    - q: "Is it safe to swim?"
      sk: survival 35
      a: "You know water. Top ten metres, daylight, quick, no splashing. Below that it goes black and cold and you lose which way is up."
      fail: "No."
    - q: "Sell me some gear?"
      sk: barter 35
      do: discount
      a: "You've got sense. Cheaper, then. Bring me anything you pull off a wreck."
      fail: "Diving gear isn't cheap. Neither is drowning."
    - q: "What's that singing?"
      a: "The fort across the water. Every night. Don't listen long. Brother Jude started out just listening."
  barks:
    idle: ["Ping. Ping. There's the big one.", "Tiny's restless tonight.", "Kettle. Where's my kettle."]
    hi: ["Aye, landsman.", "Mind the boards."]
    drawn: ["Save that for the water."]
    hurt: ["Medkit's under the bench. Go on."]
    spot: ["Something's on the rocks!", "Contact! Up out of the water!"]
    hostile: ["Wrong rock, landsman."]
    hit: ["Ach! Salt's in it!"]
    kill: ["Back in the sea with you."]
    clear: ["Quiet now. Check the screen."]
    flee: ["Into the hut!"]
    death: ["Tiny..."]
  gest: { wave: "Aye, hello.", gift: "That's good of you.", dance: "On wet boards? Go on, then.", nodance: "I'll go over the side.", insult: "Gulls have called me worse." }

l7-jude:
  hi: "Peace, child. You crossed the water and fought it the whole way. I can see it in your shoulders. Rest. Here we stop fighting."
  back: ["The water brought you back, child.", "Peace. You return."]
  warm: "Sit with me at the edge, child. Listen. Isn't it kind?"
  cold: "The deep can see your anger. So can I."
  bye: "The tide comes for us all. Gently, I hope."
  walk: "The water will wait for you."
  ask:
    - q: "Why call this Fort Surrender?"
      a: "Because every person here washed up trying to hold onto a shore that wasn't there. You surrender to the water, and the fighting stops."
    - q: "What do you believe?"
      a: "That fear is the only thing holding the door shut. There is the daylight water, then the twilight, then the midnight. We go down. We are welcomed."
      then:
        - q: "Welcomed by what?"
          a: "By it. It turns beneath us. It has never harmed one who went willingly. The unwilling I cannot speak for."
        - q: "Sounds like drowning."
          a: "Everything sounds like drowning at first. Everyone climbs, and none of them have left, have they?"
    - q: "Why do you all sing at night?"
      a: "To answer the turning below the rock. You crossed the water and still haven't heard it? Sit by the wall at dusk. You will."
    - q: "I need rest. Can you help?"
      do: heal
      a: "Lie here. Hear the swell. Breathe when it breathes. There. You have been holding your breath for weeks."
  barks:
    idle: ["Listen.", "It turns. It always turns.", "Daylight. Twilight. Midnight."]
    hi: ["Peace, child.", "Be welcome."]
    drawn: ["Steel rusts, child. Put it down."]
    hurt: ["Pain is a tide. It goes out again."]
    spot: ["Something rises."]
    hostile: ["Then the deep will have you unwilling."]
    hit: ["The tide gives. The tide takes."]
    kill: ["Go down gently."]
    flee: ["To the water's edge!"]
    death: ["Down... at last..."]
  gest: { wave: "Peace.", gift: "An offering. It sees you.", dance: "We sway like kelp.", nodance: "Stillness today.", insult: "The sea has heard worse and kept quiet." }

l7-mara:
  hi: "Don't mind the preaching, bub. That's mostly Jude. I'm Mara. I keep the still running and the walls tarred. You trading?"
  back: ["Back again, bub. Water's fresh.", "You. Good. Mind the wet tar."]
  warm: "Hey, bub. Sit. I'll pour you the clean stuff."
  cold: "Trade or go."
  bye: "Don't fall in."
  walk: "Yep."
  ask:
    - q: "What's for trade?"
      sk: barter 35
      do: discount
      a: "Fair. You're no believer and no fool. Good price."
      fail: "Price is the price. Copper's hard to come by out here."
    - q: "Any coast out beyond this rock?"
      a: "Couldn't tell you, bub. I rowed two days once looking for a coast. Came back to the same rock from the other side. So I built a still instead."
    - q: "You don't believe what he preaches?"
      a: "I believe in walls, tar and fresh water. If that thing down there wanted us, it'd have us. Doesn't mean I go jumping in."
    - q: "How does the still work?"
      a: "Seawater in, fire under, copper coil, clean drops out the end. All day for one bucket. Every drop's earned."
  barks:
    idle: ["More tar. Always more tar.", "Drip. Drip. Come on.", "Jude, you're in my light."]
    hi: ["Hey, bub.", "Trading?"]
    drawn: ["Don't you scratch my still."]
    spot: ["Something's climbing the wall!"]
    hostile: ["You'll swim for that."]
    hit: ["Ow! Damn it!"]
    kill: ["Off my wall."]
    flee: ["Behind the still!"]
    death: ["The still... watch the still..."]
  gest: { wave: "Hey.", gift: "Huh. Thanks, bub.", dance: "One. Then I've got work.", nodance: "Tar's setting.", insult: "Sure, bub." }

l7-ezra:
  hi: "Who goes. Oh. Only a walker. I keep the watch here. Nothing comes. Something always comes."
  back: ["Walker.", "Still nothing. Still something."]
  warm: "Stand the watch with me, walker. It gets lonely."
  cold: "Keep walking."
  bye: "Eyes on the water."
  walk: "Mm."
  ask:
    - q: "What are you watching for?"
      a: "Lights under the water. When they come close we light the brazier and sing. Jude says it's a welcome. I say it's a warning."
    - q: "Seen any boats or ships out there?"
      a: "Once in a while, driftwood and wardrobe doors. Never a hull with a living hand on it."
    - q: "Don't you get tired standing here alone?"
      a: "Better than listening behind me. The fort's safe enough by daylight, so long as somebody keeps eyes on the dark side of the tide."
  barks:
    idle: ["Nothing.", "Something.", "Lights. No. Not yet."]
    hi: ["Who goes.", "Oh. Walker."]
    spot: ["Lights! Lights!"]
    hostile: ["Not a walker. A wolf."]
    hit: ["Ah!"]
    kill: ["Back down."]
    flee: ["Light the brazier!"]
    death: ["Lights..."]
  gest: { wave: "Mm.", gift: "Thanks, walker.", dance: "I'm on watch.", nodance: "Still on watch.", insult: "Mm." }

l7-ines:
  hi: "Careful where you step, boots. That black isn't shadow. It's tar, and it doesn't give boots back. I'm Ines. I keep the pit."
  back: ["Boots still clean? Good.", "Back off the water. It let you go, then."]
  warm: "Come stand by the pit with me. Only warm thing on this rock."
  cold: "Mind the pit. Mind your hands."
  bye: "Watch your feet."
  walk: "Fine. Slowly, though."
  ask:
    - q: "What's the tar for?"
      a: "Everything. Walls, roof, boats, cuts. We haul furniture out of the sea and it comes up rotten. Tar holds it. The whole fort is wardrobes and tar."
      then:
        - q: "Where does it come from?"
          a: "The pit. It rises a little every night. Jude says the sea gives it. I say it's coming up from somewhere, and I'd like to know where before it stops."
    - q: "Why's there a boat under that tarp?"
      a: "Mara hauled it ashore and caulked it twice. Nobody's taken it far since the last two rowers didn't bring back any good news."
    - q: "You don't sound like a believer."
      a: "I believe the pit's hot and the wall needs patching. Jude can do the singing. Somebody has to do the work."
    - q: "Can you patch me up?"
      sk: medicine 30
      do: heal
      a: "Hold still. Bit of tar on the cut, cloth over it. Stings a minute, then it seals. Don't pick."
      fail: "You'd only pick at it. Ask Jude."
  barks:
    idle: ["Skim it. Skim it again.", "Hot tonight.", "Need more rope."]
    hi: ["Watch your feet, boots.", "Mm. Hello."]
    drawn: ["Not near the pit with that."]
    hurt: ["Tar it and keep going."]
    spot: ["Something's on the wall!"]
    hostile: ["You're going in the pit."]
    hit: ["Hah! That burns!"]
    kill: ["Stay down."]
    flee: ["Behind the barrels!"]
    death: ["Warm..."]
  gest: { wave: "Mm.", gift: "That's kind. Keep the tar off it.", dance: "Slowly. Floor's sticky.", nodance: "Not by the pit.", insult: "I've heard Tobit swear at a plank for an hour. Try harder." }

l7-tobit:
  hi: "Stop. Right there. Who sent you across? Nobody sends anybody. So you came on your own, stranger. That's worse."
  back: ["You. I counted you out. Now I count you back in.", "Back. Hands where I can see them."]
  warm: "Alright. You're alright. Stand by me. Two pairs of eyes on the water beats one."
  cold: "One more step and I ring the bell."
  bye: "Don't turn your back on the sea."
  walk: "Stay close. No. Closer."
  ask:
    - q: "Why so jumpy?"
      a: "Because I've seen the lights come right up under the pier. Ezra watches. I listen. You can hear them. Like something knocking on the bottom of a boat."
    - q: "What's the wrench for?"
      a: "Fixing things. And hitting things that climb the wall at night. Lately it's mostly the second one."
    - q: "Why stay here if the knocking scares you?"
      a: "Because I checked the whole wall twice. There's only out into the water or under it, and at least here the boards dry by noon."
    - q: "Can I come through?"
      sk: speech 40
      a: "Fine. You don't smell like the deep. Yet. Keep to the boards, don't touch the brazier, don't talk to Jude for long."
      fail: "No. Maybe. Ask Mara. She decides who's trouble."
  barks:
    idle: ["Knocking. You hear it?", "Count them. Count them again.", "Not tonight. Not tonight."]
    hi: ["Stop. Oh. You.", "Hands!"]
    drawn: ["Put it away! Put it away!"]
    hurt: ["It's fine, it's fine, it's fine."]
    spot: ["There! On the rocks!", "Ring the bell!"]
    hostile: ["I knew it. I knew it!"]
    hit: ["Agh! My arm!"]
    kill: ["Stay down! Stay down!"]
    flee: ["Bell! Ring the bell!"]
    death: ["Knocking..."]
  gest: { wave: "Don't wave. Hands down.", gift: "For me? Why? ...Thanks.", dance: "Are you mad? Out here?", nodance: "Not with the water watching.", insult: "Yeah. I know." }

l8-hobb:
  hi: "Come by the fire, butty. Keep your lamp lit in the tunnels. When you hear singing, put it out before they see it."
  back: ["Lamp still burning, butty? Good.", "You again. Sit. Get warm."]
  warm: "Sit close, butty. The girl's soup is on. Pay her proper, she's learning money."
  cold: "Fire's for the camp."
  bye: "Lamp on. Lamp off by the singing."
  walk: "Hm."
  ask:
    - q: "Where am I?"
      a: "Under a lot of rock, butty. Caves, dark, and one road running through it that nobody remembers building. My old outfit called it Eight. I call it the Road."
    - q: "How do I get out?"
      a: "Follow the painted line and don't leave the tarmac. It goes somewhere, roads do. I never walked it to the end. I've the girl to mind."
    - q: "What's doing the singing?"
      a: "The Lightless. Folk who sat in the dark too long and decided they liked it. They hate a lamp. They'll sing at you. Don't sing back."
    - q: "What happened to your fingers?"
      a: "Winch cable. Ten years a sapper for M.E.G. You learn what a cable does when it snaps. You learn it the once."
    - q: "Need a hand with the camp?"
      a: "Spiders are getting bold, butty. Ask me about plate for the perimeter if you've the stomach for it. Carla wants cheering up, too, and the Harmouth lad has a map he can't finish alone."
    - q: "Sell me supplies?"
      sk: barter 30
      do: discount
      a: "Go on, then. You've been decent to the girl. Bit off."
      fail: "Price is lamps and time, butty. No."
  barks:
    idle: ["Fire's low.", "Carla, stir the pot, love.", "One lamp is four hours. Count them."]
    hi: ["Sit, butty.", "Get warm."]
    drawn: ["Not by the fire."]
    hurt: ["Marit. Here. Now."]
    spot: ["Spiders! Up, all of you!", "Something out of the dark!"]
    hostile: ["Get away from the girl."]
    hit: ["Hngh! Keep at it!"]
    kill: ["Down."]
    clear: ["Carla? Carla, you alright, love?"]
    flee: ["Mind the girl!"]
    death: ["Carla..."]
  gest: { wave: "Mm.", gift: "That's good of you, butty.", dance: "Ha. No.", nodance: "No.", insult: "A winch said worse and took two fingers." }

l8-wen:
  hi: "Silk, caps, tar-stone. Cash only, customer. See those blue lamps down the road? Half of them are mine. You're welcome."
  back: ["Back! Buying?", "My lamps get you here alright, customer?"]
  warm: "My favourite customer. Good stuff's under the tarp."
  cold: "Money first. Then words."
  bye: "Follow the blue ones."
  walk: "Rude."
  ask:
    - q: "What's for sale?"
      a: "Spider silk, strong as wire. Cave caps, glow for a week. Tar-stone, burns slow. All fair. Mostly fair."
    - q: "Where do those blue lamps lead?"
      a: "Back to Hobb's fire. Beyond the last one you're buying your own light from me, customer."
    - q: "Cheaper?"
      sk: barter 40
      do: discount
      a: "Fine. You haggle like you mean it. I respect that. Bit off."
      fail: "Nope. Not today."
    - q: "What makes the silk?"
      a: "Spiders. Big ones, and one very big one. The silk's getting thicker and the webs are higher up the walls. Either she's growing or she's getting ideas."
  barks:
    idle: ["Silk, caps, stone.", "Who moved my lamps?", "Cash only. Yes, still."]
    hi: ["Buying?", "Hey, customer."]
    drawn: ["Don't scare the other customers."]
    spot: ["Spiders! On the wall!"]
    hostile: ["Thief!"]
    hit: ["Ow! Mind the stock!"]
    kill: ["No refunds."]
    flee: ["Grab the silk!"]
    death: ["My... lamps..."]
  gest: { wave: "Hey.", gift: "Ooh. No charge? Thanks.", dance: "Ha! Fine. One.", nodance: "Busy.", insult: "That's going on your bill." }

l8-ivo:
  hi: "Oh! A p-person. Ivo, Harmouth Speleological Society. If you are going down the road, please do not go alone. I can show you where our survey stopped."
  back: ["You came back! Good. That is good data.", "H-hello again, colleague."]
  warm: "Oh, good, colleague. May I show you the map? I fixed the loop."
  cold: "Oh. Hello."
  follow: "R-right behind you. Taking notes."
  bye: "Mark your turns!"
  walk: "Oh."
  ask:
    - q: "How did Harmouth Society end up here?"
      a: "A limestone system, I thought. We came in by rope at Harmouth on a Sunday. Then the rope was g-gone and there was a road. So. Not Harmouth. I am still working on it."
    - q: "Ever find an entrance on your survey?"
      a: "Not yet. One maps until one finds the entrance. That is the method. I have four hundred pages and no entrance. The method is sound. P-probably."
    - q: "Where's your team?"
      a: "Dell drowned in the flooded cavern. I keep her notebook. The others went on down the road and did not write back. I am still writing to them."
    - q: "Who built the road?"
      a: "That is the thing! Asphalt. Painted lines. Underground. Somebody built it, or something remembers one. I want to know which. I cannot walk it alone."
    - q: "Come with me. We'll map it."
      sk: speech 35
      do: recruit
      a: "R-really? Okay. Okay! I will bring the notebook. Both notebooks."
      fail: "I. No. Not yet. Sorry."
    - q: "Ever hear the name Dina?"
      a: "D-Dina. It is in Dell's notebook, I think. One line. 'Met D. She maps too. Doors, not caves.' That is all. Dell did not waste ink."
  barks:
    idle: ["Loop at mile four. Hm.", "Dell would know this.", "Writing it down. Writing it down."]
    hi: ["H-hello.", "Oh! Hi."]
    drawn: ["P-please, no."]
    spot: ["Something! Something on the road!"]
    hostile: ["W-why?"]
    hit: ["Ah! My notes!"]
    kill: ["I... did I do that?"]
    flee: ["Back to camp!"]
    death: ["Dell..."]
  gest: { wave: "Oh! H-hi.", gift: "Thank you. Truly.", dance: "I do not, but okay.", nodance: "I am mapping.", insult: "...That is fair." }

l8-marit:
  hi: "Sit, patient. Show me the bites. It is always bites. Spider, mostly. Sometimes not."
  back: ["Bites?", "Hm. Sit."]
  warm: "You. Good. Sit, I do the arm first."
  cold: "Sit. Be quick."
  bye: "Keep the lamp on."
  walk: "Hm."
  ask:
    - q: "Patch me up?"
      do: heal
      a: "Spider. Hold still. It burns. Good, it should. There. Do not scratch."
    - q: "You know the ones who sing?"
      a: "One. Lull. A medic, like me. Good hands. She went into the dark to fetch a child and came back singing. Now she asks me to put my lamp out."
    - q: "How do you treat cave blindness or smoke lung?"
      a: "Clean air from the draught tunnels and damp linen over the eyes. Half the job down here is keeping the grease off people's bandages."
    - q: "How do you sleep down here?"
      a: "Sitting up. Lamp on. One eye. You get used to it. No. You do not."
  barks:
    idle: ["Bites. More bites.", "Lamp is on.", "Lull? No. Nothing."]
    hi: ["Sit.", "Hm."]
    hurt: ["Sit. Now."]
    spot: ["Contact. Behind the fire."]
    hostile: ["You should not have."]
    hit: ["Tch."]
    kill: ["Down."]
    flee: ["To the light!"]
    death: ["Lull..."]
  gest: { wave: "Hm. Hi.", gift: "Thanks.", dance: "No.", nodance: "No.", insult: "Okay." }

l8-carla-kid:
  hi: "Soup's three Backbucks, grown-up. Hobb says I have to learn money. I'm not scared of the spiders. Are you?"
  back: ["You came back! Soup?", "Hi, grown-up! Three Backbucks."]
  warm: "You! I saved you the bit with the most bits in."
  cold: "Soup's four Backbucks. For you."
  bye: "Bye! Don't let the singers sing at you!"
  walk: "Oh. Bye!"
  ask:
    - q: "Can I have some soup?"
      do: heal
      a: "Here. Blow on it, it's hot. Is it good? It's good. Hobb says it's good. Three Backbucks, but you can pay later. Hobb says don't say that."
    - q: "Why does soup cost three Backbucks?"
      a: "Hobb says four is greedy and two won't buy lamp oil. Three is easy to count on fingers too."
    - q: "You're not scared of spiders?"
      a: "No. They're just big bugs. The singing's scary. The singing knows my name. Hobb says it doesn't. It does."
    - q: "Where's your mum?"
      a: "Down the road. She's coming back. Hobb says so too. He says it slower every time."
  barks:
    idle: ["Soup! Three Backbucks!", "Stir, stir, stir.", "Not scared. Not scared."]
    hi: ["Hi!", "Soup?"]
    drawn: ["Hobb! Hobb!"]
    hurt: ["You're hurt! Marit!"]
    spot: ["Hobb! Something's coming!"]
    hostile: ["You're mean!"]
    hit: ["Ow!"]
    flee: ["Hobb!"]
    death: ["Mum?"]
  gest: { wave: "Hi hi!", gift: "For me? Thank you! I'll keep it forever!", dance: "Yay!", nodance: "I'm stirring!", insult: "That's a bad word. I'm telling Hobb." }

# ---- the Lightless (hostile; they sing at you. If you get a word in, this is what comes back)
l8x-choir-1:
  hi: "Light! A light in the house of the dark! Put it out, light-bearer. Put it out and sing."
  bye: "Go. Come back without it."
  ask:
    - q: "Why do you hate lamps so much?"
      a: "Because flame makes edges and fear lives in edges. Put the light down and the stone breathes with you."
    - q: "What is it you're all singing?"
      a: "The only song with no start and no end. Give up the flame, light-bearer, and your throat already knows the note."
    - q: "Did you used to be from the camp?"
      a: "We sing no old names. Names are small lights. We put those out first."
  barks:
    idle: ["Out, out, little candle...", "Hold no light, hold no light...", "Mmmmmm."]
    hi: ["Light-bearer...", "Put it out."]
    spot: ["Light! There is a light!", "Sing it out!"]
    hostile: ["Put it OUT!"]
    hit: ["It burns! The light burns!"]
    kill: ["Dark again. Dark."]
    flee: ["Into the deep dark!"]
    death: ["Finally... dark..."]
  gest: { wave: "Wave in the dark and nobody sees.", gift: "Is it a light? Break it.", dance: "Dance blind!", nodance: "No.", insult: "Sing it louder." }
l8x-choir-2:
  hi: "Oh. Hello, little one. That light must be so heavy. Wouldn't it be easier to set it down? Stay. Stay with us."
  bye: "Come back without the light, little one."
  ask:
    - q: "Are you Lull? Marit sent word."
      a: "Shh. Marit still holds that bright hot lamp. Tell her to set it down and come rest her hands."
    - q: "You aren't hungry or cold out here?"
      a: "No, little one. It only looks frightening because you keep looking. Close your eyes and let the dark check your fever."
    - q: "Did you find the child you went in for?"
      a: "I went in for a little one once. I found her. I think I found her. Hush now."
  barks:
    idle: ["Hush now...", "Stay, little one...", "Marit? Is that you?"]
    hi: ["Hello, little one.", "Set it down."]
    spot: ["There's a little light. Shh."]
    hostile: ["Shh, shh. It won't hurt. Not for long."]
    hit: ["Ow. Naughty."]
    kill: ["Sleep now."]
    flee: ["Back to the hush."]
    death: ["Marit... your lamp..."]
  gest: { wave: "Hello, little one.", gift: "For me? Put out the light instead.", dance: "Sway with me.", nodance: "Shh.", insult: "Hush." }
l8x-choir-3:
  hi: "...Light."
  bye: "...Go."
  ask:
    - q: "Can you still talk?"
      a: "...Dark."
    - q: "Where did the others go?"
      a: "...Deep."
    - q: "Wait. Who were you before?"
      a: "...Hm. ...No."
  barks:
    idle: ["...", "...Dark.", "...Hm."]
    hi: ["...Light."]
    spot: ["...There."]
    hostile: ["...Out."]
    hit: ["..."]
    kill: ["...Dark."]
    flee: ["..."]
    death: ["..."]
  gest: { wave: "...", gift: "...", dance: "...", nodance: "...", insult: "..." }
l8x-tar-1:
  hi: "Eyes. You still use eyes. Look at mine. Black. Don't need them. Drink from the pit and you won't either."
  bye: "Come back thirsty, Eyes."
  ask:
    - q: "What did drinking from the pit do to you?"
      a: "Took away the blinking. Best trade I ever made. One cup, black teeth, clear mind."
    - q: "Why aren't your eyes scarred over?"
      a: "Because I stopped looking and started drinking. You'd do the same if you tasted the bottom."
    - q: "Who dug this pit?"
      a: "Did somebody dig the sea, Eyes? It sits where it sits and waits for the thirsty."
  barks:
    idle: ["Drink.", "Black teeth, clear mind.", "Hah."]
    hi: ["Eyes.", "Thirsty?"]
    spot: ["Fresh one!"]
    hostile: ["You'll drink it the hard way!"]
    hit: ["Ha! More!"]
    kill: ["In the pit."]
    flee: ["Into the tar!"]
    death: ["Black..."]
  gest: { wave: "Hah.", gift: "Pour it in the pit.", dance: "Hah. Swim.", nodance: "No.", insult: "Say it closer." }
l8x-tar-2:
  hi: "Shh! Don't step there! That's my sister! In the tar! See her hand? You see it? Don't you touch her!"
  bye: "Don't tell them I talked to you!"
  ask:
    - q: "Whose hands are those in the tar?"
      a: "My family! Left foot. LEFT foot, don't press there. Now you're only on my uncle."
    - q: "Can your sister still hear you?"
      a: "Sister? Sister? ...She says yes. She says stop staring at her fingers."
    - q: "Why don't you pull them out?"
