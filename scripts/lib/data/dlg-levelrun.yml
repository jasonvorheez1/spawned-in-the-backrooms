# Phoebe's Safe Alcove lines at the end of Level ! (Chapter 2 Finale).
# Main Chapter 2 stance choices & completion live dynamically in scripts/lib/ch2-quest.js.

"phoebe-lrun":
  hi:
    - "Catch your breath first. This alcove holds for a couple minutes, not forever."
    - "You made it down to the last six meters before your legs quit. Most people don't get half that far."
  back:
    - "Still catching your breath?"
    - "The door on the east wall opens behind the clinic. Don't stay in here too long."
  warm:
    - "Still upright. Good."
  cold:
    - "Save the glare for whatever chased you."
  bye:
    - "Watch yourself back in Level 11."
    - "Try not to get cornered in the next hallway."
  walk:
    - "Fine. Try not to waste the second chance."
  ask:
    - q: "Are you following me from level to level?"
      a:
        - "I walk a lot of levels, and I pay attention to people who don't fall apart the first time a room tries to kill them. Don't flatter yourself."
    - q: "You're a Mimic. Why help a human at all?"
      a:
        - "Last one of my kind left out here, and none of the things screaming down that hall hold much of a conversation. You're more interesting alive than splattered on red tile."
    - q: "Will we run into each other again?"
      a:
        - "Probably. You keep moving from floor to floor and I keep checking in. Just keep paying attention."
