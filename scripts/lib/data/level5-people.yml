# Conversations between residents: who stands in, and the lines they trade (a / b). Picked when both are free.
talks:
  - { a: l5-pip, b: l5-ambrose, lines: [[a, "Mr. Ambrose, a guest asked how to check out."], [b, "And what did you tell him?"], [a, "That I'd ask you."], [b, "Then tell him the desk is always open, Pip."], [a, "That's not an answer."], [b, "No. It is a policy."]] }
  - { a: l5-odette, b: l5-dolores, lines: [[a, "The old staff were in the north wing again."], [b, "Don't call them staff. They're not staff."], [a, "They wear the uniforms."], [b, "So does a coat rack. Did it look at you?"], [a, "It hasn't got anything to look with."], [b, "Then keep your back to the wall and your eyes on it."]] }
  - { a: l5-imani, b: l5-vesna, lines: [[a, "Faceling at the Old Stairway. Same one as yesterday."], [b, "It moved?"], [a, "Only when I blinked. Two doors closer."], [b, "Then nobody walks that wing alone. Pairs or nothing."]] }
  - { a: l5-tobias, b: l5-harlan, lines: [[a, "Room n-four was a broom closet this morning."], [b, "And now?"], [a, "Now it's a suite. With a view. Of more hallway."], [b, "Write it down, don't go in. The hotel rearranges when it's bored."]] }
  - { a: l5-zelda, b: l5-millie, lines: [[a, "Have you been to the ball, darling?"], [b, "Once. Danced with a fella in a fox mask for what felt like an hour."], [a, "And?"], [b, "Came out and my watch had stopped. Three days, Tobias says."], [a, "Ooh, a three-day waltz. How scandalous."]] }
  - { a: l5-whitlock, b: l5-wat, lines: [[b, "Captain, when do the bells ring for vespers here?"], [a, "There are no bells, brother. There is a clock in the lobby, and it is wrong."], [b, "Wrong how?"], [a, "It strikes thirteen, and nobody remarks on it."]] }
  - { a: l5-vanderholt, b: l5-ambrose, lines: [[a, "I should like my bill, Ambrose. I've stayed long enough."], [b, "Your account is settled, Mr. Vanderholt. It has always been settled."], [a, "Then I may leave?"], [b, "You may do anything you like, sir. The hotel simply prefers you here."]] }
  - { a: l5-harlan, b: l5-imani, lines: [[a, "Boiler's at the red line again."], [b, "Rats come up when it's hot."], [a, "Rats come up when it's anything. Heat just makes 'em brave."], [b, "I'll tell Vesna. Escorts stop at the metal door, not one step past."]] }
  - { a: l5-dolores, b: l5-pip, lines: [[b, "Miss Dolores, who eats the trays we leave outside room thirteen?"], [a, "There's no thirteen, honey."], [b, "The trays come back empty."], [a, "Then whoever it is likes my cooking. Stop counting doors."]] }
  - { a: l5-wat, b: l5-millie, lines: [[a, "The little black cat in the great hall spoke to me."], [b, "Samantha? What'd she say?"], [a, "That I had been here longer than I remember."], [b, "Yeah. She does that. Bring her meat next time, she's nicer fed."]] }
  - { a: l5-ambrose, b: l5-pip, lines: [[b, "Mr. Ambrose, the man in four-and-a-half asked for towels again."], [a, "Then he shall have towels."], [b, "There's no four-and-a-half. I checked. Twice."], [a, "And yet he asks. Towels, Pip."]] }
  - { a: l5-dolores, b: l5-odette, lines: [[a, "You took my good ladle."], [b, "I took a ladle. I don't know which one's good, they all look the same."], [a, "The good one's the one that's missing, Odette."], [b, "...it's in suite twelve-A. Don't ask why."]] }
  - { a: l5-pip, b: l5-odette, lines: [[a, "Did you hear the radio in the ballroom switch songs?"], [b, "It doesn't switch songs. It's only ever had the one."], [a, "Right. Right. Then what was that?"], [b, "Go sweep something, Pip."]] }
  - { a: l5-ambrose, b: l5-dolores, lines: [[b, "Those salon people sent their plates back again."], [a, "Our guests from the salon are... particular."], [b, "Particular? The captain called my stew 'steerage.'"], [a, "Then we shall serve him first class, and smile while we do it."]] }
  - { a: l5-harlan, b: l5-tobias, lines: [[b, "Rat count's up again by the boiler door."], [a, "Then put it on the board. Somebody'll want the water."], [b, "Last guy who took it came back with half a boot."], [a, "Half a boot's still a boot. Pay him the full rate."]] }
  - { a: l5-vesna, b: l5-imani, lines: [[a, "You walked the corridor north side?"], [b, "Twice. Lights flickered on the second pass, nothing else."], [a, "Nothing else is what bothers me."], [b, "You'd complain if it was quiet in a library."]] }
  - { a: l5-harlan, b: l5-vesna, lines: [[b, "I need four more rounds for tomorrow's escort."], [a, "You had twelve last week."], [b, "And the boiler had eleven rats. Do the math, Harlan."], [a, "...four. Not five. Sign for them."]] }
  - { a: l5-tobias, b: l5-imani, lines: [[a, "Do you think the hotel knows we're here?"], [b, "I think the hotel knows what you had for breakfast."], [a, "I didn't have breakfast."], [b, "See? It knows that too."]] }
  - { a: l5-millie, b: l5-whitlock, lines: [[a, "You're bluffing, Captain. Your ears do the thing."], [b, "My ears do nothing of the sort, madam."], [a, "They went flat the second you saw that queen."], [b, "Fold. Fine. Fold. Insufferable woman."]] }
  - { a: l5-vanderholt, b: l5-zelda, lines: [[b, "Corny, darling, lend me ten. I'll pay you back when the war's over."], [a, "Which war?"], [b, "Whichever one is on, I've honestly lost track."], [a, "That's what you said in eighteen-ninety. Fine. Ten."]] }
  - { a: l5-wat, b: l5-zelda, lines: [[a, "Good lady, is this the house of the Abbot? I was bid to sup here."], [b, "Sweetie, nobody's supping here, we're playing whist."], [a, "Whist... is that a penance?"], [b, "With these people? Absolutely."]] }
  - { a: l5-whitlock, b: l5-vanderholt, lines: [[a, "Whose turn is it to feed the cat?"], [b, "Not mine. I brought her the ham last time."], [a, "That was not ham. That was a boot with gravy on it."], [b, "She ate it, didn't she? Samantha's not fussy if you're polite."]] }
  - { a: l5-millie, b: l5-wat, lines: [[b, "You flew? Like an angel?"], [a, "Like a very tired angel with a bad compass."], [b, "And where did you land?"], [a, "Here, apparently. Same as you."]] }
  - { a: l5-pip, b: l5-tobias, lines: [[a, "Housekeeping! You're not on the schedule."], [b, "We're never on the schedule, kid. That's the point."], [a, "Mr. Ambrose says everybody's on the schedule."], [b, "Mr. Ambrose hasn't blinked since nineteen-thirty-one."]] }
  - { a: l5-odette, b: l5-imani, lines: [[a, "Can your people do something about the ballroom? I don't clean that room anymore."], [b, "What happened in there?"], [a, "Nothing. That's why I don't clean it."], [b, "...I'll tell Vesna."]] }
  - { a: l5-dolores, b: l5-zelda, lines: [[b, "Darling, do you do anything without gravy?"], [a, "I do water. You want water, I've got water."], [b, "Almond water. How modern."], [a, "Says the woman who still thinks it's nineteen twenty-six."]] }
  - { a: l5-ambrose, b: l5-whitlock, lines: [[b, "Your bellboy stared at me."], [a, "My sincerest apologies, Captain. He is young."], [b, "Young, and staring."], [a, "I will speak with him. Is there anything else I may do for you this evening? Anything at all?"]] }
  - { a: l5-harlan, b: l5-ambrose, lines: [[a, "Ambrose. The boiler's running hot again."], [b, "The boiler always runs exactly as hot as it wishes, Mr. Harlan."], [a, "We'll take a crew down. Keep your guests off the east stairs."], [b, "Of course. Housekeeping is always welcome."]] }
