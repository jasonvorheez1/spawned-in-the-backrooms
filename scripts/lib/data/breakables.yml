  window_wood:         { name: Window wall,         mat: wood,     hp: 120,  size: [2, 2.4, 0.16], snap: edge, collider: mesh, cost: { scrap_wood: 4, nails: 2, wire: 1 } }
  door_wood:           { name: Plank door,          mat: wood,     hp: 140,  size: [1, 2.1, 0.08], snap: edge, door: true, up: door_metal, cost: { scrap_wood: 3, nails: 2, springs: 1 } }
