# What breaks, how hard it is, and what it gives back (scripts/lib/breakables.js reads every number here).
# Damage to a structure = weapon damage x heavy swing x condition x material mul[class] x strength factor.
# Strength factor (melee and fists only) = base + per x Hardiness (1..10): HAR 1 = 0.8, HAR 5 = 1.2, HAR 10 = 1.7. Guns ignore it.
strength: { base: 0.7, per: 0.1 }
fistsMul: 0.35            # bare hands barely scratch a wall
regrowMinutes: 25        # a broken Level 0 wall grows back after this long, so the maze stays a maze
wallHpMul: 1.5           # a Level 0 wall is a double sheet of drywall: 180 hp
materials:
  drywall:  { name: Drywall,  hp: 120, wallHp: 300, toolMul: { smash: 1.3, pry: 1.2 }, mul: { blunt: 1.3, edged: 0.9, firearm: 0.35 }, sound: drywall-punch-crumble-thud, dust: [0.92, 0.88, 0.72], drops: [[drywall, 1, 3], [nails, 0, 2], [wire, 0, 1]] }
  wood:     { name: Wood,     hp: 70,  mul: { blunt: 1.0, edged: 1.5, firearm: 0.45 }, sound: wood-plank-crack-hit,      dust: [0.62, 0.48, 0.3],  drops: [[scrap_wood, 2, 4], [nails, 1, 3]] }
  metal:    { name: Metal,    hp: 160, mul: { blunt: 0.7, edged: 0.35, firearm: 0.6 }, sound: metal-sheet-clang-hit,    dust: [0.55, 0.55, 0.58], drops: [[scrap_metal, 2, 4], [wire, 0, 2], [nails, 0, 1]] }
  concrete: { name: Concrete, hp: 400, wallHp: 900, mul: { blunt: 0.45, edged: 0.15, firearm: 0.2 }, toolMul: { smash: 1.9, chop: 1.1 }, sound: concrete-chip-impact-crack, breakSound: concrete-slab-crack-crumble, dust: [0.7, 0.7, 0.68], rebar: true, drops: [[rubble, 1, 3], [rebar_rod, 0, 2], [scrap_metal, 0, 1]] }
  # below Level 0 (my numbers): wallHp = one whole wall section; toolMul = damage bonus for the right tool class (lib tools below)
  cinderblock: { name: Painted cinderblock, hp: 240, wallHp: 520, mul: { blunt: 0.6, edged: 0.2, firearm: 0.25 }, toolMul: { smash: 1.8, chop: 1.2 }, breakSound: cinderblock-wall-break-crumble, dust: [0.86, 0.86, 0.84], rebar: true, drops: [[cinder, 1, 3], [rubble, 0, 2], [rebar_rod, 0, 1]] }
  sheet_steel: { name: Sheet steel, hp: 200, mul: { blunt: 0.6, edged: 0.3, firearm: 0.55 }, toolMul: { mech: 1.6, pry: 1.4 }, breakSound: sheet-steel-buckle-clang-fall, dust: [0.5, 0.5, 0.52], drops: [[sheet_steel, 1, 2], [scrap_metal, 1, 2], [bolts, 0, 2]] }
  pipe:     { name: Steel pipe, hp: 140, mul: { blunt: 0.9, edged: 0.3, firearm: 0.6 }, toolMul: { mech: 1.8, pry: 1.2 }, breakSound: steel-pipe-clang-burst-hiss, dust: [0.5, 0.36, 0.26], drops: [[steel_pipe, 1, 2], [rust_flakes, 1, 3], [brass_valve, 0, 1]] }
  brick:    { name: Brick, hp: 260, wallHp: 560, mul: { blunt: 0.55, edged: 0.2, firearm: 0.25 }, toolMul: { smash: 1.9, chop: 1.25 }, breakSound: brick-wall-collapse-tumble, dust: [0.66, 0.42, 0.32], drops: [[bricks, 1, 3], [mortar_dust, 1, 2]] }
  conduit:  { name: Conduit, hp: 60, mul: { blunt: 1.1, edged: 1.2, firearm: 0.7 }, toolMul: { mech: 1.6, chop: 1.3 }, breakSound: conduit-snap-wire-sparks, dust: [0.6, 0.6, 0.62], sparks: true, drops: [[copper_wire, 1, 3], [scrap_metal, 0, 1]] }
  tile:     { name: Glazed tile, hp: 90, wallHp: 420, mul: { blunt: 1.2, edged: 0.5, firearm: 0.5 }, toolMul: { smash: 1.6, chop: 1.1 }, breakSound: ceramic-tile-shatter-crumble, dust: [0.82, 0.7, 0.5], drops: [[tile_shard, 1, 3], [mortar_dust, 0, 1], [bricks, 0, 1]] }
  junction: { name: Junction box, hp: 80, mul: { blunt: 1.0, edged: 0.6, firearm: 0.8 }, toolMul: { mech: 1.8 }, breakSound: electrical-box-sparks-pop, dust: [0.55, 0.57, 0.58], sparks: true, drops: [[wire, 1, 2], [fuse, 0, 2], [circuit, 0, 1], [scrap_metal, 0, 1]] }
  machine:  { name: Machine,  hp: 110, mul: { blunt: 0.8, edged: 0.4, firearm: 0.5 }, sound: metal-sheet-clang-hit,    dust: [0.6, 0.6, 0.62], drops: [[scrap_metal, 1, 3], [wire, 0, 2]] }
  fixture:  { name: Fixture,  hp: 25,  mul: { blunt: 1.4, edged: 1.0, firearm: 1.2 }, sound: metal-sheet-clang-hit,    dust: [0.95, 0.95, 0.85], drops: [[wire, 1, 2], [scrap_metal, 0, 1]] }
breakSound: debris-collapse-crumble
buildSound: hammer-nail-wood-build
# scrap tokens: name, kg each, colour in the amber lists
scrap:
  scrap_wood:  { name: Scrap wood,  kg: 0.6, color: "#d9a35a" }
  scrap_metal: { name: Scrap metal, kg: 0.8, color: "#b9c2c8" }
  drywall:     { name: Drywall chunk, kg: 0.5, color: "#e8dcb6" }
  nails:       { name: Nails,       kg: 0.05, color: "#c8c8c8" }
  wire:        { name: Wire,        kg: 0.1, color: "#e0915a" }
  bolts:       { name: Bolts,       kg: 0.05, color: "#a8b0b8" }
  gears:       { name: Gears,       kg: 0.3, color: "#d8c070" }
  springs:     { name: Springs,     kg: 0.1, color: "#c0d0d8" }
  fuse:        { name: Fuse,        kg: 0.05, color: "#f0d080" }
  copper_coil: { name: Copper coil, kg: 0.4, color: "#e88a4a" }
  circuit:     { name: Circuit board, kg: 0.2, color: "#7fd1a0" }
  motor:       { name: Small motor, kg: 1.2, color: "#f0a040" }
  rubble:      { name: Concrete rubble, kg: 1.0, color: "#b8b6b0" }
  rebar_rod:   { name: Rebar rod,   kg: 1.2, color: "#a0705a" }
  cinder:      { name: Cinderblock, kg: 1.4, color: "#d8d8d2" }
  sheet_steel: { name: Sheet steel, kg: 1.0, color: "#9aa4ac" }
  steel_pipe:  { name: Steel pipe,  kg: 0.9, color: "#8c96a0" }
  brass_valve: { name: Valve,       kg: 0.5, color: "#d4a84a" }
