  stairs_wood:         { name: Stairs,              mat: wood,     hp: 200,  size: [1.8, 2.4, 4],  snap: stairs, collider: mesh, cost: { scrap_wood: 8, nails: 4 } }
  spikes:              { name: Spike strip,         mat: wood,     hp: 80,   size: [2, 0.5, 1],    snap: free, trap: 30, cost: { scrap_wood: 3, nails: 6 } }
  storage_locker:      { name: Storage locker,      mat: metal,    hp: 200,  size: [0.9, 1.9, 0.55], snap: free, store: true, cost: { scrap_metal: 5, bolts: 2 } }
  lamp:                { name: Work lamp,           mat: metal,    hp: 60,   size: [0.4, 1.7, 0.4], snap: free, light: true, cost: { scrap_metal: 2, wire: 2, fuse: 1 } }
order: [plank_wall, metal_wall, brick_wall, barricade, steel_barricade, rebar_barricade, pipe_grate, crate, ramp, workbench]
# the B menu: number keys pick a tab, X / the wheel the piece in it. tools are not pieces: a click uses them on what you look at.
tabs:
  - { name: Foundations, pieces: [foundation_wood, foundation_concrete] }
  - { name: Walls, pieces: [plank_wall, metal_wall, brick_wall, half_wall] }
  - { name: Floors, pieces: [floor_wood, floor_metal, stairs_wood, ramp] }
  - { name: Doors, pieces: [doorway_wood, door_wood, door_metal, window_wood] }
  - { name: Defense, pieces: [barricade, steel_barricade, rebar_barricade, pipe_grate, spikes] }
  - { name: Utility, pieces: [workbench, cookfire, ammobench, storage_locker, lamp, crate] }
  - { name: Tools, pieces: [tool_repair, tool_upgrade, tool_demolish] }
tools:
  tool_repair:   { name: Repair,   info: Mends what you look at. Costs half its parts for a full mend. }
  tool_upgrade:  { name: Upgrade,  info: Rebuilds it one tier up. Costs the new piece. }
  tool_demolish: { name: Demolish, info: Takes your own piece down. You get half its parts back. }
buildReach: 7          # her pick: metres from the eye a piece can go
buildCap: 250          # her pick: pieces one player keeps outside their home


# Level 0 walls are voxels: 4 across x 3 high, each its own hp; a chunk with nothing under it and nothing beside it falls too.
voxel: { cols: 4, rows: 3 }
# Tools (my picks): which class a weapon harvests as. Everything else is "rough": base drops only.
tools:
  wrench: mech
  screwdriver: mech
  crowbar: pry
  hatchet: chop
  fire_axe: chop
  lineman_machete: chop
  sledgehammer: smash
  stun_baton: mech
  pickaxe: smash
# harvest[material][tool class]: mul scales the base drops (rolled per item, 7dtd-style), rare are [token, chance %, min, max]
# rolled one by one. A machine smashed with the wrong tool loses its parts; the right one strips them.
harvest:
  flowstone:
    smash: { mul: 1.4, rare: [[ironstone, 18, 1, 1], [mortar_dust, 30, 1, 2]] }
  travertine:
    smash: { mul: 1.4, rare: [[calcite, 25, 1, 1], [spring_salt, 35, 1, 2]] }
  calcite:
    smash: { mul: 1.5, rare: [[calcite, 30, 1, 2]] }
  ironstone:
    smash: { mul: 1.5, rare: [[bolts, 25, 1, 3], [copper_wire, 10, 1, 1]] }
    pry:   { mul: 1.1, rare: [[bolts, 15, 1, 2]] }
  machine:
    mech:  { mul: 1.6, rare: [[gears, 45, 1, 2], [springs, 35, 1, 3], [fuse, 25, 1, 2], [circuit, 22, 1, 1], [copper_coil, 18, 1, 1], [bolts, 60, 2, 5], [motor, 6, 1, 1]] }
    pry:   { mul: 1.2, rare: [[bolts, 40, 1, 3], [springs, 15, 1, 1], [gears, 10, 1, 1]] }
    smash: { mul: 0.9, rare: [[bolts, 25, 1, 2]] }
  metal:
    mech:  { mul: 1.4, rare: [[bolts, 55, 2, 4], [springs, 10, 1, 1]] }
    pry:   { mul: 1.3, rare: [[bolts, 30, 1, 3]] }
  fixture:
    mech:  { mul: 1.3, rare: [[fuse, 30, 1, 1], [copper_coil, 12, 1, 1], [circuit, 6, 1, 1]] }
  wood:
    chop:  { mul: 1.7, rare: [] }
    pry:   { mul: 1.2, rare: [[nails, 60, 2, 5]] }
  drywall:
    pry:   { mul: 1.3, rare: [[nails, 35, 1, 3], [wire, 20, 1, 2]] }
    smash: { mul: 1.5, rare: [[wire, 15, 1, 1]] }
  concrete:
    smash: { mul: 1.8, rare: [[scrap_metal, 40, 1, 2], [rebar_rod, 30, 1, 2]] }
    pry:   { mul: 1.2, rare: [[rebar_rod, 45, 1, 2]] }
  cinderblock:
    smash: { mul: 1.6, rare: [[rebar_rod, 25, 1, 1], [mortar_dust, 40, 1, 2]] }
    pry:   { mul: 1.1, rare: [[rebar_rod, 40, 1, 2]] }
  sheet_steel:
    mech:  { mul: 1.5, rare: [[bolts, 60, 2, 4], [springs, 10, 1, 1]] }
    pry:   { mul: 1.3, rare: [[bolts, 30, 1, 2]] }
  pipe:
    mech:  { mul: 1.6, rare: [[brass_valve, 35, 1, 1], [bolts, 40, 1, 3]] }
    pry:   { mul: 1.2, rare: [[brass_valve, 12, 1, 1]] }
  brick:
    smash: { mul: 1.7, rare: [[mortar_dust, 40, 1, 2]] }
    chop:  { mul: 1.2, rare: [] }
  tile:
    smash: { mul: 1.4, rare: [[bricks, 25, 1, 1]] }
  conduit:
    mech:  { mul: 1.8, rare: [[copper_coil, 15, 1, 1], [fuse, 10, 1, 1]] }
    chop:  { mul: 1.3, rare: [] }
  junction:
    mech:  { mul: 1.5, rare: [[fuse, 55, 1, 2], [circuit, 35, 1, 1], [copper_wire, 50, 1, 3], [copper_coil, 15, 1, 1]] }
    pry:   { mul: 1.1, rare: [[fuse, 25, 1, 1], [circuit, 10, 1, 1]] }
    smash: { mul: 0.8, rare: [[fuse, 10, 1, 1]] }
