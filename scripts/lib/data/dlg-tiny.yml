# Tiny's telepathic lines, mirrored from tiny.yml so art/vo/act.py records them. The game reads tiny.yml.
# Nov 13 rewrite to design/story-spine.md: Tiny knows his water and nothing about who fell into it.
l7-tiny:
  circle:
  - Small. Warm. Still kicking.
  - No shell on you. No spines. Nothing.
  - You don't know where you are, do you?
  - Swim faster. Go on. I like the fast ones.
  gloat:
  - You wanted a way out. That was one.
  - Whatever you came looking for, it isn't down here.
  noise:
  - Stop that. Stop that!
  - Loud little thing.
  notice:
  - Something fell in my water.
  - I felt that. Every kick.
  - Oh. Company.
  shore:
  - Stay up there, then. The water waits.
  - Legs. Clever. Enjoy them.
  - You'll get thirsty. It's all mine to drink.
  strike:
  - There.
  - Now you know what you are.
  - Again?
