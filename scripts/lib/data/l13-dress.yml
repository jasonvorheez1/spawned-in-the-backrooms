# Level 13's hall dressing: what the people who lived here left at their doors. Tripo models, fitted into size [w, h, d].
# Savi's picks: each shut door tells one story; the lurker's flat (a5) has the drag marks.
models:
  door:     { model: null, size: [0.96, 2.07, 0.06] }
  sconce:   { model: null, size: [0.3, 0.28, 0.18] }
  radiator: { model: null, size: [1.0, 0.7, 0.2] }
  trash:    { model: null, size: [0.8, 0.6, 0.55] }
  mail:     { model: null, size: [0.6, 0.06, 0.45] }
  shoes:    { model: null, size: [0.34, 0.14, 0.3] }
  plant:    { model: null, size: [0.42, 0.75, 0.42] }
  mop:      { model: null, size: [0.45, 1.2, 0.4] }
# per flat: things left in the hall by its door (dx along the hall from the door's centre, out = metres out from the wall)
doors:
  a1:  [{ m: mail, dx: 0.1, out: 0.3, yaw: 20 }]
  a2:  [{ m: plant, dx: 0.85, out: 0.25 }]
  a3:  [{ m: trash, dx: -0.9, out: 0.35, yaw: 30 }]
  a4:  [{ m: shoes, dx: 0.6, out: 0.22, yaw: 90 }, { m: mail, dx: 0, out: 0.28, yaw: -10 }]
  a5:  [{ m: mop, dx: 1.0, out: 0.3, yaw: 70 }, { m: shoes, dx: -1.6, out: 0.9, yaw: 140, one: true }]
  a7:  [{ m: trash, dx: 0.9, out: 0.35, yaw: -15 }, { m: trash, dx: 1.35, out: 0.3, yaw: 60 }]
  a8:  [{ m: trash, dx: -0.95, out: 0.35, yaw: 10 }]
  a10: [{ m: mail, dx: 0, out: 0.3, yaw: 5 }, { m: mail, dx: 0.3, out: 0.4, yaw: 50 }, { m: plant, dx: -0.8, out: 0.25 }]
  b3:  [{ m: plant, dx: 0.85, out: 0.25 }, { m: mail, dx: 0, out: 0.3, yaw: 15 }]
  b5:  [{ m: shoes, dx: 0.6, out: 0.22, yaw: 90 }]
  b7:  [{ m: mail, dx: 0.05, out: 0.3, yaw: -25 }, { m: mail, dx: -0.25, out: 0.45, yaw: 40 }]
  b9:  [{ m: trash, dx: 0.9, out: 0.35, yaw: 25 }]
  b10: [{ m: shoes, dx: -0.6, out: 0.22, yaw: 80 }, { m: plant, dx: 0.85, out: 0.25 }]
# notes taped to doors
notes:
  a10: ["Gone to see Mum.", "Back Tuesday. — R"]
  a4:  ["PLEASE turn your", "TV down. 3 a.m!!"]
  b7:  ["Rent is NOT free", "for everyone. Pay up."]
  a5:  ["DON'T LET IT IN"]
radiators: [[-41.85, -0.6, 90], [1.15, 4.0, -90], [41.85, 11.2, -90]]
