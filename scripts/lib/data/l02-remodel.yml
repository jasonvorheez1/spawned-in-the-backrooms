# Level 0.2's shifting rooms (scripts/lib/l02-grid.js, laid by places/level02/sim.js): "the crew rebuilds what you don't watch".
# Every number here is Savi's pick.
x0: 0          # grid west edge, m
z0: -5         # grid north edge, m
cell: 4        # room size, m
cols: 4
rows: 3
height: 3.3    # stud height from the basement slab
swapEvery: 6   # seconds between crew passes
swapChance: 0.6 # odds an unwatched, unlit wall changes on a pass
viewHalf: 35   # half the 70 degree view cone a player's camera holds walls still in
nearSkip: 0.9  # a wall within this of any body never changes (no one gets framed in)
lampRange: 5   # an ON lamp freezes walls this close...
lampHalf: 45   # ...inside this half-angle of where it points
lampAim: 0     # model yaw offset of the halogen head
# walls: v<i>-<r> runs along z at x = x0 + cell*i, room row r; h<c>-<j> runs along x at z = z0 + cell*j, room column c.
# opts: door centre along the wall in metres from its middle; null = shut. Index 0 is the layout laid on reset.
# sheath: [side, from, to]: OSB on side +1/-1 over that fraction of the length; [0,0,0] = bare studs.
walls:
  v1-0: { opts: [null, 0.9, -1.0], sheath: [1, 0, 1] }
  v1-1: { opts: [0, null, -1.1], sheath: [0, 0, 0] }
  v1-2: { opts: [null, -0.8, 1.1], sheath: [-1, 0.3, 1] }
  v2-0: { opts: [1.0, null, -0.9], sheath: [1, 0, 0.6] }
  v2-1: { opts: [-0.9, 1.0, null], sheath: [-1, 0, 1] }
  v2-2: { opts: [0.8, null, -1.0], sheath: [0, 0, 0] }
  v3-0: { opts: [-1.0, 0.9, null], sheath: [1, 0, 1] }
  v3-1: { opts: [null, 0, 1.1], sheath: [-1, 0, 0.7] }
  v3-2: { opts: [null, 1.0, -0.6], sheath: [1, 0, 1] }
  h0-1: { opts: [1.0, null, -0.9], sheath: [-1, 0, 1] }
  h0-2: { opts: [-0.9, 1.1, null], sheath: [1, 0, 1] }
  h1-1: { opts: [0, -1.0, null], sheath: [0, 0, 0] }
  h1-2: { opts: [1.0, null, -1.0], sheath: [1, 0.4, 1] }
  h2-1: { opts: [null, 0.9, -1.0], sheath: [-1, 0, 1] }
  h2-2: { opts: [null, -1.0, 0.8], sheath: [0, 0, 0] }
  h3-1: { opts: [null, -0.9, 1.0], sheath: [1, 0, 1] }
  h3-2: { opts: [null, 0.9, -1.1], sheath: [-1, 0, 0.5] }
# fixed outer walls of the grid (never swap): west x = x0 (entry on row 1), north z = z0, south z = z0 + rows*cell
fixed:
  w0: { door: null, sheath: [-1, 0, 1] }
  w1: { door: 0.6, sheath: [-1, 0, 1] }
  w2: { door: null, sheath: [-1, 0, 1] }
  n0: { door: null, sheath: [-1, 0, 1] }
  n1: { door: null, sheath: [-1, 0, 1] }
  n2: { door: null, sheath: [-1, 0, 1] }
  n3: { door: null, sheath: [-1, 0, 1] }
  s0: { door: null, sheath: [1, 0, 1] }
  s1: { door: null, sheath: [1, 0, 1] }
  s2: { door: null, sheath: [1, 0, 1] }
  s3: { door: null, sheath: [1, 0, 1] }
lamps:   # id: [x, z, yaw] where it stands on reset
  l02-lamp0: [-3.6, -4.4, -90]
  l02-lamp1: [1.4, 2.4, -90]
  l02-lamp2: [13.2, 2.2, 90]
lampLight: { kind: spot, color: "oklch(0.9 0.1 80)", intensity: 3, distance: 7, angle: 48, penumbra: 0.55 }
paint:   # the three Fresh Paint cans, one per dead-end room [x, z, yaw]
  - [1.2, -4.2, 20]
  - [15.1, -4.1, -30]
  - [1.1, 6.2, 70]
fresh: [10, 1]   # the Reality Freshener on the old lift deck, centre room
exit: { x: 15.72, z: 5, top: [-13.6, 4.2] }
