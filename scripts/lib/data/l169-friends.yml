# the house talks among itself. Never about the player.
chatter:
  - [[l169-friend-3, "someone was in the pantry last night."], [l169-friend-2, "two tins short. i checked twice."], [l169-friend-4, "nobody signed in at a."], [l169-friend-3, "then they came over the ridge. i'll walk it at dusk."]]
  - [[l169-friend-7, "would you really fight someone? for beans?"], [l169-friend-1, "for the beans, no. for this table, yes."], [l169-friend-7, "okay. that makes sense."]]
  - [[l169-friend-6, "front lock's bent."], [l169-friend-4, "forced?"], [l169-friend-6, "forced. somebody leaned hard."], [l169-friend-4, "i'll log it."], [l169-friend-6, "log won't fix it."]]
  - [[l169-friend-5, "you shouted at that drifter."], [l169-friend-2, "he had my compass in his coat."], [l169-friend-5, "senna's compass."], [l169-friend-2, "the house's compass. it's on the ledger."]]
  - [[l169-friend-1, "dov, your hand."], [l169-friend-6, "it's nothing. door bit me."], [l169-friend-1, "doors don't bite."], [l169-friend-6, "this one does."], [l169-friend-1, "sit. i'll wrap it."]]
  - [[l169-friend-3, "if anyone ever comes at the house, you go to the basement."], [l169-friend-7, "and you?"], [l169-friend-3, "i stand at the door."], [l169-friend-7, "...i'll stand with you."]]
  - [[l169-friend-4, "i still say we take in whoever walks up."], [l169-friend-2, "and when one robs us?"], [l169-friend-4, "then we take in the next one."], [l169-friend-2, "you're impossible."], [l169-friend-4, "i'm hospitable."]]
  - [[l169-friend-5, "heat's rising early today."], [l169-friend-3, "how early?"], [l169-friend-5, "early enough to cook a careless walker."], [l169-friend-3, "then nobody leaves till dark."]]
  - [[l169-friend-1, "whose turn is the dishes?"], [l169-friend-6, "tobin's."], [l169-friend-2, "i did them tuesday."], [l169-friend-1, "there is no tuesday out here."], [l169-friend-2, "then i did them last."]]
  - [[l169-friend-5, "the pantry door squeaks again."], [l169-friend-6, "i oiled it."], [l169-friend-5, "it squeaks in a new place."], [l169-friend-6, "then i'll oil the new place."]]
  - [[l169-friend-4, "how many bottles went north this week?"], [l169-friend-2, "thirty-one."], [l169-friend-4, "i logged twenty-nine."], [l169-friend-2, "senna took two on the cart."], [l169-friend-3, "they were for my own walk."]]
  - [[l169-friend-3, "cart wheel's pulling left."], [l169-friend-6, "it's the axle pin. after supper."], [l169-friend-3, "you said that before supper."]]
  - [[l169-friend-1, "we're short two plates."], [l169-friend-7, "one's on the porch. sorry."], [l169-friend-1, "and the other?"], [l169-friend-7, "also the porch."]]
  - [[l169-friend-5, "sunrise in under an hour."], [l169-friend-6, "shutters are next on my list."], [l169-friend-5, "they were next yesterday too."]]
  - [[l169-friend-2, "ferry's light flickered when i opened the door."], [l169-friend-6, "bulb or wiring?"], [l169-friend-2, "it stopped when i said good morning."], [l169-friend-6, "bulb, then."]]
  - [[l169-friend-4, "crate at b needs a new lid."], [l169-friend-3, "i'll carry one up next walk."], [l169-friend-4, "it's ninety kilometres past a."], [l169-friend-3, "then it's a light lid."]]
  - [[l169-friend-1, "beans again tonight."], [l169-friend-7, "i like the beans."], [l169-friend-1, "you've been here two weeks. give it time."]]
  - [[l169-friend-2, "seven people, eight bottles an hour. that's the whole sum."], [l169-friend-1, "and we've never once run dry."], [l169-friend-2, "because i count."]]
