# premade replies an npc falls back on when the ai reply fails; picked by what the player said and how safe the level is.
# Kept short and a bit flat, the way someone talks to a stranger: no summing up, no advice nobody asked for.
safe: [main, level1, level4, level5, level61, gamma]
hello:
  any: ["hey.", "oh. hi.", "you're new.", "didn't hear you come up.", "hey. you walk far?", "morning. i think."]
place:
  safe: ["it's quiet. people mind their own.", "better than most. there's food.", "nobody's chased me in a week. that's the whole review."]
  danger: ["don't talk loud here.", "i've lost people on this level.", "i wouldn't stand there."]
danger:
  safe: ["here? you're fine. it's the next level that gets you.", "nothing in here bites. the doors are another story."]
  danger: ["if something's behind you, don't turn round. walk.", "stay where the lights are."]
trade:
  any: ["depends what you've got.", "maybe. show me.", "i'll look. don't expect much."]
you:
  any: ["me? nobody. i just stayed.", "long story and a bad one.", "been here longer than i should say."]
bye:
  any: ["yeah. go on.", "see you.", "mind your feet."]
other:
  safe: ["huh. never thought about it.", "no idea, honestly.", "ha. sure.", "ask someone else."]
  danger: ["not now.", "later. eyes open.", "mm. quiet."]
