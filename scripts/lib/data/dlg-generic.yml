# The unnamed: everyone without their own entry speaks as their faction and role ("faction:role"). Each line slot can be a
# list; a person always draws the same one (picked by their id), so two strangers rarely sound alike. Written by hand, Nov 11.

"survivor:default":
  hi: ["Hold up. Stand under the light a second.", "Don't come closer till I've had a look at you.", "Sorry. Thought you were the thing from the next room.", "Which hall did you come through?"]
  back: ["You found your way back.", "Anything following you?", "Oh, it's you. Hi."]
  warm: ["Hey. Sit. I've got half a can of something.", "Good to see a face I know."]
  cold: ["Keep your distance.", "I remember you."]
  follow: ["Behind you.", "I'm here. Go."]
  bye: ["Watch yourself.", "Don't follow the voices.", "Yeah. See you. Maybe."]
  walk: ["Okay then.", "Fine."]
  ask:
    - q: "How long have you been down here?"
      a: ["Lost count after the second notebook.", "Long enough to stop hoping for doors.", "A year? Three? The days don't add up right here."]
    - q: "Where should I go from here?"
      sk: survival 30
      a: ["Hold a scrap of paper up at the junction. Take the hall where it moves. The dead ends don't draw air.", "Look for a wall somebody's wiped down. The clean ones usually lead to a camp."]
      fail: ["Away from me, for a start.", "Don't know. If I knew, I wouldn't be here."]
    - q: "Have you seen anyone else?"
      a: ["A woman in a yellow coat, two days back. She was walking fast. I didn't ask from what.", "Tracks in the dust. I followed them until they went up the wall."]
    - q: "Want to come with me?"
      sk: speech 40
      do: recruit
      a: ["Give me a second to get my pack. You take point.", "Where are we headed? I'll walk with you."]
      fail: ["No. I've buried enough company.", "I go alone. Nothing personal."]
  barks:
    idle: ["The lights have gone quiet.", "Feet hurt.", "Was that a door?", "Don't think about it.", "One more room."]
    hi: ["Hey.", "You.", "Oh. Hi."]
    drawn: ["Easy. Easy.", "Put that down."]
    hurt: ["You're bleeding.", "You look bad."]
    sneak: ["I hear you."]
    close: ["Back off a bit."]
    spot: ["Something's coming!", "There! Over there!"]
    hostile: ["Get back!", "Alright, you want this?"]
    hit: ["Agh!", "It got me!"]
    kill: ["Got it.", "Stay down."]
    clear: ["Is it gone?"]
    flee: ["I'm out!", "Not dying here!"]
    death: ["Oh.", "No..."]
  gest: { wave: "Uh. Hi.", gift: "For me? Thanks. Really.", dance: "Here? Sure, why not.", nodance: "No. Not in the mood.", insult: "Nice. Real nice." }

"survivor:scout":
  hi: ["Down. Quiet. Okay, it moved on. Who are you?", "Stay low. Something's been walking the next hall."]
  back: ["You. Still quiet. Good.", "Back. Any trouble?"]
  bye: ["Keep low.", "Quiet feet."]
  ask:
    - q: "What's moving out there?"
      a: ["Something big two halls over. It stops when you stop. So I stopped for an hour.", "Hounds. Three. They circle. Don't let them circle you."]
    - q: "Any safe spots near here?"
      sk: survival 30
      a: ["The room with the dead lamp. Nothing goes in there. I don't know why, I don't ask.", "Look for fresh paint on the corners. The people keeping watch mark their routes that way."]
      fail: ["I haven't found anywhere I'd sleep through both watches."]
  barks:
    idle: ["Shh.", "Listening.", "Something moved."]
    hi: ["Shh.", "Low."]
    spot: ["Contact!", "There!"]
    hit: ["Ngh!"]
    kill: ["Down."]
    flee: ["Pulling back!"]
  gest: { wave: "Shh. Hi.", gift: "Thanks.", dance: "Too loud.", nodance: "Too loud.", insult: "Quietly, please." }

"survivor:medic":
  hi: ["Sit down. You're grey. Let me look.", "Hurt? Course you're hurt. Sit."]
  back: ["Let me see that again.", "Healing up? Show me."]
  bye: ["Keep it clean.", "Don't pick at it."]
  ask:
    - q: "Can you patch me up?"
      do: heal
      a: ["Hold still while I rinse it. There. Change the dressing when it soaks through.", "Put your thumb here and keep the pressure on while I tie it."]
    - q: "How do you keep supplies?"
      a: ["I boil the instruments and wash the wraps. When the wraps wear through, I cut up a clean shirt."]
  barks:
    idle: ["Bandages, bandages.", "Boil it."]
    hurt: ["Sit, you're bleeding."]
    spot: ["Wounded, behind me!"]
    hit: ["Ah! Fine."]
    flee: ["Grab the kit!"]
  gest: { wave: "Hi. Sit.", gift: "That'll help someone.", dance: "Gently.", nodance: "Busy.", insult: "Still patching you." }

"survivor:trader":
  hi: ["Set what you're trading on the cloth. If you're buying, I've got batteries.", "Everything's for sale except my boots.", "I'll take cash or sealed water."]
  back: ["Back! Pockets full?", "My customer!"]
  bye: ["Come back richer.", "Tell anyone who needs batteries where to find me."]
  ask:
    - q: "What've you got?"
      a: ["A bit of everything. Most of it works.", "Tape, batteries, a lighter with three flicks left. Fair prices."]
    - q: "Cut me a deal?"
      sk: barter 35
      do: discount
      a: ["Alright, alright. A bit off. Don't spread it around.", "Fine. I'll take a little off this time."]
      fail: ["Nope.", "Price is the price."]
  barks:
    idle: ["Selling!", "Fair prices.", "Batteries!"]
    hi: ["Buying?", "Hey!"]
    spot: ["Guard the stock!"]
    hostile: ["Thief!"]
    hit: ["My stock!"]
    flee: ["Grab the good stuff!"]
  gest: { wave: "Hey!", gift: "A gift? I'll never understand you people. Thanks.", dance: "Ha! Okay!", nodance: "Shop's open.", insult: "Prices just doubled." }

"meg:default":
  hi: ["M.E.G. checkpoint. Let me see your hands before you come in.", "You're in M.E.G. territory. Weapons low.", "Come inside. Quietly, please. The watch is listening."]
  back: ["You again. Behaving?", "Welcome back."]
  warm: ["Good to see you. You looking for water or a bunk?"]
  cold: ["I'm watching you."]
  bye: ["Tell the next watch you came through here.", "Weapons low."]
  walk: ["Noted."]
  ask:
    - q: "What does M.E.G. do?"
      a: ["Survey crews draw the maps. The rest of us keep the camps open so people have somewhere to come back to.", "We write down what kills people so it kills fewer of them."]
    - q: "What's the danger here?"
      sk: survival 30
      a: ["Check the board by the door. The latest patrol report's at the top."]
      fail: ["Everything. Stay inside."]
    - q: "Come with me?"
      sk: speech 45
      do: recruit
      a: ["Alright. I'll log it as a patrol."]
      fail: ["My post is here."]
  barks:
    idle: ["Post's quiet.", "Radio check.", "Weapons low in camp."]
    hi: ["Wanderer.", "Hello."]
    drawn: ["Weapon down."]
    hurt: ["Medic's inside."]
    spot: ["Contact!", "Movement!"]
    hostile: ["Stand down!"]
    hit: ["Hit! Still up!"]
    kill: ["Target down."]
    clear: ["Area clear."]
    flee: ["Falling back!"]
    death: ["Report... it..."]
    reload: ["Reloading!"]
  gest: { wave: "Hello.", gift: "Appreciated.", dance: "On duty.", nodance: "On duty.", insult: "Logged." }

"meg:scout":
  hi: ["Scout. Don't block the hall. What's behind you?", "Patrol. Seen anything moving?"]
  back: ["Anything new out there?", "You. Report."]
  bye: ["Watch your six."]
  ask:
    - q: "What's out there?"
      sk: survival 30
      a: ["Two hounds working the east halls. A dead light at the junction. Go west.", "Quiet sector. Too quiet. I'd wait a while."]
      fail: ["Things you'll meet soon enough."]
    - q: "Can I patrol with you?"
      sk: speech 40
      do: recruit
      a: ["Fine. Keep up, keep quiet."]
      fail: ["Not with that footwork."]
  barks:
    idle: ["Sweep's clear.", "Next sector."]
    spot: ["Contact! Hounds!", "Movement!"]
    hit: ["I'm hit!"]
    kill: ["Down."]
    flee: ["Falling back!"]
  gest: { wave: "Hm.", gift: "Thanks.", dance: "On patrol.", nodance: "On patrol.", insult: "Noted." }

"meg:medic":
  hi: ["Medical. Bleeding? Infected? Hearing things? Sit.", "Sit. Let me check you over."]
  bye: ["Drink water.", "Rest when you can."]
  ask:
    - q: "Can you patch me up?"
      do: heal
      a: ["Hold still. There. Fluids, rest, and stop getting bitten."]
  barks:
    idle: ["Next.", "Boil the water."]
    hurt: ["Sit. Now."]
    spot: ["Wounded to the back!"]
  gest: { wave: "Hello.", gift: "Thank you.", dance: "Briefly.", nodance: "Patients.", insult: "Still treating you." }

"meg:trader":
  hi: ["Requisitions. What do you need, what can you pay.", "Supplies. Everything logged."]
  bye: ["Signed out."]
  ask:
    - q: "What's in stock?"
      a: ["Water, filters, bandages, rounds. Logged, counted, fair."]
    - q: "Any discount?"
      sk: barter 40
      do: discount
      a: ["For a friend of M.E.G., a little."]
      fail: ["Prices are set."]
  barks: { idle: ["Count's off.", "Sign here."], spot: ["Secure the stores!"] }
  gest: { wave: "Hello.", gift: "Logged as a donation.", dance: "No.", nodance: "No.", insult: "Logged." }

"bntg:default":
  hi: ["B.N.T.G. We move goods, not feelings. Buying?", "Trade route's open. What've you got?"]
  bye: ["Good trading."]
  ask:
    - q: "What's B.N.T.G.?"
      a: ["Traders. Routes between levels. Chits for credit. If it's moving, we're moving it."]
    - q: "Any deals?"
      sk: barter 35
      do: discount
      a: ["For a good customer, sure."]
      fail: ["Not today."]
  barks: { idle: ["Trade's open.", "Chits accepted."], spot: ["Protect the goods!"], hostile: ["Contract void!"] }
  gest: { wave: "Hello.", gift: "Noted on your account.", dance: "Ha.", nodance: "Working.", insult: "Priced in." }
"bntg:trader":
  hi: ["Goods for sale, goods for trade, honest weights. Mostly.", "B.N.T.G. stall. Look all you like, buy what you can."]
  bye: ["Come back with coin."]
  ask:
    - q: "What've you got?"
      a: ["Batteries, rations, tools. Prices on the tags."]
    - q: "Cheaper?"
      sk: barter 35
      do: discount
      a: ["Fine. A little."]
      fail: ["Tags don't lie."]
  barks: { idle: ["Fresh stock!", "Honest weights."], spot: ["Guard the stall!"] }
  gest: { wave: "Hey!", gift: "Thanks, friend.", dance: "Ha!", nodance: "Customers.", insult: "Prices up." }

"tbd:default":
  hi: ["T.B.D. Show me something that does nothing.", "Got anything strange? Strange is currency."]
  bye: ["Bring me nothing."]
  ask:
    - q: "What do you want?"
      a: ["Objects with no purpose. A key to nothing. A map of nowhere."]
  barks: { idle: ["Useless. Good.", "Hm. Strange."] }
  gest: { wave: "Mm.", gift: "Useful? Pity. Thanks.", dance: "Pointless. Yes.", nodance: "No.", insult: "Useless. I'll keep it." }

"amor:default":
  hi: ["Softly. The bloom is listening.", "Welcome, child. Breathe."]
  bye: ["Go gently."]
  ask:
    - q: "What is this?"
      a: ["A garden. A home. It holds us. It will hold you, if you let it."]
  barks: { idle: ["It grows.", "Breathe."], hostile: ["Then you'll feed it."] }
  gest: { wave: "Peace.", gift: "An offering. It's grateful.", dance: "We sway.", nodance: "Stillness.", insult: "It heard you." }

"hotel:default":
  hi: ["Good evening, guest. Welcome to the Homely.", "Welcome. May I help you find your room?"]
  bye: ["Enjoy your stay."]
  ask:
    - q: "How long have you worked here?"
      a: ["Always, guest. Always."]
  barks: { idle: ["Good evening.", "Your room is ready."], drawn: ["Not in the hotel, please."] }
  gest: { wave: "Good evening.", gift: "How kind.", dance: "The ballroom is open.", nodance: "On duty.", insult: "Of course, guest." }

"hk:default":
  hi: ["Housekeeping. Watch the boiler doors.", "M.E.G. Housekeeping. Need supplies?"]
  bye: ["Mind the heat."]
  ask:
    - q: "What should I avoid here?"
      a: ["The boiler room, the waltz, and anything on a floor above twelve."]
  barks: { idle: ["Pressure's up.", "Linen."], spot: ["Rats!"] }
  gest: { wave: "Hello.", gift: "Thanks.", dance: "Not the waltz.", nodance: "Working.", insult: "Hm." }

"orig:default":
  hi: ["Modern, aren't you. How unfortunate.", "Members only, I'm afraid. You may stand."]
  bye: ["Good day."]
  ask:
    - q: "Who are you people?"
      a: ["The ones who arrived first. Long before you, dear. Long before."]
  barks: { idle: ["Whist, anyone?", "Insufferable."], drawn: ["How vulgar."] }
  gest: { wave: "Hm.", gift: "How quaint.", dance: "A proper waltz, if you know one.", nodance: "Certainly not.", insult: "How modern." }

"surrender:default":
  hi: ["Peace. Stop fighting the water.", "You came across the sea. Rest. Here, we stop."]
  bye: ["The tide is patient."]
  ask:
    - q: "What do you believe?"
      a: ["That the deep is a door, and fear keeps it shut."]
  barks: { idle: ["Listen.", "It turns below."], hostile: ["The deep will take you."], death: ["Down..."] }
  gest: { wave: "Peace.", gift: "An offering.", dance: "We sway.", nodance: "Stillness.", insult: "The sea forgives." }

"lightless:default":
  hi: ["Light... put it out...", "Shh. Too bright. Too bright."]
  bye: ["Come back dark."]
  ask: []
  barks: { idle: ["Hush...", "Out, out..."], spot: ["Light!"], hostile: ["Put it OUT!"], death: ["Dark..."] }
  gest: { wave: "...", gift: "Is it a light? Break it.", dance: "Sway in the dark.", nodance: "No.", insult: "Sing louder." }

"city:default":
  hi: ["Good afternoon. Lovely day.", "Hello. Are you lost? Most people are, at first.", "Oh, hello. New in town?"]
  back: ["Hello again.", "Good afternoon."]
  bye: ["Have a nice day.", "Mind the crosswalk."]
  ask:
    - q: "What's this city?"
      a: ["The Capital, people call it. It goes on. It's nice. Nothing bad happens. Almost nothing."]
    - q: "Anything strange around here?"
      a: ["The roadworks move at night. The apples turn up in crates. My neighbour's door has a different number every morning. Otherwise, normal."]
  barks:
    idle: ["Lovely day.", "Same train.", "Coffee's good today."]
    hi: ["Hello.", "Afternoon."]
    drawn: ["Oh. That's not polite."]
    spot: ["Oh dear!"]
    hostile: ["How rude!"]
    hit: ["Ow!"]
    flee: ["Excuse me!"]
  gest: { wave: "Hello!", gift: "How kind!", dance: "In the street? Alright!", nodance: "I'll be late.", insult: "Well, have a nice day anyway." }

# Level 31 "The Roller Rink" snack bar. The clerk's orders run through do: l31:<key> (scripts/lib/level31-food.js).
l31-food-clerk:
  hi: "Welcome. Everything is free. Clear your tray when you're done."
  back: ["Welcome back. Still free.", "What can I get you."]
  bye: "Trash cans are by the opening."
  walk: "Tray goes in the trash."
  ask:
    - q: "Got anything from back home?"
      tag: "Order"
      a: "Sprite. Capri Sun. Nobody restocks them. They're just always there."
      then:
        - q: "Sprite."
          tag: "Order"
          a: "One Sprite. Cold. No charge."
          do: "l31:sprite"
        - q: "Capri Sun."
          tag: "Order"
          a: "Capri Sun. Good luck with the straw."
          do: "l31:capri"
    - q: "A slice of pizza."
      tag: "Order"
      a: "Cheese or pepperoni."
      then:
        - q: "Cheese."
          tag: "Order"
          a: "One cheese slice. No charge."
          do: "l31:cheese"
        - q: "Pepperoni."
          tag: "Order"
          a: "One pepperoni slice. No charge."
          do: "l31:pepperoni"
    - q: "Chicken wings."
      tag: "Order"
      a: "Mild, hot, or too hot."
      then:
        - q: "Mild."
          tag: "Order"
          a: "Mild wings. No charge."
          do: "l31:mild"
        - q: "Hot."
          tag: "Order"
          a: "Hot wings. No charge."
          do: "l31:hot"
        - q: "Too hot."
          tag: "Order"
          a: "Too hot wings. The sign did tell you."
          do: "l31:toohot"
    - q: "A foot-long hot dog."
      tag: "Order"
      a: "One foot-long. No charge."
      do: "l31:hotdog"
    - q: "Something to drink."
      tag: "Order"
      a: "Cola, orange, lime, or almond water."
      then:
        - q: "Cola."
          tag: "Order"
          a: "One cola. No charge."
          do: "l31:cola"
        - q: "Orange."
          tag: "Order"
          a: "One orange soda. No charge."
          do: "l31:orange"
        - q: "Lime."
          tag: "Order"
          a: "One lime soda. No charge."
          do: "l31:lime"
        - q: "Almond water."
          tag: "Order"
          a: "One almond water. No charge."
          do: "l31:almond"
    - q: "What is this place? How do I get out of the Backrooms?"
      a: "I work the counter."
  barks:
    idle: ["Order up.", "Slices are fresh."]
    hi: ["Welcome.", "It's all free."]
    close: ["Staff only back here."]
  gest: { wave: "Hello.", gift: "We don't take tips.", dance: "Not on shift.", nodance: "Not on shift.", insult: "Next, please." }
l31-food-cust1:
  hi: "We're on the couples skate after this. He says his knees can take it."
  back: ["The pepperoni's better than the cheese. Don't tell the counter."]
  bye: "Mind your tray."
  ask:
    - q: "How long have you been here?"
      a: "Since the last song. Or the one before. It's a long song."
    - q: "Is the food any good?"
      a: "It's hot and nobody asks you to pay. I've stopped being picky."
  gest: { wave: "Hi there.", gift: "Oh, for me?", dance: "Save it for the rink.", nodance: "After I finish this.", insult: "That's not very nice." }
l31-food-cust2:
  hi: "Sit anywhere. Nobody's saving a seat."
  back: ["Still here. Still on the same slice."]
  bye: "See you on the floor."
  ask:
    - q: "Do you skate?"
      a: "Badly. She does the turning for both of us."
    - q: "Why does everyone clear their trays?"
      a: "Somebody didn't once. The counter wouldn't look at him after."
  gest: { wave: "Evening.", gift: "Thanks, pal.", dance: "My knees say no.", nodance: "My knees say no.", insult: "Alright, alright." }

# Level 31 arcade customers (Facelings, docile). Keys are their object ids.
"l31-arcade-face1":
  hi: ["Hang on. Third floor. Okay, hi.", "Oh. Hi. Is it your turn? It isn't a line, I'm just here."]
  back: ["Still on Marty.", "You again. Good."]
  bye: ["See you round the rink.", "Okay. Bye now."]
  ask:
    - q: "How do I play these?"
      a: ["Green card. The metal box by the way in, big blue button. It's free. Everything's free, it just wants the card."]
    - q: "Any good?"
      a: ["I fix the windows, the big guy breaks them, I fix them again. I've been on this building a while. I like it."]
  barks:
    idle: ["Come on, Marty.", "Left. Left. Up.", "Nearly."]
    hi: ["Hi.", "Hey there."]
    hit: ["Hey! Ow."]
    flee: ["I'm going, I'm going."]
  gest: { wave: "Hi! One sec.", gift: "For me? Thank you.", dance: "After this screen.", nodance: "I'm mid-game.", insult: "That's not very nice." }
"l31-arcade-face2":
  hi: ["Don't bump the table.", "Hey. Watch this ball."]
  back: ["Same ball. I think.", "Back for a turn?"]
  bye: ["Take it easy.", "Mind the cord."]
  ask:
    - q: "What's your high score?"
      a: ["Board says SAL. It always says SAL. Never met a Sal."]
    - q: "Is anyone working here?"
      a: ["Somebody restocks the cards. I never see them do it."]
  barks:
    idle: ["Stay up, stay up.", "Not the middle.", "Ha."]
    hi: ["Hey.", "Yep."]
    hit: ["Ow. Tilt."]
    flee: ["Okay, okay!"]
  gest: { wave: "Hands are busy. Hi.", gift: "Oh, nice. Thanks.", dance: "Can't. Flippers.", nodance: "Nope.", insult: "Sure, pal." }
"l31-arcade-face3":
  hi: ["Lane two's open if you want it.", "Hi. You roll?"]
  back: ["Lane two. Still open.", "Hey again."]
  bye: ["Good luck out there.", "Roll well."]
  ask:
    - q: "Where do the tickets go?"
      a: ["Nowhere. It counts them up and that's all. I'm at four hundred something."]
    - q: "How long have you been here?"
      a: ["Since the song started. It's a long song."]
  barks:
    idle: ["Forty.", "Come on, hundred.", "Short. Too short."]
    hi: ["Hi.", "Hello."]
    hit: ["Ow!"]
    flee: ["Leaving!"]
  gest: { wave: "Hi there.", gift: "Thanks. Really.", dance: "Sure, why not.", nodance: "Not right now.", insult: "Okay." }
