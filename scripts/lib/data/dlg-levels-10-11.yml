# Level 10 (Outpost Bountiful), Level 11 (the city), Level 0's B.N.T.G. man, Level 6.1 (the Snackrooms) and the Bonus Room.
# In the city the soldier on the radio set holds trail:radio and the apple seller holds trail:pass.
# Other locals keep questions to their own beat, camp, or trade.

l10-meg-cooper:
  hi: "Well, look what the rain washed in. Get under the roof, hon. Bread's warm and nobody's counting slices."
  back: ["There's my hungry one. Bread?", "Back for the heel of the loaf, hon?"]
  warm: "Pull up a bale, hon. End piece is yours. I hid it from the others."
  cold: "Bread's on the table. Cut your own."
  bye: "Take a loaf. Take two, you're thin."
  walk: "Rain'll still be here, hon."
  ask:
    - q: "I'm in bad shape. Got food?"
      do: heal
      a: "Sit by the oven. Butter, bread, clover honey. Chew slow. There, you've got a face again. Bread fixes most things."
    - q: "How does the wheat grow so fast?"
      a: "I plant it and I water it. After that it's none of my doing. Some mornings it's taller than at sundown and the rows have shifted over a foot."
    - q: "Sell me some loaves cheap?"
      sk: barter 25
      do: discount
      a: "Half price, hon. Folks who eat are folks who come back."
      fail: "It's bread, hon. It's already cheap."
    - q: "Where am I?"
      a: "Bountiful. Fields, a barn, a lake, and rain that never quits. The uniforms call it by a number. I call it the farm."
    - q: "How do I get out?"
      a: "Out of the rain? That door. Out of all of it? Hon, if I knew, I'd have gone home and checked on my own oven."
  barks:
    idle: ["Rain's good for the crop.", "Oven's hot.", "Who hasn't eaten?"]
    hi: ["Hey there, hon.", "Come in, come in."]
    drawn: ["Hon. Not in my kitchen."]
    hurt: ["You're hurt. Oven. Now."]
    spot: ["Something's in my wheat!"]
    hostile: ["You'd raise a hand on a farm? Off my land."]
    hit: ["Ow! Durn you!"]
    kill: ["Back to the dirt with you."]
    flee: ["Barn! Get to the barn!"]
    death: ["Mind... the oven..."]
  gest: { wave: "Howdy, hon.", gift: "Well, ain't you raised right.", dance: "Barn dance! Mind my toes.", nodance: "Dough's rising, hon.", insult: "Well, bless your heart." }

l10-meg-hale:
  hi: "Stop there, carrier. Name, load, where it's going. Nothing leaves here until it's been on my scale."
  back: ["Carrier. On the scale.", "Book's open. What have you got?"]
  warm: "An honest carrier. I'd started to think you were a rumour."
  cold: "Scale or step aside."
  bye: "Signed out."
  walk: "Marked absent."
  ask:
    - q: "Why weigh everything?"
      a: "Loaves go missing. Eleven last week. No tracks. Sacks too. Something takes one in nine. Never eight. Never ten."
    - q: "Any better rate for me?"
      sk: barter 40
      do: discount
      a: "You've never shorted me. That's worth a margin. A small one."
      fail: "The scale doesn't do favours. I learned from the scale."
    - q: "Seen anyone skulking by the grain bins?"
      a: "Never a figure. Just wet footprints ending halfway to the shed door and sacks nine pounds lighter by morning."
    - q: "Where does all the bread go?"
      a: "Packers carry loaves up to the Snackrooms or east toward the city docks. Mostly what walks out of here doesn't come back on a ledger."
  barks:
    idle: ["Eleven loaves.", "One in nine. Every time.", "Short again."]
    hi: ["On the scale.", "Carrier."]
    drawn: ["Not near the scale."]
    spot: ["Contact. Lock the stores."]
    hostile: ["Entered as hostile."]
    hit: ["Ugh."]
    kill: ["Struck off."]
    flee: ["Take the book! Leave the bread!"]
    death: ["One... in nine..."]
  gest: { wave: "Carrier.", gift: "Entered. Thank you.", dance: "No.", nodance: "No.", insult: "Entered." }

l10-meg-wren:
  hi: "Oh, new hands! Scythe's by your foot. Dig shallow, skip the purple wheat, and we're inside by dark. The scarecrows aren't."
  back: ["New hands! You didn't dig deep, did you?", "Hey hey! Still got all your fingers?"]
  warm: "You! Come do the east rows with me. Kidding. Unless you want to."
  cold: "Hi. Rows."
  follow: "Right behind you! Mostly!"
  bye: "Shallow, okay?"
  walk: "Okay, bye!"
  ask:
    - q: "Why dig shallow?"
      a: "Worms. Big. They're under the lake. You get past the clay and the ground starts humming. That's your cue to stop."
    - q: "What about the scarecrows?"
      a: "They face the barn at noon and the road at dusk. Nobody moves them. I quit watching for it because one time I caught one."
    - q: "Come along with me a while?"
      sk: speech 30
      do: recruit
      a: "Past the fields? Heck yes. Hold this. No, the other way up."
      fail: "Harvest's on. Ask me when it's off. It's never off."
    - q: "What's up with that barn poster?"
      a: "Do not lean on it. Somebody went right through the paper once and all we heard was gulls. Nobody else volunteered to check."
    - q: "Anything down in the lake?"
      a: "Worms under the mud, mostly. Old well pipe sticks up near the west reeds too, if you like wet shoes."
  barks:
    idle: ["Swish, swish.", "Not looking at the scarecrow.", "Purple wheat, nope."]
    hi: ["Hi!", "New hands!"]
    drawn: ["Hey, point that at the wheat!"]
    spot: ["Worm! Worm!", "Something's in the rows!"]
    hostile: ["Hey! I liked you!"]
    hit: ["Ow, okay, ow!"]
    kill: ["Harvested!"]
    flee: ["Nope nope nope!"]
    death: ["My rows..."]
  gest: { wave: "Hi hi!", gift: "Aw, for me?", dance: "Yeehaw!", nodance: "Rows first!", insult: "Rude! I'm telling the scarecrow." }

l10-meg-sully:
  hi: "Shh. Sorry. Listening. Sit, whoever you are. Tea's strong. Don't drink it fast."
  back: ["Mm. The quiet one. Tea?", "Shh. Oh. It's you."]
  warm: "Sit. I caught something last night. Tell me I'm not making it up."
  cold: "Shh."
  bye: "Shh. Go on."
  walk: "Mm."
  ask:
    - q: "Anything strange on the airwaves?"
      a: "Join Us Radio. Comes in on any set, any band, when it wants to. Kids' choir songs about balloons and no exits. A host who can barely say words. We log every time it gets loud. It gets loud before somebody goes missing."
    - q: "What are you listening to?"
      a: "The aerial points at the ground. Don't ask. Shortwave comes up out of the dirt. Weather, for towns I can't find. Rain tomorrow, every one of them."
    - q: "What was the last thing you heard?"
      a: "A man reading a shopping list. Slow. Eggs, milk, the boy, bread. I wrote it down. Didn't enjoy writing it down."
    - q: "Why point the aerial at the dirt?"
      a: "Sky's only rain and cloud. The ground carries hums clearer than the air ever did, like copper cable buried miles down."
    - q: "Any real signal ever cut through?"
      a: "Once in a blue moon, numbers or weather. Somebody swore the big set in the city pulls voices clear across levels. Still sore she was right."
  barks:
    idle: ["Shh.", "Rain tomorrow.", "Tea's stewed. Good."]
    hi: ["Shh. Hello.", "Mm."]
    spot: ["That's not on the radio. That's outside."]
    hostile: ["Hey! Quiet hands!"]
    hit: ["Ow!"]
    flee: ["Under the desk."]
    death: ["Static..."]
  gest: { wave: "Mm. Hello.", gift: "Ooh. Tea money.", dance: "Quietly. Quietly.", nodance: "Listening.", insult: "Shh." }

l10-meg-maeve:
  hi: "You there. Off that row. Thank you. Dr. Maeve. Soil, grain, worms. Mostly worms, this month."
  back: ["You there. Row. Thank you.", "Back. Good. I have numbers and nobody to bore."]
  warm: "Come look at this sample. You'll hate it. I did."
  cold: "I'm working."
  bye: "Mind the rows on your way."
  walk: "Mm."
  ask:
    - q: "What about the worms?"
      a: "Three metres long, live under the lake, come up for the wheat on nights the rain stops. The rain never stops. Except then."
    - q: "Is the wheat normal?"
      a: "Every grain is the same grain. Identical, down to the smallest part. Fields don't do that. This wasn't grown. It was copied."
    - q: "Tested the soil or rain too?"
      a: "Yes. Four cores, zero mineral variation, no spores older than yesterday. It holds moisture like blotting paper and never goes sour."
    - q: "Why stay out here collecting numbers?"
      a: "Because if something repeats itself to twelve decimal places, sooner or later a rounding error shows up. That's what I'm looking for."
  barks:
    idle: ["Same grain. Every one.", "Sample twelve.", "Who stood here?"]
    hi: ["Mm.", "Off the row."]
    drawn: ["Not near the samples."]
    spot: ["Worm! It's surfacing!"]
    hostile: ["That's poor method."]
    hit: ["Ah!"]
    kill: ["Specimen."]
    flee: ["Take the samples!"]
    death: ["My numbers..."]
  gest: { wave: "Hello.", gift: "Thank you. Is it a sample? Pity.", dance: "Briefly.", nodance: "Working.", insult: "Noted. Not significant." }

l11-meg-agent-vance:
  hi: "Easy, citizen. Specialist Vance. I walk this street by day and sit the radio set by night. Things are polite in this city. Don't let it relax you."
  back: ["Citizen. Staying out of trouble?", "You again. Good. Still in one piece."]
  warm: "Citizen. Walk the boulevard with me. It's the only quiet beat I've ever had."
  cold: "State your business, citizen."
  bye: "Keep to the lit streets."
  walk: "Carry on."
  ask:
    - q: "Why is everything so calm here?"
      a: "I don't know. I've seen a hound wait at a crossing beside a faceling. Neither bothered the other. Don't assume every street has the same rules, though."
    - q: "I'm hurt. Can you help?"
      do: heal
      a: "Field kit. Hold still, citizen. There. Next time find me before you start leaking."
    - q: "Anything here I should fear?"
      a: "Roadworks that weren't there yesterday. Lifts that skip floors. And a lit window in the alley by the green dumpster, in a wall nobody lives behind. Don't walk into it. Ask me about it if you won't take that for an answer."
    - q: "Where am I?"
      a: "The city. That's all we call it. Streets, towers, weather, no country around it. It's the safest place I've been posted and I still can't tell you what it is."
    - q: "How do I get out?"
      a: "Out of the city, plenty of doors. Out for good, nobody's confirmed one. All I've got is a voice on the set at night. Voices aren't doors."
    - q: "Ever hear the name Dina?"
      do: "trail:radio"
      a: "Dina. Yes. She wouldn't leave my post until I ran the set for her. We caught it at three in the morning. A voice, reading out today's date like it was nothing. That broadcast is real, citizen. Next morning she'd booked herself onto a ship."
      then:
        - q: "Who sold her the ticket?"
          a: "The apple seller on the corner. He books passage on the side. Don't tell him a uniform sent you. He'll charge double."
        - q: "What did the voice say?"
          a: "The date. A time check. Then a song I knew from before. I wrote the date in the log and my hand shook doing it."
    - q: "Heard someone named Halliel used to stay near here."
      a: "Halliel. Incident 11-607B. Before I rotated in, an unregistered Skin-Stealer lived off Fourteenth without bothering anyone. Two fresh transfers decided Level 11 docility rules didn't apply to her, cornered her in an alley, and emptied half a magazine. Only dragged back a torn sleeve and a lot of blood."
      then:
        - q: "So she's dead?"
          a: "No body in the gutter, just wet pavement and a wool cap. Command closed the file as presumed dead. Nobody's seen her since, and we have standing notes to log it if a girl in a yellow coat comes asking after her."
  barks:
    idle: ["Street's clear.", "Boulevard's quiet.", "Hound. Sit. Good."]
    hi: ["Citizen.", "Afternoon, citizen."]
    drawn: ["Lower it. This is a city."]
    hurt: ["Citizen, you're hurt. Come here."]
    spot: ["Contact! Clear the street!"]
    hostile: ["Stand down, citizen!"]
    hit: ["Hit! Still up!"]
    kill: ["Target down."]
    clear: ["Street's ours again."]
    flee: ["Falling back to base!"]
    death: ["Log... the date..."]
    reload: ["Reloading!"]
  gest: { wave: "Citizen.", gift: "Appreciated, citizen.", dance: "Not in uniform.", nodance: "Not in uniform.", insult: "I've been called worse by a hound." }

l11-trader-kael:
  hi: "Afternoon, boss! Apples, bread, coffee, batteries. Apples are free. They turn up in the crate on their own. Batteries don't."
  back: ["Boss! Coffee?", "Back for apples, boss?"]
  warm: "For you, boss, the good coffee. The beans that stay in the cup."
  cold: "Buying, boss?"
  bye: "Come back thirsty!"
  walk: "Your loss, boss!"
  ask:
    - q: "Anything worth listening to on Eleven?"
      a: "The ad station. Five-forty. Swear half the stuff I stock I first heard about in a jingle. Almond Water, almond water, good for every son and daughter. It's in my head for good now. Thanks for asking."
    - q: "The apples just appear?"
      a: "Every dawn. Crate's empty at night, full by morning. So I sell the crate. The crate's mine. The apples are the city's."
    - q: "Deal on supplies?"
      sk: barter 35
      do: discount
      a: "You're good at this, boss. Ten percent off. And an apple. The apple was always free."
      fail: "My prices are honest, boss. Mostly."
    - q: "How's business?"
      a: "Slow. There's a barge waiting outside the lock with my coffee on it, and the valve won't move. I've got supplies to trade while I wait."
    - q: "What's stuck at the lock?"
      a: "Gate gear sheared its pin two days back. Guild clerks swore a barge with real dark roast could clear once somebody twists the auxiliary valve."
    - q: "People say you sell things nobody else has."
      do: "trail:pass"
      a: "Quiet, boss. One berth. The ship's the SS Fun. You don't walk up a plank to her. You find her cruise poster, the offices have one, the farm barn has one, and you put your hand flat on it. Tell the purser Cabin 23. That's booked under River."
    - q: "Ever hear the name Dina?"
      do: "trail:name"
      a: "I don't do names, boss. I do faces and what they owe. If she bought off the back of the stall, she paid in full. Those I forget on purpose."
    - q: "Know anyone named Halliel?"
      a: "Quiet girl, tall, wore winter parkas in mild weather. Used to pay exact change for two bottles of Almond Water every third day, never made eye contact, always said thank you. Base Beta swept the block east of here last spring and I found her scarf by the drain next morning. Nobody settles a tab after that, so I crossed her off as dead."
  barks:
    idle: ["Apples! Free!", "Coffee, fresh!", "Batteries. Not free."]
    hi: ["Afternoon, boss!", "Boss!"]
    drawn: ["Bad for business, boss!"]
    spot: ["Trouble on the corner!"]
    hostile: ["Thief!"]
    hit: ["My stall!"]
    kill: ["Bad customer."]
    flee: ["Behind the counter!"]
    death: ["My crate..."]
  gest: { wave: "Afternoon, boss!", gift: "A gift, to a seller? That's backwards. I'll take it.", dance: "Ha, sure!", nodance: "Customers, boss.", insult: "Prices just went up." }

l11-commuter-faceling:
  hi: "Good morning. Lovely weather. It is always lovely weather. Are you lost? The crossing is that way. Wait for the little man."
  back: ["Good morning again.", "Hello. Still lovely."]
  warm: "Oh, hello. I saved you a page of the paper."
  cold: "Good morning."
  bye: "Wait for the little man."
  walk: "Good morning."
  ask:
    - q: "How long have you come this way?"
      a: "Eleven years. Same train. Same paper. The headlines change a little. Only the names."
    - q: "What's your name?"
      a: "Oh. I don't think I was given one. People say 'excuse me'. I like that one."
    - q: "Who prints that newspaper?"
      a: "It sits folded on every bench before eight. Same crossword every Thursday, though I still fill it in."
    - q: "Ever miss the eight-fifteen train?"
      a: "Oh, no. It leaves at eight fifteen and arrives at eight fifteen. Very convenient for all of us."
  barks:
    idle: ["Lovely weather.", "Wait for the little man.", "Same train."]
    hi: ["Good morning.", "Hello."]
    drawn: ["Oh. That is not very polite."]
    spot: ["Oh dear."]
    hostile: ["That is not polite at all."]
    hit: ["Oh."]
    flee: ["Excuse me."]
    death: ["Good... morning..."]
  gest: { wave: "Good morning.", gift: "For me? How kind.", dance: "In the street? All right.", nodance: "I will miss the train.", insult: "Good morning anyway." }

l11-walker-1:
  hi: "Coming through, chief! Got a parcel for across town? Give me the address. I beat most of the lights."
  back: ["Chief! Quick, I'm late!", "Hey hey, you're still alive!"]
  warm: "Chief! Two minutes. Go."
  cold: "Can't stop, chief."
  bye: "Gotta run!"
  walk: "Later, chief!"
  ask:
    - q: "Best shortcut in town?"
      a: "Third alley off the canal, through the laundromat, out the back. Saves twenty minutes. Some days an hour. Some days it costs one. Roll the dice."
    - q: "That's a lot of parcels."
      a: "Delivery slips. The ones I need are locked inside Sedco, and without them I can't prove I ran the route. I could use help getting them back."
    - q: "Which blocks do you run?"
      a: "Canal wharf to the tower lobby, dodging the roadworks crews. I run sealed envelopes to the apple stall too, cash up front."
    - q: "Ever hear the name Dina?"
      do: "trail:name"
      a: "I don't read labels, chief. Well. One. 'Hold for D.' at the apple stall, paid up front. Guy who paid was in uniform. The radio one. Weird tip, that."
  barks:
    idle: ["Late late late.", "Shortcut!", "Sign here. Anyone? Okay."]
    hi: ["Yo, chief!", "Hey!"]
    drawn: ["Whoa, chief, chill!"]
    spot: ["Trouble! Bounce!"]
    hostile: ["Not cool, chief!"]
    hit: ["Ow, man!"]
    flee: ["Shortcut!"]
    death: ["Late..."]
  gest: { wave: "Yo!", gift: "Ayy, thanks, chief!", dance: "Two seconds, go!", nodance: "Running late!", insult: "Wow. Okay. No tip for you either." }

l11-walker-2:
  hi: "Hi! Oh my gosh, a new person! It's my third week. Isn't it great? The tap water tastes like almonds. The TAP water."
  back: ["Hi! Coffee cart's open!", "Oh hi, new person!"]
  warm: "You! Sit, sit. I'm getting us coffee."
  cold: "Oh. Hi."
  bye: "Don't look up too long!"
  walk: "Oh. Bye!"
  ask:
    - q: "I'm hurt. Can you help?"
      do: heal
      a: "Oh no! I have a first aid kit at my desk, it came with the desk. Hold this. Okay! You look better. Do you want a coffee?"
    - q: "What's the catch here?"
      a: "Catch? It's perfect! Well. I can't look up at the towers, I get dizzy. And my desk has a nameplate I didn't order. But they spelled it right!"
    - q: "What happens if you look up at the towers?"
      a: "The tops keep going until your neck pops and the clouds move sideways. Better to stare at spreadsheets and drink almond coffee."
    - q: "Do folks in the office ever leave downtown?"
      a: "Why would anyone leave when lunch is free? Wait. Somebody asked me that last week and never came back from break."
  barks:
    idle: ["Coffee!", "Don't look up, don't look up.", "Data entry, yay."]
    hi: ["Hi!", "Oh, hi!"]
    drawn: ["Whoa! That's against office policy!"]
    hurt: ["Oh no, you're hurt!"]
    spot: ["Eek!"]
    hostile: ["I'm telling HR!"]
    hit: ["Owie!"]
    flee: ["Back to my desk!"]
    death: ["Coffee..."]
  gest: { wave: "Hi hi!", gift: "Ooh! Thank you!", dance: "Office party!", nodance: "I'm on break!", insult: "Oh. Wow. Okay." }

l11-walker-3:
  hi: "Mind the steam, pal. Been venting since midnight. City dropped another roadworks on my route overnight. Nobody ordered it."
  back: ["You. Mind the steam.", "New night, new hole in the road."]
  warm: "Sit, pal. Coffee's from a thermos. It's bad. Have some."
  cold: "Busy."
  bye: "Watch the manholes."
  walk: "Yeah."
  ask:
    - q: "Who digs the roadworks?"
      a: "Nobody. Cones, signs, a hole, a little digger with no keys. Overnight. Like the city's fixing a pipe it doesn't have."
    - q: "Need a hand with the work?"
      a: "The compressor's feeding steam into the wrong main. There's a tenant in 11-B with no heat. I can't leave the rest of the route long enough to fix both."
    - q: "What's jammed the canal locks?"
      a: "Main valve gear sheared off a bronze tooth. Fruit man at the corner stall has been sore about his barge all week."
    - q: "Why keep fixing pipes nobody owns?"
      a: "Somebody has to keep 11-B warm, pal. Besides, let a steam main overpressure and the whole block drops into sub-basement."
  barks:
    idle: ["Steam, steam.", "Who ordered that hole.", "Thermos coffee. Ugh."]
    hi: ["Yeah.", "Hm. Pal."]
    drawn: ["Put that away, pal."]
    spot: ["Something's down the manhole!"]
    hostile: ["You wanna go, pal?"]
    hit: ["Argh!"]
    kill: ["Down the drain."]
    flee: ["Back off!"]
    death: ["Valve's... open..."]
  gest: { wave: "Yeah.", gift: "Huh. Thanks, pal.", dance: "Ha. No.", nodance: "No.", insult: "Yeah, yeah." }

l11-realty-agent:
  hi: "Mara, B.N.T.G. Realty. You look like a client who's tired of sleeping on floors. I have keys in my pocket right now."
  back: ["My client! Ready to sign?", "Hello again. Still renting the pavement?"]
  warm: "My favourite client. Sit. The green house is still free. It's always free. For you."
  cold: "Buying or browsing?"
  bye: "Think it over. Homes don't wait. This one does."
  walk: "I'll keep the pen warm."
  ask:
    - q: "Tell me about the green house."
      a: "Two beds, a tub, a fridge that stays cold, a lock that works. On a street where nothing has ever happened. Twenty-five hundred, keys today."
    - q: "Who owned it before?"
      a: "Nobody. They come up empty with the lights on and the papers in order. I don't ask. I sell."
    - q: "Anyone actually buy a house from you?"
      a: "Two M.E.G. retirees last spring, one Guild clerk, and a faceling who paid in rolled pennies. Quiet neighbours, zero noise complaints."
    - q: "Why push houses when nobody wants to stay?"
      a: "You say that after three nights on concrete, client. Lost one closing last month to a berth sold off a fruit stall, of all things. A fruit stall."
  barks:
    idle: ["Keys today.", "Location, location.", "Still available."]
    hi: ["Hello, client!", "Buying?"]
    drawn: ["Not in the office."]
    spot: ["Security!"]
    hostile: ["Your credit just died."]
    hit: ["My suit!"]
    flee: ["Out the back!"]
    death: ["Closing..."]
  gest: { wave: "Hello!", gift: "Generous. It goes in your file.", dance: "One. To seal it.", nodance: "I'm with a client.", insult: "Charming. Still want the house?" }

l11-tm-clerk:
  hi: "Welcome to Thrift Mode, shopper. We take sandwiches for clothes. Not a joke. Leave the red smile shirts alone. They aren't for sale. They aren't for anything."
  back: ["Shopper! Got a sandwich?", "Hey. Looking or buying?"]
  warm: "My sandwich supplier. Look at this jacket. I held it back."
  cold: "Looking's free. Mostly."
  bye: "Bring sandwiches."
  walk: "Okay."
  ask:
    - q: "What are the red smile shirts?"
      a: "They show up on the rack every morning. We bin them. They come back. Last week one was folded. Nobody here folds."
    - q: "Better deal?"
      sk: barter 30
      do: discount
      a: "Good argument. Also you smell like a sandwich. Deal."
      fail: "Store policy. I made it up just now."
    - q: "Why trade clothes for sandwiches?"
      a: "Because sandwiches don't grow on racks, shopper. Coats keep showing up by themselves, and a person can't chew leather."
    - q: "Get many travellers offloading heavy winter gear?"
      a: "Funny you ask. A woman dumped a prime heavy coat here for a bag of sandwiches and swore she wouldn't need sleeves at sea. From downtown, shopper."
    - q: "Did a regular named Halliel shop here?"
      a: "Size large coats, cotton gloves in seventy-degree air, tipped in quarters. Real polite, never tried anything on in front of the mirror. Stopped coming in after the M.E.G. boys got jumpy on Fourteenth. Word is they dropped her behind the brick lot, though nobody showed me a grave."
  barks:
    idle: ["Sandwiches accepted.", "Bin the smile shirt.", "Who folded that?"]
    hi: ["Welcome, shopper.", "Hey."]
    drawn: ["Not in the store."]
    spot: ["Ugh. Trouble."]
    hostile: ["Banned!"]
    hit: ["Ow!"]
    flee: ["Stock room!"]
    death: ["Folded..."]
  gest: { wave: "Hey.", gift: "Is it a sandwich? Close enough.", dance: "In the aisle? Sure.", nodance: "Customers.", insult: "Banned. Kidding. Mostly." }

l0-bntg-kade:
  hi: "Kade. B.N.T.G., acquisitions. I'm paying for a runner who can work in the dark. Are you one, or are you just standing in my light?"
  back: ["Runner. Still breathing. Useful.", "Back for work, runner?"]
  warm: "My reliable runner. Sit. We'll talk numbers."
  cold: "Talk money or walk."
  bye: "Don't lose the card."
  walk: "Hm."
  ask:
    - q: "What's B.N.T.G. want here?"
      a: "Whatever's lying around. There's a station behind that bulkhead with more working machines than anyone alive can claim. So I'm claiming."
    - q: "What's behind the bulkhead?"
      a: "A station. Drones still walking their rounds. Machines still humming. People, once. Not my department."
    - q: "What happened to your previous runner?"
      a: "Didn't swipe cleanly at the junction and tried to outrun a patrol drone in wet boots. Don't make the same accounting error."
    - q: "How's the pay if I bring salvage back?"
      a: "Half the street price in B.N.T.G. chits, clean lamps on the card, and nobody asking how you spent the other half."
  barks:
    idle: ["Numbers.", "Cards cost money.", "Somebody's going in today."]
    hi: ["Runner.", "Working?"]
    drawn: ["Poor way to open a negotiation."]
    spot: ["Drone! Down!"]
    hostile: ["Contract terminated."]
    hit: ["Ah! That's a cost!"]
    kill: ["Written off."]
    flee: ["Withdrawing. With the assets."]
    death: ["Bill... the firm..."]
  gest: { wave: "Hm.", gift: "A gift. I'll invoice you for my thanks.", dance: "No.", nodance: "No.", insult: "Priced in." }

l61-sal:
  hi: "Grab a stool, kid. Burgers are on and the fryer just came up to heat."
  back: ["Kid! The usual?", "Back already? Good. Sit."]
  warm: "There's my kid. Extra cheese. Don't argue."
  cold: "Menu's up there. Order at the counter."
  bye: "Come back hungry!"
  walk: "Kid, your burger's going cold!"
  ask:
    - q: "Is the food really free?"
      a: "Never charged a soul. Burgers, fries, shakes. Stock appears in the cold locker before dawn, and Level 10 or Kael's barge in Level 11 covers the real coffee when the grease runs thin. Funny thing is watching folks finish a plate and never bother leaving."
    - q: "Who runs this place?"
      a: "The ones with no faces. They don't talk, they clear your tray before the seat cools, and they know your order before you sit. I just work the grill. Nobody hired me either."
    - q: "Where am I?"
      a: "The Snackrooms, or Level 6.1 if you use M.E.G. numbers. East glass doors go straight onto Level 11 concrete. Back wall smells like Level 3 and Level 6."
    - q: "How do I get out?"
      a: "Same glass doors you came in, or the service vent if M.E.G. clears you. Just leave while you're still a little hungry. Full people get lazy."
  barks:
    idle: ["Grill's hot!", "Fries up!", "Who had the shake?"]
    hi: ["Hey.", "Hungry?"]
    drawn: ["Not in my diner."]
    spot: ["Trouble at the counter."]
    hostile: ["You're eighty-sixed."]
    hit: ["Ow, my arm!"]
    kill: ["Eighty-sixed."]
    flee: ["Walk-in freezer!"]
    death: ["Order up..."]
  gest: { wave: "Hey.", gift: "For me? Here, fries. We're even.", dance: "Go on, jukebox is working.", nodance: "Grill's full right now.", insult: "Putting that on your tab." }

l61-guard-a:
  hi: "Hold it. This door's sealed. Seal 6.1-02 stays bolted unless you want pitch-dark Level 6 spilling into the dining room."
  back: ["Carry two lamps?", "You again."]
  bye: "Watch the lamps."
  ask:
    - q: "What's through the door?"
      a: "Dark, wall to wall. Straight into Level 6, with a bad splice down the suction vent to Level 3. That's why we bolted Seal 6.1-02 and sent the sensor feed to Base Gamma."
    - q: "Why bolt Seal 6.1-02 from this side?"
      a: "Because if something walks up out of Level 6 while the dining room is full of hungry folks, you want steel between the grill and the dark."
    - q: "Anything ever push against that bulkhead?"
      a: "Not yet, unless you count cold air tasting like ozone. East doors stay safe out to Level 11, though."
  barks:
    idle: ["Door's quiet.", "Check your lamps.", "Nothing moving."]
    hi: ["Hold it.", "State your business."]
    drawn: ["Lower the weapon."]
    spot: ["Contact at the door."]
    hostile: ["Stand down."]
    hit: ["Hit!"]
    kill: ["Down."]
    flee: ["Fall back."]
    death: ["Hold the door..."]
  gest: { wave: "Evening.", gift: "Thanks.", dance: "On duty.", nodance: "On duty.", insult: "Move along." }
l61-amber-a:
  hi: "Hi. Camp Amber runs the board here. We help people get back to The Hub or track down folks who missed their stop."
  back: ["Back already? Any word from Jo or the bus stop?", "Hey. Need something?"]
  bye: "Check the board."
  ask:
    - q: "What's the board?"
      a: "Pinned by the fryer. Names, coat colors, bus-stop sightings. 'Tall, red coat, goes by Bee', last seen toward 11th Avenue in Level 11. Folks find each other through it sometimes."
    - q: "Why help people?"
      a: "Someone fed me when I first got here and didn't charge for it. Jo in The Hub runs the infirmary and Pip handles routes. I watch this end."
    - q: "Ever hear the name Dina?"
      a: "There's an old card on the board: 'DINA, wait here if you see this.' Unsigned. Bee thought she saw someone like her heading toward the Guild's corner. That pin's been up awhile."
  barks:
    idle: ["Board's up to date.", "Water's by the table.", "Any new names?"]
    hi: ["Hi.", "Need help?"]
    drawn: ["Whoa, put that away."]
    spot: ["Stay back."]
    hostile: ["We don't want trouble!"]
    hit: ["Ow!"]
    flee: ["Get out the back!"]
    death: ["Tell Jo..."]
  gest: { wave: "Hi.", gift: "For camp? Thanks.", dance: "Sure, why not.", nodance: "Busy right now.", insult: "Rough day, huh." }
l61-guild-a:
  hi: "Walk safely, traveller. The Guild of Many tracks paths out of these rooms. Have you checked the seams between here and Level 3?"
  back: ["Safe walking, traveller.", "Did you bring word for Page 413?"]
  bye: "Watch your footing."
  ask:
    - q: "What is the Guild?"
      a: "Pilgrims and barge clerks. Our main ledger stays at Level 11's wharf by Kael's crane, and our runners log grates from Level 3 up to Level 4's vending wall. Put enough pages in the Book of Ways and maybe somebody pieces together a way home."
    - q: "What makes Page 413 worth finding?"
      a: "Four hundred and twelve ways are already inked: out to Level 11, down the east vent to Level 3, back toward Level 4. Nobody has inked a crossing that holds still twice."
    - q: "Ever hear the name Dina?"
      a: "A woman copied pages from our Book of Ways and gave the name Dina. She only copied routes marked uncertain, especially the seam joining Level 6.1, Level 3, and Level 4."
  barks:
    idle: ["Many paths.", "Count the ways.", "The book grows."]
    hi: ["Traveller.", "Well met."]
    drawn: ["Peace, traveller."]
    spot: ["Danger on the road!"]
    hostile: ["You leave the road."]
    hit: ["Ah!"]
    flee: ["Another path!"]
    death: ["Write... it down..."]
  gest: { wave: "Peace.", gift: "For the road. Thank you.", dance: "Even the road dances.", nodance: "We walk.", insult: "The road forgives. I am slower." }

bonus-tom:
  hi: "Welcome to Tom's, sugar! Booth's free, coffee's hot, pie's from yesterday. Yesterday was a good day."
  back: ["Sugar! Usual?", "Sit anywhere, sugar!"]
  bye: "Don't be a stranger!"
  ask:
    - q: "How's business?"
      a: "Everybody ends up at the mall sooner or later, sugar. And everybody eats pie. That's the whole plan."
    - q: "What kind of pie do you serve?"
      a: "Cherry, pecan, and whatever canned peaches the train brings in. Yesterday's slice is always best once the crust settles."
    - q: "How'd a diner end up inside a mall?"
      a: "Same way the furniture store and clothing rack did, sugar. You walk off the platform hungry, there's a booth waiting."
  barks: { idle: ["Pie's up!", "Coffee, hot!", "Booth four's free."], hi: ["Welcome, sugar!", "Hey!"] }
  gest: { wave: "Hey, sugar!", gift: "Next slice is on me.", dance: "Jukebox! Go on!", nodance: "Orders up, sugar!", insult: "No pie for you." }
bonus-andrew:
  hi: "Andrew's Furniture! Go on, friend, sit on it. All of it. The one by the door dips on the left. I call that character."
  back: ["Back for a chair, friend?", "Hello again! Sit!"]
  bye: "Sit on something nice!"
  ask:
    - q: "Where's the furniture from?"
      a: "Offices, mostly. There's a floor of them with more chairs than people. I wipe them down and sell them. I call that recycling."
    - q: "Anyone ever drag a sofa onto the train?"
      a: "Twice. Both times Rico made them pay double fare and wedge it across two benches. Looks cozy while you ride, though."
    - q: "Which chair in the showroom is the best one?"
      a: "The green recliner near the window. Well, wall. You sit in that ten minutes and you stop worrying which floor you left your keys on."
  barks: { idle: ["Comfy, comfy.", "Try the green one.", "I sat on every couch here."], hi: ["Hello, friend!", "Hi there!"] }
  gest: { wave: "Hi there!", gift: "Oh! Thanks, friend!", dance: "On the showroom floor? Sure!", nodance: "Customers!", insult: "Okay then. Stand, see if I care." }
bonus-dawn:
  hi: "Liminal Clothes. Everything on these racks was found somewhere it had no reason to be. Like you, babe."
  back: ["Babe. Try the hoodie.", "Oh, it's you."]
  bye: "Stay weird."
  ask:
    - q: "What do people wear here?"
      a: "Layers. Pockets. Nothing that rustles. The things with teeth hate rustling. So do I."
    - q: "Why do they care about rustling?"
      a: "Sound carries down concrete hallways like a dinner bell, babe. Give me quiet wool over loud nylon any day."
    - q: "How do you restock sizes nobody asked for?"
      a: "Racks fill themselves between shifts. Good heavy boots go first, so grab yours before the next platform stop."
  barks: { idle: ["Layers.", "No rustling.", "That's the look."], hi: ["Hey, babe.", "Hi."] }
  gest: { wave: "Hey.", gift: "Ooh. Okay, I like you.", dance: "Runway. Go.", nodance: "Folding.", insult: "Your outfit already said it, babe." }
bonus-rico:
  hi: "Platform one, rider! I'm Rico. I punch tickets, I call the train, I keep the yellow line yellow."
  back: ["Rider! Where's she taking you today?", "Hey! Marigold missed you. Marigold's the train.", "Platform one. Still open. Always open."]
  warm: "My favourite rider. Front car's yours. Nobody sits there anyway."
  cold: "Ticket. Train. After that you're not my problem."
  bye: "Arms in, eyes front!"
  walk: "Hey, the train doesn't wait! Okay, it does. Still!"
  ask:
    - q: "What is this train?"
      a: "Marigold. She runs from here to wherever you last stood, and back. Nobody laid the tracks. They were here one morning. Warm."
      then:
        - q: "Who drives her?"
          a: "Nobody. I knocked on the cab once. Somebody knocked back. I don't knock now."
        - q: "Warm tracks?"
          a: "Like somebody just stepped off them. Every day. I quit putting my hand down."
    - q: "Why do you work here?"
      a: "Woke up holding a ticket punch. Felt rude not to use it. Five years. I think. That clock only goes up to eleven."
    - q: "Can I ride free?"
      a: "For you, rider? Sure. Don't tell Tom. He charges for ketchup."
      sk: speech 40
      fail: "Ha! No. Kiosk's right there. Marigold has bills. I assume."
      do: discount
    - q: "Where does this train go?"
      a: "Marigold only goes back where you've been. I asked her for somewhere new once. We sat in the tunnel forty minutes. I think that was a no."
    - q: "Seen anything strange?"
      a: "A guy got off who never got on. Same coat as you. I punched his ticket anyway. It was blank."
      sk: survival 30
      fail: "Strange? Rider, it's a train in a mall. Pick something."
  barks:
    idle: ["Platform one!", "Mind the yellow.", "Marigold's warm today.", "Tickets, tickets."]
    hi: ["Hey! Riding?", "Rider!", "Where to?"]
    drawn: ["Whoa. Not on the platform.", "Put it away, she spooks."]
    hurt: ["You're dripping on my yellow line.", "Sit down before you ride, okay?"]
    spot: ["Uh. That's no rider.", "Off my platform!"]
    hostile: ["Ticket's void!", "Last stop, pal!"]
    hit: ["Ow! I punch tickets, not people!", "Hey!"]
    kill: ["Doors closing.", "End of the line."]
    clear: ["Okay. Okay. Platform's open.", "Nobody saw that."]
    flee: ["Marigold, hold the doors!", "Nope!"]
    death: ["Tell her I..."]
    sneak: ["I can see you, rider."]
    close: ["Personal space. Think of it as a yellow line."]
    board: ["All aboard! Arms in!", "Marigold's leaving, rider!", "Doors closing. Eyes front!", "Next stop, wherever you left off!"]
  gest: { wave: "Yo! Rider!", gift: "Ha, a tip! Thanks!", dance: "Platform party!", nodance: "Train's due. Rain check.", insult: "I'm putting you on the slow one." }

bonus-sal:
  hi: "Squeeze Play! Ice in, lid on. Pick two fruits, or three if you're feeling lucky."
  back: ["Back by the fountain? Mix something new.", "Blender's cold and the fruit's fresh. Sort of."]
  warm: "My favourite taste-tester. I saved the good Lucky O Milk in the back cooler."
  cold: "Menu's on the board. Pay at the counter."
  bye: "Drink it before the fizz quits!"
  ask:
    - q: "What's actually in these smoothies?"
      a: "Almond water base, crates of fruit that wash up off the service corridor, and plenty of crushed ice. Keeps your knees moving out there."
    - q: "Any secret blends worth knowing?"
      a: "Wild Berry with Mango wakes you right up. Almond, Berry, and Kiwi? Call that the Night Shift — patches body and head at once."
      then:
        - q: "What about Lucky O Milk?"
          a: "Weird pink stuff, sweet as melted cereal. Toss it with Almond Water and Kiwi if you've got the coin for a Pot o' Gold."
    - q: "How'd you get a juice stand beside a mall fountain?"
      a: "Fountain was already running when I dragged the cart in. Seemed criminal not to sell cold cups next to running water."
    - q: "Cut me a break on the tab?"
      a: "Ah, go on then. Don't tell Andrew — he still owes me two dollars for a mango cup."
      sk: speech 35
      fail: "Nice try, slick. Fruit doesn't haul itself up from Level 1."
      do: discount
  barks:
    idle: ["Ice in, lid on!", "Fresh blends by the fountain.", "Try the Lucky O Milk!"]
    hi: ["Hey! Thirsty?", "Right by the fountain!"]
  gest: { wave: "Yo!", gift: "Cheers! Next swirl's extra cold.", dance: "Fountain groove!", nodance: "Busy blending.", insult: "Enjoy tap water, pal." }

l02-capn:
  hi: "Ah. A visitor. Mind the carpet, it is new. Everything is new. Sorry for the inconvenience."
  back: ["The visitor returns. Nobody returns.", "The floor is fine now. It is always fine at first."]
  warm: "My favourite visitor. Do not tell Major Took I have a favourite."
  cold: "We are busy improving things. Please improve somewhere else."
  bye: "Sorry for the inconvenience."
  walk: "I will wait here. Waiting is in the job."
  ask:
    - q: "What happened up there?"
      a: "A first-class remodel. Red carpet, white walls, sockets that work. Then somebody touched it. Possibly me."
    - q: "Who else is on your crew?"
      a: "Penelope runs errands. Grunt lifts things. Toaster is a toaster. On paper we are a very good team."
    - q: "Who is Major Took?"
      a: "The officer who signed the work order for red carpet, white walls, and working sockets. Nobody has seen the Major since the ceiling complained."
    - q: "Why keep remodelling if touching it ruins the work?"
      a: "Because leaving an unfinished corridor is against code. Even if code occasionally bursts into flames."
  barks:
    idle: ["Sorry for the inconvenience.", "True order comes through furniture.", "Measure twice.", "Please leave a light on in there. The crew do not like being watched at work."]
    hi: ["Ah. Hello.", "Mind the carpet."]
    drawn: ["Please put that away. It scuffs the paint."]
    hurt: ["Ow. That is a workplace incident."]
    spot: ["Something here is not up to code."]
    hostile: ["You are no longer an approved visitor."]
    hit: ["Ah."]
    kill: ["Sorry for the inconvenience."]
    clear: ["Back to work, then."]
    flee: ["This is above my pay grade."]
    death: ["Tell the Major I measured twice."]
  gest:
    wave: "Ah. Yes. Hello."
    gift: "For me? I will log it as company property."
    dance: "Not on the new floor."
    insult: "That will go in my report. Nobody reads my report."

l31-shop-keeper:
  hi: "Have a look round, hon. If you want a camera, ask first. I keep the batteries out of them."
  back: ["Gumball machine's full again.", "Hello, hon. After something?"]
  warm: "I put the camera with the clean lens by for you, hon."
  cold: "Leave the case shut, please."
  bye: "Mind the step going out."
  walk: "I'll be here."
  ask:
    - q: "Who brings you the stock?"
      a: "Nobody. A girl bought the last blue shirt once. I went to take the tag down and there was another blue shirt behind it. I order by leaving a gap."
    - q: "How do I get out of the rink?"
      a: "Plywood door, southwest corner. You'll hear pipes before you see them."
    - q: "Can you do better on the price?"
      sk: barter 30
      do: discount
      a: "All right, hon. Help me get something out of that case for once."
      fail: "I'll give you a fresh battery. The price stays."
    - q: "What's behind that white door?"
      a: "Cold to the touch and quieter than the rink. Folks who test the handle never come back past the counter, so I keep the key hung behind the postcards."
    - q: "Still carry film for those old cameras?"
      a: "Check the drawer under the keychains, hon. Half the exposures turn out black, half show someone standing near the concession stand."
