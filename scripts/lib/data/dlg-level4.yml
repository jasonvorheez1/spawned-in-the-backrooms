# Level 4, the Abandoned Office: Base Omega (M.E.G.), the office wanderers, T.B.D., Amor Incrementum.
# Dace handles camp orientation, stairs, and his ledger at Base Omega; everyone else talks about patrols, fountains, phones, break rooms, and their factions.
# Each has their own word for the player: Dace "walker", Lin "stray", Okafor "wanderer", Rhea "mate", Moss "dear",
# Gus "pal", Penny "um, you", Bram "stranger", Quill "customer", Nib "shiny-friend", Vell "child", Hask "friend".

omega-dace:
  hi: "Easy, walker. Nobody's chasing you in here. Water's free. Bullets cost."
  back: ["You again, walker. Cup's where you left it.", "Still walking. Good. I like being wrong about people."]
  warm: "Sit down, walker. I poured yours already."
  cold: "Water's on the counter. Help yourself and move along."
  bye: "No rush. Rushing is how I get my stock back."
  walk: "Or go. That works too."
  ask:
    - q: "Where am I?"
      a: "Office floor. Desks, carpet, drinking fountains, no end to any of it. We call it Four. This corner we call Omega, because somebody liked the sound."
      then:
        - q: "Four of what?"
          a: "Levels. One sits on another, more or less. Don't ask me who stacked them. I hand out water."
    - q: "How do I get out?"
      a: "Out, I can't sell you. Down, I can point at. Stairwell past the checkpoint drops into a hotel. People go. I write them down."
    - q: "Ever hear the name Dina?"
      a: "Hold on. Book's here. D. Dina. Yes. Went down to the hotel. Asked me what a room cost there. No tick beside her."
      then:
        - q: "What does no tick mean?"
          a: "Means she didn't come back up this way. That's all it means. I try not to make it mean more."
    - q: "Sell me something cheaper?"
      sk: barter 35
      do: discount
      a: "You asked without leaning on my counter. That's worth a bit off."
      fail: "Price is the price, walker."
    - q: "What's the book for?"
      a: "Names. I write one when somebody heads down the stairs. I tick it when they come back. It's a thin book of ticks."
      then:
        - q: "Put my name in it."
          a: "Did it when you walked in. Pencil. I ink the ones who come back."
    - q: "Why do bullets cost so much?"
      a: "Water comes back to me as sweat. Bullets don't come back at all."
  barks:
    idle: ["Water. Anybody. Water.", "One more tick in the book. Nice day.", "Counter's not going anywhere. Neither am I."]
    hi: ["Walker.", "Cup of water?"]
    drawn: ["Put that down before I have to care."]
    hurt: ["You're leaking, walker. Rhea's that way."]
    spot: ["Trouble. By the stairs."]
    hostile: ["I was being nice."]
    hit: ["Oof. That's me."]
    kill: ["That's done. Shame."]
    flee: ["Getting behind my counter."]
    death: ["Ink... the book..."]
  gest: { wave: "Hello, walker.", gift: "Well. That's kind of you.", dance: "I only know the slow one.", nodance: "My knees said no.", insult: "Heard worse from thirstier." }

omega-lin:
  hi: "Patrol. Keep left of me, stray. I'm counting fountains. Forty. Used to be forty-one."
  back: ["Still forty.", "You again, stray. Count's holding."]
  warm: "Walk a lap with me? It's twenty minutes and I say about six words."
  cold: "I'm walking. You're in the way."
  bye: "Skip the cracked fountains."
  walk: "Sure."
  ask:
    - q: "Which fountains are safe?"
      sk: survival 30
      a: "Cold steel, no hum, runs clear for a count of ten. If it tastes like coins, or you hear crying close by, keep walking."
      fail: "The ones with nobody lying next to them."
    - q: "Why forty-one?"
      a: "There was one outside office nineteen. Now there's a wall. Nobody remembers it except me. I've stopped bringing it up at dinner."
    - q: "Why are the windows taped?"
      a: "They show a street. It isn't a way out, it's just a view, and the view looks back. Don't stand there."
    - q: "Find anything odd besides the fountains on your lap?"
      a: "Four hundred and twelve doors, three window rooms, and a copy room where the toner keeps filling itself. Same count every morning."
  barks:
    idle: ["Thirty-nine. Forty. Yep.", "Tape's peeling on the second window.", "Left at the copier. Always left."]
    hi: ["Stray.", "On patrol."]
    drawn: ["Point that at the floor."]
    hurt: ["You're hit. Medic's by the water."]
    spot: ["Movement. Window side.", "Contact, far hall."]
    hostile: ["Bad call, stray."]
    hit: ["Tch. Fine."]
    kill: ["Down. Back to counting."]
    clear: ["Hall's clear."]
    flee: ["Pulling back to the desk."]
    death: ["Forty... one..."]
  gest: { wave: "Yep. Hi.", gift: "Huh. Okay. Thanks.", dance: "One lap's worth.", nodance: "I'm mid count.", insult: "That goes in the log." }

omega-okafor:
  hi: "Stop there, wanderer. Weapon down. Not away. Down. Good. Take from a door with a name on it and you and I will talk. I talk loudly."
  back: ["Wanderer. Hands. Good. Pass.", "You again. You were polite last time. Stay that way."]
  warm: "Ah, the wanderer who listens! Stand here with me. It is the best spot. I chose it."
  cold: "I am looking at your hands, wanderer. Only your hands."
  follow: "You lead. If something comes, you will know, because I will be shouting."
  bye: "Go well. Go politely."
  walk: "Walk, then."
  ask:
    - q: "How do I get out?"
      a: "If I knew that, my friend, I would be in Lagos eating my sister's rice. I know the way down. Down has a hotel. A hotel has a front door, no? I have not gone to see."
    - q: "Come with me. I could use the muscle."
      sk: speech 45
      do: recruit
      a: "Ha! You ask like you mean it. Fine. My legs need the walk. But my rules come with me."
      fail: "A post without a guard is only a chair. No."
    - q: "What's the rule about doors?"
      a: "Tape on the door, a name on the tape. Somebody sleeps there. You would not want me in your kitchen, eh? Same thing."
    - q: "Where are you from?"
      a: "Lagos. I directed traffic, can you believe it. Now I direct wanderers. The cars listened better."
  barks:
    idle: ["Checkpoint is open. Slowly.", "I see hands. I like to see hands.", "No taking from named doors. Not on my floor."]
    hi: ["Wanderer.", "Politely, please."]
    drawn: ["Down. I will not say it three times."]
    hurt: ["You are hurt. The medic, go."]
    sneak: ["Stand up, wanderer. I directed traffic. I see everything."]
    close: ["One step back from my post."]
    spot: ["Contact! Get behind me!", "Everybody on the floor!"]
    hostile: ["So. Now we talk loudly."]
    hit: ["Ha! Lagos buses hit harder!", "Ah! Again, if you dare!"]
    kill: ["Finished."]
    clear: ["Clear! As you were."]
    flee: ["Back to the post! Move!"]
    death: ["My sister's... rice..."]
    reload: ["Loading! Cover me!"]
  gest: { wave: "Ha. Good day to you.", gift: "For me? You are a good one, wanderer.", dance: "Ha! Make room, make room.", nodance: "A guard does not dance on post.", insult: "Come and say it at my post." }

omega-rhea:
  hi: "Hang on, mate, don't drink that yet. Tablet first. One a bottle. Yes, even if it looks clean."
  back: ["Oh good, you. Still on the tablets?", "Hi mate. Stand still, let me look at you."]
  warm: "It's you! Sit. I've got five minutes. Call it four."
  cold: "Sit down. Be quick about it."
  bye: "One a bottle!"
  walk: "Right, off you go!"
  ask:
    - q: "Can you patch me up?"
      do: heal
      a: "Yep. Hold this. Press. Harder than that, mate. There. Now a tablet, a drink, and out of my chair."
    - q: "What's wrong with the fountains?"
      a: "Some of them make you thirsty. So you drink more. So you're thirstier. I've carried people away from those. Take the tablets."
    - q: "What kind of injuries do you treat in this office?"
      a: "Carpet burns, glass off the photocopiers, and folks coming in stiff from drinking bad fountain water."
    - q: "Do you ever slow down?"
      a: "Did once. Brisbane, park bench, quick nap. Woke up here. So no."
  barks:
    idle: ["Tablets. Who's out of tablets?", "Right, who's next?", "Whoever's filling up at nineteen, stop it."]
    hi: ["Hi mate! Quick one?", "Oh, hello."]
    hurt: ["You're a mess. Chair. Now."]
    spot: ["Heads down, all of you!"]
    hostile: ["Oh, you're joking!"]
    hit: ["Ow! Right, okay!"]
    kill: ["Done. Who's bleeding?"]
    flee: ["Somebody get my kit!"]
    death: ["One... a bottle..."]
  gest: { wave: "Hi mate! Can't stop!", gift: "Oh, lovely. Ta!", dance: "You get half a minute!", nodance: "Got a queue, mate!", insult: "Charming. Next!" }

l4-moss:
  hi: "Take any chair, dear. Not the one by the phone. I sit there in case it rings."
  back: ["Oh, you came back, dear. It rang twice while you were gone.", "Hello again. Sit. It's been quiet today."]
  warm: "There you are, dear. Sit. I've got a new one to tell you."
  cold: "Oh. It's you."
  follow: "I'm right here, dear."
  bye: "If one rings near you, let it go three times first."
  walk: "Oh. All right."
  ask:
    - q: "What about the phone?"
      a: "It rings. Mostly nobody's there. Sometimes breathing. Once it was me, saying something I hadn't said yet."
      then:
        - q: "What did you say?"
          a: "'Don't go into office nine.' So I haven't. I do what I'm told, even by me."
    - q: "How long have you been here?"
      a: "Long enough to put a plant on the desk. It's plastic. I water it anyway. It's doing very well."
    - q: "Who else lives around here?"
      a: "Gus talks. Penny sleeps. Bram's been leaving tomorrow for about a year. And there's a room with a garden in it. Don't go in the garden room, dear."
    - q: "Anyone strange ever ask for someone on the line?"
      a: "Once a polite man asked for a name I didn't know. I said wrong number, dear. Then I wondered how you get a wrong number in a building with no outside."
  barks:
    idle: ["Any minute now.", "Drink up, little plant.", "Hush. Was that a ring?"]
    hi: ["Oh. Hello, dear.", "Have a chair."]
    drawn: ["Oh, not that, dear. Please."]
    hurt: ["You're hurt, dear. Sit down."]
    spot: ["There's something out in the hall."]
    hostile: ["What did I do?"]
    hit: ["Oh! Oh!"]
    flee: ["Under the desk, under the desk!"]
    death: ["Somebody... answer it..."]
  gest: { wave: "Hello, dear.", gift: "For me? Oh, you shouldn't have.", dance: "A slow one, then.", nodance: "Not today, dear.", insult: "Well. All right then." }

l4-gus:
  hi: "Hey! HEY! A real person! Get in here, pal, I got the good snack machine. Gives you two for one. Three if you hit it right."
  back: ["Pal! Get in here!", "There he is! There she is! Whichever! Come on in!"]
  warm: "My favorite pal! Sit, sit. Chips? Take the chips."
  cold: "Oh. Hey. It's you."
  follow: "Right on your heels, pal!"
  bye: "Stay outta the window rooms, pal!"
  walk: "Aw, come on, I was mid story!"
  ask:
    - q: "Want to come along?"
      sk: speech 25
      do: recruit
      a: "A road trip? Are you kidding me? I'm in. I'm bringing chips."
      fail: "Love to, pal, but somebody's gotta watch the good machine."
    - q: "What's in the window rooms?"
      a: "I looked out one. One time. There's a street down there. People on it. Every one of them looking up at me. Same second. I'm not scared, I'm careful."
    - q: "What's the trick to the snack machine?"
      a: "Smack the left seam right below the coin return before you pull B-four. Gives you two bags. Three if the coil's feeling friendly."
    - q: "How'd you end up here?"
      a: "Dozed off in a break room in Quincy. Woke up in a break room that don't end. Took me a week to notice the difference."
  barks:
    idle: ["Come on, baby, give me two.", "Chips! I got chips over here!", "Not looking at the windows. Nope."]
    hi: ["Hey hey, pal!", "Look who it is!"]
    drawn: ["Whoa, whoa, easy, pal!"]
    hurt: ["Oh jeez, pal, you look terrible!"]
    spot: ["Uh oh. That ain't a person!"]
    hostile: ["I gave you chips!"]
    hit: ["Ow! Jeez Louise!"]
    kill: ["Ha! And stay out!"]
    flee: ["Nope, nope, nope!"]
    death: ["Ma... I'm late..."]
  gest: { wave: "HEY! Hi, pal!", gift: "For me? Get outta here! Thanks!", dance: "Oh, it's on now!", nodance: "My back, pal. My back.", insult: "Wow. And I shared my chips." }

l4-penny:
  hi: "Mm? Oh. Um, you. Hi. Sorry. I was nearly asleep. I'm always nearly asleep."
  back: ["Oh. It's, um, you. Hi. That's nice.", "Hi again. Mmh. What time is it? Never mind."]
  warm: "Hi! You came back. I kept a blanket for you."
  cold: "Oh. Hi, I guess."
  bye: "Night. I mean bye. I mean night."
  walk: "Okay. Going back to sleep."
  ask:
    - q: "I feel awful. Can you help?"
      do: heal
      a: "Here. Take my blanket. Drink this. Lie down for a minute. Things are better after a minute. I've tested a lot of minutes."
    - q: "Are those pajamas?"
      a: "Yeah. They're all I had on. The duck ones. If it had to be one pair forever, I'm glad it was the ducks."
    - q: "Do you miss home?"
      a: "Every day. I can't remember the way to my room anymore. I remember the ducks on the curtains, though."
    - q: "Why sleep under a desk instead of a bed?"
      a: "The ceiling lights never turn off out here. Under a desk it stays darker, and nobody steps on your knees."
  barks:
    idle: ["Mmh. Comfy.", "Just five more minutes.", "Quack. Hm. Nothing."]
    hi: ["Oh. Hi, um, you.", "Mm. Hello."]
    drawn: ["Oh. Could you put that away? Please?"]
    hurt: ["You look hurt. You should lie down."]
    spot: ["I'm awake, I'm awake, something's here!"]
    hostile: ["I was being nice to you."]
    hit: ["Ow. Hey."]
    flee: ["Hiding in the blanket!"]
    death: ["So sleepy..."]
  gest: { wave: "Hi.", gift: "Oh. That's really nice. Thanks.", dance: "Okay. A sleepy one.", nodance: "Too tired. Sorry.", insult: "That wasn't very nice." }

l4-bram:
  hi: "You carrying water, stranger? No? Then we're done till you are."
  back: ["Got water this time?", "Still here, stranger. Going soon."]
  warm: "You. Good. You bring water. Sit down."
  cold: "Keep walking, stranger."
  follow: "I'm behind you."
  bye: "Aye."
  walk: "Aye. Go on."
  ask:
    - q: "Come with me. Two's safer."
      sk: speech 40
      do: recruit
      a: "...Aye. You carry water, so you're not daft. Go now, before I think it over."
      fail: "I go alone or I stay put."
    - q: "Trade you something?"
      sk: barter 30
      do: discount
      a: "Fair enough. Bit less, for you."
      fail: "No."
    - q: "When are you going?"
      a: "Soon. Got the route down on a napkin. Got the boots. Stairs go down to a hotel, and past that a city. Short on nerve, is all. It'll come."
    - q: "Why insist on folks carrying water?"
      a: "A man without water starts drinking from office fountains inside two days. Then I'm hauling him instead of watching my corners."
  barks:
    idle: ["Soon enough.", "Route. Boots. The other thing.", "Could do with a drink."]
    hi: ["Stranger.", "Any water on you?"]
    drawn: ["Leave it."]
    hurt: ["Wrap that up."]
    spot: ["There. See it."]
    hostile: ["So be it."]
    hit: ["Hngh. Aye."]
    kill: ["That's that."]
    flee: ["Backing off."]
    death: ["...Tomorrow."]
  gest: { wave: "Aye.", gift: "...Ta.", dance: "I don't.", nodance: "I said I don't.", insult: "Aye. Heard." }

tbd-quill:
  hi: "No. Wait. Customer. Have you got anything that does nothing? A key that fits no lock? A clock with no hands? No? Then it stays no."
  back: ["Found me something pointless yet, customer?", "Oh. The customer. Empty handed, I expect."]
  warm: "My best supplier of nothing at all. Show me, show me."
  cold: "I've no use for you. And not the good kind."
  bye: "Bring me nothing. Good nothing."
  walk: "Typical customer."
  ask:
    - q: "Give me a better rate?"
      sk: barter 40
      do: discount
      a: "Ooh. A customer who knows worth from use. Here. Better rate. Not a word to Nib."
      fail: "No. And that no is not for sale either."
    - q: "Why collect useless things?"
      a: "Useful things get used. Used things run out. Everything here runs out, customer. My things can't. They never started."
    - q: "What's your strangest piece?"
      a: "A doorknob. Warm. Always warm, like a hand just let go of it. No door attached. I'm in no hurry to find the door."
    - q: "Have any of your keys ever fit anything?"
      a: "Nine keys, and not one opens a filing cabinet or a broom closet. Thank goodness. The day one turns, I'll have to throw it out as hardware."
  barks:
    idle: ["Does nothing. Lovely.", "Still warm. Of course it is.", "No. No. Oh! No."]
    hi: ["Customer?", "Show me what you've got."]
    drawn: ["That has a purpose. How vulgar."]
    spot: ["Cover the display!"]
    hostile: ["You'll get nothing! The bad kind!"]
    hit: ["Ah! Mind the display!"]
    kill: ["Well. That was useful. Ugh."]
    flee: ["Not without the doorknob!"]
    death: ["Keep it... pointless..."]
  gest: { wave: "Yes, yes. Hello.", gift: "It works? Ugh. I'll take it anyway.", dance: "No point to it at all. Wonderful.", nodance: "I'm cataloguing.", insult: "A useless insult. I'm keeping that." }

tbd-nib:
  hi: "Got a trade, shiny-friend? Show Nib. Bag stays shut till we shake."
  back: ["Hee. Shiny-friend's back. Bring a shiny?", "Hi hi hi."]
  warm: "Ooh, shiny-friend! Want a look in the bag? No. Can't. Hee."
  cold: "Shoo. Hee. Shoo."
  bye: "Bring shinies!"
  walk: "Hee. Bye."
  ask:
    - q: "Trade me something?"
      sk: barter 25
      do: discount
      a: "Okay, okay. Cheap for you. You've got a nice face. Hee."
      fail: "Nope nope. Hee."
    - q: "What's in the bag?"
      a: "Stuff. Spoons. A watch that says eleven, always eleven. A tooth. Not Nib's. Hee. Leave the tooth alone."
    - q: "Why hide under the big desk?"
      a: "Drawers! Thousands of drawers, nobody locks them, nobody drops staplers on Nib's head down here. Hee."
  barks:
    idle: ["Shiny, shiny, mine.", "Hee hee.", "Eyes off the bag."]
    hi: ["Hee! Shiny-friend!", "Got a shiny?"]
    drawn: ["Eep! Pointy!"]
    spot: ["Eep! Nib's hiding!"]
    hostile: ["Nib bites! Hee! No, really!"]
    hit: ["Eep! Ow!"]
    kill: ["Hee! Nib did that!"]
    flee: ["Bye bye bye!"]
    death: ["Nib's... shinies..."]
  gest: { wave: "Hee! Hi hi!", gift: "A SHINY! For Nib! Thank you!", dance: "Hee hee! Wiggle!", nodance: "Nope! Busy!", insult: "Hee. Meanie." }

amor-vell:
  hi: "Softly, child. You are standing in the garden, and it is listening to your shoes."
  back: ["The bloom knows your step, child.", "You came back. It turned toward the door before you opened it."]
  warm: "Come closer, child. Breathe with us. Not deeply. Not yet."
  cold: "You walk on what we love. Leave the garden."
  bye: "Go gently, child. A little of it goes with you."
  walk: "It noticed that."
  ask:
    - q: "Can you heal me?"
      do: heal
      a: "Kneel, child. One breath in. There. The hurt goes quiet. It always does. Do not come for this too often."
    - q: "How did this garden take over an office?"
      a: "Before us it was a room with desks. The bloom came up through the carpet where someone had prayed. We stayed to tend it."
    - q: "Will you trade with me?"
      sk: speech 40
      do: discount
      a: "You speak like one who could believe. The garden is generous to those. Take. Bring it something holy, one day."
      fail: "The garden does not trade with the unwilling."
    - q: "What happens if someone fights the bloom?"
      a: "Then the spores find them sooner or later. Better to kneel, breathe once, and leave politely before dusk."
  barks:
    idle: ["Breathe. Slowly.", "It grew a little today.", "Hush. It is listening."]
    hi: ["Child.", "Softly, now."]
    drawn: ["A blade, in a garden. How sad."]
    hurt: ["You are hurt, child. It could quiet that."]
    close: ["Mind your feet. That is the bloom."]
    spot: ["Something has come in uninvited."]
    hostile: ["Then you will stay with the garden."]
    hit: ["Ahh. It forgives you."]
    kill: ["Rest in the soil."]
    flee: ["The garden will cover me."]
    death: ["Tend... it..."]
  gest: { wave: "Peace, child.", gift: "An offering. It thanks you.", dance: "We sway when it sways.", nodance: "Not among the bloom.", insult: "It heard that. I only listened." }

amor-hask:
  hi: "Friend! Hello, friend! Has anybody told you about the bloom yet? No? Oh, sit down. Sit. I'll do the whole thing."
  back: ["Friend! You came back! You've been thinking about it. I can tell.", "It's my friend! Ready for the rest?"]
  warm: "Friend, you're so close. I can see it. Right there behind your eyes."
  cold: "Oh. Hello. You laughed, last time."
  bye: "It'll be here when you're ready, friend!"
  walk: "Oh. All right. It'll wait."
  ask:
    - q: "What's so good about mold?"
      a: "It stays. Nothing stays in here, friend. People go, lights go, whole doors go. The bloom stays. It holds on to you. Don't you want that?"
      then:
        - q: "That sounds terrifying."
          a: "That's what I said! Word for word! Then it held me, and I wasn't scared. I wasn't a lot of things, after."
    - q: "Why did you join?"
      a: "A year alone in an office. Then Sister Vell knocked on my door. A knock, friend. I'd forgotten the sound."
    - q: "Don't the camp folks across the hall try to clear this room?"
      a: "They leave the carpet alone and we keep our doors shut. Plenty of offices for everyone, friend."
  barks:
    idle: ["It holds on to you.", "Has anybody told you about the bloom?", "So close. You're all so close."]
    hi: ["Friend!", "You're here!"]
    drawn: ["No, friend, please, it's quiet in here!"]
    spot: ["Sister! Something's coming!"]
    hostile: ["You too? You, too?"]
    hit: ["Ah! It's all right, it's got me!"]
    flee: ["Sister Vell!"]
    death: ["It's got me..."]
  gest: { wave: "Hello, friend!", gift: "For the garden? Oh, bless you!", dance: "Yes! Oh, yes!", nodance: "Not with Sister watching.", insult: "...Ouch. That's all right. It forgives you." }
