# Level 3 creatures: deathmoth swarms and the hound brigades. Savi's pick on every number, tune freely.
moths:
  hp: 45             # Savi's pick
  xp: 30             # Savi's pick
  speed: 2.2         # drifting, m/s. Savi's pick
  chase: 3.5         # when a light pulls them. Savi's pick
  lightReach: 22     # a lit flashlight draws them this far. Savi's pick
  nearReach: 6       # anyone at all this close. Savi's pick
  bite: 6            # hp a bite, before armor. Savi's pick
  sanity: 3          # sanity a bite. Savi's pick
  biteEvery: 0.8     # seconds. Savi's pick
  biteRange: 1.3     # Savi's pick
  roam: 2            # cells from home they wander. Savi's pick
  strayEvery: [5, 11] # seconds between a few moths peeling off. Savi's pick
  giveUp: 14         # cells: past this path length they lose interest. Savi's pick
hounds3:
  packRadius: 30     # a spotter's brigade within this joins the hunt. Savi's pick
  packHold: 9        # seconds the brigade keeps the shared prey. Savi's pick
  barkRange: 40      # Savi's pick
  lurkSearch: 4      # cells from home to look for a dead end. Savi's pick
  pounceNear: 7      # passing this close springs the ambush. Savi's pick
  pounceBack: 10     # turning your back this close does too. Savi's pick
  pounceBoost: 1.6   # Savi's pick
  pounceTime: 1.0    # seconds. Savi's pick
  lurkScale: 0.8     # crouched body height. Savi's pick
  stunSpeed: 0.2     # speed while state.stunUntil holds (every level). Savi's pick
