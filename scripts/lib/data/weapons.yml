# power attack (melee, my picks): hold attack to wind up; release past `min` of the wind-up for a heavy swing.
# charge: seconds to full. damage: multiplier at full. stamina/cooldown: multipliers for a heavy. reach: extra metres at full.
power: { charge: 0.9, min: 0.3, damage: 2.2, stamina: 1.8, cooldown: 1.4, reach: 0.5 }
pickups: 30        # weapons lying in the maze at once
pickupRespawn: 90  # seconds between refills
# First person. magSize: rounds in the gun (the ammo / shells counts are the reserve). reloadTime: a magazine swap. reloadStart/reloadShell: a shotgun loads one shell at a time and can be fired mid-reload.
# ads: where the arm sits on the camera (x right, y up, depth forward) when aiming down sights, so the sights line up with the crosshair. muzzle: the muzzle point in the same space, for the flash.
# adsCone: the tighter aim cone while aiming. fovAds: the zoomed field of view.
# recoil (first person, my picks): up = muzzle climb deg/s, back = shove toward you m/s, lift m/s, side/twist = random yaw/roll deg/s; all cosmetic.
# Level 2 tools (her picks): found in the utility halls
screwdriver:  { name: Screwdriver,  damage: 14, levelScale: 0.9, cooldown: 0.32, reach: 1.9, stamina: 5,  minLevel: 2, rarity: common, weight: 6, xp: 8,  level2: true, color: "oklch(0.6 0.18 40)", length: 0.3, req: { h: 2 } }
sledgehammer: { name: Sledgehammer, damage: 64, levelScale: 1.3, cooldown: 1.35, reach: 2.8, stamina: 26, minLevel: 9, rarity: rare,  weight: 1, xp: 55, level2: true, color: "oklch(0.4 0.01 250)", length: 0.95, req: { h: 8 }, two: [0.22, 0, 0.024] }
