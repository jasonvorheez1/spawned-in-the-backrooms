smg:             { name: Thompson SMG,      damage: 9,  levelScale: 0.5, cooldown: 0.09, reach: 2, range: 24, ranged: true, auto: true, magSize: 30, reloadTime: 2.3, cone: 0.988, adsCone: 0.995, spread: 0.13, heatPer: 0.09, wear: 0.2, ap: 30, sound: smg-tommy-gun-loud-rattle-shot, fovAds: 50, ads: [0, -0.07, 0.46], muzzle: [0, 0.03, -0.49], recoil: { up: 70, back: 0.6, lift: 0.12, side: 30, twist: 20 }, stamina: 0.3, minLevel: 9, rarity: rare, weight: 1, xp: 60, level3: true, color: "oklch(0.3 0.02 260)", length: 0.85, kg: 4.9, mv: 280, drag: 0.005, acc: [3.4, 1.4], zero: 25, req: { h: 6, guns: 40 }, two: [0.03, -0.27, 0.02] }
# Real-world weapons, each in its own loot pool (pools: l0 lobby, l1 garage, l2 pipes, l3 electrical station, l4 offices, l5 hotel). A pooled weapon is
# never rolled anywhere else (scripts/lib/loot.js rollWeapon(ctx, pool)). req: what it takes to use it well (Hardiness; Guns or Melee skill): falling short
# widens the spread, kicks harder and wanders the aim, or costs a melee weapon damage and stamina (scripts/lib/stats.js handling).
# mv m/s and drag 1/m are the muzzle velocity and how fast air slows the round (the numbers are each cartridge's real ones, scripts/lib/ballistics.js);
# acc [hip, ads]: spread half-angle in degrees at rest; zero: the range its sights are set for; tube: loads one round at a time like a shotgun.
