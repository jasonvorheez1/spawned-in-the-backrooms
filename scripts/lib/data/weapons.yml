# Variants (my picks): a found weapon may roll one. The key is "<kind>~<variant>" (crowbar~taped), everywhere a kind goes.
# for: which kinds can roll it (melee, ranged, blunt, blade, or a kind's name). chance: weight against `plain` (no variant).
# Each number multiplies the base stat; rarity steps the rarity up or down; cnd: the condition it is found at.
# look: what scripts/weapon-geo.js draws over the weapon (rust, tape, nails, edge, meg, mag, sawn).
variantPlain: 46
blunt: [table_leg, pipe_scrap, crowbar, bat, wrench, sledgehammer, stun_baton, golf_club, tire_iron, baton]
blade: [hatchet, fire_axe, screwdriver, rebar, lineman_machete, pickaxe, cleaver]
variants:
  rusty:    { name: Rusty,        for: [melee, ranged], chance: 20, damage: 0.82, cooldown: 1.06, rarity: -1, xp: 0.6, cnd: 55, look: rust, tint: "oklch(0.62 0.08 50)" }
  taped:    { name: Taped,        for: [melee], chance: 13, cooldown: 0.88, stamina: 0.82, xp: 1.2, look: tape }
  nailed:   { name: Nail-studded, for: [blunt], chance: 8, damage: 1.25, stamina: 1.1, rarity: 1, xp: 1.6, look: nails }
  honed:    { name: Honed,        for: [blade], chance: 8, damage: 1.22, cooldown: 0.94, rarity: 1, xp: 1.6, look: edge }
  extended: { name: Extended-mag, for: [pistol], chance: 10, magSize: 1.5, reloadTime: 1.15, rarity: 1, xp: 1.5, look: mag }
  sawn:     { name: Sawed-off,    for: [shotgun], chance: 10, damage: 1.15, range: 0.65, cone: 0.6, pellets: 1.25, cooldown: 0.9, rarity: 1, xp: 1.5, look: sawn, short: 0.72 }
  drum:     { name: Drum-fed,     for: [smg], chance: 10, magSize: 1.67, reloadTime: 1.3, rarity: 1, xp: 1.5 }
  serrated: { name: Serrated,     for: [knife], chance: 10, damage: 1.25, rarity: 1, xp: 1.4 }
  meg:      { name: M.E.G.-issue, for: [melee, ranged], chance: 4, damage: 1.12, cooldown: 0.92, cone: 0.7, rarity: 2, xp: 2.2, cnd: 100, look: meg }
