# Melee weapons. Fists are what you start with: weak on purpose. Found weapons need a level to wield.
# damage: base hit. levelScale: share of the per-level damage bonus it gets. cooldown: seconds. reach: metres. stamina: cost per swing.
order: [fists, table_leg, pipe_scrap, crowbar, bat, hatchet, fire_axe, pistol, shotgun, rebar, wrench, screwdriver, sledgehammer, stun_baton, lineman_machete, knife, smg, golf_club, tire_iron, pickaxe, baton, cleaver, revolver, coach_gun, lever_rifle, hunting_rifle, carbine]
# rarity: common < uncommon < rare. weight: how often it is rolled for floor spawns and smiler drops. xp: reward for picking one up.
rarities:
  common:   { label: COMMON,   color: '#c9c2a0' }
  uncommon: { label: UNCOMMON, color: '#7fd1a0' }
  rare:     { label: RARE,     color: '#f0a040' }
  elite:    { label: ELITE,    color: '#d38cff' }
dropChance: { weapon: 0.18, almond: 0.35, ammo: 0.15, shells: 0.08 }  # per smiler kill
# Ranged weapons spend ammo, not much stamina, and need a clear line to the target. Ammo is scarce on purpose.
ammo: { perPickup: 6, floor: 18, respawn: 120 }  # floor: ammo boxes lying in the maze at once
crates: { count: 32, respawn: 100 }  # supply crates in the maze to search (1 to 3 items each)
shells: { perPickup: 2, floor: 9, respawn: 180 }  # shotgun shells: scarcer than pistol ammo
fists:      { name: Fists,      damage: 4,  levelScale: 0.3, cooldown: 0.45, reach: 1.9, stamina: 5,  minLevel: 1 }
table_leg:  { name: Table leg,  damage: 11, levelScale: 0.8, cooldown: 0.5,  reach: 2.4, stamina: 8,  minLevel: 1, rarity: common, weight: 10, xp: 5, color: "oklch(0.55 0.08 60)",  length: 0.7, req: { h: 3 } }
