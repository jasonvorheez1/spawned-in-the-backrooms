# Level 9's house kit. One row per house model; the layout (scripts/lib/level9.js) picks rows by seed and the sim furnishes `rooms`.
# CONTRACT (every model): origin at ground centre of the w x d footprint, front door on the +Z side of the file (placed forward: "+z"),
# interior floor at y = floorY, rooms in the model's own metres (x right, z toward the front door).
# models: Tripo houses fitted by art/l9-houses/fit.py (front turned to +Z, scaled into w x d).
# door: the hole fit.py cuts in the front wall (centre x, front face z, threshold y, 1 m wide, 2.1 m tall); the sim hangs a hinged door there
# footprints the lots are cut for (model: null = a blueprint box stands in):
houses:
  ranch:    { name: "Ranch",      w: 16, d: 10, stories: 1, model: "/cdn/value.4acf96287a1b54fd4ef2f5677b1f1f15e0a30c2f31a3e1cde11474fc756d5c0f.glb", door: { x: -2.1, z: 3.1, y: 0.4 }, rooms: [] }
  bungalow: { name: "Bungalow",   w: 9,  d: 11, stories: 1, model: "/cdn/value.75b332b908aff287aef8a3cc233ed95230493a0c5d465a3ef816e50394c03a7a.glb", door: { x: 0.86, z: 1.89, y: 0.65 }, rooms: [] }
  colonial: { name: "Colonial",   w: 11, d: 9,  stories: 2, model: "/cdn/value.8e4cd739bb4e873aca8c6efd901d9ff90cad3bb86c9a8d410597f1ded7a5f274.glb", door: { x: 0, z: 2.9, y: 0.44 }, rooms: [] }
  cape:     { name: "Cape Cod",   w: 10, d: 8,  stories: 2, model: "/cdn/value.75c1c9f782b6d2a259e3c5051c66570b1374c2fa55e6740e64377f3fe2ac2f02.glb", door: { x: 0, z: 2.85, y: 0.55 }, rooms: [] }
  garage2:  { name: "Two-storey with garage", w: 15, d: 9, stories: 2, model: "/cdn/value.505b2edaafb4fae91d10c7c58df2f5300b371a6fcbca74fd019334eef3d93976.glb", door: { x: 1.56, z: 2.62, y: 0.5 }, rooms: [] }
