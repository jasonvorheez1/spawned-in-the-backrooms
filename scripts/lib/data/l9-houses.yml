# Level 9's house kit. One row per house model; the layout (scripts/lib/level9.js) picks rows by seed and the sim furnishes `rooms`.
# CONTRACT (every model): origin at ground centre of the w x d footprint, front door on the +Z side of the file (placed forward: "+z"),
# interior floor at y = floorY, rooms in the model's own metres (x right, z toward the front door).
# models: Tripo houses fitted by art/l9-houses/fit.py (front turned to +Z, scaled into w x d).
# door: the hole fit.py cuts in the front wall (centre x, front face z, threshold y, 1 m wide, 2.1 m tall); the sim hangs a hinged door there
# footprints the lots are cut for (model: null = a blueprint box stands in):
houses:
  ranch:    { name: "Ranch",      w: 16, d: 10, stories: 1, model: "/cdn/value.45443c1dbf4ec9c62fcc3fde6c0b6d1f2a16d6076c4a29f6ff63f12e415b0a1d.glb", door: { x: -2.1, z: 3.1, y: 0.4 }, rooms: [] }
  bungalow: { name: "Bungalow",   w: 9,  d: 11, stories: 1, model: "/cdn/value.2ff3d6d6b34ed8b68efe971ad610faee9309d95f822fa3635e927a41b45daafe.glb", door: { x: 0.86, z: 1.89, y: 0.65 }, rooms: [] }
  colonial: { name: "Colonial",   w: 11, d: 9,  stories: 2, model: "/cdn/value.f3dbef42d9615b331bb8dbd126a027e3cb28055ff4266c34e88b7bf8060c8d71.glb", door: { x: 0, z: 2.9, y: 0.44 }, rooms: [] }
  cape:     { name: "Cape Cod",   w: 10, d: 8,  stories: 2, model: "/cdn/value.56c34695239213924ef5e32b00b6dfacc46e6c215e4b08bc5555cb02971ff641.glb", door: { x: 0, z: 2.85, y: 0.55 }, rooms: [] }
  garage2:  { name: "Two-storey with garage", w: 15, d: 9, stories: 2, model: "/cdn/value.dfafcf04a294f17c7292ebfd3512fed6c932569592e35d41935eecfb211ec372.glb", door: { x: 1.56, z: 2.62, y: 0.5 }, rooms: [] }
